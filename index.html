<style>
:root{
  --bg:#f6f5f2; --panel:#fff; --ink:#232323; --sub:#6b6b6b; --line:#dcd8d0;
  --accent:#3a6ea5; --wall:#4a4a4a; --furn:#8fa8bd; --furnSel:#3a6ea5;

:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#7fb0e0; --wall:#c8c8c8; --furn:#48606f; --furnSel:#7fb0e0;

}}
:root[data-theme="dark"]{

  --warnA:#e0a252; --warnB:#e57373; --ok:#7fbf90; --ghost:#5b7f9e; --dim:#5a5a5a;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
  overscroll-behavior:none;}
/* 🔴 需求 21：手機上平面圖下方一大片空白。
   ① 用 100dvh 不用 100vh（手機瀏覽器網址列會吃掉高度，100vh 會算成比可見區更高）
      ⚠️ 100dvh 不支援時要有退路 ⇒ 先寫 100vh 再用 100dvh 覆蓋（支援的瀏覽器取後者）
   ② max-height ＋ overflow:hidden ⇒ 整個 app 不可能高過可見區 ⇒ 頁面不會捲動
      （Ali 的症狀是「平面圖下方到底部分頁之間約一個螢幕高的空白」＝ 容器比可見區高） */
.app{display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  max-height:100vh;max-height:100dvh;
  overflow:hidden;
  max-width:520px;margin:0 auto;background:var(--bg);}

/* ── 需求 13：頂列（44px）＝ 標題 ＋ 可點的連線徽章 ＋ 齒輪 ── */
.apptop{flex:none;height:44px;display:flex;align-items:center;gap:7px;padding:0 10px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.apptop .ttl{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
/* 🔴 標題很長時不可壓縮右邊兩顆（需求 13 邊界） */
.apptop .pill{font-size:11px;color:var(--accent);border:1px solid
  color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:20px;padding:5px 9px;
  background:var(--bg);white-space:nowrap;flex:none;font-family:inherit;cursor:pointer;
  min-height:30px}
.apptop .pill.off{color:var(--sub);border-color:var(--line)}
.apptop .pill.er{color:var(--warnB);border-color:color-mix(in srgb,var(--warnB) 45%,var(--line))}
.apptop .gear{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;
  font-size:17px;flex:none;cursor:pointer;padding:0;font-family:inherit}

/* ── 頂部：原型控制列（正式版沒有這排，只是給你切方案用）──
   ⚠️ _i 三份都沒有把它列進「刪什麼」，故保留（CLAUDE.md 3-2：不刪規格沒說要刪的）。 */
.protobar{flex:none;background:var(--panel);border-bottom:1px solid var(--line);
  padding:5px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.protobar .tag{color:var(--sub);font-size:11px;margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--sub);padding:4px 8px;font-size:12px;
  font-family:inherit;cursor:pointer;min-height:28px}
.seg button.on{background:var(--accent);color:#fff}
.chk{display:inline-flex;align-items:center;gap:4px;color:var(--sub)}

/* ── 模式列（A1 才顯示）── */
.modebar{flex:none;display:none;padding:5px 8px;background:var(--panel);
  border-bottom:1px solid var(--line);align-items:center;gap:8px}
.modebar.show{display:flex}
.modebar .hint{font-size:11px;color:var(--sub)}

/* ── 舞台（§22：flex 子項要捲動/收縮必須 min-height:0）── */
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
#plan{width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
.stage.m-obj::after,.stage.m-pan::after{content:"";position:absolute;inset:0;
  pointer-events:none;border:3px solid transparent;transition:border-color .15s}
.stage.m-obj::after{border-color:var(--accent)}
.stage.m-pan::after{border-color:var(--sub);opacity:.45}

.zoombtns{position:absolute;right:8px;top:8px;z-index:10;
  display:flex;flex-direction:column;gap:5px;align-items:center}
.zoombtns button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--ink);
  font-size:17px;line-height:1;cursor:pointer;padding:0;font-family:inherit;
  backdrop-filter:blur(3px)}
.zoombtns button:active{background:var(--accent);color:#fff}
.zlabel{font-size:10px;color:var(--sub);background:color-mix(in srgb,var(--panel) 88%,transparent);
  padding:2px 5px;border-radius:5px;font-variant-numeric:tabular-nums}
.zoombtns[hidden]{display:none!important}

/* ── 頁面容器（清單／照片／專案／之後）── */
.page{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:10px 10px 4px}
.page[hidden]{display:none!important}
/* 🔴 需求 8：清單很長滑到底時，(+) 不可被最後一張卡片遮住 */
#listPage{padding-bottom:84px}

.grp:first-child{margin-top:2px}
.grp .bar{width:14px;height:3px;border-radius:2px;flex:none}
.grp .gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .gbtn{border:1px solid var(--line);background:var(--bg);color:var(--sub);

  min-height:26px}
.chip.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:transparent;

.miss{font-size:11px;color:var(--warnA);margin-left:auto}

   （面板實測 187/199px 已貼著 _d §10-0d 的上限）。 */

.icard .cur{font-size:11.5px;color:var(--sub)}
.icard .cur[hidden]{display:none!important}
.icard .price{width:84px;min-width:0;font-size:11.5px;text-align:right;

  color:var(--sub);font-family:inherit;font-variant-numeric:tabular-nums;
  padding:3px 4px;min-height:26px}
.icard .price:focus{background:var(--bg);border-color:var(--line);color:var(--ink);outline:none}

/* 🔴 需求 22：展開列變成 [房間下拉][寬][深][高][備註]。

   ⇒ 手機上允許該列【橫向捲動】；不要換行把卡片撐高（沿用 N-99 的結論）。 */
.roomrow{display:flex;gap:6px;align-items:center;margin-top:6px;

/* 🔴 v0.05_i §4：note 併進【同一個展開列】。單行 input ⇒ 長備註橫向捲，

.roomrow input.note{flex:0 0 120px;min-width:0;background:var(--bg);border:1px solid var(--line);

/* 面板可收合：只想看平面圖時把它壓成一條 */
.sel.mini > *:not(.selhead){display:none}

/* 未旋轉原貌對照（_d §10-2b，Ali 指定）*/
.orig{display:none;gap:7px;align-items:center;margin-top:5px;padding:5px 7px;

/* ── 📷 照片分頁 ── */
.pbtns{display:flex;gap:8px;margin-bottom:10px}

.viewer .vbar b{color:#fff}
/* 🔴 需求 17：關閉鈕在【圖片正下方】，整寬、高度 ≥ 44px（已驗收的觸控尺寸）。
   position 不再是 absolute ⇒ 它參與 flex 排版，圖片區高度自動縮小、圖片仍 contain 不裁切。 */
.viewer .vclose{flex:none;margin:0 12px 8px;min-height:46px;
  background:rgba(255,255,255,.14);color:#fff;border:1px solid #888;border-radius:10px;

.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.42);

.ov[hidden]{display:none!important}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;width:100%;max-width:360px;max-height:80vh;overflow-y:auto;
  box-shadow:0 6px 26px rgba(0,0,0,.3)}
.dlg h4{margin:0 0 9px;font-size:14px}
.dlg.blocked{border-color:var(--warnB)}
.inputline{display:flex;gap:6px;align-items:stretch}
.inputline input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:8px;color:var(--ink);font:inherit;font-size:14px;min-height:40px;
  text-transform:uppercase}
.dlgbody{font-size:12px;color:var(--sub);line-height:1.7;margin:9px 0}
.dlgbody b{color:var(--ink)}
.dlgbody ul{margin:5px 0 0;padding-left:18px}
.cstat{font-size:11px;color:var(--sub);line-height:1.65;margin-top:9px;

.cstat b{color:var(--ink)}
.cstat .on{color:var(--ok);font-weight:600}
.cstat .off{color:var(--sub)}

.rw{display:flex;gap:6px;margin-top:11px}
.rw .btn{flex:1}
/* 🔴 需求 19 ③：專案代碼一律等寬 ＋ 加寬字距（顛倒的字母才看得出來）
   ⚠️ 第二條選擇器不是贅寫：`.inputline input` 有 `font:inherit`，
      那是【簡寫】⇒ 會把 font-family 一起重設，而它的優先權（0,1,1）高於 .codetxt（0,1,0）

.codetxt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;

  letter-spacing:.16em}

.codelist{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}

.syncprog:empty{display:none}

.syncprog .run{color:var(--accent)}

/* 🔴 需求 19 ①：新專案提醒（狀態，不是功能說明；不阻擋） */
.newproj{margin-top:9px;padding:8px 10px;border-radius:8px;font-size:11.5px;line-height:1.7;
  background:color-mix(in srgb,var(--warnA) 14%,transparent);color:var(--warnA)}
.newproj[hidden]{display:none!important}

.diagrow{margin-top:16px;padding:9px 10px;border-top:1px solid var(--line);

      <!-- 🔴 v0.07_i 需求 25：診斷列。

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   幾何與手勢的計算邏輯（⭐ 未來會整段搬進正式 App 的部分）
   畫面部分是拋棄式的
   ══════════════════════════════════════════════════════════════ */

const APP_VER = 'v0.1.4.3';

/* ── 需求 1／需求 4：三種物件不再是 const 字面值，改成執行時載入 ──
   🔴 記憶體側單位＝【公分、浮點】；資料庫側（IndexedDB ＋ 雲端）＝【公釐、整數】。
      換算只發生在資料層邊界（toDb/fromDb、toRow/fromRow）。 */
let ROOMS = [];
let WALLS = [];
let BEAMS = [];        // 需求 1：樑。本輪【只有欄位與儲存，沒有 UI】
let FURN  = [];

/* ── 常數 ───────────────────────────────────────────────
   _d 不可變方向 #11：人操作的精度用【螢幕距離】，房子的事實用【公分】
   ⚠️ 需求 4：這幾個全部不換算——它們是記憶體側的常數。 */
const SNAP_PX   = 30;   // 吸附觸發：螢幕距離（不是公分！）
const NUDGE_PX  = 3;    // 微調步進：螢幕距離
const NUDGE_MIN = 1;    // 步進下限 1 公分（Ali：1 公分是極限）
const DRAG_PX   = 4;    // 點/拖判定門檻（技法筆記 §2）
const CLEAR_CM  = 60;   // 走道淨空預設值（_d §5-6，必須顯示在畫面上）
const GRAB_PAD_PX = 14; // 選中家具的命中緩衝（螢幕距離）

/* 需求 8：房間色盤（系統自動配，本輪不讓使用者選）。色盤用完循環使用。 */
const ROOM_PALETTE = ['#3a6ea5','#4a8f5e','#c98a2e','#8e5ba6','#2f8f8f','#b0553f'];

const S = { gesture:'A2', mode:'obj', snap:true, gridAll:false,
            selId:null, zoom:1, panX:0, panY:0, tab:'plan',
            dragging:null, snapCand:null,
            pinPhoto:null,
            prevTab:'plan',        // 🔴 需求 16：進專案頁之前停在哪一個分頁
            sizeOpen:false,        // 需求 12：尺寸欄展開中？
            warnOpen:false,        // 需求 12：警示展開全部？
            /* 需求 8 §3-2 ＋ v0.05_i §4（修四）：卡片內的展開列在哪一筆。
               🔴 房間下拉與備註共用【同一個】展開狀態，不做兩個獨立展開。
               expandCause：'chip'（點〔已擺〕而 room=null 進來）／'manual'（點 ▾ 進來）
               —— 兩者對「選未指定」的處理不同，見 itemCard()。 */
            expandId:null, expandCause:null,
            dataErr:'' };          // 需求 15：pull 失敗時的錯誤（不可用種子蓋掉）

const svg = document.getElementById('plan');
const NS  = 'http://www.w3.org/2000/svg';
const el  = (t,a)=>{const n=document.createElementNS(NS,t);
  for(const k in a) n.setAttribute(k,a[k]); return n;};
const $ = id=>document.getElementById(id);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ══════════════════════════════════════════════════════════════
   幾何 helpers
   ⚠️ 需求 4 N-8：這一段的【本體】不准因為單位改變而改邏輯。
      本版只加了 null 尺寸與缺牆的守衛（需求 7／需求 9），沒有動運算。
   ══════════════════════════════════════════════════════════════ */
const wallById = id => WALLS.find(w=>w.id===id);
function wallAngle(w){ return Math.atan2(w.y2-w.y1, w.x2-w.x1); }
function wallLen(w){ return Math.hypot(w.x2-w.x1, w.y2-w.y1); }

/* 需求 9：房間不一定有牆（開放式廚房／打通）→ 沒有牆就回 null，不回 NaN */
function roomCenter(rid){
  const ws=WALLS.filter(w=>w.room===rid);
  if(!ws.length) return null;
  let sx=0,sy=0; ws.forEach(w=>{sx+=w.x1;sy+=w.y1;});
  return {x:sx/ws.length, y:sy/ws.length};
}
/* 🔴 房間底的多邊形要靠【牆首尾相接】排出來，不可直接用陣列順序。
   ⚠️ 這是本版換掉假資料後才出現的：v0.1.3.1 的 WALLS 是寫死的 const，順序就是幾何順序；
      現在 WALLS 來自 IndexedDB.getAll()，順序是 UUID 順序（隨機）
      ⇒ 直接連起點會畫出【自交】的多邊形（畫面上是幾塊白色三角）。
   做法：從任一道牆出發，用端點配對往下接。接不完就畫接到的那一段（>=3 點才畫）。 */
function roomRing(rid){
  const ws=WALLS.filter(w=>w.room===rid);
  if(ws.length<3) return null;
  const k=(x,y)=>Math.round(x*10)+','+Math.round(y*10);
  const used=new Set([ws[0].id]);
  const pts=[{x:ws[0].x1,y:ws[0].y1},{x:ws[0].x2,y:ws[0].y2}];
  for(let i=1;i<ws.length;i++){
    const tail=pts[pts.length-1], tk=k(tail.x,tail.y);
    const nx=ws.find(w=>!used.has(w.id) && (k(w.x1,w.y1)===tk || k(w.x2,w.y2)===tk));
    if(!nx) break;
    used.add(nx.id);
    pts.push(k(nx.x1,nx.y1)===tk ? {x:nx.x2,y:nx.y2} : {x:nx.x1,y:nx.y1});
  }
  if(pts.length>3 && k(pts[0].x,pts[0].y)===k(pts[pts.length-1].x,pts[pts.length-1].y)) pts.pop();
  return pts.length>=3 ? pts : null;
}
// 牆的內側法線：指向房間中心那一側
function wallNormal(w){
  const a=wallAngle(w), nx=Math.sin(a), ny=-Math.cos(a);
  const c=roomCenter(w.room);
  if(!c) return {x:nx,y:ny};                   // 需求 9：沒有中心可比 → 取任一側，不 NaN
  const mx=(w.x1+w.x2)/2, my=(w.y1+w.y2)/2;
  return ((c.x-mx)*nx+(c.y-my)*ny) >= 0 ? {x:nx,y:ny} : {x:-nx,y:-ny};
}
/* 🔴 貼牆家具「離牆多遠」不能寫死用 深/2 —— 自訂旋轉 90° 後，貼著牆的那一邊變成【寬】。
   正解＝旋轉後的實際垂直半徑：|寬/2·sin| + |深/2·cos|
   ⚠️ 需求 7：尺寸未填（null）時這裡會拿到 null → 回 0，不產生 NaN。 */
function perpHalf(f){
  if(f.w==null || f.d==null) return 0;
  const t=(f.rot||0)*Math.PI/180;
  return Math.abs(f.w/2*Math.sin(t)) + Math.abs(f.d/2*Math.cos(t));
}
/* 世界座標＋角度：貼牆的由「牆＋偏移」算出來（_d §5-2 真相唯一） */
function place(f){
  const a0=f.anchor||{type:'free',x:0,y:0};
  if(a0.type==='free')
    return {x:a0.x??0, y:a0.y??0, ang:(f.rot||0)*Math.PI/180, wall:null};
  const w=wallById(a0.wall);
  /* 🔴 需求 9：牆不見了也不炸。⚠️ 這是防呆不是正解——
     正解是需求 6 的 anchor 重設（刪房間時就地轉絕對座標）。兩層都要。 */
  if(!w) return {x:a0.x??0, y:a0.y??0, ang:(f.rot||0)*Math.PI/180, wall:null};
  const a=wallAngle(w), n=wallNormal(w);
  const ux=Math.cos(a), uy=Math.sin(a);
  const bx=w.x1+ux*(a0.along||0), by=w.y1+uy*(a0.along||0);
  const dep=perpHalf(f) + (a0.off||0);
  return {x:bx+n.x*dep, y:by+n.y*dep, ang:a+(f.rot||0)*Math.PI/180, wall:w};
}
/* 旋轉矩形的四角 */
function corners(cx,cy,w,d,ang,grow){
  const hw=w/2+(grow||0), hd=d/2+(grow||0);
  const c=Math.cos(ang), s=Math.sin(ang);
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]]
    .map(([x,y])=>({x:cx+x*c-y*s, y:cy+x*s+y*c}));
}
/* SAT：兩個旋轉矩形有沒有相交 */
function overlap(A,B){
  for(const poly of [A,B]){
    for(let i=0;i<4;i++){
      const p1=poly[i], p2=poly[(i+1)%4];
      const ax=-(p2.y-p1.y), ay=p2.x-p1.x;
      let a1=Infinity,a2=-Infinity,b1=Infinity,b2=-Infinity;
      A.forEach(p=>{const v=p.x*ax+p.y*ay; a1=Math.min(a1,v); a2=Math.max(a2,v);});
      B.forEach(p=>{const v=p.x*ax+p.y*ay; b1=Math.min(b1,v); b2=Math.max(b2,v);});
      if(a2<b1||b2<a1) return false;
    }
  }
  return true;
}
/* 拖曳中的「當下位置」——正在拖的那件用手指當下的位置畫，其餘照舊（O-7） */
function liveP(f){
  if(S.dragging && S.dragging.f.id===f.id)
    return {x:S.dragging.gx, y:S.dragging.gy, ang:S.dragging.ang, wall:null};
  return place(f);
}
function boxOf(f,grow){ const p=liveP(f);
  return corners(p.x,p.y,f.w,f.d,p.ang,grow); }
/* 斜擺＝角度不是 90 度倍數 */
function isSkew(f){ const p=place(f);
  const deg=((p.ang*180/Math.PI)%90+90)%90;
  return Math.min(deg,90-deg) > 1.5;
}
/* 需求 7：尺寸未填的物件【不參與碰撞】 */
const hasSize = f => f && f.w!=null && f.d!=null;
/* 需求 8：會出現在平面圖上的家具＝有房間 ＋ 已擺 ＋ 有尺寸 */
const onPlan  = f => hasSize(f) && f.isPlaced && f.room;
function collisions(f){
  const hit=[], near=[];
  if(!hasSize(f)) return {hit,near};
  const A=boxOf(f,0), Ac=boxOf(f,CLEAR_CM/2);
  FURN.forEach(g=>{ if(g.id===f.id||g.room!==f.room) return;
    if(!onPlan(g)) return;
    if(overlap(A,boxOf(g,0))) hit.push(g);
    else if(overlap(Ac,boxOf(g,CLEAR_CM/2))) near.push(g);
  });
  return {hit,near};
}
/* 點到線段的距離 */
function distSeg(px,py,w){
  const dx=w.x2-w.x1, dy=w.y2-w.y1, L=dx*dx+dy*dy;
  let t=L? ((px-w.x1)*dx+(py-w.y1)*dy)/L : 0;
  t=Math.max(0,Math.min(1,t));
  return {d:Math.hypot(px-(w.x1+dx*t), py-(w.y1+dy*t)), t};
}
/* 螢幕↔世界 */
const w2s = (x,y)=>({x:x*S.zoom+S.panX, y:y*S.zoom+S.panY});
const s2w = (x,y)=>({x:(x-S.panX)/S.zoom, y:(y-S.panY)/S.zoom});
const snapCm  = ()=> SNAP_PX/S.zoom;
const nudgeCm = ()=> Math.max(NUDGE_MIN, Math.round(NUDGE_PX/S.zoom));

/* ══════════════════════════════════════════════════════════════
   🔴 需求 20｜「給人讀的文字」一律畫在【畫面座標】，不隨 zoom／pan 跑出畫面
   來歷（Ali 手機截圖，zoom 192%）：房間只有 400×300 公分 ⇒ fit() 把它撐到滿寬
     ⇒ 用世界座標畫的文字被推出畫面左邊：
        「（可刪）」只剩右半／「單〕重來，或直接改它」左邊被切／「道寬 60 公分」的「走」被切
   做法：另開一個【不受 transform 影響】的圖層（直接掛在 <svg> 上，不進 g），
         字級用固定 px（不隨 zoom 變大變小），位置一律夾在可見範圍內。
   ⚠️ 家具名稱【仍然跟世界座標】（必須貼在物件上才有意義），但算出來的位置要夾回邊界。
   ══════════════════════════════════════════════════════════════ */
let _uiLayer=null;                     // 畫面座標圖層（每次 render 重建）
const SVG_PAD = 6;                     // 夾限留白
function svgSize(){
  const r=svg.getBoundingClientRect();
  /* ⚠️ O-1：版面未定案時 rect 是 0。回一個保底值，不要讓夾限算出 NaN／負數。 */
  return { w: r.width  || 360, h: r.height || 480 };
}
/* 在畫面座標圖層寫一行字，並把它夾回可見範圍內。
   🔴 夾限用【實際量出來的 getBBox()】，不用估寬。
      ⚠️ 這一條是 N-113 實測抓到的：第一版用 `字數 × px × 0.62` 估寬，
         但【中日韓字寬約 1em】，估出來只有實際的六成
         ⇒ 平移到角落時「範例房間（可刪）」與「走道寬 60 公分」照樣跑出畫面。
         ⇒ 估的東西會錯，量的東西不會。 */
function uiText(sx, sy, txt, opt){
  const o=opt||{};
  const px=o.size||13;
  const anchor=o.anchor||'start';
  const t=el('text',{x:sx, y:sy, 'text-anchor':anchor,
    fill:o.fill||'var(--sub)', 'font-size':px,
    'pointer-events':'none'});
  if(o.weight) t.setAttribute('font-weight',o.weight);
  if(o.opacity!=null) t.setAttribute('opacity',o.opacity);
  t.textContent=txt;
  _uiLayer.appendChild(t);
  try{
    const {w,h}=svgSize();
    const b=t.getBBox();
    let dx=0, dy=0;
    if(b.width <= w-2*SVG_PAD){
      if(b.x < SVG_PAD) dx = SVG_PAD - b.x;
      else if(b.x+b.width > w-SVG_PAD) dx = (w-SVG_PAD) - (b.x+b.width);
    }else{
      dx = SVG_PAD - b.x;          // 比畫面還寬 → 至少讓【開頭】看得到，不要左邊被切
    }
    if(b.y < SVG_PAD) dy = SVG_PAD - b.y;
    else if(b.y+b.height > h-SVG_PAD) dy = (h-SVG_PAD) - (b.y+b.height);
    if(dx||dy){ t.setAttribute('x', sx+dx); t.setAttribute('y', sy+dy); }
  }catch(e){ /* getBBox 在版面未定案時會丟 → 這一幀不夾，下一幀 render 會再來一次 */ }
  return t;
}

/* 需求 8／需求 11：房間色。
   🔴 v0.05_i §3（修三）：依【createdAt（建立順序）】排序取色，不是陣列順序。
      ⚠️ 原因：WALLS/ROOMS 來自 IndexedDB.getAll()，順序是 UUID 順序（隨機），
         「陣列順序」跨裝置一致但【不是建立順序】⇒ 新增房間 UI 一落地就會顯形。
   邊界：
     · 舊資料沒有 createdAt → localeCompare 讓空字串排最前面（它們本來就是最早的）。
       🔴 不補寫假的 createdAt（obs O-13）。
     · createdAt 完全相同 → 用 id 當第二順位，保證兩台裝置排出同一個順序。
     · 🔴 排序用的是 ROOMS_ALL（**含軟刪除的墓碑**），不是只有活的。
       依據＝v0.05_i §3 自己的兩條驗收：
         N-93「刪中間那一間 → 另外兩間的顏色【不變】（不是重新編號）」
         邊界「房間被刪（軟刪）再還原 → 順序不變 ⇒ 顏色不會跳」
       ⚠️ 兩條都只有在【墓碑仍然佔著它的名次】時才成立。
       （v0.05_i §3 貼的 pseudocode 寫 `ROOMS.filter(r=>!r.deletedAt)`，
         那會重新編號、與它自己的 N-93 相反 ⇒ 已回報，碼取 N-93 那一邊。）
   ⚠️ room 為 null → 中性灰，與清單「未擺放」分組同一個灰。 */
let ROOMS_ALL = [];        // 含墓碑，只給 roomOrder() 用
function roomOrder(){
  return ROOMS_ALL.slice().sort((a,b)=>{
    const c=String(a.createdAt||'').localeCompare(String(b.createdAt||''));
    return c!==0 ? c : String(a.id).localeCompare(String(b.id));
  });
}
function roomColor(roomId){
  if(!roomId) return 'var(--dim)';
  const i=roomOrder().findIndex(r=>r.id===roomId);
  if(i<0) return 'var(--dim)';
  return ROOM_PALETTE[i % ROOM_PALETTE.length];
}
function roomName(roomId){
  const r=ROOMS.find(x=>x.id===roomId);
  return r ? (r.name||'未命名') : '未指定房間';
}

/* ══════════════════════════════════════════════════════════════
   需求 14｜比例尺：拆成兩個元件
   ① 走道寬度示意帶（既有，保留）——標籤指的是【厚度】
   ② 長度比例尺（🆕）——長度由當前 zoom 實算
   🔴 O-9：「標示」與「比例尺」是兩種東西。不可共用標籤。
   ══════════════════════════════════════════════════════════════ */
let _scaleCm = null;                    // 需求 14：遲滯用，記住上一次回傳的候選
function niceScaleCm(zoom){             // zoom = 每公分幾個螢幕 px
  const CAND=[10,20,50,100,200,500];
  const TARGET=90;                      // 目標螢幕長度（60~120 的中點）
  /* 🔴 遲滯：上一次的候選若仍落在 50~140px（比 60~120 寬的容忍帶）就沿用，
     一次縮放手勢裡最多換一次，不會在兩個候選之間來回跳。 */
  if(_scaleCm!=null){
    const px=_scaleCm*zoom;
    if(px>=50 && px<=140) return _scaleCm;
  }
  let best=CAND[0], bestErr=Infinity;
  for(const c of CAND){
    const err=Math.abs(c*zoom-TARGET);
    if(err<bestErr){ bestErr=err; best=c; }
  }
  _scaleCm=best;
  return best;
}
function dataLeft(){ let x=null; WALLS.forEach(w=>{
    x = x==null ? Math.min(w.x1,w.x2) : Math.min(x,w.x1,w.x2); }); return x==null?0:x; }
function dataBottom(){ let y=null; WALLS.forEach(w=>{
    y = y==null ? Math.max(w.y1,w.y2) : Math.max(y,w.y1,w.y2); }); return y==null?300:y; }
const barY = ()=> dataBottom()+80;      // 示意帶（上）
const scaleY = ()=> barY()+58;          // 長度比例尺（下）

/* ① 走道寬度示意帶。標籤 ＋ 一條指向厚度方向的細引線。 */
function corridorHint(g){
  const bx=dataLeft(), by=barY();
  const grp=el('g',{'pointer-events':'none'});
  grp.appendChild(el('rect',{x:bx,y:by-CLEAR_CM/2,width:150,height:CLEAR_CM,
    fill:'url(#clr)',color:'var(--sub)',stroke:'var(--line)','stroke-width':1.5}));
  // 人形（肩軸橫跨通道）：肩寬 45、身厚 18、頭直徑 18（真實公分）
  const person=el('g',{transform:`translate(${bx+75},${by})`,opacity:.95});
  person.appendChild(el('ellipse',{cx:0,cy:0,rx:9,ry:22.5,
    fill:'var(--accent)','fill-opacity':.30,stroke:'var(--accent)','stroke-width':2}));
  person.appendChild(el('circle',{cx:0,cy:0,r:9,
    fill:'var(--accent)','fill-opacity':.55,stroke:'var(--accent)','stroke-width':2}));
  grp.appendChild(person);
  /* 🔴 需求 14：引線必須指向【厚度】方向（垂直），不可讓人讀成長度 */
  const lx=bx+150+14;
  grp.appendChild(el('line',{x1:lx,y1:by-CLEAR_CM/2,x2:lx,y2:by+CLEAR_CM/2,
    stroke:'var(--sub)','stroke-width':1.6}));
  grp.appendChild(el('line',{x1:lx-5,y1:by-CLEAR_CM/2,x2:lx+5,y2:by-CLEAR_CM/2,
    stroke:'var(--sub)','stroke-width':1.6}));
  grp.appendChild(el('line',{x1:lx-5,y1:by+CLEAR_CM/2,x2:lx+5,y2:by+CLEAR_CM/2,
    stroke:'var(--sub)','stroke-width':1.6}));
  g.appendChild(grp);
  /* 🔴 需求 20：標籤改畫在【畫面座標】圖層。
     位置仍然貼著示意帶（用 w2s 換算過去），但會被夾在可見範圍內
     ⇒ zoom 拉大時不會被推出畫面（Ali 截圖裡「走」字被切掉的就是這一句）。 */
  const p=w2s(lx+10, by);
  uiText(p.x, p.y+5, `👤 走道寬 ${CLEAR_CM} 公分`, {size:13, fill:'var(--sub)'});
}
/* ② 長度比例尺：一條水平線 ＋ 兩端刻度，長度由 zoom 實算。 */
function lengthScale(g){
  const cm=niceScaleCm(S.zoom);
  const bx=dataLeft(), by=scaleY();
  const grp=el('g',{'pointer-events':'none'});
  grp.appendChild(el('line',{x1:bx,y1:by,x2:bx+cm,y2:by,
    stroke:'var(--ink)','stroke-width':2.4}));
  grp.appendChild(el('line',{x1:bx,y1:by-9,x2:bx,y2:by+9,
    stroke:'var(--ink)','stroke-width':2.4}));
  grp.appendChild(el('line',{x1:bx+cm,y1:by-9,x2:bx+cm,y2:by+9,
    stroke:'var(--ink)','stroke-width':2.4}));
  g.appendChild(grp);
  /* 🔴 需求 20：同上，標籤走畫面座標。
     ⚠️ 比例尺的【線】一定要留在世界座標（長度隨 zoom 變才有意義，需求 14），
        只有標籤搬出來——這兩件事不可以一起搬。 */
  const p=w2s(bx+cm+14, by);
  uiText(p.x, p.y+5, `${cm} cm`, {size:13, fill:'var(--ink)', weight:600});
}

/* ══════════════════════════════════════════════════════════════
   繪圖
   ══════════════════════════════════════════════════════════════ */
function render(){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const defs=el('defs');
  const pat=el('pattern',{id:'clr',width:7,height:7,patternUnits:'userSpaceOnUse',
    patternTransform:'rotate(45)'});
  pat.appendChild(el('rect',{width:7,height:7,fill:'transparent'}));
  pat.appendChild(el('line',{x1:0,y1:0,x2:0,y2:7,stroke:'currentColor',
    'stroke-width':2.2,opacity:.5}));
  defs.appendChild(pat); svg.appendChild(defs);

  const g=el('g',{transform:`translate(${S.panX},${S.panY}) scale(${S.zoom})`});
  svg.appendChild(g);
  /* 🔴 需求 20：畫面座標圖層。掛在 g 之【後】⇒ 永遠蓋在世界內容上面，
     而且不受 translate/scale 影響 ⇒ 文字不會被 zoom/pan 推出畫面。 */
  _uiLayer=el('g',{'data-layer':'ui'});
  svg.appendChild(_uiLayer);
  const sel = FURN.find(f=>f.id===S.selId);

  // 房間底
  ROOMS.forEach(r=>{
    const c=roomCenter(r.id);
    /* 需求 9：roomCenter 回 null（沒有牆）→ polygon 與房間名都不畫，不是畫在 NaN */
    if(!c) return;
    const ring=roomRing(r.id);
    if(ring){
      g.appendChild(el('polygon',{points:ring.map(p=>`${p.x},${p.y}`).join(' '),
        fill:'var(--panel)',stroke:'none',opacity:.85}));
    }
    /* 🔴 需求 20：房間名是「給人讀的文字」。
       Ali 截圖裡被切成只剩右半的「（可刪）」就是這一句。
       位置仍由世界座標決定（要貼著那個房間），但夾回可見範圍內。 */
    const ps=w2s(c.x, c.y-140);
    uiText(ps.x, ps.y, r.name||'未命名', {size:15, anchor:'middle',
      fill:'var(--sub)', opacity:.75});
  });
  // 牆（選中家具所依附的那道要高亮）
  const litWall = sel ? place(sel).wall : null;
  WALLS.forEach(w=>{
    const on = litWall && litWall.id===w.id;
    g.appendChild(el('line',{x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2,
      stroke: on?'var(--accent)':'var(--wall)',
      'stroke-width': on?11:7,'stroke-linecap':'square',
      'stroke-dasharray': w.state==='proposed' ? '18 10' : 'none'}));
  });
  // 吸附預示：目標牆 ＋ 虛線幽靈
  if(S.snapCand){
    const c=S.snapCand;
    g.appendChild(el('line',{x1:c.wall.x1,y1:c.wall.y1,x2:c.wall.x2,y2:c.wall.y2,
      stroke:'var(--ghost)','stroke-width':13,opacity:.85,'stroke-linecap':'square'}));
    const gp=corners(c.gx,c.gy,c.f.w,c.f.d,c.gang,0);
    g.appendChild(el('polygon',{points:gp.map(p=>`${p.x},${p.y}`).join(' '),
      fill:'none',stroke:'var(--ghost)','stroke-width':3,
      'stroke-dasharray':'10 7'}));
  }
  // 走道網格（常駐視覺，_d §5-6 方向 #7）
  FURN.forEach(f=>{
    if(!onPlan(f)) return;
    const isDrag = S.dragging && S.dragging.f.id===f.id;
    if(!S.gridAll && !isDrag && (!sel || sel.id!==f.id)) return;
    const p=liveP(f), pts=corners(p.x,p.y,f.w,f.d,p.ang,CLEAR_CM/2);
    const n=collisions(f);
    g.appendChild(el('polygon',{points:pts.map(q=>`${q.x},${q.y}`).join(' '),
      fill:'url(#clr)', color: n.near.length?'var(--warnA)':'var(--sub)',
      stroke: n.near.length?'var(--warnA)':'var(--line)',
      'stroke-width':2,'stroke-dasharray':'8 6', opacity:.9}));
  });

  // 需求 14：兩個元件——示意帶在上、比例尺在下
  corridorHint(g);
  lengthScale(g);

  /* ── 家具 ──
     🔴 需求 11（v0.04_i §4）三個視覺通道，取代原本的優先權表：
        填色     ← 自訂色（color 為 null 用系統預設）。唯一例外：撞到 → 紅
        外框顏色 ← 所屬房間的顏色。唯一例外：走道不足 → 橙
        外框粗細 ← 選中：2px → 4px（🔴 只改粗細，不改顏色） */
  FURN.forEach(f=>{
    if(!onPlan(f)) return;
    const p=liveP(f), pts=corners(p.x,p.y,f.w,f.d,p.ang,0);
    const n=collisions(f), on=sel&&sel.id===f.id;
    const isDrag = S.dragging && S.dragging.f.id===f.id;
    const fillCol   = n.hit.length ? 'var(--warnB)' : (f.color || 'var(--furn)');
    const strokeCol = n.near.length? 'var(--warnA)' : roomColor(f.room);
    const strokeW   = on ? 4 : 2;
    g.appendChild(el('polygon',{points:pts.map(q=>`${q.x},${q.y}`).join(' '),
      fill: fillCol,
      'fill-opacity': n.hit.length?.55:(isDrag?.75:(on?.92:.8)),
      stroke: strokeCol,
      'stroke-width': strokeW,
      'data-f':f.id}));
    if(isDrag){   // 拖曳中額外給一個「浮起來」的外框，讓「它正在被拖」看得出來
      g.appendChild(el('polygon',{points:pts.map(q=>`${q.x},${q.y}`).join(' '),
        fill:'none',stroke:'var(--furnSel)','stroke-width':6,opacity:.45}));
    }
    /* 🔴 需求 20：家具名稱【仍然跟世界座標】（必須貼在物件上才有意義），
       但算出來的位置若超出可見範圍 → 夾回邊界內（uiText 會做）。 */
    const ps=w2s(p.x, p.y);
    uiText(ps.x, ps.y+4, f.name||'未命名', {size:12, anchor:'middle', fill:'var(--ink)'});
  });
  // 照片標記（_d §8-1 Marker）
  MARKERS.forEach(m=>{
    const gm=el('g',{transform:`translate(${m.x},${m.y})`,'data-mk':m.id,style:'cursor:pointer'});
    gm.appendChild(el('circle',{cx:0,cy:0,r:17,fill:'var(--warnA)','fill-opacity':.92,
      stroke:'#fff','stroke-width':3}));
    const tt=el('text',{x:0,y:7,'text-anchor':'middle','font-size':19,'pointer-events':'none'});
    tt.textContent='📷'; gm.appendChild(tt);
    g.appendChild(gm);
  });

  /* 需求 5：種子提示。依 _d §10-0b 這句是【功能說明】
     ⇒ 只留到使用者建了第一件東西為止，之後不再顯示。 */
  if(isSeedPristine()){
    /* 🔴 需求 20：提示句固定在平面圖【左上】（畫面座標），完全不隨 zoom／pan 跑。
       Ali 截圖裡被切成「單〕重來，或直接改它」的就是這一句。 */
    uiText(SVG_PAD+2, SVG_PAD+16, '這是範例。到 ⚙️ 按〔清清單〕重來，或直接改它',
      {size:12, fill:'var(--sub)', opacity:.9});
  }
  /* 需求 15：pull 失敗必須看得到（不可被「本機全空」蓋成一個空專案）
     🔴 需求 20：這也是給人讀的文字 ⇒ 畫面座標，固定在左上第二行。 */
  if(S.dataErr){
    uiText(SVG_PAD+2, SVG_PAD+(isSeedPristine()?34:16), '⚠️ '+S.dataErr,
      {size:12, fill:'var(--warnB)', weight:600});
  }
}

/* ══════════════════════════════════════════════════════════════
   手勢（議題 A：兩案並陳，同一原型用開關切）
   ══════════════════════════════════════════════════════════════ */
const pts=new Map();
let startPt=null, moved=false, pinch0=null, hitId=null;

function furnAt(sx,sy){
  const p=s2w(sx,sy);
  const pad = GRAB_PAD_PX/S.zoom;               // 螢幕 14px 換算成公分
  for(let i=FURN.length-1;i>=0;i--){
    const f=FURN[i];
    if(!onPlan(f)) continue;
    const q=place(f);
    const m = (f.id===S.selId) ? pad : 0;       // 只有選中的才有緩衝
    const c=Math.cos(-q.ang), s=Math.sin(-q.ang);
    const dx=p.x-q.x, dy=p.y-q.y;
    const lx=dx*c-dy*s, ly=dx*s+dy*c;
    if(Math.abs(lx)<=f.w/2+m && Math.abs(ly)<=f.d/2+m) return f;
  }
  return null;
}
function canDragFurn(f){
  if(!f) return false;
  if(!hasSize(f)) return false;        // 🔴 需求 7：尺寸未填不可拖（點選仍可，供編輯）
  if(S.gesture==='A1') return S.mode==='obj';
  return S.selId===f.id;               // A2：要先選中才拖得動
}
svg.addEventListener('pointerdown',e=>{
  try{ svg.setPointerCapture(e.pointerId); }catch(err){}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    pinch0={d:Math.hypot(a.x-b.x,a.y-b.y), z:S.zoom,
            mx:(a.x+b.x)/2, my:(a.y+b.y)/2, px:S.panX, py:S.panY};
    S.dragging=null; startPt=null; hitId=null; return;   // 進入縮放＝取消單指狀態
  }
  const r=svg.getBoundingClientRect();
  const sx=e.clientX-r.left, sy=e.clientY-r.top;
  startPt={id:e.pointerId,x:e.clientX,y:e.clientY,sx,sy,panX:S.panX,panY:S.panY};
  moved=false;
  const f=furnAt(sx,sy); hitId=f?f.id:null;
  if(canDragFurn(f)){
    const q=place(f);
    S.dragging={f, gx:q.x, gy:q.y, ang:q.ang,
      ox:q.x-s2w(sx,sy).x, oy:q.y-s2w(sx,sy).y};
  }
});
svg.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch0 && pts.size===2){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const z=Math.max(.25,Math.min(4, pinch0.z*(d/pinch0.d)));
    const r=svg.getBoundingClientRect();
    const mx=pinch0.mx-r.left, my=pinch0.my-r.top;
    S.panX = mx-(mx-pinch0.px)*(z/pinch0.z);
    S.panY = my-(my-pinch0.py)*(z/pinch0.z);
    S.zoom=z; render(); syncSel(); zLbl(); return;
  }
  if(!startPt) return;
  const dx=e.clientX-startPt.x, dy=e.clientY-startPt.y;
  if(!moved && (Math.abs(dx)>DRAG_PX||Math.abs(dy)>DRAG_PX)) moved=true;   // §2
  if(!moved) return;
  if(S.dragging){
    const r=svg.getBoundingClientRect();
    const p=s2w(e.clientX-r.left, e.clientY-r.top);
    S.dragging.gx=p.x+S.dragging.ox;
    S.dragging.gy=p.y+S.dragging.oy;
    previewMove(); render(); syncSel();
  }else if(S.gesture==='A1' && S.mode==='obj'){
    nudgeHint('這裡是空白處。要移動畫面請先切到「✋ 移動畫面」');
  }else{
    S.panX=startPt.panX+dx; S.panY=startPt.panY+dy; render();
  }
});
let hintT=null;
function nudgeHint(msg){
  const h=$('modeHint'); if(!h) return;
  h.textContent=msg; h.style.color='var(--warnA)';
  clearTimeout(hintT);
  hintT=setTimeout(()=>{ h.style.color='';
    h.textContent = S.mode==='obj'?'現在拖曳＝移動家具':'現在拖曳＝移動畫面'; },1600);

function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size<2) pinch0=null;
  /* ⚠️ O-2：只處理「開始這一筆的那根手指」抬起。
     否則漏收一次 pointerup 會用上一次留下的 startPt/hitId 去做選取。 */
  const mine = startPt && startPt.id===e.pointerId;
  if(S.dragging && moved){ commitMove(); }
  else if(!moved && mine){
    const r2=svg.getBoundingClientRect();
    const wp=s2w(e.clientX-r2.left, e.clientY-r2.top);
    if(S.pinPhoto){ dropMarker(wp.x, wp.y); }
    else {
      const hitM=MARKERS.find(m=>Math.hypot(wp.x-m.x, wp.y-m.y) <= 17+8/S.zoom);
      if(hitM){ showMarker(hitM); }
      else{
        const f=hitId?FURN.find(x=>x.id===hitId):null;
        select(f?f.id:null);                         // 輕點＝選取 / 點空白＝取消
      }
    }
  }
  if(mine || !S.dragging){ startPt=null; hitId=null; }
  S.dragging=null; S.snapCand=null;
  render(); syncSel();
}
svg.addEventListener('pointerup',endPointer);
svg.addEventListener('pointercancel',endPointer);   // 來電/通知蓋掉：當作沒發生
svg.addEventListener('lostpointercapture',e=>{      // 擷取被搶走＝那根手指已經不算數
  pts.delete(e.pointerId);
  if(pts.size<2) pinch0=null;
  if(startPt && startPt.id===e.pointerId){ startPt=null; hitId=null; S.dragging=null; }
});

/* 吸附後的朝向（O-8：自動對齊只能對齊使用者沒有表態的維度） */
function snapRot(absAng, wallAng, curRot){
  let rel=(absAng-wallAng)*180/Math.PI;
  rel=((rel%360)+360)%360;
  const ortho = Math.abs((((curRot||0)%90)+90)%90) < 0.5;
  return ortho ? (Math.round(rel/90)%4)*90 : rel;
}
/* 拖曳中：找吸附候選並產生預示（不當場跳貼，維持跟手）*/
function previewMove(){
  S.snapCand=null;
  if(!S.snap||!S.dragging) return;
  const {f,gx,gy}=S.dragging;
  if(!hasSize(f)) return;
  let best=null;
  const ph=perpHalf(f);
  WALLS.filter(w=>w.room===f.room).forEach(w=>{
    const {d,t}=distSeg(gx,gy,w);
    const gap=d-ph;
    if(gap<snapCm() && (!best||gap<best.gap))
      best={w,t,gap};
  });
  if(!best) return;
  const w=best.w, a=wallAngle(w), n=wallNormal(w);
  const along=Math.max(f.w/2, Math.min(wallLen(w)-f.w/2, best.t*wallLen(w)));
  const bx=w.x1+Math.cos(a)*along, by=w.y1+Math.sin(a)*along;
  const nr=snapRot(S.dragging.ang, a, f.rot);
  S.snapCand={f, wall:w, along,
    gx:bx+n.x*ph, gy:by+n.y*ph, gang:a+nr*Math.PI/180};
}
function commitMove(){
  const {f,gx,gy,ang}=S.dragging;
  if(S.snapCand && S.snapCand.f.id===f.id){
    /* 🔴 吸附【不可以順手把家具轉正】（O-8）。以目前的絕對朝向為準反算 rot。 */
    f.rot = snapRot(ang, wallAngle(S.snapCand.wall), f.rot);
    f.anchor={type:'wall', wall:S.snapCand.wall.id, along:S.snapCand.along, off:0};
  }else{
    f.anchor={type:'free', x:gx, y:gy};      // 錨點切換＝依附身分改變（_d §5-2）
    f.rot=((ang*180/Math.PI)%360+360)%360;   // 脫離牆面時同樣保持絕對朝向
  }
  /* 🔴 需求 4：7 處「直接 in-place 改值」一律改成「改記憶體 → 呼叫 saveItem()」 */
  saveItem(f).catch(e=>cloudErr(e));
}

function warnSummary(n){
  if(n.hit.length){
    const names=n.hit.map(x=>x.name||'未命名');
    if(S.warnOpen || names.length===1) return {cls:'c', txt:`🔴 撞到：${names.join('、')}`};
    return {cls:'c', txt:`🔴 撞到：${names[0]} +${names.length-1}`};
  }
  if(n.near.length){
    const names=n.near.map(x=>x.name||'未命名');
    if(S.warnOpen || names.length===1)
      return {cls:'w', txt:`🟠 走道不足：與 ${names.join('、')} 之間不到 ${CLEAR_CM} 公分`};
    return {cls:'w', txt:`🟠 走道不足：與 ${names[0]} +${names.length-1} 不到 ${CLEAR_CM} 公分`};
  }
  return {cls:'n', txt:'🟢 沒有碰撞，走道也夠'};
}

  let axis;

  /* 需求 12 邊界：
     · 未貼牆時「脫離牆面」disabled，不隱藏（否則按鈕會跳位）
     · 尺寸未填時只有「📏 改尺寸」可按（沒有寬深算不出位置與碰撞） */
  const noSize=!hasSize(f);

  [...$('pad').querySelectorAll('button')].forEach(b=>{ b.disabled=noSize; });

  // 未旋轉原貌對照（留什麼：一行都不改）
  const ob=$('origBox');
  if(hasSize(f) && isSkew(f)){
    ob.classList.add('show');
    const s=$('origSvg'); while(s.firstChild) s.removeChild(s.firstChild);
    const k=Math.min(20/f.w, 20/f.d);
    s.appendChild(el('rect',{x:-f.w*k/2,y:-f.d*k/2,width:f.w*k,height:f.d*k,
      fill:'none',stroke:'var(--sub)','stroke-width':1.4,'stroke-dasharray':'3 2'}));
    const deg=p.ang*180/Math.PI;
    const r2=el('rect',{x:-f.w*k/2,y:-f.d*k/2,width:f.w*k,height:f.d*k,
      fill:'var(--furnSel)','fill-opacity':.5,stroke:'var(--furnSel)','stroke-width':1.6,
      transform:`rotate(${deg})`});
    s.appendChild(r2);
    const approx = (f.shape && f.shape!=='rect');
    $('origTxt').innerHTML =

              : `<br>矩形家具的碰撞判定精確，不受角度影響。`);
  } else ob.classList.remove('show');

  // 警示列（只提示不擋 — _d 方向 #9）。與「完成」同排，高度固定一列。

let _rep=null, _repId=null;
function stopRepeat(){ if(_rep){ clearInterval(_rep); clearTimeout(_rep); } _rep=null; _repId=null; }

  .forEach(ev=>$('pad').addEventListener(ev,e=>{ if(_repId===e.pointerId) stopRepeat(); }));

$('pad').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  e.stopPropagation();                       // §2：擋住父層
  nudge(b.dataset.d);
});
function nudge(dir){
  const f=FURN.find(x=>x.id===S.selId); if(!f||!hasSize(f)) return;
  const step=nudgeCm(), p=place(f);
  const axis = p.wall ? wallAngle(p.wall) : (f.rot? f.rot*Math.PI/180 : 0);
  const ux=Math.cos(axis), uy=Math.sin(axis);
  /* ⚠️ O-6：螢幕的 y 是【往下增加】。整組按鈕用 CSS rotate(axis) 轉，
     「▲ 這顆鈕視覺上指的方向」＝ 把 (0,-1) 旋轉 axis 度 ＝ (uy, -ux)。 */
  const nx=uy, ny=-ux;
  let dx=0,dy=0;
  if(dir==='r'){dx=ux*step;  dy=uy*step;}
  if(dir==='l'){dx=-ux*step; dy=-uy*step;}
  if(dir==='u'){dx=nx*step;  dy=ny*step;}
  if(dir==='d'){dx=-nx*step; dy=-ny*step;}
  if(f.anchor.type==='wall'){
    const w=wallById(f.anchor.wall);
    if(w){
      const n2=wallNormal(w);
      f.anchor.along += dx*ux + dy*uy;
      f.anchor.off    = (f.anchor.off||0) + (dx*n2.x + dy*n2.y);
    }
  }else{ f.anchor.x=(f.anchor.x||0)+dx; f.anchor.y=(f.anchor.y||0)+dy; }
  saveItem(f).catch(e=>cloudErr(e));          // 需求 4：改記憶體 → 呼叫 saveItem()
  render(); syncSel();
}

/* ══════════════════════════════════════════════════════════════
   需求 7｜存檔顆粒度：即時算、失焦才存
     即時（input）：只重算【記憶體 ＋ 畫面】——碰撞、走道、警告顏色
     存檔          ：① blur ② Enter ③ 🔴 visibilitychange → hidden
   需求 7（v0.04_i §7）｜無效輸入：
     打字中不阻止、不還原、不寫入，但該欄位加紅框
     三個存檔觸發點：值無效 → 還原成【上一個有效值】並移除紅框
   ══════════════════════════════════════════════════════════════ */
const SZ=[['fw','w'],['fd','d'],['fh','h']];
SZ.forEach(([id,key])=>{
  $(id).addEventListener('input',()=>{
    const f=FURN.find(x=>x.id===S.selId); if(!f) return;
    const raw=$(id).value.trim();
    if(raw===''){                        // 尺寸從有值改成空白 → 視為 null（未填），不是 0
      f[key]=null; $(id).classList.remove('bad'); render(); syncSel(); return;
    }
    const v=parseFloat(raw);
    if(!isFinite(v)||v<=0){              // 無效：不寫入，保留上一個有效值，但標紅框
      $(id).classList.add('bad'); return;
    }
    $(id).classList.remove('bad');
    f[key]=v;                            // 即時重算（記憶體＋畫面），不存
    render(); syncSel();
  });
  $(id).addEventListener('blur',()=>commitFieldEdits());
  $(id).addEventListener('keydown',e=>{ if(e.key==='Enter'){ $(id).blur(); } });
});
function commitFieldEdits(){
  const f=FURN.find(x=>x.id===S.selId); if(!f) return;
  let dirty=false;
  SZ.forEach(([id,key])=>{
    const inp=$(id);
    const raw=inp.value.trim();
    const v=raw===''? null : parseFloat(raw);
    if(raw!=='' && (!isFinite(v)||v<=0)){
      // 🔴 無效 → 還原成上一個有效值（記憶體裡那個），移除紅框
      inp.value = f[key]==null ? '' : Math.round(f[key]*10)/10;
      inp.classList.remove('bad');
      return;
    }
    inp.classList.remove('bad');
    if(f[key]!==v){ f[key]=v; }
    dirty=true;
  });
  if(dirty){ saveItem(f).catch(e=>cloudErr(e)); render(); syncSel(); }
}

/* ══════════════════════════════════════════════════════════════
   需求 2｜本機持久化（IndexedDB）
   🔴 DB_VER 升到 2：加 rooms / walls / beams / items 四個 store。
   🔴 R-6：onblocked 沒掛 → Promise 永不 resolve 也永不 reject → 畫面停在「讀取中…」
   ══════════════════════════════════════════════════════════════ */
const DB_NAME='deco_probe', DB_VER=2;
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{const d=e.target.result;
      ['photos','markers','rooms','walls','beams','items'].forEach(st=>{
        if(!d.objectStoreNames.contains(st)) d.createObjectStore(st,{keyPath:'id'});
      });
    };
    r.onsuccess=e=>{
      _db=e.target.result;
      /* 另一個分頁要升級時，這一邊要主動讓位，否則那一邊會被 blocked 卡住 */
      _db.onversionchange=()=>{ try{_db.close();}catch(err){} _db=null;
        showDbNotice('資料庫版本被另一個分頁更新了。請重新載入這一頁。'); };
      res(_db);
    };
    r.onerror=e=>rej(e.target.error);
    /* 🔴 這一條不做會【靜默卡死】：另一個分頁還開著舊版本 ⇒ 升級被擋 */
    r.onblocked=()=>rej(new Error(
      '另一個分頁還開著舊版本，資料庫升級被擋住。請把其他分頁關掉再重新載入。'));
  });
}
function showDbNotice(msg){
  S.dataErr=msg;
  try{ render(); }catch(e){}
  const b=$('pstat'); if(b) b.innerHTML='🔴 '+esc(msg);
}
function tx(store,mode,fn){
  return openDB().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store);
    const req=fn(s);
    t.oncomplete=()=>res(req&&req.result);
    t.onerror=()=>rej(t.error);
  }));
}
/* ⚠️ id 必須是【合法 UUID】——雲端的 id 是 uuid 型別，非 UUID 會被拒，
   而錯誤訊息看不出是 id 的問題（研究員 R-5）。🔴 種子資料也一律走這裡。 */
function uid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16));
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
/* ── 本機（IndexedDB）低階：只在資料層內部使用，畫面層不呼叫 ── */
async function lPut(st,rec){ rec.id=rec.id||uid(); await tx(st,'readwrite',s=>s.put(rec)); return rec.id; }
async function lGet(st,id){ return tx(st,'readonly',s=>s.get(id)); }
async function lAll(st){ return tx(st,'readonly',s=>s.getAll()); }
async function lDel(st,id){ return tx(st,'readwrite',s=>s.delete(id)); }

/* ══════════════════════════════════════════════════════════════
   需求 4｜單位換算（_d §3-6b）
     資料庫（IndexedDB ＋ 雲端）→ 公釐、整數
     記憶體與幾何運算            → 公分、浮點
     換算【只發生在資料層邊界】
   🔴 含 anchor 內的 along / off / x / y —— 唯一一個「嵌在 JSON 裡的長度」，最容易漏。
   ══════════════════════════════════════════════════════════════ */
const toMM   = v => (v==null || v==='') ? null : Math.round(Number(v)*10);
const fromMM = v => (v==null) ? null : Number(v)/10;

/* 要換算的長度欄位（逐一列出，不可漏）。
   ❌ 不換算：rot（度）、price（元）、color、name、note、所有布林、所有時間 */
const LEN_FIELDS = {
  rooms:['slabH'],
  walls:['x1','y1','x2','y2','thickness','height'],
  beams:['x1','y1','x2','y2','width','drop'],
  items:['w','d','h']
};
function anchorToMM(a){
  if(!a) return null;
  if(a.type==='wall') return {type:'wall', wall:a.wall,
    along:toMM(a.along), off:toMM(a.off||0)};
  return {type:'free', x:toMM(a.x), y:toMM(a.y)};
}
function anchorFromMM(a){
  if(!a) return {type:'free', x:0, y:0};
  if(a.type==='wall') return {type:'wall', wall:a.wall,
    along:fromMM(a.along)||0, off:fromMM(a.off)||0};
  return {type:'free', x:fromMM(a.x)||0, y:fromMM(a.y)||0};
}
/* 記憶體物件（公分） → IndexedDB 紀錄（公釐整數） */
function toDb(store,obj){
  const o=Object.assign({},obj);
  (LEN_FIELDS[store]||[]).forEach(k=>{ o[k]=toMM(obj[k]); });
  if(store==='items') o.anchor=anchorToMM(obj.anchor);
  return o;
}
/* IndexedDB 紀錄（公釐整數） → 記憶體物件（公分浮點） */
function fromDb(store,rec){
  const o=Object.assign({},rec);
  (LEN_FIELDS[store]||[]).forEach(k=>{ o[k]=fromMM(rec[k]); });
  if(store==='items') o.anchor=anchorFromMM(rec.anchor);
  return o;
}
/* 🔴 需求 4｜時區：一律存 ISO（UTC），顯示時才轉本地。
   現況 W1（寫 '2026-09-08 10:30' 無時區）／W2（把 UTC 當本地印）各偏 8 小時。 */
const nowISO = ()=> new Date().toISOString();
function fmtLocal(iso){
  if(!iso) return '';
  const s=String(iso);
  /* ⚠️ 舊紀錄的 addedAt 是無時區字串 → new Date() 會得到 Invalid Date。
     邊界處理：沒有 T 也沒有 Z → 原樣輸出（那是舊紀錄，isLegacy() 已經會標它）。 */
  if(s.indexOf('T')<0 && s.indexOf('Z')<0) return s;
  const d=new Date(s);
  if(isNaN(d.getTime())) return s;
  const z=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} `+
         `${z(d.getHours())}:${z(d.getMinutes())}`;
}

/* ── 物件資料層（與照片線同構）──
   🔴 save* 與 savePhoto() 同一個模式：① 寫本機 ② 標 pending ③ 背景推雲端（失敗不擋畫面）
   🔴 delete* 【不是】。delete* 一律走軟刪除（需求 5 / 6 / 7），
      不可抄 deletePhoto() 的 lDel()。（v0.04_i §6） */
async function lAllObj(st){ return (await lAll(st)).map(r=>fromDb(st,r)); }
async function lAllLive(st){ return (await lAllObj(st)).filter(x=>!x.deletedAt); }
async function lGetObj(st,id){ const r=await lGet(st,id); return r? fromDb(st,r) : null; }
async function lPutObj(st,obj){ return lPut(st, toDb(st,obj)); }

function stampObj(o){
  o.id = o.id || uid();
  o.projectCode = CLOUD.code || null;
  o.updatedAt   = nowISO();
  o.appVer      = APP_VER;
  if(o.deletedAt===undefined) o.deletedAt=null;
  /* 🔴 v0.05_i §3（修三）：createdAt 只在【新建】時寫入（見 newObj()），
     這裡【一個字都不准動它】——之後任何更新、pull 覆蓋都要保留。
     🔴 也【不准】在這裡幫舊資料補一個假的 createdAt（obs O-13：偽裝成有資料）。 */
  /* ⚠️ 與 savePhoto 的一點差異（刻意）：物件【會被反覆修改】，
     每次存都要重新標 pending，否則改過的值永遠推不上去（N-59）。 */
  if(CLOUD.code){ o.pending=true; o.synced=false; }
  return o;
}
/* 🔴 v0.05_i §3（修三）：唯一可以寫 createdAt 的地方。
   四種物件（Room/Wall/Beam/Item）新建時都要經過這裡。
   ⚠️ 只有「這一筆真的是現在被造出來的」才准蓋這個章——
      從雲端 pull 回來的那條路不走這裡（它帶著雲端的 created_at，見 fromRow）。 */
function newObj(o){
  o.id = o.id || uid();
  o.createdAt = nowISO();
  return o;
}
async function saveRoom(r){ stampObj(r); await lPutObj('rooms',r);
  if(CLOUD.on) cloudPushObj('rooms',r.id).catch(e=>cloudErr(e)); return r.id; }
async function saveWall(w){ stampObj(w); await lPutObj('walls',w);
  if(CLOUD.on) cloudPushObj('walls',w.id).catch(e=>cloudErr(e)); return w.id; }
async function saveBeam(b){ stampObj(b); await lPutObj('beams',b);
  if(CLOUD.on) cloudPushObj('beams',b.id).catch(e=>cloudErr(e)); return b.id; }
async function saveItem(i){ stampObj(i); await lPutObj('items',i);
  if(CLOUD.on) cloudPushObj('items',i.id).catch(e=>cloudErr(e)); return i.id; }

/* delete*：🔴 軟刪除（進垃圾桶），不是 lDel */
async function softDelete(store, arr, id, saver){
  const o=arr.find(x=>x.id===id) || await lGetObj(store,id);
  if(!o) return;
  o.deletedAt=nowISO();
  await saver(o);
}
async function deleteRoom(id){ return softDelete('rooms',ROOMS,id,saveRoom); }
async function deleteWall(id){ return softDelete('walls',WALLS,id,saveWall); }
async function deleteBeam(id){ return softDelete('beams',BEAMS,id,saveBeam); }
async function deleteItem(id){ return softDelete('items',FURN,id,saveItem); }

/* ── 需求 4／15｜啟動時一次載入 ──
   🔴 順序寫死（v0.04_i §1）：
      lAll × 四個 store → pull（若已連線）→ seedIfEmpty → purgeTrash
      ⚠️ pull 失敗（丟錯）→ 【不要】跑 seedIfEmpty，讓使用者看到錯誤訊息。
         理由：pull 失敗時「本機全空」不代表「這個專案是空的」。 */
async function reloadObjects(){
  ROOMS_ALL = await lAllObj('rooms');      // 🔴 含墓碑，給 roomOrder() 用（v0.05_i §3 / N-93）
  ROOMS = await lAllLive('rooms');
  WALLS = await lAllLive('walls');
  BEAMS = await lAllLive('beams');
  FURN  = await lAllLive('items');
}
async function loadAll(){
  await reloadObjects();
  let pulled=false;
  if(CLOUD.on){
    await cloudPull();            // 丟錯 → 由呼叫端接，且不會走到 seed
    await reloadObjects();
    pulled=true;
  }
  if(!CLOUD.on || pulled) await seedIfEmpty();
  await purgeTrash();
  await reloadObjects();
}

/* ══════════════════════════════════════════════════════════════
   需求 5｜種子範例、兩種清空、垃圾桶
   ══════════════════════════════════════════════════════════════ */
const SEED_ROOM_NAME='範例房間（可刪）';
/* 判準是「四個 store 全空（活的）」，不是「第一次開啟」——否則清空後不會重新出現。 */
async function seedIfEmpty(){
  if(ROOMS.length || WALLS.length || BEAMS.length || FURN.length) return;
  const rid=uid();
  const room=newObj({ id:rid, name:SEED_ROOM_NAME, slabH:300, note:'',
    projectCode:CLOUD.code||null, synced:false, pending:false,
    appVer:APP_VER, deletedAt:null });
  await saveRoom(room);
  // 矩形 400×300 公分（＝4000×3000 公釐）、state='proposed'、isBoundary=true、thickness=10cm
  const P=[[0,0],[400,0],[400,300],[0,300]];
  for(let i=0;i<4;i++){
    const a=P[i], b=P[(i+1)%4];
    await saveWall(newObj({ id:uid(), room:rid, x1:a[0],y1:a[1],x2:b[0],y2:b[1],
      /* 🔴 v0.05_i §1（修一）：種子牆是 state:'proposed'，不是 'existing'。
         _d §4-2c：existing ＝ 後台匯入、前台唯讀；種子是【前台自己造的】
         ⇒ 它在定義上就不可能是 existing。
         ⚠️ 寫 'existing' 的後果（建造者實測推出來的）：需求 3 的 insert 政策
            with check (… and state='proposed') 會回 42501 ⇒ 四道牆永遠 pending
            ⇒「有 N 筆未上傳」永遠不歸零。 */
      thickness:10, height:null, isBoundary:true, state:'proposed',
      total:null, note:'', isPlaced:true, isBudgeted:false,
      projectCode:CLOUD.code||null, synced:false, pending:false,
      appVer:APP_VER, deletedAt:null }));
  }
  // 🔴 家具 ×0（零件）。要試就自己建一件——那正是本輪的功能。
  await reloadObjects();
}
/* 種子還沒被動過？（提示句只留到使用者建了第一件東西為止） */
function isSeedPristine(){
  return FURN.length===0 && ROOMS.length===1 && ROOMS[0].name===SEED_ROOM_NAME;
}

/* 甲｜清擺設：什麼都不刪，只把所有 Item 的 isPlaced 設成 false。
   🔴 anchor 保留！只是不擺（它記得上次擺哪，切回來就回原位）。
   ⚠️ 逐筆更新、逐筆標 pending，不做交易（探針階段）。 */
async function clearPlacement(){
  for(const f of FURN.slice()){ f.isPlaced=false; await saveItem(f); }
  await reloadObjects();
}
/* 乙｜清清單：Room / Wall / Beam / Item 的【全部】列 → deletedAt = nowISO()
   🔴 留什麼：photos / markers 【完全不動】（照片不屬於清單）。 */
async function clearAll(){
  for(const r of ROOMS.slice()){ r.deletedAt=nowISO(); await saveRoom(r); }
  for(const w of WALLS.slice()){ w.deletedAt=nowISO(); await saveWall(w); }
  for(const b of BEAMS.slice()){ b.deletedAt=nowISO(); await saveBeam(b); }
  for(const f of FURN.slice()) { f.deletedAt=nowISO(); await saveItem(f); }
  await reloadObjects();
}
/* 垃圾桶｜真刪除的兩個條件【先到先算】：① 超過 20 筆刪最舊 ② deletedAt 超過 1 個月
   🔴 只刪【本機】那一列。雲端那一列【保留】當墓碑（v0.04_i §2）——
      兩邊都刪會讓墓碑消失，另一台未到期的那筆會把它重新插回雲端 ⇒ 復活迴路。 */
async function purgeTrash(){
  const MONTH=30*24*3600*1000, now=Date.now();
  for(const st of ['rooms','walls','beams','items']){
    const all=await lAllObj(st);
    const trash=all.filter(x=>x.deletedAt)
      .sort((a,b)=>String(a.deletedAt).localeCompare(String(b.deletedAt)));
    const kill=[];
    const rest=[];
    for(const x of trash){
      const t=new Date(x.deletedAt).getTime();
      if(isFinite(t) && now-t>MONTH) kill.push(x.id); else rest.push(x);
    }
    while(rest.length>20) kill.push(rest.shift().id);
    for(const id of kill) await lDel(st,id);        // 🔴 只刪本機
  }
}
async function trashSize(){
  let n=0;
  for(const st of ['rooms','walls','beams','items'])
    n += (await lAllObj(st)).filter(x=>x.deletedAt).length;
  return n;
}

/* ══════════════════════════════════════════════════════════════
   需求 6｜房間：改名／刪除（含 anchor 重設）
   ══════════════════════════════════════════════════════════════ */
async function renameRoom(id,name){
  const r=ROOMS.find(x=>x.id===id); if(!r) return;
  r.name=(name==null?'':String(name)).trim();       // 可留空 → 顯示「未命名」，不報錯
  await saveRoom(r); await reloadObjects();
}
/* 🔴 刪什麼／留什麼（spec-authoring §5-1）
   刪：該 Room／該 Room 底下所有 Wall／Beam 的列（軟刪除）
   留：Item 一筆都不刪；name/w/d/h/note/price/color/log/isBudgeted 全部不動；
       🔴 anchor 必須【就地轉成絕對座標】，不可留著指向已刪的牆
   🔴 順序硬規則：【先算 place()、再刪牆】。反了就取不到牆。 */
async function deleteRoomCascade(rid){
  const items=FURN.filter(f=>f.room===rid);
  const snap=items.map(f=>({f, p:place(f)}));       // ← 先算（此時牆還在）
  for(const {f,p} of snap){
    if(f.anchor && f.anchor.type==='wall'){
      f.anchor={type:'free', x:p.x, y:p.y};
      f.rot = p.ang*180/Math.PI;                    // 保住視覺朝向（沿用 btnUnsnap 的做法）
    }
    f.room=null;
    f.isPlaced=false;
    await saveItem(f);
  }
  for(const w of WALLS.filter(w=>w.room===rid)){ w.deletedAt=nowISO(); await saveWall(w); }
  for(const b of BEAMS.filter(b=>b.room===rid)){ b.deletedAt=nowISO(); await saveBeam(b); }
  await deleteRoom(rid);
  if(S.selId && items.some(f=>f.id===S.selId)) { /* 家具沒刪，但已不在平面圖上 */ }
  await reloadObjects();
}
/* 確認框要列出家具名稱（Ali 定 Q-2）。N 很多時列前 10 筆 ＋「…等 N 件」 */
function confirmDeleteRoomText(rid){

  if(names.length>10) li+=`<li>…等 ${names.length} 件</li>`;
  return `刪除房間「${esc(roomName(rid))}」。<br>`+
    `牆與樑會一起刪除。<b>家具一件都不刪</b>，會變成未擺放：`+
    (names.length? `<ul>${li}</ul>` : '<br>（這個房間目前沒有家具）');
}

const SYNC = { added:0, pushed:0, photoTotal:0, photoDone:0,

const hhmm = ()=>{ const d=new Date(), z=x=>String(x).padStart(2,'0');
  return `${z(d.getHours())}:${z(d.getMinutes())}`; };
/* ⚠️ O-14：fetch 被 CSP 擋掉時丟的是 TypeError，訊息看起來像網路問題。
   要把它與「真的連不上」分開講，否則測試的人會以為程式壞了。 */
async function sbFetch(path, opt){
  opt = opt || {};
  const h = Object.assign({ apikey: CLOUD.key }, opt.headers||{});
  if(CLOUD.tok) h.Authorization = 'Bearer '+CLOUD.tok;
  let r;
  try{
    r = await fetch(CLOUD.url+path, Object.assign({}, opt, {headers:h}));
  }catch(e){
    CLOUD.blocked = true;
    throw new Error('對外連線失敗（可能被這個環境的安全政策擋住）：'+e.message);
  }
  CLOUD.blocked = false;
  if(r.status===401 && !opt._retry && path.indexOf('/auth/')<0){
    await signInAnon(true);                     // 身分過期 → 重新拿一個
    /* 🔴 R-1：新身分是【全新的 uid】，不在 members 裡。
       少了這一步，接下來每個讀取都會回 200 []（有權限問題，但長得像「雲端空了」）。 */
    if(CLOUD.code && !_rejoining){
      _rejoining = true;
      try{ await joinProject(CLOUD.code); }
      finally{ _rejoining = false; }            // ⚠️ 防遞迴：joinProject 本身也走 sbFetch
    }
    return sbFetch(path, Object.assign({}, opt, {_retry:true}));
  }
  return r;
}
let _rejoining = false;
async function signInAnon(force){
  if(CLOUD.tok && !force) return;
  if(!force){
    const saved=LS.get('deco_sess');
    if(saved){ try{ const j=JSON.parse(saved); CLOUD.tok=j.t; CLOUD.uid=j.u; return; }catch(e){} }
  }
  const r=await sbFetch('/auth/v1/signup',{method:'POST',
    headers:{'Content-Type':'application/json'}, body:'{}'});
  const t=await r.text();
  let j={}; try{ j=JSON.parse(t); }catch(e){}
  if(!r.ok || !j.access_token)
    throw new Error('拿匿名身分失敗（Anonymous sign-ins 開了嗎？）：'+(j.msg||j.error_description||j.error||t.slice(0,160)));
  const prev=CLOUD.uid;
  CLOUD.tok=j.access_token; CLOUD.uid=(j.user&&j.user.id)||null;
  if(force && prev && prev!==CLOUD.uid) CLOUD.reauth++;   // 身分真的換掉了
  LS.set('deco_sess', JSON.stringify({t:CLOUD.tok,u:CLOUD.uid}));
}
/* 🔴 R-1 的核心修法：把「雲端 0 筆」這個有歧義的訊號，
   換成一個有明確答案的問題——「這台的身分在 members 裡嗎？」
   ⚠️ 需求 15 留什麼：這一段【一行不動】。 */

  return Array.isArray(rows) && rows.length>0;
}
async function joinProject(code){

}

   🔴 fromRow() 必須做 fromMM()，含 anchor 內的 along/off/x/y
   ⚠️ synced / pending / appVer 是本機專用欄位，不可送上雲端（雲端 schema 沒有）
   ══════════════════════════════════════════════════════════════ */
function toRow(store,o){
  const base={ id:o.id, project_code:CLOUD.code,
    deleted_at:o.deletedAt||null, updated_at:o.updatedAt||nowISO() };
  /* 🔴 v0.05_i §3（修三）：有 createdAt 才送 created_at。
     ⚠️ 沒有的【不要送 null】——雲端那一欄是 not null default now()，
        送 null 會被拒；而 omit 掉就由資料庫自己蓋（那是真的時間，不是假造的）。
        這正好就是「不要補寫一個假的 createdAt」（obs O-13）的另一半。 */
  if(o.createdAt) base.created_at=o.createdAt;
  if(store==='rooms') return Object.assign(base,{
    name:o.name??null, slab_h:toMM(o.slabH), note:o.note??null });
  if(store==='walls') return Object.assign(base,{
    room_id:o.room||null, x1:toMM(o.x1), y1:toMM(o.y1), x2:toMM(o.x2), y2:toMM(o.y2),
    thickness:toMM(o.thickness), height:toMM(o.height),
    /* 🔴 v0.05_i §1（修一）：前台是唯一的 insert 來源，它只能寫 proposed
       ⇒ 這裡的後備值也必須是 'proposed'，否則一道沒有 state 的牆會被 42501 拒掉。 */
    is_boundary:o.isBoundary!==false, state:o.state||'proposed',
    total:o.total??null, note:o.note??null,
    is_placed:o.isPlaced!==false, is_budgeted:!!o.isBudgeted });
  if(store==='beams') return Object.assign(base,{
    room_id:o.room||null, x1:toMM(o.x1), y1:toMM(o.y1), x2:toMM(o.x2), y2:toMM(o.y2),
    width:toMM(o.width), drop_mm:toMM(o.drop), note:o.note??null });
  // items
  return Object.assign(base,{
    room_id:o.room||null, name:o.name??null,
    w:toMM(o.w), d:toMM(o.d), h:toMM(o.h),
    note:o.note??null, price:o.price??null, color:o.color??null, rot:o.rot||0,
    anchor:anchorToMM(o.anchor),
    is_placed:!!o.isPlaced, is_budgeted:!!o.isBudgeted, log:o.log||[] });
}
function fromRow(store,row){
  const base={ id:row.id, projectCode:row.project_code||null,
    deletedAt:row.deleted_at||null, updatedAt:row.updated_at||null,
    /* 🔴 v0.05_i §3（修三）：pull 覆蓋時要【保留】建立時間 ⇒ 直接讀雲端的 created_at。
       雲端沒有（舊列）→ null，不偽造。 */
    createdAt:row.created_at||null,
    appVer:APP_VER };
  if(store==='rooms') return Object.assign(base,{
    name:row.name||'', slabH:fromMM(row.slab_h), note:row.note||'' });
  if(store==='walls') return Object.assign(base,{
    room:row.room_id||null,
    x1:fromMM(row.x1), y1:fromMM(row.y1), x2:fromMM(row.x2), y2:fromMM(row.y2),
    thickness:fromMM(row.thickness), height:fromMM(row.height),
    isBoundary:row.is_boundary!==false, state:row.state||'existing',
    total:row.total??null, note:row.note||'',
    isPlaced:row.is_placed!==false, isBudgeted:!!row.is_budgeted });
  if(store==='beams') return Object.assign(base,{
    room:row.room_id||null,
    x1:fromMM(row.x1), y1:fromMM(row.y1), x2:fromMM(row.x2), y2:fromMM(row.y2),
    width:fromMM(row.width), drop:fromMM(row.drop_mm), note:row.note||'' });
  // items
  return Object.assign(base,{
    room:row.room_id||null, name:row.name||'',
    w:fromMM(row.w), d:fromMM(row.d), h:fromMM(row.h),
    note:row.note||'', price:row.price??null, color:row.color||null, rot:row.rot||0,
    anchor:anchorFromMM(row.anchor),
    isPlaced:!!row.is_placed, isBudgeted:!!row.is_budgeted, log:row.log||[] });
}
/* 推：本機 → 雲端（單筆） */
async function cloudPushObj(store,id){
  const o=await lGetObj(store,id);
  if(!o || !CLOUD.on || o.projectCode!==CLOUD.code) return;
  const row=toRow(store,o);
  const ins=await sbFetch(`/rest/v1/${store}?on_conflict=id`,{method:'POST',
    headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify(row)});
  if(!ins.ok) throw new Error(`寫入雲端 ${store} 失敗：`+(await ins.text()).slice(0,200));
  o.pending=false; o.synced=true; await lPutObj(store,o);
  SYNC.pushed++;                                 // 🔴 需求 18 ②：上傳 N 筆
  cloudStat();
}

/* ── 推：本機 → 雲端（照片與標記，一行不改）── */
async function cloudPushPhoto(id){
  const r=await lGet('photos',id);
  if(!r || !CLOUD.on || r.projectCode!==CLOUD.code) return;
  if(!r.storagePath){
    const blob=r.small||r.orig;
    if(!blob) return;
    const path=`${CLOUD.code}/${r.id}.jpg`;      // 🔑 路徑第一段＝權限鍵
    const up=await sbFetch('/storage/v1/object/photos/'+path,{method:'POST',
      headers:{'Content-Type':blob.type||'image/jpeg','x-upsert':'true'}, body:blob});
    if(!up.ok) throw new Error('上傳照片檔失敗：'+(await up.text()).slice(0,200));
    r.storagePath=path;
  }
  /* ⚠️ 先上傳檔案、成功才寫列。反序會留下「指不到檔的列」。 */
  const row={ id:r.id, project_code:CLOUD.code, name:r.name, mime:r.mime,
    orig_size:r.origSize||null, small_size:r.smallSize||null,
    width:r.w||null, height:r.h||null, date_taken:r.dateTaken||null,
    added_at:r.addedAt||null, storage_path:r.storagePath,
    updated_at:nowISO() };
  const ins=await sbFetch('/rest/v1/photos?on_conflict=id',{method:'POST',
    headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify(row)});
  if(!ins.ok) throw new Error('寫入雲端清單失敗：'+(await ins.text()).slice(0,200));
  r.pending=false; r.synced=true; await lPut('photos',r);
  SYNC.pushed++;                                 // 🔴 需求 18 ②
  cloudStat();
}

/* ══════════════════════════════════════════════════════════════
   🔴 需求 15｜四張物件表的 pull
   掛在 cloudPull() 內、照片與標記【之後】。
   前提：cloudPull() 開頭的 cloudVerifyMember() 已通過（R-1 守門），本函式不重複做。
   🔴 【不准】抄照片線的兩條：
      · 「本機已有就跳過」—— 房間/家具會改，抄了就永遠拉不到修改
      · 「雲端沒這個 id ⇒ 刪本機」—— 四張表有 deletedAt，刪除是寫得出來的事實
   ══════════════════════════════════════════════════════════════ */
async function cloudPullObjects(){
  const q = '&project_code=eq.' + encodeURIComponent(CLOUD.code);
  syncStep('房間／牆／樑／家具…');               // 🔴 需求 18 ①（第 4 階段）
  for(const store of ['rooms','walls','beams','items']){
    const r = await sbFetch(`/rest/v1/${store}?select=*${q}`);
    if(!r.ok) throw new Error(`讀雲端${store}失敗：` + (await r.text()).slice(0,200));
    const rows  = await r.json();
    SYNC.cloudObjRows += rows.length;           // 🔴 需求 19 ①
    const local = await lAllObj(store);
    const lmap  = new Map(local.map(x => [x.id, x]));

    for(const row of rows){
      const inc = fromRow(store, row);        // 欄位改名 ＋ fromMM() ＋ anchor 內的長度
      const cur = lmap.get(inc.id);

      if(!cur){
        if(inc.deletedAt) continue;           // ① 墓碑：本機沒有 → 不要把它生出來
        await lPutObj(store, Object.assign({}, inc, {synced:true, pending:false}));
        SYNC.added++;                         // 🔴 需求 18 ②：聯集發生時要說出多了幾筆
        continue;
      }
      if(cur.pending) continue;               // ② 本機有還沒推成功的修改 → 不覆蓋，等 push
      if(!inc.updatedAt) continue;            // ③ 雲端沒時間戳 → 當最舊，不覆蓋
      if(new Date(inc.updatedAt) > new Date(cur.updatedAt))
        await lPutObj(store, Object.assign({}, inc, {synced:true, pending:false,
          /* 🔴 v0.05_i §3（修三）：整筆覆蓋時 createdAt 要【保留】。
             雲端那一欄是 not null，正常一定有值；只有「雲端是舊列、沒有 created_at」
             這個情況才會回 null —— 那時用本機原本記得的，不要被 null 蓋掉。 */
          createdAt: inc.createdAt || cur.createdAt || null})); // ④ 晚的贏
    }
    // 🔴 ⑤ 這裡【沒有】「雲端沒有就刪本機」那一段。刪除一律走 deletedAt。
  }
  /* ⑥ 補推：本機還沒推成功的（pending）。
     ⚠️ 這一段是建造者依【規則②「等 push」】＋ 既有 ③ 補推（照片/標記）的對稱性補的，
        _i 需求 15 的函式本體沒有寫。若規格者認為不該有，砍掉這一個 for 即可。 */
  {
    let n=0;
    for(const store of ['rooms','walls','beams','items'])
      n += (await lAllObj(store)).filter(x=>x.projectCode===CLOUD.code && x.pending).length;
    if(n) syncStep(`上傳 ${n} 筆…`);            // 🔴 需求 18 ①（第 6 階段）
  }
  for(const store of ['rooms','walls','beams','items']){
    for(const x of await lAllObj(store))
      if(x.projectCode===CLOUD.code && x.pending)
        await cloudPushObj(store,x.id).catch(e=>cloudErr(e));
  }
}

/* ── 拉：雲端 → 本機 ── */
async function cloudPull(){
  if(!CLOUD.on) return;
  syncStep('確認身分…');                       // 🔴 需求 18 ①（第 1 階段）
  /* 🔴 R-1：先確認身分，再談同步。
     ⚠️ 這一步失敗就【中止】——下面有刪除傳播迴路（照片線），
        身分不對時它會把「讀不到」誤讀成「別台刪了」，然後刪掉本機。 */
  if(!await cloudVerifyMember())
    throw new Error(`這台的身分不在專案 ${CLOUD.code} 裡（身分可能已變更）。`
      +`為避免誤刪本機資料，同步已中止，一筆都沒有刪。請按「重新連線」。`);
  const q='&project_code=eq.'+encodeURIComponent(CLOUD.code);

  // ① 照片
  const pr=await sbFetch('/rest/v1/photos?select=*'+q);
  if(!pr.ok) throw new Error('讀雲端清單失敗：'+(await pr.text()).slice(0,200));
  const rows=await pr.json();
  SYNC.photoTotal=rows.length;
  SYNC.cloudPhotoRows=rows.length;             // 🔴 需求 19 ①：雲端到底有沒有東西
  const local=await lAll('photos');
  const lmap=new Map(local.map(x=>[x.id,x]));
  for(const row of rows){
    /* 🔴 需求 18 ①（第 2 階段）：逐張下載時要動，不然她只看到「停住好久」 */
    SYNC.photoDone++;
    syncStep(`照片 ${SYNC.photoDone}/${SYNC.photoTotal}…`);
    const cur=lmap.get(row.id);
    if(cur && (cur.small||cur.orig)){
      if(!cur.synced){ cur.synced=true; cur.pending=false; cur.projectCode=CLOUD.code;
                       cur.storagePath=cur.storagePath||row.storage_path; await lPut('photos',cur); }
      continue;
    }
    const f=await sbFetch('/storage/v1/object/photos/'+row.storage_path);
    if(!f.ok) continue;                          // 檔案還沒到 → 下次再拉
    const blob=await f.blob();
    await lPut('photos',{ id:row.id, name:row.name, source:'雲端', mime:row.mime||'image/jpeg',
      origSize:row.orig_size||blob.size, smallSize:row.small_size||blob.size,
      w:row.width, h:row.height, rawW:row.width, rawH:row.height,
      dateTaken:row.date_taken||null,
      addedAt:row.added_at || nowISO(),
      decoded:true, orientation:null, rotated:false, oriBy:null, err:null,
      appVer:APP_VER+'（雲端）', small:blob, storagePath:row.storage_path,
      projectCode:CLOUD.code, synced:true, pending:false });
    SYNC.added++;                              // 🔴 需求 18 ②：要說出「新增 N 筆」
  }
  /* 🔴 照片段落的「雲端沒這個 id → lDel」【一行不動】（需求 15 留什麼）。
     理由：照片沒有 deletedAt 欄位，它只能用「消失」表達刪除。
     ⚠️ 這是兩套刪除語言並存，【刻意的】，不要統一。 */
  const rid=new Set(rows.map(r=>r.id));
  for(const x of local)
    if(x.synced && x.projectCode===CLOUD.code && !rid.has(x.id)) await lDel('photos',x.id);

  // ② 標記
  syncStep('標記…');                            // 🔴 需求 18 ①（第 3 階段）
  const mr=await sbFetch('/rest/v1/markers?select=*'+q);
  if(mr.ok){
    const mrows=await mr.json();
    const lm=await lAll('markers');
    const lmm=new Map(lm.map(x=>[x.id,x]));
    for(const row of mrows){
      const cur=lmm.get(row.id);
      if(cur && cur.x===row.x && cur.y===row.y && cur.synced) continue;
      await lPut('markers',{ id:row.id, photoId:row.photo_id, x:row.x, y:row.y,
        projectCode:CLOUD.code, synced:true, pending:false });
      SYNC.added++;
    }
    const mid=new Set(mrows.map(r=>r.id));
    for(const x of lm)
      if(x.synced && x.projectCode===CLOUD.code && !mid.has(x.id)) await lDel('markers',x.id);
  }

  // ③ 補推：本機有、雲端還沒有的（離線時拍的）
  {
    const pend=(await lAll('photos')).filter(x=>x.projectCode===CLOUD.code && x.pending)
      .concat((await lAll('markers')).filter(x=>x.projectCode===CLOUD.code && x.pending));
    if(pend.length) syncStep(`上傳 ${pend.length} 筆…`);   // 🔴 需求 18 ①（第 5 階段）
  }
  for(const x of await lAll('photos'))
    if(x.projectCode===CLOUD.code && x.pending) await cloudPushPhoto(x.id).catch(e=>cloudErr(e));
  for(const x of await lAll('markers'))
    if(x.projectCode===CLOUD.code && x.pending) await cloudPushMarker(x.id).catch(e=>cloudErr(e));

  // ④ 🔴 需求 15：四張物件表（掛在照片與標記【之後】）
  await cloudPullObjects();
}

async function cloudSync(){
  if(!CLOUD.on || CLOUD.busy) return;
  CLOUD.busy=true; CLOUD.msg='';
  syncReset();
  $('newProjNote').hidden=true;
  if($('btnSync')) $('btnSync').disabled=true;    // 🔴 需求 18 ④：同步中不能連按
  cloudStat();
  let ok=false;
  try{ await cloudPull(); S.dataErr=''; ok=true; }
  catch(e){ cloudErr(e); S.dataErr=(e&&e.message)||String(e); }
  CLOUD.busy=false;
  if($('btnSync')) $('btnSync').disabled=false;
  /* 🔴 需求 18 ②③：完成／失敗都要有一行【帶時間】的結果。
     ⚠️ 失敗時的錯誤與歸屬句由 cloudStat() 照原樣輸出，這裡只給狀態行。 */
  if(ok){
    syncProg(`<span class="done">✅ 同步完成</span>　`
      +`新增 <b>${SYNC.added}</b> 筆、上傳 <b>${SYNC.pushed}</b> 筆　${hhmm()}`);
  }else{
    syncProg(`<span class="fail">🔴 同步失敗</span>　${hhmm()}`);
  }
  /* ⚠️ 需求 15 邊界：pull 結束後呼叫【一次】render() ＋ buildList()，
     不要每寫一筆就重畫。 */
  await loadMarkers();
  await reloadObjects();
  render(); buildList(); syncSel(); refreshTop(); renderPhotos();
  /* 🔴 需求 19 ①：雲端這個代碼下【四張表 ＋ photos 全部 0 筆】＝ 這是一個新專案。
     ⚠️ 不阻擋，只提醒（她可能真的要開新專案）。
        邊界：雲端有照片但沒有物件 → 不算新專案（所以兩個計數要一起看）。
     🔴 這是 obs_環境與既有狀態的落差那條坑的【第四次變形】：
        用「什麼都沒有」表達「你不在你以為的地方」。 */
  if(ok && CLOUD.on && SYNC.cloudPhotoRows===0 && SYNC.cloudObjRows===0){
    const n=$('newProjNote');
    n.innerHTML = `⚠️ <b>這是一個新的專案</b>，雲端目前沒有任何東西。<br>`
      +`如果你是要連到既有專案，請檢查代碼有沒有打錯：`
      +`<b class="codetxt">${esc(CLOUD.code||'')}</b>`;
    n.hidden=false;
  }
  cloudStat();
}

/* ══════════════════════════════════════════════════════════════
   🔴 需求 19 ②｜記住用過的專案代碼（最多 5 組）
   理由：Ali 這次就是【手打錯】的（ALI_WUNDAWU vs ALI_WUNDAUW），
        一整輪跨裝置測試因此作廢。點一下填入 ⇒ 不必再手打。
   ⚠️ 邊界（v0.06_i §4）：清單裡要能【刪除單筆】——
      否則打錯的那個代碼會一直留在清單裡誘惑人點。
   ══════════════════════════════════════════════════════════════ */
const CODES_KEY='deco_codes';
function codesGet(){
  try{ const a=JSON.parse(LS.get(CODES_KEY)||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function codesSave(a){ LS.set(CODES_KEY, JSON.stringify(a.slice(0,5))); }
function codesAdd(code){
  if(!code) return;
  const a=codesGet().filter(x=>x!==code);
  a.unshift(code);                      // 最近用過的排最前
  codesSave(a); renderCodes();
}
function codesDel(code){
  codesSave(codesGet().filter(x=>x!==code)); renderCodes();
}
function renderCodes(){
  const box=$('codeList'); if(!box) return;
  box.innerHTML='';
  for(const c of codesGet()){
    const chip=document.createElement('span'); chip.className='codechip';
    const pick=document.createElement('button'); pick.className='pick codetxt';
    pick.textContent=c;
    pick.title='填入這個代碼';
    pick.onclick=()=>{ $('pcode').value=c; };
    const del=document.createElement('button'); del.className='del';
    del.textContent='✕'; del.title='從清單移除';
    del.onclick=()=>codesDel(c);
    chip.appendChild(pick); chip.appendChild(del);
    box.appendChild(chip);
  }
}

/* ── 連線 / 離開 / 狀態 ── */
async function cloudJoin(){
  const raw=($('pcode').value||'').trim().toUpperCase();
  if(raw.length<4){ CLOUD.msg='專案代碼至少 4 個字'; cloudStat(); return; }
  CLOUD.busy=true; CLOUD.msg=''; cloudStat();
  try{
    const code=await joinProject(raw);
    CLOUD.code=code; CLOUD.on=true;
    LS.set('deco_code',code);
    codesAdd(code);                       // 🔴 需求 19 ②：記住它，下次不必手打
    $('pcode').value=code;
    /* 這台既有的本機照片：歸到這個 project 底下並推上去
       ⚠️ 只認 projectCode 為空的（沒有被別的代碼認領過的），不搶別人的 */
    for(const x of await lAll('photos'))
      if(!x.projectCode){ x.projectCode=code; x.pending=true; await lPut('photos',x); }
    for(const x of await lAll('markers'))
      if(!x.projectCode){ x.projectCode=code; x.pending=true; await lPut('markers',x); }

       v0.04_i 需求 15「留什麼」原本寫「cloudJoin 一行不改」⇒ 建造者依規格沒動

    for(const store of ['rooms','walls','beams','items']){

        if(x.projectCode) continue;          // 已屬於某個專案 → 不動（不搶別人的）

        if(store==='walls' && x.state==='existing'){

            +`既有牆只能由後台匯入。這一道留在本機，不會上傳。`));

        await lPutObj(store, x);             // ⚠️ 逐筆寫入、不做交易（與需求 5 甲同一個模式）
      }

/* ── 最小 EXIF 解析：只取 DateTimeOriginal 與 Orientation ── */
function parseExif(buf){
  const v=new DataView(buf), out={dateTaken:null, orientation:null};
  if(v.byteLength<4 || v.getUint16(0)!==0xFFD8) return out;   // 不是 JPEG
  let off=2;
  while(off+4<v.byteLength){
    if(v.getUint16(off)!==0xFFE1){ off+=2+v.getUint16(off+2); continue; }
    const start=off+4;
    if(v.getUint32(start)!==0x45786966) return out;           // "Exif"
    const tiff=start+6;
    const le=v.getUint16(tiff)===0x4949;
    const u16=(p)=>v.getUint16(p,le), u32=(p)=>v.getUint32(p,le);
    const readIFD=(p,want)=>{
      const n=u16(p); let found={};
      for(let i=0;i<n;i++){
        const e=p+2+i*12, tag=u16(e), type=u16(e+2), cnt=u32(e+4);
        if(!want.includes(tag)) continue;
        if(type===3) found[tag]=u16(e+8);
        else if(type===4) found[tag]=u32(e+8);
        else if(type===2){
          const vo=cnt>4? tiff+u32(e+8) : e+8;
          let str=''; for(let k=0;k<cnt-1;k++) str+=String.fromCharCode(v.getUint8(vo+k));
          found[tag]=str;
        }
      }
      return found;
    };
    const ifd0=tiff+u32(tiff+4);
    const a=readIFD(ifd0,[0x0112,0x8769]);
    if(a[0x0112]) out.orientation=a[0x0112];
    if(a[0x8769]){
      const b=readIFD(tiff+a[0x8769],[0x9003,0x9004]);
      out.dateTaken=b[0x9003]||b[0x9004]||null;
    }
    return out;
  }
  return out;
}
const orientOf = v => (Number.isInteger(v) && v>=1 && v<=8) ? v : 1;

/* 🔴 O-12：瀏覽器會不會自己套 EXIF 方向？——【測】，不猜（能力探測）。 */
let _oriByBrowser = null;
function _probeJpegOri6(bytes){
  const body=[0x45,0x78,0x69,0x66,0x00,0x00,
              0x49,0x49,0x2A,0x00, 0x08,0x00,0x00,0x00,
              0x01,0x00,
              0x12,0x01, 0x03,0x00, 0x01,0x00,0x00,0x00, 0x06,0x00,0x00,0x00,
              0x00,0x00,0x00,0x00];
  const len=body.length+2;
  const app1=[0xFF,0xE1,(len>>8)&0xFF,len&0xFF].concat(body);
  const out=new Uint8Array(2+app1.length+(bytes.length-2));
  out.set(bytes.subarray(0,2),0);
  out.set(app1,2);
  out.set(bytes.subarray(2),2+app1.length);
  return new Blob([out],{type:'image/jpeg'});
}
async function browserAppliesOrientation(){
  if(_oriByBrowser!==null) return _oriByBrowser;
  try{
    const cv=document.createElement('canvas'); cv.width=2; cv.height=1;
    const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,2,1);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
    const probe=_probeJpegOri6(new Uint8Array(await blob.arrayBuffer()));
    const bmp=await createImageBitmap(probe);
    _oriByBrowser = bmp.height > bmp.width;      // 2×1 → 1×2 ＝ 被轉了
    bmp.close && bmp.close();
  }catch(e){ _oriByBrowser = false; }            // 測不出來 → 當它不轉（回到原行為）
  return _oriByBrowser;
}
function applyOrient(ctx, ori, rw, rh){
  switch(ori){
    case 2: ctx.transform(-1, 0, 0, 1, rw, 0); break;
    case 3: ctx.transform(-1, 0, 0,-1, rw, rh); break;
    case 4: ctx.transform( 1, 0, 0,-1, 0, rh); break;
    case 5: ctx.transform( 0, 1, 1, 0, 0, 0); break;
    case 6: ctx.transform( 0, 1,-1, 0, rh, 0); break;
    case 7: ctx.transform( 0,-1,-1, 0, rh, rw); break;
    case 8: ctx.transform( 0,-1, 1, 0, 0, rw); break;
    default: break;                                   // 1：不動
  }
}
const fmtBytes=n=> n>=1048576 ? (n/1048576).toFixed(2)+' MB'
                 : n>=1024 ? (n/1024).toFixed(0)+' KB' : n+' B';

/* ── 收一張照片 ── */
async function intake(file, source){
  const rec={ id:uid(), name:file.name||'(無檔名)', source, appVer:APP_VER,
    mime:file.type||'(未知)', origSize:file.size,
    addedAt:nowISO(), dateTaken:null, orientation:null,     // 🔴 需求 4：存 ISO
    decoded:false, err:null, w:0,h:0, small:null, smallSize:0 };
  try{
    const head=await file.slice(0, 256*1024).arrayBuffer();
    const ex=parseExif(head);
    rec.dateTaken=ex.dateTaken; rec.orientation=ex.orientation;
  }catch(e){ rec.err='EXIF 讀取失敗：'+e.message; }
  let bmp=null;
  try{
    bmp=await createImageBitmap(file);
    rec.decoded=true; rec.rawW=bmp.width; rec.rawH=bmp.height;
  }catch(e){
    rec.err=(rec.err? rec.err+'｜':'')+'解碼失敗（可能是 HEIC/HEIF）：'+e.message;
  }
  if(bmp){
    try{
      const exifOri=orientOf(rec.orientation);
      const byBrowser=await browserAppliesOrientation();
      const ori = byBrowser ? 1 : exifOri;
      rec.oriBy = (exifOri>1) ? (byBrowser?'瀏覽器':'本程式') : null;
      const k=Math.min(1, 1600/Math.max(bmp.width,bmp.height));
      const rw=Math.round(bmp.width*k), rh=Math.round(bmp.height*k);
      const swap = ori>=5;
      const cv=document.createElement('canvas');
      cv.width  = swap? rh : rw;
      cv.height = swap? rw : rh;
      const ctx=cv.getContext('2d');
      applyOrient(ctx, ori, rw, rh);
      ctx.drawImage(bmp,0,0,rw,rh);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8));
      rec.small=blob; rec.smallSize=blob? blob.size : 0;
      rec.w=cv.width; rec.h=cv.height;
      rec.rotated = (exifOri>1);
    }catch(e){
      rec.err=(rec.err? rec.err+'｜':'')+'壓縮失敗：'+e.message;
      rec.w=rec.rawW; rec.h=rec.rawH;
    }
    bmp.close && bmp.close();
  }
  rec.orig=file;
  await savePhoto(rec);
  return rec;
}

/* ⚠️ 環境偵測：某些情境下 IndexedDB 會被【整個擋掉】，且錯誤訊息看起來像程式壞了。
   → 要先講清楚「這是環境，不是程式」（留什麼：整段一字不動）。 */
function envNote(){
  const bad = (location.protocol==='data:' || location.origin==='null');
  return bad ? `<div class="pstat" style="border-color:var(--warnB)">
      🔴 <b>這個環境擋住了瀏覽器儲存</b>（來源：<code>${location.origin}</code>／<code>${location.protocol}</code>）。<br>

      ⚠️ 請改用 <b>正式網址</b>（有正式的來源）開啟本頁再測。</div>` : '';
}

      🔴 瀏覽器儲存讀取失敗：${esc(e.name)}｜${esc(e.message)}<br>
      常見原因：無痕視窗、瀏覽器設定擋網站資料、或裝置空間不足。</div>`;
    $('pstat').innerHTML='張數：<b>—</b>（儲存不可用）';

  }
  if(warn) box.innerHTML=warn;
  recs.sort((a,b)=>String(a.dateTaken||a.addedAt).localeCompare(String(b.dateTaken||b.addedAt)));
  const mk=await listMarkers().catch(()=>[]);

    const pinned=mk.find(x=>x.photoId===r.id);
    m.innerHTML=
      `<b>${esc(r.name)}</b><br>`+
      `來源：${esc(r.source)}｜格式：${esc(r.mime)}<br>`+
      `原始：${fmtBytes(r.origSize)}`+(r.decoded?`（${r.rawW??r.w}×${r.rawH??r.h}）`:'')+
      (r.smallSize?`　→ 壓縮後：${fmtBytes(r.smallSize)}`+
        ((!isLegacy(r) && r.w)?`（${r.w}×${r.h}）`:''):'')+`<br>`+
      `解碼：${r.decoded?'<span class="good">成功</span>':'<span class="bad">失敗</span>'}`+
      `｜EXIF 方向：${r.orientation??'<span class="bad">無</span>'}`+
      (isLegacy(r) ? `<br><span class="bad">⚠️ 舊版存的，方向未處理</span>`+
                     `<span style="opacity:.8">（請刪掉重新加入）</span>`
        : (r.rotated? `　<span class="good">✅ 已轉正（${esc(r.oriBy||'?')}）</span>`
                    : (r.decoded? `　（不需轉）`:'')))+`<br>`+
      `🕐 <b>時間軸用</b>：`+
      (r.dateTaken? `<span class="good">拍攝時間 ${esc(r.dateTaken)}</span>`
                  : `<span class="bad">加入時間 ${esc(fmtLocal(r.addedAt))}</span>（取不到拍攝時間）`)+
      (r.err? `<br><span class="bad">⚠️ ${esc(r.err)}</span>`:'')+
      (pinned? `<br>📍 已標在平面圖上`:'')+
      `<br><span style="opacity:.65">存於 ${esc(verOf(r))}</span>`;
    const acts=document.createElement('div'); acts.className='acts';
    const b1=document.createElement('button'); b1.className='btn';
    b1.textContent=pinned?'📍 重新標位置':'📍 標到平面圖';
    b1.onclick=()=>startPin(r.id);
    const b2=document.createElement('button'); b2.className='btn'; b2.textContent='刪除';
    b2.onclick=async()=>{ await deletePhoto(r.id);
      const ms=await listMarkers(); for(const x of ms) if(x.photoId===r.id) await deleteMarker(x.id);
      await loadMarkers(); renderPhotos(); render(); };
    acts.appendChild(b1); acts.appendChild(b2);
    m.appendChild(acts); c.appendChild(m); box.appendChild(c);
  });
  if(!recs.length) box.innerHTML=warn+'<div class="pstat">還沒有照片。按上面兩顆鈕的其中一個。</div>';
  let est='（此瀏覽器不支援容量查詢）';
  try{ const e=await navigator.storage.estimate();
    est=`已用 <b>${fmtBytes(e.usage||0)}</b> / 可用上限約 <b>${fmtBytes(e.quota||0)}</b>`;
  }catch(e){}
  $('pstat').innerHTML=`張數：<b>${recs.length}</b>　｜　${est}`;
}
