   ✅ 比照 .btn:disabled，不新造語彙。 */
.chip:disabled{opacity:.42;cursor:default}
/* 🔴 v0.1.9 §3：相簿清單頁的搜尋佔位框（灰色、不能按）。高度 26px＝.chip 的 min-height ⇒ 整條仍是 38px。 */
.srchph{flex:1;min-width:0;height:26px;border:1px solid var(--line);border-radius:20px;padding:0 10px;
  font-size:calc(12px * var(--fs));font-family:inherit;color:var(--sub);background:var(--bg);opacity:.6;
  pointer-events:none;-webkit-user-select:none;user-select:none}
/* ╔═ 🔴 v0.17_i 乙-0／乙-6｜【一顆會換臉的動作鈕】，取代舊的〔已擺〕chip ═══════╗
   待擺 →〔擺上圖〕　已擺 →〔收回清單〕　—— 同一個位置、同一顆按鈕。（v0.21_i B-3：拿掉 ↩）
   🔴 刻意【不用】chip 的膠囊樣式，也不用兩段切換條（_d §13-36 已結案）：
      · chip 的「點亮＝有」是【狀態】語意（_d §10-0e），而這顆是【動作】
      · 兩段切換條裡永遠只有一段可按 ⇒ 看起來像「另一個選項壞掉了」
   ⇒ 用一般按鈕的外觀（方角、不點亮）。 ╚═════════════════════════════════════╝ */
.icard .act{font-size:calc(11px * var(--fs));border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;color:var(--ink);background:var(--bg);white-space:nowrap;
  font-family:inherit;cursor:pointer;min-height:26px;flex:none}
.icard .act:active{background:var(--accent);color:#fff;border-color:transparent}
/* 🔴 修九：缺寬或缺深時，〔擺上圖〕是【鎖住】的。
   🔴 刻意【不用】disabled：按下去要有反應（卡片閃一下＋把游標送進缺的欄位），
      disabled 的按鈕連 click 都不會發 ⇒ 又變成「點了沒反應」（O-18）。
   ⇒ 用虛線框＋灰字表示「它現在按不出結果」，與保留格（.btn.hold）同一個語彙。 */
.icard .act.locked{color:var(--sub);border-style:dashed}
/* 🔴 修九：卡片閃一下 —— 一次、短（0.45s），不是持續動畫。
   ⚠️ 尊重系統的「減少動態效果」設定：關掉動畫時至少留一個靜態的底色變化。 */
@keyframes cardflash{
  0%{background:var(--panel)}
  35%{background:color-mix(in srgb,var(--warnA) 26%,var(--panel))}
  100%{background:var(--panel)}
}
.icard.flash{animation:cardflash .45s ease-out 1}
@media (prefers-reduced-motion:reduce){
  .icard.flash{animation:none;background:color-mix(in srgb,var(--warnA) 20%,var(--panel))}
}
/* 🔴 修三：「還沒填尺寸」整塊字＝可點區域（手機上 ▾ 那顆 30px 的鈕太難按）。
   ⚠️ O-4：手機沒有 hover ⇒ 可點的線索必須是【常駐】的，不可以只有 hover 態。
      ⇒ 用虛線底線＋內距把它做成一塊「看得出可以按」的東西，並放大觸控面積。 */
.icard .dim.missbtn{cursor:pointer;padding:4px 7px;border-radius:7px;
  border:1px dashed color-mix(in srgb,var(--warnA) 55%,var(--line));
  background:color-mix(in srgb,var(--warnA) 10%,transparent)}
.icard .dim.missbtn:active{background:color-mix(in srgb,var(--warnA) 22%,transparent)}
.money{font-size:calc(11.5px * var(--fs));color:var(--sub);font-variant-numeric:tabular-nums;margin-left:auto}
.miss{font-size:calc(11px * var(--fs));color:var(--warnA);margin-left:auto}
/* 🔴 v0.05_i §4（修四）：price 就地編輯。放清單卡片，【不放】選中面板
   （面板實測 187/199px 已貼著 _d §10-0d 的上限）。 */
.icard .pricewrap{margin-left:auto;display:flex;align-items:center;gap:1px;flex:none}
.icard .cur{font-size:calc(11.5px * var(--fs));color:var(--sub)}
.icard .cur[hidden]{display:none!important}
.icard .price{width:84px;min-width:0;font-size:calc(11.5px * var(--fs));text-align:right;
  background:transparent;border:1px solid transparent;border-radius:6px;
  color:var(--sub);font-family:inherit;font-variant-numeric:tabular-nums;
  padding:3px 4px;min-height:26px}
.icard .price:focus{background:var(--bg);border-color:var(--line);color:var(--ink);outline:none}
/* 「缺價錢」＝ 空值時的 placeholder，用 warnA（與 .miss 同色） */
.icard .price::placeholder{color:var(--warnA);opacity:1}
.icard .price.bad{border-color:var(--warnB);border-width:1.5px}
/* ╔═ 🔴 v0.17_i 修四 ⑩｜展開列改成【整張卡片寬的四列表】（Ali 2026-09-18 定案）═══╗
   舊版：`.roomrow` 一列橫排、掛在 .col 裡（左邊縮 46px 給 icon、右邊被 ▾／› 切掉），
         而且 overflow-x:auto 允許橫捲（N-99 的結論）。
   🔴 本批兩件一起改，只改 CSS 沒有用（v0.17_i §0-5 D-2）：
      ① DOM 重組：.icard 底下多一層 .body（stripe 之外的全部），展開列掛在 .body，
         不再掛在 .col ⇒ 它才會是【整張卡片寬、不縮排】
      ② N-99 在【展開列】這個範圍內由本批取代：不橫捲、改成四列
         第一行 [房間▾] 離地 寬 深 高 cm／第二行 備註／第三行 照片／最後 🗑
   🔴 不橫捲是靠【結構】保證的，不是靠量出來的：第一行每個控制項都 flex:1 1 0 ＋
      min-width:0 ⇒ 空間不夠時一起縮，不會產生 scrollWidth > clientWidth。
      （縮減優先序照 ⑨：cm 只寫一次 → 縮標籤間距 → 🔴 標籤絕不可以改回 placeholder）
   ⚠️ 舊的 .roomrow 規則整段由本區取代；class 名（szbox／sz／note）沿用，只換容器。╚═╝ */
.cedit{border-top:1px solid var(--line);padding:8px 9px 9px;
  display:flex;flex-direction:column;gap:7px;position:relative}
/* 🔴 修十四 ④：少了 ▾ 之後，「這張卡片是展開的」要看得出來。
   建造者選的是【兩個一起】：卡片底色微變（.icard.open）＋ 展開列右上一個小 ▴。 */
.cedit .opmark{position:absolute;right:8px;top:2px;font-size:calc(10px * var(--fs));
  color:var(--sub);line-height:1;pointer-events:none}
.crow{display:flex;gap:6px;align-items:center;min-width:0}
.crow > label{font-size:calc(10px * var(--fs));color:var(--sub);flex:none}
.crow1{display:flex;gap:4px;align-items:flex-end;min-width:0}
/* 🔴 flex 的權重不是均分：房間名是【字】（她有 11 間，名稱長），數字欄只要放得下 3~5 位數。
   實測 375：select 91px／每個數字欄 51px，兩者都不橫捲（見測試待辦的量測表）。 */
.crow1 select{flex:1.8 1 0;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:5px 3px;color:var(--ink);font:inherit;font-size:calc(12px * var(--fs));min-height:34px}
/* 離地／寬／深／高：四個小欄，沿用需求 7 的輸入規則（紅框、失焦還原、清空＝null）
   🔴 ⑨ 欄位標籤【常駐】，不可以改回 placeholder（填完就看不出這欄是什麼）。 */
.crow1 .szbox{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:1px}
.crow1 .szbox label{font-size:calc(9.5px * var(--fs));color:var(--sub);padding-left:2px;
  white-space:nowrap;overflow:hidden}
.crow1 input.sz{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:5px 2px;color:var(--ink);font:inherit;font-size:calc(13px * var(--fs));
  min-height:30px;text-align:center;font-variant-numeric:tabular-nums}
.crow1 input.sz.bad{border-color:var(--warnB);border-width:1.5px}
/* 🔴 ⑩：cm【只出現一次】，放在第一行最後（不要每個欄位都寫 cm）。
   🔴 它同時是 🗑 那一列的右緣基準（D-1：垃圾桶與第一行的 cm 右側貼齊）。 */
.crow1 .unit{flex:none;font-size:calc(10px * var(--fs));color:var(--sub);padding-bottom:7px}
/* 🔴 備註要能換行（Ali 問，claude 查碼確認舊版的單行 input 不行）
   ⇒ 只有 note 這個欄位走 <textarea>，其餘欄位（name/price/w/d/h/zBase）仍是 <input>。 */
/* ╔═ 🔴 v0.19_i §下-6｜家具備註欄常駐 8 行 ═════════════════════════════════════╗
   🔴 min-height 不寫死 px（字級是 var(--fs)，寫死會在放大字級時縮水）⇒ 用 em 算。
   🔴 resize:none（拿掉右下角那個斜紋拖曳把手 —— Ali 裁決）。
   🔴 但捲軸要【看得見】（Ali：「免得會覺得底下沒東西」）。
      建造者選【第一案＋補強】：overflow-y:scroll 常駐軌道 ＋ 自訂軌道底色，
      再加一道 background-attachment:local 的下緣漸層當保險
      —— 因為手機的系統捲軸是浮動式的、平常隱藏，只靠 ::-webkit-scrollbar 可能無效
        （HTML技法互動筆記 §22：那組屬性只有 Chromium/WebKit 吃）。
      ⚠️ 能不能達到目的【只有 Ali 在真機驗得到】（N-422），我只保證它可捲、且桌機看得到。 */
.crow textarea.note{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:6px;color:var(--ink);font:inherit;font-size:calc(12px * var(--fs));
  min-height:calc(8 * 1.5em + 14px);resize:none;line-height:1.5;
  overflow-y:scroll;
  /* 下緣漸層：內容捲到底時會自己消失（local），⇒「底下還有字」看得出來 */
  background-image:linear-gradient(to top, color-mix(in srgb,var(--ink) 14%,transparent), transparent 22px);
  background-repeat:no-repeat;background-position:bottom;background-size:100% 22px;
  background-attachment:local}
/* 自訂軌道：常駐、看得見（只有 Chromium/WebKit 吃；Firefox 走系統預設，功能不受影響） */
.crow textarea.note::-webkit-scrollbar{width:8px}
.crow textarea.note::-webkit-scrollbar-track{background:color-mix(in srgb,var(--ink) 7%,transparent);
  border-radius:4px}
.crow textarea.note::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 28%,transparent);
  border-radius:4px}
/* 照片位：以後版本。沿用 .btn.hold 的「保留格」語彙（虛線框＋灰字＋不可按），
   依 _d §10-0b 不寫用途說明。 */
.crow .holdbtn{flex:none;min-width:44px;min-height:30px;border:1px dashed var(--line);
  border-radius:7px;background:transparent;color:var(--dim);font:inherit;
  font-size:calc(12px * var(--fs));cursor:default}
/* 🔴 v0.17_i 修一：清單卡片的刪除入口（在此之前全檔只有選中面板那顆 🗑 叫得到
   confirmDeleteItem ⇒ 修五把那顆改掉之後，家具會變成刪不掉而且不報錯）。
   🔴 位置＝最後一列、靠右（D-1：⑦「展開列的最右邊」那句作廢，橫捲列的最右邊會看不見）。 */
.crow.trashrow{justify-content:flex-end}
.crow .delbtn{flex:none;min-width:36px;min-height:30px;border:1px solid
  color-mix(in srgb,var(--warnB) 40%,var(--line));border-radius:7px;background:var(--bg);
  color:var(--warnB);font:inherit;font-size:calc(13px * var(--fs));cursor:pointer}
.empty{text-align:center;color:var(--sub);padding:48px 12px;font-size:calc(13px * var(--fs));line-height:2}
.empty .ic{font-size:calc(34px * var(--fs));display:block;opacity:.5}

/* 🔴 需求 8 §3-1：清單頁右下浮動 (+)。空狀態與非空狀態是【同一顆】。 */
.fab{position:fixed;right:16px;bottom:calc(56px + 12px + env(safe-area-inset-bottom,0px));
  z-index:24;width:56px;height:56px;border-radius:50%;border:0;
  background:var(--accent);color:#fff;font-size:calc(26px * var(--fs));line-height:1;cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.24);font-family:inherit}
.fab[hidden]{display:none!important}

/* ── 需求 12：選中面板（§21：fixed 避免被容器裁切）── */
.sel{position:fixed;left:0;right:0;bottom:56px;z-index:20;max-width:520px;margin:0 auto;
  background:var(--panel);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -3px 14px rgba(0,0,0,.10);
  max-height:42vh;overflow-y:auto}
.sel[hidden]{display:none!important}
.selhead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
/* 🔴 v0.17_i 丙-10：selPos 拿掉之後，撐開空間的責任改由 selname 接手（flex:1）。
   v0.21_i 下-26 之後第一排是〔收回清單〕名字〔回主畫面〕▾ ⇒ 它把後兩顆推到右邊。 */
.selname{font-weight:600;font-size:calc(13px * var(--fs));flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
/* 🔴 v0.17_i 修五：〔↩ 收回〕（v0.21_i 下-26 改名〔收回清單〕，區隔樣式見 .selback.recall）。
   · 要有【文字】（Ali 2026-09-18：旁邊就是 ▾，兩顆純圖示並排看不懂）
   · 🔴 不再用 .dgr（紅／危險色）——收回是【可逆】的，不是刪除。
     顏色若留著紅的，使用者仍然會以為按下去東西會不見。
   · 丙-11：高度不設固定數字（舊 _i 的「標題列 32px」是假精確，.btn 是 34、.ib 是 30）。 */
.selback{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:8px;padding:5px 10px;font:inherit;font-size:calc(11.5px * var(--fs));
  cursor:pointer;white-space:nowrap;min-height:30px}
.selback:active{background:var(--accent);color:#fff;border-color:transparent}
/* ╔═ 🔴 v0.21_i 下-26｜〔收回清單〕的區隔樣式（Ali 2026-09-28 選【甲】：藍框藍字）══════╗
   為什麼要區隔：〔回主畫面〕與〔收回清單〕原本是【同一個 .selback】、緊鄰、而且 ↩ 本身就是
   「返回」的通用圖示 ⇒ 難分是設計出來的。而後果差很多：一個只換畫面，一個把家具拿回清單。
   🔴 寫成【修飾類】，不可以改 .selback 本身 —— 兩顆共用它（O-30），改了〔回主畫面〕也會變藍。
   🔴 `.selback.recall` 與 `.selback:active` 的權重相同（都是 0,2,0）⇒ 後寫的贏
      ⇒ 不補 `.selback.recall:active` 的話，按下去【沒有任何回饋】。
   🛑 不用紅色：「收回是可逆的，不是刪除」（v0.17_i 已定）。 ╚══════════════════════════╝ */
.selback.recall{border-color:var(--accent);color:var(--accent);background:transparent}
.selback.recall:active{background:var(--accent);color:#fff;border-color:transparent}
.ib{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;
  justify-content:center;font-size:calc(13px * var(--fs));flex:none;cursor:pointer;padding:0;font-family:inherit}
.ib.dgr{color:var(--warnB);border-color:color-mix(in srgb,var(--warnB) 40%,var(--line))}
/* 🗂 v0.21_i 下-26：這裡原本有 `.ibgap{width:16px}`（N-48「🗑 不與其他按鈕相鄰」）。
   當時〔↩ 收回〕（前身是 🗑）緊鄰 ▾，空隙是為了隔開它；〔收回清單〕搬到名字前面之後
   那個理由已經不存在 ⇒ Ali 2026-09-28：「把這個空格拿掉，回主畫面直接放在 ▾ 的左邊」。
   全檔已無使用者 ⇒ 規則一併刪除（O-37）。 */
.selrow{display:flex;gap:10px;align-items:center}

/* 微調鍵：整組跟著軸旋轉（_d §10-2b）。🔴 88×88 與 29×29 是已驗收的觸控尺寸，不動。 */
.padwrap{flex:none;width:88px;height:88px;position:relative}
.pad{position:absolute;inset:0;transition:transform .18s ease}
.pad button{position:absolute;width:29px;height:29px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);
  font-size:calc(13px * var(--fs));line-height:1;cursor:pointer;padding:0;font-family:inherit}
.pad button:active{background:var(--accent);color:#fff}
.pad button:disabled{opacity:.4}
.pad .up{left:29px;top:0}.pad .dn{left:29px;bottom:0}
.pad .lf{left:0;top:29px}.pad .rt{right:0;top:29px}
.padc{position:absolute;left:29px;top:29px;width:29px;height:29px;border-radius:50%;
  border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
  font-size:calc(9px * var(--fs));color:var(--sub);text-align:center;line-height:1.1}

.grid2{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.g3,.g2{display:flex;gap:6px}
.g3 .btn,.g2 .btn{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:8px;padding:9px 6px;font:inherit;font-size:calc(12px * var(--fs));cursor:pointer;
  min-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent;font-weight:600}
.btn:disabled{opacity:.42;cursor:default}
/* 🔴 修十二：第三格靠 hidden 換內容 ⇒ 要補這條守衛（本檔其餘 13 處都有，見 .inputline 的教訓） */
.btn[hidden]{display:none!important}
/* 🔴 修五：雙態貼牆鈕的兩個狀態【必須看得出差別】——不能只換字（Ali 定的規矩）。
   已貼牆＝亮底（同 chip.on 的語彙）／未貼牆＝一般底。 */
.btn.magon{background:color-mix(in srgb,var(--accent) 16%,transparent);
  border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);font-weight:600}
/* 保留格：虛線框 ＋ 灰字，不可按。⚠️ 依 _d §10-0b 不寫用途說明 */
.btn.hold{color:var(--dim);border-style:dashed;background:transparent}

/* 🔴 需求 12：尺寸按需展開。cm 在【標籤列】、右對齊。
   🔴 v0.17_i 十二-b：三格 → 四格（寬／深／高／離地），四格平均（.frow 各 flex:1），
      cm 移到【最後一格（離地）】的 label 右側。 */
.fields{display:flex;gap:5px;align-items:flex-end;margin-bottom:7px}
.fields[hidden]{display:none!important}
.frow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.frow label{font-size:calc(10px * var(--fs));color:var(--sub);display:flex;justify-content:space-between;gap:4px}
.frow input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:6px;color:var(--ink);font:inherit;font-size:calc(15px * var(--fs));
  text-align:center;font-variant-numeric:tabular-nums;min-height:38px}
/* 🔴 需求 7（v0.04_i §7）：打字中值無效 → 該欄位加紅框，讓「這個值沒被採用」看得出來 */
.frow input.bad{border-color:var(--warnB);border-width:1.5px}
/* ╔═ 🔴 v0.20_i §3-1e｜角度四格裡有**三個是按鈕** ════════════════════════════════╗
   `.frow input{…}` 這個選擇器**吃不到 `<button>`**
   ⇒ 不補這一條的話＝三顆瀏覽器原生外觀的矮按鈕 ＋ 一個 38px 的自訂輸入框，
     高度不一致、字級不跟 --fs，而 `align-items:flex-end` 會讓它們貼底錯開。
   ⇒ 所以「一行 CSS 都不必新寫」是錯的，這一條是必要的。 ╚═══════════════════════╝ */
/* 🔬 實測修正：只寫 min-height 不夠 —— `.btn` 自己的 `padding:9px 6px` 會把按鈕撐到
   比同列的 `<input>` 高 4px（量到 45 vs 41），而 `align-items:flex-end` 會讓它們貼底錯開。
   ⇒ 讓按鈕**照抄 `.frow input` 的盒模型**（padding／min-height／字級），三者才真的等高。 */
.frow .angbtn{width:100%;padding:6px;min-height:38px;
  font-size:calc(15px * var(--fs));line-height:1.5}
/* 展開尺寸時，微調鍵整組【隱藏】——改尺寸與移動位置是兩件事 */
.sel.szopen .padwrap,.sel.szopen .g2{display:none}

/* 🔴 v0.09_i 需求 30：兩處守衛訊息（面板內／清單頁）。中性色＝狀態，不是錯誤。 */
.selnote{margin-top:6px;padding:6px 8px;border-radius:7px;font-size:calc(11.5px * var(--fs));line-height:1.5;
  background:color-mix(in srgb,var(--sub) 12%,transparent);color:var(--sub)}
.selnote[hidden]{display:none!important}
.listnote{margin:10px 2px 0;padding:8px 10px;border-radius:8px;font-size:calc(11.5px * var(--fs));line-height:1.6;
  background:color-mix(in srgb,var(--sub) 12%,transparent);color:var(--sub)}
.listnote[hidden]{display:none!important}
.warnline{display:flex;gap:8px;align-items:center;margin-top:7px}
.warnline .w{flex:1;min-width:0;font-size:calc(11.5px * var(--fs));padding:6px 8px;border-radius:7px;
  background:color-mix(in srgb,var(--warnA) 16%,transparent);color:var(--warnA);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
  font-family:inherit;text-align:left;border:0}
.warnline .w.c{background:color-mix(in srgb,var(--warnB) 16%,transparent);color:var(--warnB)}
.warnline .w.n{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.warnline .w.open{white-space:normal;overflow:visible;text-overflow:clip}
.warnline .btn{flex:none;padding:9px 16px}

/* 面板可收合：只想看平面圖時把它壓成一條 */
.sel.mini > *:not(.selhead){display:none}

/* 未旋轉原貌對照（_d §10-2b，Ali 指定）*/
.orig{display:none;gap:7px;align-items:center;margin-top:5px;padding:5px 7px;
  border:1px dashed var(--line);border-radius:8px}
.orig.show{display:flex}
.orig svg{flex:none}
.orig .t{font-size:calc(10.5px * var(--fs));color:var(--sub);line-height:1.35}

/* ── 📷 相簿分頁（v0.1.9 批 5；取代舊的照片分頁）── */
/* pstat：狀態小方塊（envNote、資料庫錯誤、上傳訊息共用這個外觀） */
.pstat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;margin-bottom:10px;font-size:calc(11.5px * var(--fs));color:var(--sub);line-height:1.7;
  font-variant-numeric:tabular-nums}
.pstat b{color:var(--ink)}
.pstat .bad{color:var(--warnB);font-weight:600}
.pstat:empty{display:none}
/* 頂端一排：〔📷〕〔＋ 上傳到：… ▾〕 */
.atop{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.atop .ttl2{font-weight:600;font-size:calc(14px * var(--fs));flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atop .ttl2.edit{border-bottom:1px dashed var(--sub);cursor:text}
.abtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;
  padding:6px 10px;font:inherit;font-size:calc(12.5px * var(--fs));min-height:34px;cursor:pointer;
  white-space:nowrap}
.abtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.abtn:disabled{opacity:.42;cursor:default}
.abtn.sm{min-height:28px;padding:3px 9px;font-size:calc(11.5px * var(--fs))}
/* 上傳鈕＝主體＋▾ 兩塊（主體＝選照片、▾＝換目標，R-36） */
.upl{display:inline-flex;align-items:stretch}
.upl .abtn:first-child{border-radius:8px 0 0 8px}
.upl .abtn.dd{border-radius:0 8px 8px 0;border-left:1px solid color-mix(in srgb,#fff 40%,transparent);padding:6px 9px}
.upl .abtn:disabled + .abtn{opacity:.42}
/* 用量條（§9-4：常駐、同一條、不跳視窗） */
.usage{padding:7px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;
  font-size:calc(11.5px * var(--fs));color:var(--sub);background:var(--panel)}
.usage .ubar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.usage .ubar i{display:block;height:100%;background:var(--ok)}
.usage.warn{background:color-mix(in srgb,var(--warnA) 14%,var(--panel));color:var(--ink)}
.usage.warn .ubar i{background:var(--warnA)}
.usage.full{background:color-mix(in srgb,var(--warnB) 12%,var(--panel));color:var(--ink)}
.usage.full .ubar i{background:var(--warnB)}
.usage .uacts{display:flex;gap:6px;margin-top:6px}
.usage.thin{padding:4px 10px}
/* 清單頁的相簿卡（圖 1） */
.alb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:9px}
.alb.flash{animation:cardflash .9s ease-out 1}
.alb .ah{display:flex;align-items:center;gap:6px;margin-bottom:6px;cursor:pointer;min-height:30px}
.alb .an{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alb .am{font-size:calc(11px * var(--fs));color:var(--sub);white-space:nowrap}
/* 🔴 F-3：橫排的起點離左緣 ≥ 20px（卡片 margin 10＋padding 8＋這裡 4），避開 iPhone 左緣返回手勢 */
.astrip{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:0 4px 2px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}
.astrip::-webkit-scrollbar{display:none}
.astrip .tn{flex:none;height:88px;position:relative;border-radius:6px;overflow:hidden;
  background:var(--line);scroll-snap-align:start;cursor:pointer}
.astrip .tn img{height:88px;width:auto;display:block}
.astrip .tn.ph{width:88px;display:flex;align-items:center;justify-content:center;
  font-size:calc(10px * var(--fs));color:var(--sub)}
.astrip .empty1{flex:none;width:118px;height:88px;border-radius:6px;border:1px dashed var(--line);
  background:color-mix(in srgb,var(--line) 30%,transparent)}
/* 沒有原檔的照片：右側橘色直條（§3） */
.origbar{position:absolute;right:0;top:0;bottom:0;width:6px;background:var(--warnA)}
.scrub{position:relative;height:18px;margin:6px 4px 0;touch-action:none;cursor:pointer}
.scrub .tr{position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;background:var(--line)}
.scrub .th{position:absolute;top:3px;height:12px;border-radius:6px;background:var(--accent);min-width:14px}
.scrubt{font-size:calc(10.5px * var(--fs));color:var(--sub);margin:1px 4px 0;font-variant-numeric:tabular-nums}
/* 🔴 R-38：只有相簿畫面的卡片關掉選字與 iPhone 長按圖片選單（🛑 不退回全頁白名單，O-26） */
.alb,.apc{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.alb img,.apc img{-webkit-user-drag:none}
/* 相簿內頁的照片卡（圖 2） */
.apc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:7px;
  display:flex;gap:9px;align-items:flex-start;position:relative}
.apc.flash{animation:cardflash .9s ease-out 1}
.apc.sel{outline:2px solid var(--accent)}
.apc.dragging{opacity:.85;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:5}
.apc .tbox{flex:none;width:88px;height:88px;display:flex;align-items:center;justify-content:center;
  position:relative;border-radius:6px;overflow:hidden;background:var(--bg);cursor:pointer}
.apc .tbox img{max-width:88px;max-height:88px;display:block}
.apc .tx{flex:1;min-width:0;font-size:calc(12.5px * var(--fs))}
.apc .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.apc .nm2{font-weight:600;font-size:calc(13.5px * var(--fs));border-bottom:1px dashed var(--sub);cursor:text;
  min-width:0;overflow-wrap:anywhere}
.apc .nm2.ph{color:var(--sub)}
.apc.multi .nm2{border-bottom:0;cursor:default}
.apc .nbtn{font-size:calc(11px * var(--fs));border:1px solid var(--accent);color:var(--accent);background:transparent;
  border-radius:6px;padding:1px 7px;font-family:inherit;cursor:pointer;min-height:24px}
.apc .nbtn.on{background:var(--accent);color:#fff}
.apc .nt{margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.apc .nt.noval{color:var(--sub);opacity:.75}   /* ⚠️ 不可叫 .empty：全檔已有 .empty（空狀態，置中＋48px 內距），自驗撞到過 */
.apc input.ed,.apc textarea.ed{width:100%;font:inherit;border:2px solid var(--accent);border-radius:6px;
  padding:4px 6px;background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
.apc textarea.ed{min-height:3.2em;resize:vertical}
.apc .st{font-size:calc(10.5px * var(--fs));color:var(--sub);margin-top:3px}
.apc .st .retry{color:var(--warnB);text-decoration:underline;cursor:pointer}
.apc .grip{flex:none;align-self:stretch;display:flex;align-items:center;padding:0 6px;
  color:var(--sub);font-size:calc(18px * var(--fs));cursor:grab;touch-action:none}
.apc .ck{flex:none;width:22px;height:22px;border:2px solid var(--sub);border-radius:50%;margin-top:33px;position:relative}
.apc .ck.on{background:var(--accent);border-color:var(--accent)}
.apc .ck.on::after{content:"✓";color:#fff;position:absolute;left:4px;top:-2px;font-size:13px}
.atool{position:sticky;bottom:0;display:flex;justify-content:space-around;gap:6px;background:var(--panel);
  border-top:1px solid var(--line);padding:8px 4px;margin:8px -10px 0}
.atool .abtn{flex:1}
.gonebox{padding:24px 12px;text-align:center;color:var(--sub)}
/* 選單（▾ 換上傳目標／轉移複製的目標／⋯）＝頁內覆蓋層，z 55（高於放大畫面 47、確認框 50） */
.ovm{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.30);display:flex;align-items:flex-end;justify-content:center}
.ovm[hidden]{display:none!important}
.ovm .mbox{background:var(--panel);width:100%;max-width:520px;max-height:70vh;overflow-y:auto;
  border-radius:14px 14px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.ovm .mt{font-size:calc(12px * var(--fs));color:var(--sub);padding:6px 16px 8px}
.ovm .mi{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;
  color:var(--ink);font:inherit;font-size:calc(13.5px * var(--fs));padding:11px 16px;cursor:pointer}
.ovm .mi:disabled{color:var(--dim);cursor:default}
.ovm .mi .ms{font-size:calc(11px * var(--fs));color:var(--sub);margin-left:6px}
.ovm .mi.danger{color:var(--warnB)}
.ovm .mi.cur{color:var(--accent);font-weight:600}
/* 勾選清單框（§8-1／§8-2；🔴 R-21：新元件，不把 askDialog 改成第四種模式）z 52 */
.ovp{position:fixed;inset:0;z-index:52;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;padding:16px}
.ovp[hidden]{display:none!important}
.ovp .prow{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);
  font-size:calc(12.5px * var(--fs));cursor:pointer}
.ovp .prow .box{width:20px;height:20px;border:2px solid var(--sub);border-radius:4px;flex:none;margin-top:1px}
.ovp .prow .box.on{background:var(--warnB);border-color:var(--warnB)}
.ovp .prow .sub{color:var(--sub);font-size:calc(11px * var(--fs))}
.ovp .pacts{display:flex;justify-content:flex-end;gap:8px;margin-top:11px;flex-wrap:wrap}
.ovp .pacts .btn{flex:none;padding:9px 12px}
.btn.dangerfill{background:var(--warnB);border-color:var(--warnB);color:#fff}
.fhide{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* ╔═ 🔴 v0.19_i §下-9｜房間備註頁 ═══════════════════════════════════════════════╗
   🔴🔴 z-index:45 —— 現有層級 zoombtns 10／sel 20／fab 24／pinning 25／tabbar 30／
      ov 50／viewer 60。45 蓋得住所有 App 介面，而確認框（50）仍然在它【之上】
      ⇒〔取消〕的確認框問得出來、也點得到。照抄 60 會讓 App 卡死。
   §22：能捲的那一層要 overflow-y:auto，而它上面每一個「自己不捲」的 flex 祖先都要 min-height:0。 */
.notepage{position:fixed;inset:0;z-index:45;background:var(--bg);
  display:flex;flex-direction:column}
.notepage[hidden]{display:none!important}
/* 🔴 v0.20_i 下-11：按鈕列移到【最上方】(obs O-32：滿版＋底部按鈕＋要打字＝手機上一定被鍵盤吃掉)
   🔴 下框線【從 .nphead 移到 .nprow】——新順序是 nphead → nprow → npbody，
      若下框線留在 .nphead，它會畫在【按鈕列之上】
      ⇒ 按鈕列在視覺上被歸到「內文」那一側，而它其實是標題列的一部分。 */
.notepage .nphead{flex:none;padding:12px 14px 8px;font-size:calc(14px * var(--fs));
  color:var(--ink);font-weight:600}
.notepage .npbody{flex:1;min-height:0;display:flex;padding:10px 12px}
.notepage .npbody textarea{flex:1;min-height:0;width:100%;resize:none;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;
  color:var(--ink);font:inherit;font-size:calc(13px * var(--fs));line-height:1.6;
  overflow-y:auto}
.notepage .npbody textarea::-webkit-scrollbar{width:8px}
.notepage .npbody textarea::-webkit-scrollbar-track{background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:4px}
.notepage .npbody textarea::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 28%,transparent);border-radius:4px}
/* 🔴 兩顆【不等寬】：取消窄、完成寬並上色（Ali 最後裁決）—— 比例一個字不改。
   🔴 v0.20_i 下-11：padding 由 `8px 12px 14px` 改成 `8px 12px 10px`（那 14px 原本是
      「按鈕列在最下面」時的底部留白，移到頂端之後不需要那麼多），
      並接下 .nphead 讓出來的那條下框線。 */
.notepage .nprow{flex:none;display:flex;gap:8px;padding:8px 12px 10px;
  border-bottom:1px solid var(--line)}
.notepage .nprow #npCancel{flex:0 0 32%;min-height:46px}
.notepage .nprow #npDone{flex:1;min-height:46px}

/* ╔═ 🔴 v0.1.9 批 6｜放大畫面（圖 4）═══════════════════════════════════════════════════╗
   🔴 R-21：z-index 47（高於備註頁 45、低於確認框 .ov 50、勾選清單框 52、選單 55）
      ⇒ 在放大畫面上按〔刪除〕〔轉移／複製〕跳出的框看得到、按得到（相-34）。舊的 60 會把它們蓋住、App 卡死。
   🔴 直／橫換版用 CSS 的 orientation（§5）—— 🛑 不改全域 viewport。
   🔴 Q-A3（Ali 09-30 選甲）：直拿時〔✕ 關閉〕在照片正下方、按鈕列最前面；橫放時在右欄最下面。 ╚═╝ */
.viewer{position:fixed;inset:0;z-index:47;background:rgba(16,16,16,.97);color:#eee;
  display:flex;flex-direction:column}
.viewer[hidden]{display:none!important}
.viewer .vstage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;
  display:flex;align-items:center;justify-content:center}
.viewer .vstage img{max-width:100%;max-height:100%;object-fit:contain;display:block;
  transform-origin:50% 50%;will-change:transform;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.viewer .vpos{position:absolute;top:8px;right:12px;font-size:calc(11.5px * var(--fs));color:#aaa;pointer-events:none}
.viewer .vload{position:absolute;left:12px;top:8px;font-size:calc(11.5px * var(--fs));color:#ddd;pointer-events:none}
.viewer .vside{flex:none;display:flex;flex-direction:column;max-height:52vh;overflow-y:auto}
.viewer .vbtns{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap;order:1}
.viewer .vbtns .vb{background:#2a2a2a;color:#eee;border:1px solid #555;border-radius:9px;
  padding:8px 11px;font:inherit;font-size:calc(12.5px * var(--fs));min-height:40px;cursor:pointer}
.viewer .vbtns .vb:disabled{opacity:.4;cursor:default}
.viewer .vbtns .vb.close{font-weight:700;background:rgba(255,255,255,.14);border-color:#888}
.viewer .vinfo{padding:2px 12px 6px;font-size:calc(12.5px * var(--fs));color:#bbb;line-height:1.65;order:2;
  overflow-wrap:anywhere}
.viewer .vinfo b{color:#fff;font-size:calc(14px * var(--fs))}
.viewer .vinfo .on2{color:#fff;font-weight:700;border-bottom:2px solid #7fbf90}
.viewer .vinfo .on2.w{border-bottom-color:#e0a252}
.viewer .vinfo .off2{color:#666}
.viewer .vinfo .er{color:#ff8a8a}
/* 診斷列（R-40：保留到放大畫面最下面；Ali 09-20：真機跑過一輪後才刪）＋本機儲存配額（pstat） */
.viewer .vdiag{padding:4px 12px 10px;font-size:calc(10px * var(--fs));color:#888;line-height:1.55;order:3;
  word-break:break-all;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
@media (orientation:landscape){
  .viewer{flex-direction:row}
  .viewer .vside{width:min(40%,300px);max-height:none;height:100%;border-left:1px solid #333}
  .viewer .vbtns{flex-direction:column;order:2;padding:6px 10px}
  .viewer .vbtns .vb{text-align:center}
  .viewer .vinfo{order:1;padding-top:10px}
  .viewer .vdiag{order:2}                     /* 橫放：文字 → 診斷 → 按鈕 → 關閉（§5：右欄由上往下，關閉在最下） */
  .viewer .vbtns{order:3}
  .viewer .vbtns .vb.close{order:9}          /* 🔴 Q-A3：橫放時〔✕ 關閉〕在右欄最下面 */
}

.pinning{position:fixed;left:0;right:0;bottom:56px;z-index:25;max-width:520px;margin:0 auto;
  background:var(--accent);color:#fff;padding:11px;text-align:center;font-size:calc(13px * var(--fs));font-weight:600}
.pinning[hidden]{display:none!important}
/* 🗂 v0.1.9 R-23：.pinning 這組樣式【保留】—— 舊的 #pinning（標到平面圖提示）拿掉了，
   但 #beamBack〔‹ 返回設定〕也用這個 class（返回列共用樣式）。 */
/* ╔═ 🔴 v0.1.9 批 8｜定位提示條（§10-3：藍色、頂端；沒有〔取消〕）與預覽卡（§10-2）═══╗

const ENV_PREFIX = (()=>{
  const DEFAULT_PREFIX = '';
  try{
    const h=location.hostname;
    if(h==='localhost' || h==='127.0.0.1'){
      const v=new URLSearchParams(location.search).get('env');
      if(v && /^[A-Za-z0-9]{1,12}$/.test(v)) return v+'_';
    }
  }catch(e){}
  return DEFAULT_PREFIX;
})();

/* 🔴 形心用【面積加權】（鞋帶公式），不可以用「所有點的平均」——

function polyCentroid(p){
  let a=0, cx=0, cy=0;
  for(let i=0;i<p.length;i++){
    const q1=p[i], q2=p[(i+1)%p.length];
    const f=q1[0]*q2[1]-q2[0]*q1[1];
    a+=f; cx+=(q1[0]+q2[0])*f; cy+=(q1[1]+q2[1])*f;
  }
  a*=0.5;
  if(!isFinite(a) || Math.abs(a)<1e-9){
    let sx=0, sy=0; p.forEach(q=>{ sx+=q[0]; sy+=q[1]; });
    return {x:sx/p.length, y:sy/p.length};

  const c={x:cx/(6*a), y:cy/(6*a)};
  return (isFinite(c.x)&&isFinite(c.y)) ? c : null;

  if(r && validPoly(r.poly)) return polyCentroid(r.poly);
  const ws=WALLS.filter(w=>w.room===rid);
  if(!ws.length) return null;
  let sx=0,sy=0; ws.forEach(w=>{sx+=w.x1;sy+=w.y1;});

  const r=ROOMS.find(x=>x.id===rid);
  if(r && validPoly(r.poly)) return r.poly.map(p=>({x:p[0], y:p[1]}));
  const ws=WALLS.filter(w=>w.room===rid);

    pts.push(k(nx.x1,nx.y1)===tk ? {x:nx.x2,y:nx.y2} : {x:nx.x1,y:nx.y1});

         不要照著它去推現在的行為（SNAP_MAX_CM 本身仍在用：修五的〔貼到牆〕靠它當上限）。 */
const snapCm  = ()=> Math.min(SNAP_PX/S.zoom, SNAP_MAX_CM);
/* ╔═ 🔴 v0.17_i 甲-2（修十五）｜只把 NUDGE_MIN 改成 0.5 是【沒有效果】的 ══════════╗

   ⇒ 舊寫法 Math.round(...) 的輸出【恆 ≥ 1】⇒ Math.max(0.5, ≥1) 永遠等於後者
   ⇒ 症狀：常數改了、node --check 過、.padc 仍顯示「1 cm」、按鈕仍走 1 公分 —— 一句話都沒有。

   📌 0.5 是【下限】不是固定值：步進仍隨縮放變動，全屋檢視下 .padc 仍會寫 3 cm／6 cm。
      （與 _d §10-1b「微調仍屬不可變方向 #11」一致；若要「一律 0.5」那是另一件事。）╚═╝ */
const nudgeCm = ()=> Math.max(NUDGE_MIN, Math.round(NUDGE_PX/S.zoom*2)/2);

/* ══════════════════════════════════════════════════════════════
   🔴 需求 20｜「給人讀的文字」一律畫在【畫面座標】，不隨 zoom／pan 跑出畫面
   來歷（Ali 手機截圖，zoom 192%）：房間只有 400×300 公分 ⇒ fit() 把它撐到滿寬
     ⇒ 用世界座標畫的文字被推出畫面左邊：
        「（可刪）」只剩右半／「單〕重來，或直接改它」左邊被切／「道寬 60 公分」的「走」被切
   做法：另開一個【不受 transform 影響】的圖層（直接掛在 <svg> 上，不進 g），
         字級用固定 px（不隨 zoom 變大變小），位置一律夾在可見範圍內。
   ⚠️ 家具名稱【仍然跟世界座標】（必須貼在物件上才有意義），但算出來的位置要夾回邊界。
   ══════════════════════════════════════════════════════════════ */
let _uiLayer=null;                     // 畫面座標圖層（每次 render 重建）
const SVG_PAD = 6;                     // 夾限留白
function svgSize(){
  const r=svg.getBoundingClientRect();
  /* ⚠️ O-1：版面未定案時 rect 是 0。回一個保底值，不要讓夾限算出 NaN／負數。 */
  return { w: r.width  || 360, h: r.height || 480 };
}
/* 在畫面座標圖層寫一行字，並把它夾回可見範圍內。
   🔴 夾限用【實際量出來的 getBBox()】，不用估寬。
      ⚠️ 這一條是 N-113 實測抓到的：第一版用 `字數 × px × 0.62` 估寬，
         但【中日韓字寬約 1em】，估出來只有實際的六成
         ⇒ 平移到角落時「範例房間（可刪）」與「走道寬 60 公分」照樣跑出畫面。
         ⇒ 估的東西會錯，量的東西不會。 */
/* 🔴 v0.09_i 需求 32：SVG 的字級也要跟著同一個知識來源走。
   ⚠️ 刻意【讀 CSS 變數】而不是在 JS 裡另外寫一個 1.2——
      兩個地方各寫一份就不是「單一來源」了，下次只改一邊就會不同步。 */
function fsScale(){
  const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'));
  return (isFinite(v)&&v>0)?v:1;
}
/* 🔴 v0.13_i 修七 F-12：房間名改畫在形心之後【不可以】套那段螢幕座標夾限——
   夾限是為了「單一房間的名字不要跑出畫面」寫的；10 間房一起夾，會全部疊成一坨
   堆在畫面邊緣。⇒ 傳 {clamp:false}：畫面外就不畫。
   ⚠️ v0.14_i 補七 N-8c：本批【只改房間名】的夾限，家具名維持現有夾限，下一手不必重想。 */
function uiText(sx, sy, txt, opt){
  const o=opt||{};
  if(o.clamp===false){
    const {w,h}=svgSize();
    if(!isFinite(sx) || !isFinite(sy)) return null;
    if(sx < -SVG_PAD || sx > w+SVG_PAD || sy < -SVG_PAD || sy > h+SVG_PAD) return null;
  }
  const px=(o.size||13)*fsScale();
  const anchor=o.anchor||'start';
  const t=el('text',{x:sx, y:sy, 'text-anchor':anchor,
    fill:o.fill||'var(--sub)', 'font-size':px,
    'pointer-events':'none'});
  if(o.weight) t.setAttribute('font-weight',o.weight);
  if(o.opacity!=null) t.setAttribute('opacity',o.opacity);
  t.textContent=txt;
  _uiLayer.appendChild(t);
  if(o.clamp===false) return t;      // 🔴 F-12：房間名不夾限（畫面外就不畫，上面已擋）
  try{
    const {w,h}=svgSize();
    const b=t.getBBox();
    let dx=0, dy=0;
    if(b.width <= w-2*SVG_PAD){
      if(b.x < SVG_PAD) dx = SVG_PAD - b.x;
      else if(b.x+b.width > w-SVG_PAD) dx = (w-SVG_PAD) - (b.x+b.width);
    }else{
      dx = SVG_PAD - b.x;          // 比畫面還寬 → 至少讓【開頭】看得到，不要左邊被切
    }
    if(b.y < SVG_PAD) dy = SVG_PAD - b.y;
    else if(b.y+b.height > h-SVG_PAD) dy = (h-SVG_PAD) - (b.y+b.height);
    if(dx||dy){ t.setAttribute('x', sx+dx); t.setAttribute('y', sy+dy); }
  }catch(e){ /* getBBox 在版面未定案時會丟 → 這一幀不夾，下一幀 render 會再來一次 */ }
  return t;
}

/* 需求 8／需求 11：房間色。
   🔴 v0.05_i §3（修三）：依【createdAt（建立順序）】排序取色，不是陣列順序。

   邊界：
     · 舊資料沒有 createdAt → localeCompare 讓空字串排最前面（它們本來就是最早的）。
       🔴 不補寫假的 createdAt（obs O-13）。
     · createdAt 完全相同 → 用 id 當第二順位，保證兩台裝置排出同一個順序。
     · 🔴 排序用的是 ROOMS_ALL（**含軟刪除的墓碑**），不是只有活的。
       依據＝v0.05_i §3 自己的兩條驗收：
         N-93「刪中間那一間 → 另外兩間的顏色【不變】（不是重新編號）」
         邊界「房間被刪（軟刪）再還原 → 順序不變 ⇒ 顏色不會跳」
       ⚠️ 兩條都只有在【墓碑仍然佔著它的名次】時才成立。
       （v0.05_i §3 貼的 pseudocode 寫 `ROOMS.filter(r=>!r.deletedAt)`，
         那會重新編號、與它自己的 N-93 相反 ⇒ 已回報，碼取 N-93 那一邊。）
   ⚠️ room 為 null → 中性灰，與清單「未擺放」分組同一個灰。 */
let ROOMS_ALL = [];        // 含墓碑，只給 roomOrder() 用
function roomOrder(){
  return ROOMS_ALL.slice().sort((a,b)=>{
    const c=String(a.createdAt||'').localeCompare(String(b.createdAt||''));
    return c!==0 ? c : String(a.id).localeCompare(String(b.id));
  });
}
/* 🔴 需求 43 ＋ v0.13_i 修十 F-21：樑的【穩定】排序。
   平面圖上的「樑 3」與設定頁的「樑 3」必須是同一根，重新載入後編號也不可以變。
   ⚠️ createdAt 相同（同一次 SQL 插入，六根幾乎必然相同）→ 用 id 字串比大小當第二鍵
      ⇒ 穩定且跨裝置一致。 */
function beamOrder(){
  return BEAMS.slice().sort((a,b)=>{
    const c=String(a.createdAt||'').localeCompare(String(b.createdAt||''));
    return c!==0 ? c : String(a.id).localeCompare(String(b.id));
  });
}
function roomColor(roomId){
  if(!roomId) return 'var(--dim)';
  const i=roomOrder().findIndex(r=>r.id===roomId);
  if(i<0) return 'var(--dim)';
  return ROOM_PALETTE[i % ROOM_PALETTE.length];
}
function roomName(roomId){
  const r=ROOMS.find(x=>x.id===roomId);
  return r ? (r.name||'未命名') : '未指定房間';
}
/* 🔴 v0.09_i 需求 33：這一筆的 room 還指得到一間【存活】的房間嗎？
   ⚠️ 「指不到」有兩種來源：
        · room 本來就是 null（使用者還沒指定）
        · room 有值，但那間房間已經被軟刪 ⇒ 【孤兒】
      以前碰不到孤兒，是因為 UI 刪房間走 deleteRoomCascade()，它會把 room 設成 null；
      而需求 31 之後【雲端可以直接送來房間墓碑】，本機沒有經過那條路。
   🔴 這個函式只給【顯示層】用——不可以拿它去把 f.room 改寫成 null。
      理由：房間墓碑之後若被還原（或另一台推回活的版本），這筆家具要能自己回去。 */
function roomAlive(roomId){ return !!roomId && ROOMS.some(r=>r.id===roomId); }

/* ══════════════════════════════════════════════════════════════
   需求 14｜比例尺：拆成兩個元件
   ① 走道寬度示意帶（既有，保留）——標籤指的是【厚度】
   ② 長度比例尺（🆕）——長度由當前 zoom 實算
   🔴 O-9：「標示」與「比例尺」是兩種東西。不可共用標籤。
   ══════════════════════════════════════════════════════════════ */
let _scaleCm = null;                    // 需求 14：遲滯用，記住上一次回傳的候選
function niceScaleCm(zoom){             // zoom = 每公分幾個螢幕 px
  const CAND=[10,20,50,100,200,500];
  const TARGET=90;                      // 目標螢幕長度（60~120 的中點）
  /* 🔴 遲滯：上一次的候選若仍落在 50~140px（比 60~120 寬的容忍帶）就沿用，
     一次縮放手勢裡最多換一次，不會在兩個候選之間來回跳。 */
  if(_scaleCm!=null){
    const px=_scaleCm*zoom;
    if(px>=50 && px<=140) return _scaleCm;
  }
  let best=CAND[0], bestErr=Infinity;
  for(const c of CAND){
    const err=Math.abs(c*zoom-TARGET);
    if(err<bestErr){ bestErr=err; best=c; }
  }
  _scaleCm=best;
  return best;
}
/* 分區多邊形的所有頂點（planBounds 用）。 */
function polyPoints(){
  const out=[];
  ROOMS.forEach(r=>{ if(validPoly(r.poly)) r.poly.forEach(q=>out.push(q)); });
  return out;
}

/* ╔═ 🔴 v0.21_i 下-22｜走道示意＋比例尺 → 固定在畫面左下（HUD）═══════════════════════╗
   Ali 定的版面（2026-09-28，已看過介面預覽並同意）：

      超出畫面時線畫到右緣 − 6 px、**右端刻度不畫**（＝這條線沒有另一邊的邊界）。
      📌 這是防呆：線長最多約 140 px（遲滯帶上限）、右欄約 202 px ⇒ 真機縮放全範圍都觸發不到

   ⑤ 🔴 家具面板或兩條提示列顯示中 ⇒ 整組隱藏（hudCovered，見上方）。 ╚══════════════════╝ */
const HUD_BAND_CM = 75;          // 走道示意帶的長度（公分）
function hudGeom(){
  const {w:W, h:H}=svgSize();
  const fs=fsScale();
  const txtBase = H - 12;                 // 文字列基線
  const txtTop  = txtBase - 13*fs;        // 文字列上緣（字級 13 × --fs）
  const iconBot = txtTop - 6;             // 圖示列底邊
  return {W, H, fs, txtBase, iconBot};

/* 走道示意要不要因為放大而隱藏（③）。抽出來是為了讓 fit() 的預留計算與畫的時候用同一條規則。 */
function hudBandHidden(z){
  const {W,H}=hudGeom();
  return (HUD_BAND_CM*z + 8 > W/2 - 24) || (CLEAR_CM*z > H*0.25);
}
function drawHUD(){
  if(hudCovered()) return;                               // ⑤
  const G=hudGeom(), z=S.zoom;
  const hud=el('g',{'data-hud':'1','pointer-events':'none'});
  const txt=(x,s,opt)=>{ const t=el('text',{x, y:G.txtBase, 'font-size':13*G.fs,
      fill:(opt&&opt.fill)||'var(--sub)', 'pointer-events':'none'});
    if(opt&&opt.weight) t.setAttribute('font-weight',opt.weight);
    t.textContent=s; hud.appendChild(t); };
  /* ── 左欄：走道示意帶（②③）── */
  if(!hudBandHidden(z)){
    const bw=HUD_BAND_CM*z, bh=CLEAR_CM*z;
    const x0=12, y0=G.iconBot-bh;
    hud.appendChild(el('rect',{x:x0, y:y0, width:bw, height:bh,
      fill:'var(--sub)','fill-opacity':.14, stroke:'var(--line)','stroke-width':1.5}));   // 🔴 B-2 平塗
    // 人形（肩軸橫跨通道）：肩寬 45、身厚 18、頭直徑 18（真實公分）⇒ 跟著縮放
    const pcx=x0+bw/2, pcy=y0+bh/2;
    hud.appendChild(el('ellipse',{cx:pcx, cy:pcy, rx:9*z, ry:22.5*z,
      fill:'var(--accent)','fill-opacity':.30, stroke:'var(--accent)','stroke-width':1.5}));
    hud.appendChild(el('circle',{cx:pcx, cy:pcy, r:9*z,
      fill:'var(--accent)','fill-opacity':.55, stroke:'var(--accent)','stroke-width':1.5}));
    /* 🔴 需求 14：引線必須指向【厚度】方向（垂直），不可讓人讀成長度。
       🔴 v0.21_i：引線與刻度用畫面 px（+8／±4），不跟著縮放。 */
    const lx=x0+bw+8;
    [[lx,y0,lx,y0+bh],[lx-4,y0,lx+4,y0],[lx-4,y0+bh,lx+4,y0+bh]].forEach(a=>
      hud.appendChild(el('line',{x1:a[0],y1:a[1],x2:a[2],y2:a[3],
        stroke:'var(--sub)','stroke-width':1.6})));
    txt(x0, `走道寬度 ${CLEAR_CM} cm`);
  }
  /* ── 右欄：長度比例尺（④）——從畫面中線開始 ── */
  const cm=niceScaleCm(z), sx=G.W/2, len=cm*z, ly=G.iconBot-8;
  const xEnd=Math.min(sx+len, G.W-6), full=(sx+len)<=G.W-6;
  hud.appendChild(el('line',{x1:sx,y1:ly,x2:xEnd,y2:ly, stroke:'var(--ink)','stroke-width':2.4}));
  hud.appendChild(el('line',{x1:sx,y1:ly-8,x2:sx,y2:ly+8, stroke:'var(--ink)','stroke-width':2.4}));
  if(full)   // 🔴 超出畫面時右端刻度不畫（防呆，見 ④）
    hud.appendChild(el('line',{x1:xEnd,y1:ly-8,x2:xEnd,y2:ly+8, stroke:'var(--ink)','stroke-width':2.4}));
  txt(sx, `${cm} cm`, {fill:'var(--ink)', weight:600});
  _uiLayer.appendChild(hud);
}
/* 🔴 v0.21_i B-1（Ali 照建議）：〔全圖〕時畫面底部要留一個 HUD 的高度。
   理由：拿掉示意帶的世界座標預留（舊的 160 公分）之後，fit 的留白只剩 FIT_PAD（她家全屋約 10 px），
   而 HUD 高約 50 px ⇒ **房子最下面會被 HUD 壓住**。
   ⇒ 預留的是【畫面 px】（HUD 實際多高就留多高），不是舊的那一大塊世界座標空白（N-607）。
   高度＝ 12（基線到底）＋ 文字列 ＋ 6 ＋ max(比例尺刻度 16, 走道圖示高) */
function hudReservePx(z){
  const G=hudGeom();
  const iconH = hudBandHidden(z) ? 16 : Math.max(16, CLEAR_CM*z);
  return 12 + 13*G.fs + 6 + iconH;
}

/* 走道網格（常駐視覺，_d §5-6 方向 #7）—— 內容從 render() 原樣搬家，一行未改。 */
function drawGrid(ctx){
  const {g, sel}=ctx;
  FURN.forEach(f=>{
    if(!onPlan(f)) return;
    const isDrag = S.dragging && S.dragging.f.id===f.id;
    /* 🔴 §1-1b：走道網格是【三檔】不是布林 —— 全關時，選中的那一件與正在拖的那一件

          —— 而且**壞了完全安靜**：▦ 平常就是暗的，她要到下一次想看走道夠不夠時才發現。 */
    if(!L('grid') && !isDrag && (!sel || sel.id!==f.id)) return;
    const p=liveP(f), pts=corners(p.x,p.y,f.w,f.d,p.ang,CLEAR_CM/2);
    const n=collisions(f);
    g.appendChild(el('polygon',{points:pts.map(q=>`${q.x},${q.y}`).join(' '),
      fill:'url(#clr)', color: n.near.length?'var(--warnA)':'var(--sub)',
      stroke: n.near.length?'var(--warnA)':'var(--line)',

/* ── 家具本體 ──
   🔴 需求 11（v0.04_i §4）三個視覺通道，取代原本的優先權表：
      填色     ← 自訂色（color 為 null 用系統預設）。唯一例外：撞到 → 紅
      外框顏色 ← 所屬房間的顏色。唯一例外：走道不足 → 橙
      外框粗細 ← 選中：2px → 4px（🔴 只改粗細，不改顏色）

      `p`／`n`／`on`／`isDrag` **各自重算**，不可以共用閉包或暫存陣列
      （下一個人不知道那個暫存何時失效）。 */
function drawFurn(ctx){
  const {g, sel}=ctx;
  FURN.forEach(f=>{
    if(!onPlan(f)) return;
    const p=liveP(f), pts=corners(p.x,p.y,f.w,f.d,p.ang,0);
    const n=collisions(f), on=sel&&sel.id===f.id;
    const isDrag = S.dragging && S.dragging.f.id===f.id;
    const fillCol   = n.hit.length ? 'var(--warnB)' : (f.color || 'var(--furn)');
    const strokeCol = n.near.length? 'var(--warnA)' : roomColor(f.room);
    const strokeW   = on ? 4 : 2;
    g.appendChild(el('polygon',{points:pts.map(q=>`${q.x},${q.y}`).join(' '),
      fill: fillCol,
      'fill-opacity': n.hit.length?.55:(isDrag?.75:(on?.92:.8)),
      stroke: strokeCol,
      'stroke-width': strokeW,
      'data-f':f.id}));
    if(isDrag){   // 拖曳中額外給一個「浮起來」的外框，讓「它正在被拖」看得出來
      g.appendChild(el('polygon',{points:pts.map(q=>`${q.x},${q.y}`).join(' '),
        fill:'none',stroke:'var(--furnSel)','stroke-width':6,opacity:.45}));
    }
  });
}

function render(){

  pat.appendChild(el('rect',{width:7,height:7,fill:'transparent'}));
  pat.appendChild(el('line',{x1:0,y1:0,x2:0,y2:7,stroke:'currentColor',

  WALLS.forEach(w=>{
    const on = litWall && litWall.id===w.id;
    /* 🔴 需求 42-a：粗細＝真實牆厚（公分）。牆畫在帶 scale(zoom) 的 g 裡 ⇒ 不要自己乘 zoom。
       🔴 高亮改走【顏色】通道，不再改粗細（粗細讓給厚度了）。
       🔴 linecap 從 square 改成 butt：square 會讓兩端各多出半個線寬
          ⇒ 39 公分的管道間兩端各爆出 19.5 公分，轉角會凸出來。
          ⚠️ 代價是牆角會看到小缺口 —— 那是 butt 的必然，不是畫錯（交付必講 ⑥）。 */
    g.appendChild(el('line',{x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2,
      stroke: on?'var(--accent)':'var(--wall)',
      'stroke-width': wallThick(w),'stroke-linecap':'butt',
      'stroke-dasharray': w.state==='proposed' ? '18 10' : 'none'}));
  });
  /* ── 🔴 需求 43：樑（畫在【牆之後】＝壓在牆上面，Ali 2026-09-13 裁決）──
     配套：只畫【兩邊的虛線】、中間不填 ⇒ 壓在牆上也看得到牆。
     🔴 編號必須穩定（v0.13_i 修十 F-21）：六根樑是同一次 SQL 插入，createdAt 幾乎必然相同
        ⇒ 先用 beamOrder() 排成陣列，再用那個陣列的 index，
          不可以直接用 BEAMS.forEach 的 index（BEAMS 的順序來自 IndexedDB，不保證）。 */
  beamOrder().forEach((b,i)=>{
    const filled = (b.drop != null);
    const focus  = (S.beamFocus === b.id);
    const col = focus ? 'var(--accent)' : (filled ? 'var(--warnA)' : 'var(--dim)');
    const dx=b.x2-b.x1, dy=b.y2-b.y1, L=Math.hypot(dx,dy)||1;
    const hw=(b.width||20)/2;
    const nx=-dy/L*hw, ny=dx/L*hw;
    /* 🔴 v0.15_i 修四（M-27，Ali：「樑的高亮好難看，把他從虛線改成填滿某個顏色吧」）：
       【只有被高亮的那一根】改成填滿。
       ⚠️ 範圍嚴格限定：「只畫兩邊虛線、中間不填」是 Ali 自己 2026-09-13 的裁決，
          理由是【壓在牆上也要看得到牆】⇒ 沒被高亮的五根，畫法一行不改。
          被高亮的那一根本來就是「我要你現在看它」，遮住底下的牆是可以接受的。
       🔴 四個角就是兩條側線的端點，順序要【繞一圈】1→2→2'→1'；
          寫成 1→2→1'→2' 會變成蝴蝶結（自交的沙漏形）。
       ⚠️ focus?6:3 的加粗一起被吃掉是對的：填滿之後不需要再加粗。 */
    if(focus){
      const pts=[[b.x1+nx,b.y1+ny],[b.x2+nx,b.y2+ny],
                 [b.x2-nx,b.y2-ny],[b.x1-nx,b.y1-ny]];
      g.appendChild(el('polygon',{points:pts.map(p=>p[0]+','+p[1]).join(' '),
        fill:col,'fill-opacity':.55,stroke:col,'stroke-width':2.5,'stroke-linejoin':'miter'}));
    }else{
      [1,-1].forEach(sgn=>{
        g.appendChild(el('line',{x1:b.x1+nx*sgn, y1:b.y1+ny*sgn,
          x2:b.x2+nx*sgn, y2:b.y2+ny*sgn,
          stroke:col, 'stroke-width':3, opacity:0.85,
          'stroke-dasharray':'24 14'}));
      });
    }
    /* 🔴 v0.13_i 修一（F-1）：文字要先用 w2s 轉成【畫面座標】，而且中點要自己宣告。
       ⚠️ 照 v0.12_i 的 pseudocode 抄（直接用未宣告的 cx/cy）＝ "use strict" 下
          ReferenceError ⇒ render() 在 boot() 的 try 之外 ⇒ 🔴 啟動就白畫面。
       顯示規則（Ali 2026-09-13）：沒填高度 → 常駐顯示「樑N（未填高度）」（obs O-13：
       未處理的狀態不可以長得像處理過的）；填完高度 → 不顯示，只有從設定頁按〔預覽〕
       進來的那一根才亮起來並顯示編號。 */
    if(!filled || focus){
      const mcx=(b.x1+b.x2)/2, mcy=(b.y1+b.y2)/2;
      const ps=w2s(mcx, mcy);
      uiText(ps.x, ps.y, '樑'+(i+1)+(filled?'':'（未填高度）'),
        {size:11, anchor:'middle', fill:col});
    }
  });
  // 吸附預示：目標牆 ＋ 虛線幽靈
  if(S.snapCand){
    const c=S.snapCand;
    /* 🔴 v0.13_i 修八 F-10：目標牆的高亮原本寫死 13 ⇒ 42-a 之後 39cm 那道會完全蓋住它，
       而這是本批唯一能讓 Ali 當場看出「貼對邊」的回饋。
       ⇒ 改成比牆粗一圈（wallThick+8），linecap 也要一起改 butt（v0.14_i 補七 N-8b）。 */
    /* ╔═ 🔴 v0.17_i 修七-b｜只亮【side 那一側的那一個面】，不再蓋住整道牆 ═════════╗
       Ali：「除非之後可以寫 只亮＋一側＋」
       做法：沿 wallBaseNormal × side 位移 wallThick/2（＝走到那一側的牆面），
             在那裡畫一條沿牆的亮線。
       ✅ 粗細定案 11（第一版 3.5 太細，Ali 2026-09-14 定「至少兩倍」）
       🔴 顏色與透明度【不變】（var(--ghost) ＋ opacity .85）——
          改的只有「蓋整道牆」→「只蓋一面」＋粗細。
       🔴 為什麼一定要改（不是美化）：觸發時家具已經壓在牆上 ⇒ 幽靈與手上那件只差 6cm
          ⇒ 手機 fit 時是 2 像素 ⇒ 靠比對兩個外框的回饋【失效】，
            而「哪一側」正好是唯一看不出來的那件事。 ╚═══════════════════════════╝ */
    const nb=wallBaseNormal(c.wall);
    const sd=(c.side===1||c.side===-1)? c.side : 1;
    const ox=nb.x*sd*wallThick(c.wall)/2, oy=nb.y*sd*wallThick(c.wall)/2;
    g.appendChild(el('line',{x1:c.wall.x1+ox,y1:c.wall.y1+oy,x2:c.wall.x2+ox,y2:c.wall.y2+oy,
      stroke:'var(--ghost)','stroke-width':11,opacity:.85,
      'stroke-linecap':'butt'}));
    const gp=corners(c.gx,c.gy,c.f.w,c.f.d,c.gang,0);
    g.appendChild(el('polygon',{points:gp.map(p=>`${p.x},${p.y}`).join(' '),
      fill:'none',stroke:'var(--ghost)','stroke-width':3,
      'stroke-dasharray':'10 7'}));
  }
  /* 🗂 v0.21_i 下-22：這裡原本呼叫 corridorHint(g)／lengthScale(g)，把示意帶與比例尺畫進世界座標。
     整組已搬進畫面座標的 HUD（drawHUD，在本函式最後、_uiLayer 裡）。
     ⇒ v0.20_i 那段「走道網格外緣會蓋到示意帶」的顧慮（N-509b）**隨之消失**：
        HUD 在 _uiLayer，永遠在世界座標的一切之上。 */

  /* ╔═ 🔴 v0.20_i §2-3a ③｜疊圖排序區塊 ══════════════════════════════════════════╗
     🔴 **必須傳 ctx** —— g 與 sel 是本函式的區域 const，抽出去的函式看不到它們
        （零參數 ⇒ ReferenceError ⇒ render 在 boot 的 try 之外 ⇒ 啟動白畫面）。
     🔴 `slice()` 之後才 sort —— 不要就地排序 DRAW_ORDER（那會每一幀改動常數陣列）。
     🔴 **不要在這一行做過濾**（例如 `if(shown(d.layer))`）——
        §1-1b 的「走道三檔」會被一刀切掉。各支自己判斷。 ╚═══════════════════════════╝ */
  const ctx = { g, sel };
  DRAW_ORDER.slice().sort((a,b)=>a.z-b.z).forEach(d=> d.fn(ctx));
  /* 🔴🔴 家具名稱在排序迴圈【結束之後】才畫，而且**不在 DRAW_ORDER 裡**。
     位置對疊圖沒有任何影響（它畫進 _uiLayer，永遠在 g 的一切之上），
     固定放這裡只是為了**可預測**、讓下一個人一眼看到它不在排序裡。
     🛑 不要試圖把它插進迴圈 —— 「家具與照片標記之間」這個位置在迴圈外不存在（v0.1.9 起照片標記改成 drawPins，也在迴圈外），
        「在它們之間」這個位置在迴圈外根本不存在。 */
  drawName(ctx);
  /* 🔴 v0.1.9 批 8：相簿釘子（R-22：房間名 → 家具名 → 釘子 → HUD） */
  drawPins();
  /* 🔴 v0.21_i 下-22：左下角的走道示意＋比例尺（畫面座標，永遠在最上層）。
     放在家具名之後 ⇒ 兩者重疊時 HUD 在上面，比例尺不會被名字蓋住。 */
  drawHUD();

  /* 需求 5：種子提示。依 _d §10-0b 這句是【功能說明】
     ⇒ 只留到使用者建了第一件東西為止，之後不再顯示。 */
  /* 🔴 左上角逐行堆疊（種子提示 → pull 錯誤 → 幾何格式錯誤），行高 18。 */
  let _ty = SVG_PAD+16;
  if(isSeedPristine()){
    /* 🔴 需求 20：提示句固定在平面圖【左上】（畫面座標），完全不隨 zoom／pan 跑。
       Ali 截圖裡被切成「單〕重來，或直接改它」的就是這一句。 */
    uiText(SVG_PAD+2, _ty, '這是範例。到 ⚙️ 按〔清清單〕重來，或直接改它',
      {size:12, fill:'var(--sub)', opacity:.9});
    _ty += 18;
  }
  /* 需求 15：pull 失敗必須看得到（不可被「本機全空」蓋成一個空專案）
     🔴 需求 20：這也是給人讀的文字 ⇒ 畫面座標，固定在左上第二行。 */
  if(S.dataErr){
    uiText(SVG_PAD+2, _ty, '⚠️ '+S.dataErr, {size:12, fill:'var(--warnB)', weight:600});
    _ty += 18;
  }
  /* 🔴 v0.13_i 修七 F-29 ＋ v0.14_i 補七 N-9：分區幾何格式錯誤畫在第三行。
     它放在【不會被同步清掉】的 S.geomErr 裡（S.dataErr 的清除點是 cloudSync 成功與 boot 成功）。 */
  if(S.geomErr){
    uiText(SVG_PAD+2, _ty, '⚠️ '+S.geomErr, {size:12, fill:'var(--warnB)', weight:600});
    _ty += 18;
  }
  /* 🔴 v0.1.9 R-15：雲端是新版格式 ⇒ 停推雲端。常駐一行（不隨同步成功消失）。 */
  if(CLOUD.frozen){
    uiText(SVG_PAD+2, _ty, '⚠️ '+FROZEN_MSG, {size:12, fill:'var(--warnB)', weight:600});
  }
}

/* ══════════════════════════════════════════════════════════════
   手勢（議題 A：兩案並陳，同一原型用開關切）
   ══════════════════════════════════════════════════════════════ */
const pts=new Map();
let startPt=null, moved=false, pinch0=null, hitId=null;

function furnAt(sx,sy){
  const p=s2w(sx,sy);
  const pad = GRAB_PAD_PX/S.zoom;               // 螢幕 14px 換算成公分
  for(let i=FURN.length-1;i>=0;i--){
    const f=FURN[i];
    if(!onPlan(f)) continue;
    const q=place(f);
    const m = (f.id===S.selId) ? pad : 0;       // 只有選中的才有緩衝
    const c=Math.cos(-q.ang), s=Math.sin(-q.ang);
    const dx=p.x-q.x, dy=p.y-q.y;
    const lx=dx*c-dy*s, ly=dx*s+dy*c;
    if(Math.abs(lx)<=f.w/2+m && Math.abs(ly)<=f.d/2+m) return f;
  }
  return null;
}
function canDragFurn(f){
  if(!f) return false;
  if(!hasSize(f)) return false;        // 🔴 需求 7：尺寸未填不可拖（點選仍可，供編輯）
  return S.selId===f.id;               // 🔴 需求 39：唯一路徑——要先選中才拖得動
}
svg.addEventListener('pointerdown',e=>{
  try{ svg.setPointerCapture(e.pointerId); }catch(err){}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    pinch0={d:Math.hypot(a.x-b.x,a.y-b.y), z:S.zoom,
            mx:(a.x+b.x)/2, my:(a.y+b.y)/2, px:S.panX, py:S.panY};
    S.dragging=null; startPt=null; hitId=null; return;   // 進入縮放＝取消單指狀態
  }
  const r=svg.getBoundingClientRect();
  const sx=e.clientX-r.left, sy=e.clientY-r.top;
  startPt={id:e.pointerId,x:e.clientX,y:e.clientY,sx,sy,panX:S.panX,panY:S.panY};
  moved=false;
  const f=furnAt(sx,sy); hitId=f?f.id:null;
  /* 🔴 v0.1.9 R-20：按下點命中釘子 ⇒ 不啟動家具拖曳（釘子壓在已選中的家具上時，點擊要給釘子）；
     定位中一律不拖家具（進定位時已 select(null)，這裡是第二道）。 */
  const pinDown = !!S.loc || pinsAt(sx,sy).length>0;
  if(!pinDown && canDragFurn(f)){
    const q=place(f);
    S.dragging={f, gx:q.x, gy:q.y, ang:q.ang,
      ox:q.x-s2w(sx,sy).x, oy:q.y-s2w(sx,sy).y};
  }
});
svg.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch0 && pts.size===2){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const z=Math.max(.25,Math.min(4, pinch0.z*(d/pinch0.d)));
    const r=svg.getBoundingClientRect();
    const mx=pinch0.mx-r.left, my=pinch0.my-r.top;
    S.panX = mx-(mx-pinch0.px)*(z/pinch0.z);
    S.panY = my-(my-pinch0.py)*(z/pinch0.z);
    S.zoom=z; render(); syncSel(); zLbl(); return;
  }
  if(!startPt) return;
  const dx=e.clientX-startPt.x, dy=e.clientY-startPt.y;
  if(!moved && (Math.abs(dx)>DRAG_PX||Math.abs(dy)>DRAG_PX)) moved=true;   // §2
  if(!moved) return;
  if(S.dragging){
    const r=svg.getBoundingClientRect();
    const p=s2w(e.clientX-r.left, e.clientY-r.top);
    S.dragging.gx=p.x+S.dragging.ox;
    S.dragging.gy=p.y+S.dragging.oy;
    previewMove(); render(); syncSel();
  }else{
    /* 🔴 需求 39：沒有在拖家具 ⇒ 一律平移。原 A1 的 nudgeHint 分支已整段移除——
       它那句提示會叫使用者去按一顆已經不存在的按鈕。平移是唯一路徑，不可以壞。 */
    S.panX=startPt.panX+dx; S.panY=startPt.panY+dy; render();
  }
});
function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size<2) pinch0=null;
  /* ⚠️ O-2：只處理「開始這一筆的那根手指」抬起。
     否則漏收一次 pointerup 會用上一次留下的 startPt/hitId 去做選取。 */
  const mine = startPt && startPt.id===e.pointerId;
  if(S.dragging && moved){ commitMove(); }
  else if(!moved && mine){
    const r2=svg.getBoundingClientRect();
    const wp=s2w(e.clientX-r2.left, e.clientY-r2.top);
    /* 🔴 v0.1.9 R-23：定位中「點＝移過去」接在這裡（舊的 S.pinPhoto 那一格）。
       Q-12 判定順序：兩指＝縮放 → 已選中家具＝拖曳（按下當下決定）→ 其他單指移動＝平移
                      → 沒移動就放開：定位中＞釘子（📷 亮著才算；收集全部）＞家具選取／點空白取消。 */
    if(S.loc && S.loc.phase==='locating'){ locMoveTo(wp.x, wp.y); }
    else {
      const hits = pinsAt(e.clientX-r2.left, e.clientY-r2.top);
      if(hits.length===1){ openPinCard(hits[0].albumId); }
      else if(hits.length>1){ openPinList(hits.map(h=>h.albumId)); }
      else{
        if(S.loc || S.pinSel) clearPinState();       // 定位完成後／預覽卡開著：點空白處＝取消選取（同家具）
        const f=hitId?FURN.find(x=>x.id===hitId):null;
        select(f?f.id:null);                         // 輕點＝選取 / 點空白＝取消
      }
    }
  }
  if(mine || !S.dragging){ startPt=null; hitId=null; }
  S.dragging=null; S.snapCand=null;
  render(); syncSel();
}
svg.addEventListener('pointerup',endPointer);
/* 🔴 v0.21_i（讀坑 🔴5）：舊註解寫「pointercancel＝來電/通知蓋掉：當作沒發生」——**那是錯的**。
   它走的是同一支 endPointer ⇒ 若已經拖動過（moved），**會 commitMove**（家具停在被打斷的位置）。
   ⇒ 只改註解、不改行為（O-25：註解不可以指向一個不存在的事實）。 */
svg.addEventListener('pointercancel',endPointer);   // 來電/通知蓋掉：與放手同一條路（會 commit）
/* ╔═ 🔴 v0.21_i 下-23（讀坑 🔴5）｜放手的【第三條路】═════════════════════════════════╗
   放手有三條路：pointerup、pointercancel（兩者都是 endPointer，結尾一定 render）、以及這一條。
   🔴 這一條原本清掉 S.dragging 卻**不重畫**、也沒清 S.snapCand
      ⇒ 被系統手勢搶走擷取時，拖曳中才出現的東西（房間名、幽靈、浮起來的外框）
        會一直掛在畫面上，直到下一次別的東西觸發重畫（N-614）。
   ✅ 只在【真的清掉了這一筆】時才重畫 —— 正常放手時 pointerup 已經先把 startPt 清掉，
      這裡不成立，不會多重畫一次。 ╚══════════════════════════════════════════════════╝ */
svg.addEventListener('lostpointercapture',e=>{      // 擷取被搶走＝那根手指已經不算數
  pts.delete(e.pointerId);
  if(pts.size<2) pinch0=null;
  if(startPt && startPt.id===e.pointerId){
    startPt=null; hitId=null; S.dragging=null; S.snapCand=null;
    render(); syncSel();
  }
});

/* ╔═ 🔴🔴 v0.20_i §5 下-20｜碰牆【一律】取牆角（Ali 2026-09-20 裁決【丁】）═════════╗
   Ali 原話：「我的意圖**一直都是**，雖然家具已經調整過角度，但是
              **碰牆之後，就直接用牆的角度覆蓋**。」
   她同時把「吸附」的語意定了下來（🔑 這句比規則本身重要）：
     「當之前已經把吸附意圖限制到【只有碰牆（完全碰到才算）】才會吸附的時候，
       此時的吸附我將它視為【和牆面貼齊】（家具本來就不能穿牆，除非有特例，
       或僅僅是擺放用），**特例和測試擺放我用微調**。」
   ⇒ 🔑 吸附是一個【物理事實】（家具不能穿牆），不是一個【操作手感】。

   ── 完整模型（三句，Ali 逐句確認過）────────────────────────────────────
     ① 碰牆　⇒ 貼齊牆面 ＋ 用牆的角度覆蓋（一律，沒有例外）　＝ 本函式
     ② 脫離（🧲 已貼牆 → 未貼牆）⇒ 角度留著，不可以轉回預設值　＝ 下-19（btnUnsnap）
     ③ 微調鍵 ⇒ 特例與測試擺放用；nudge() 完全不碰 rot（現況就是）
   ⚠️ 由 ①＋② 推出、且 Ali 已明確接受：**貼牆的家具被【拖動】⇒ 角度會再次被覆蓋。**
      貼牆後微調出來的角度，拖一下就沒了 —— 這是預期行為，不是 bug。

   ── 🗂 歷史：這裡曾經有一個 `flags.rotUser`，2026-09-20 被撤掉 ──────────────
   v0.1.7 §下-7 為了修「換牆之後角度回不去」而引入 `f.flags.rotUser`：
     她自己轉過 ⇒ 保留她的角度；沒表態過 ⇒ 對齊新牆。
   🔴 它被撤掉的理由（Ali 裁決【丁】，見 `_i` §10-4）：
     · 她的意圖從頭到尾就是「碰牆一律覆蓋」，rotUser 從來不是她要的
     · 而且 rotUser 是一個【一旦 true 就永遠 true】的鎖（全檔沒有任何清除點）
       ⇒ 她按過一次〔↻ 旋轉〕，那一件從此碰牆都不再取角
     · 她也否決了「用〔🧲〕清掉 rotUser」的替代案：「這樣會和畫面上的吸附打架」
       —— 🧲 的語意是「它現在貼著牆嗎」＝一個事實，不可以同時表達「角度有沒有被鎖住」
   ⚠️ 資料庫裡的舊 `flags:{"rotUser":true}` **不清除**（沒有人讀它了，清它反而是動使用者
      的資料）⇒ 下一個人看到那個殘留值時，答案在這一段。欄位 `items.flags` 本身保留
      （通用 jsonb，toRow／fromRow 一行不改）。
   🔴 **簽名不要改**（仍然吃 `f`）—— 全檔三個呼叫點（commitMove／snapBackToWall／
      previewMove）不動；改簽名會多三個要跟著改的地方，而收益是零。
      📌 `f` 目前**沒有被用到**，保留純粹是為了不動那三個呼叫點。不要把它刪掉。 ╚═════╝ */
function snapRot(absAng, wallAng, f){
  let rel=(absAng-wallAng)*180/Math.PI;
  rel=((rel%360)+360)%360;
  return (Math.round(rel/90)%4)*90;        // 🔴 下-20：一律對齊牆，不再看任何旗標
}
/* 拖曳中：找吸附候選並產生預示（不當場跳貼，維持跟手）*/
function previewMove(){
  S.snapCand=null;
  if(!L('snap')||!S.dragging) return;
  const {f,gx,gy}=S.dragging;
  if(!hasSize(f)) return;
  let best=null;
  /* ╔═ 🔴🔴 v0.19_i §下-4｜perpHalf 的角度用錯了（要改結構，不是加參數）═════════╗
     舊寫法　const ph=perpHalf(f);  ← 在 WALLS.forEach【外面】，只算一次
     f.rot 是相對於【它目前附著的那道牆】的角度，可是門檻要比的是
     「相對於【這一道候選牆】」的垂直半徑 ⇒ 候選牆是迴圈裡才選出來的
     ⇒ 「多收一個角度參數」沒有地方可以傳 ⇒ 必須把計算搬進迴圈。
     🔬 第 0 批實測（33 道真實牆、150×200 的家具）：
        水平牆 clearance −0.02（正確）／**垂直牆 +24.98（早吸 25 公分）**／
        斜牆 −24.98 ~ +17.14 ⇒ 誤差 ＝ ph_used − ph_true，與牆的角度直接相關。
        ⇒ 🔴 下-5「直牆吸附仍有小範圍」與本條【同一個根因】，本條修好就一起解決。
     🔴 1281 place() 那個呼叫點【一行不改】—— 它現在是對的（f 已經貼在那道牆）。 */
  const phFor = (wall)=>{
    const rel = S.dragging.ang - wallAngle(wall);        // 相對【這一道候選牆】的角度
    return Math.abs((f.w/2)*Math.sin(rel)) + Math.abs((f.d/2)*Math.cos(rel));
  };
  /* 🔴 需求 45-a：不再過濾房間。匯入的 33 道牆 room 全 NULL
     ⇒ 舊的 WALLS.filter(w=>w.room===f.room) 永遠沒有候選 ⇒ 根本吸不到。
     ⚠️ 配套是 SNAP_MAX_CM（需求 45-c），否則全屋 fit 時會吸到屋外那道。 */
  /* ╔═ 🔴 v0.17_i 修七-a ＋ 甲-1｜吸附觸發改成「碰到牆的【本體】才吸」═════════════╗
     Ali：「傢俱所占面積和牆面重疊的時候，才開啟吸附，設定成沒有觸碰牆，不存在吸附的意圖」
     　　　「縮小看全屋時，也是碰到才吸。」（2026-09-18 裁決）
     ⇒ 門檻 ＝ wallThick(w)/2，🔴 沒有螢幕像素下限（SNAP_MIN_PX 整條取消，不新增那個常數）。
     🔴 gap 的定義不變（gap = d - perpHalf(f)），這一行不要動。
     ⚠️ 已知代價（Ali 已被告知並接受，🔴 不是 bug）：
        全屋檢視下 wallThick/2 換算成螢幕距離只有 2 像素上下
        ⇒「縮小＝粗擺、容易吸」這個舊行為沒有了
        ⇒ 要避開吸附，用的是【吸附開關】，不是放大。 ╚═══════════════════════════╝ */
  WALLS.forEach(w=>{
    const {d,t}=distSeg(gx,gy,w);
    /* 🔴 §下-4 ①：每一道候選牆各算一次 ph（gap 的定義不變：gap = d − 垂直半徑）。 */
    const ph=phFor(w);
    const gap=d-ph;
    if(gap <= wallThick(w)/2 && (!best||gap<best.gap))
      best={w,t,gap,ph};
  });
  if(!best) return;
  const w=best.w, a=wallAngle(w);
  /* 🔴 v0.14_i 補二：這裡是【寫入端】（1336 那格是 previewMove，每幀都跑，不是放手當下）。
     算出 side 放進 S.snapCand；真正寫進 f.anchor 的是 commitMove（放手當下）。 */
  const side=sideFromPoint(w, gx, gy);
  const n=wallNormalFor(w, {side});
  /* 🔴 需求 42-b 的連帶（claude 裁決，A 類歧義：_i 沒寫幽靈要不要跟著往外移）：
     幽靈必須與 place() 算出來的最終位置一致，否則放手後家具會跳 thickness/2，
     而幽靈正是「看得出貼哪一邊」的唯一回饋。⇒ 同樣加 wallThick/2。
     ⚠️ gx/gy 只用來畫幽靈（commitMove 用的是 along/side），不進任何資料。 */
  /* ╔═ 🔴 v0.20_i §5 下-21｜幽靈的【落點】要用【對齊後】的角度算（Ali 裁決【乙】：順手修）╗
     現象（既有缺陷，建造前讀坑補驗 H 查出來的）：
       幽靈的【角度】本來就對（gang 用的是 nr），但它的【離牆距離】用的是
       `best.ph` ＝【拖曳當下、還沒對齊】的角度算出來的垂直半徑，
       而放手後 place() 用的是 perpHalf(f)，此時 f.rot 已被 snapRot 打成 0/90/180/270。
     🔬 複驗（150×200 的家具，落差隨角度變，最壞在 45° 附近）：
       rel 44.0° ⇒ nr 0°  ／ ph_drag 124.0 vs ph_snap 100.0 ⇒ 差 **24.0 cm**
       rel 45.0° ⇒ nr 90° ／ ph_drag 123.7 vs ph_snap  75.0 ⇒ 差 **48.7 cm** ← 最壞
     ⚠️ 這不是下-20 造成的，但下-20 之後「碰牆一律對齊」成為【唯一路徑】
        ⇒ 它每次都會出現（以前 rotUser 為 true 的家具不會對齊，幽靈反而是準的）
        ⇒ 而 N-526「拖到別的牆」正好會照到它 ⇒ 她會先看到一個不準的幽靈。

     🛑🛑 **迴圈裡那個 `ph`（phFor(w)）不可以動** —— 它是【觸發判斷】用的：
        `const gap = d - ph; if(gap <= wallThick(w)/2)`
        它問的是「我**現在這個角度**，有沒有碰到牆」⇒ 必須用拖曳當下的角度。
        📌 `best.ph` 只是把那個值【記錄下來】，本批之後**已經沒有人讀它**
           （落點改用下面的 phSnap）。留著它是為了不動 best 的形狀；不要以為它還在用。
        把觸發也改成用對齊後的角度 ⇒ 會變成「還沒碰到就先吸」，
        直接推翻 v0.1.6 修七-a「碰到牆本體才吸」那條已裁決的行為。
     🔑 **一個是「要不要吸」，一個是「吸上去之後在哪」——兩個問題，兩個角度。**
     🛑 along／side／gang 三個都不動（along 與 commitMove 共用、gang 本來就用 nr、
        side 由 sideFromPoint 算與角度無關）。 ╚═══════════════════════════════════════╝ */
  const along=Math.max(f.w/2, Math.min(wallLen(w)-f.w/2, best.t*wallLen(w)));
  const bx=w.x1+Math.cos(a)*along, by=w.y1+Math.sin(a)*along;
  const nr=snapRot(S.dragging.ang, a, f);            // ① 🔴 下-21：提前算（本來在最後）
  const relRad=nr*Math.PI/180;
  const phSnap=Math.abs((f.w/2)*Math.sin(relRad))
             + Math.abs((f.d/2)*Math.cos(relRad));   // ② 用【對齊後】的角度重算垂直半徑
  const dep=phSnap + wallThick(w)/2;                 // 🔴 改用 phSnap（不是 best.ph）
  S.snapCand={f, wall:w, along, side,
    gx:bx+n.x*dep, gy:by+n.y*dep, gang:a+nr*Math.PI/180};
}
/* ╔═ 🔴 v0.19_i §下-3｜「它現在在哪一間」的判定（放手與微調共用這一段）════════╗
   🔴 六-b：判不出來時【維持原本的 f.room 不變】，絕對不可以寫成 null
      （寫 null ⇒ onPlan 失敗 ⇒ 它從畫面上消失），而且要靠 S.roomGuessFailed
      這個旗標說一句話（不可以直接寫 S.selNote —— 下一幀就被蓋掉）。 */
function rejudgeRoom(f){
  const rid=roomOfAnchor(f, f.anchor);
  if(rid){
    f.room=rid;                       // 判得出來 ⇒ 跟著新房間走（外框與清單色條也會跟著換）
    S.roomGuessFailed=null;
  }else{
    S.roomGuessFailed=f.id;           // 判不出來 ⇒ 保留原值，並在 selNote 說出來
  }
}
/* ╔═ 🔴🔴 §下-3｜微調跨界要重判房間 ═══════════════════════════════════════════╗
   現況　roomOfAnchor 只有兩個呼叫點（previewMove 預判／commitMove 放手）
        ⇒ nudge() 沒有呼叫它 ⇒ **微調永遠不會重判房間**。
   🔴🔴 掛點【不可以掛 stopRepeat】：單擊的真實順序是
        pointerdown → pointerup(stopRepeat) → click → nudge()
        ⇒ 掛 stopRepeat 會比家具移動【早一步】⇒ 用移動前的位置重判
        ⇒ 要多按一次才換房間，而「多按一次就對了」看起來像修好了。
   ✅ 掛在 nudge() 尾端 ＋ debounce：連發時只在最後一次算（N-419：按住不放不會一直閃），
      單擊時也保證在移動【之後】。 */
let _rejudgeTimer=null;
function scheduleRoomRejudge(id){
  if(_rejudgeTimer) clearTimeout(_rejudgeTimer);
  _rejudgeTimer=setTimeout(()=>{
    _rejudgeTimer=null;
    const f=FURN.find(x=>x.id===id); if(!f) return;
    const before=f.room;
    rejudgeRoom(f);
    /* 🔴 重判之後要跟著做兩件，否則 N-418 做不出來：
       ① saveItem —— 房間改了但沒存 ⇒ **重開就打回原形**
       ② buildList —— 讓那張卡片跳到新的一組，否則畫面上看不出房間換了
       ⚠️ 兩件都只在【房間真的變了】那一次做（位置本身 nudge 已經存過了）
          ⇒ 一次微調不會產生兩次無謂的 saveItem。 */
    if(f.room!==before){
      saveItem(f).catch(e=>cloudErr(e));
      buildList();
    }
    render(); syncSel();
  }, 35);   // 20~50ms
}

function commitMove(){
  const {f,gx,gy,ang}=S.dragging;
  if(S.snapCand && S.snapCand.f.id===f.id){
    /* 🔴 吸附【不可以順手把家具轉正】（O-8）。以目前的絕對朝向為準反算 rot。 */
    f.rot = snapRot(ang, wallAngle(S.snapCand.wall), f);   // 🔴 v0.20_i 下-20：一律取牆角
    /* 🔴 v0.14_i 補二：commitMove 會【整個重建 anchor】
       ⇒ side 必須在這裡從 S.snapCand 寫進去，不可以指望 previewMove 寫的值還在。
       ⚠️ side 是【使用者的決定】（她把家具拖到哪一側就是表態），不是每次重算的衍生值
          —— 與 _memory_「名次與順序是資料不是衍生值」同一個形狀。 */
    f.anchor={type:'wall', wall:S.snapCand.wall.id, along:S.snapCand.along, off:0,
              side:S.snapCand.side};
  }else{
    f.anchor={type:'free', x:gx, y:gy};      // 錨點切換＝依附身分改變（_d §5-2）
    f.rot=((ang*180/Math.PI)%360+360)%360;   // 脫離牆面時同樣保持絕對朝向
  }
  /* ╔═ 🔴 v0.17_i 修六｜放手之後，自動判定它現在在哪一間 ═══════════════════════╗
     Ali：「我指定客廳，床出現在客廳，接著把它放到另一個空間，在清單中他仍然是在客廳。」
     🔴 六-b：判不出來時【維持原本的 f.room 不變】，絕對不可以寫成 null
        （寫 null ⇒ onPlan 失敗 ⇒ 它從畫面上消失），而且要說一句話
        （靠 S.roomGuessFailed 這個旗標，不可以直接寫 S.selNote —— 下一幀就被蓋掉，§0-5 A-6）。
     ⚠️ 三個判不出來的死角：沒有 poly 的房間（種子／舊資料）／貼在外牆外側／
        poly 的邊與牆體之間的浮點縫。 ╚═══════════════════════════════════════════╝ */
  rejudgeRoom(f);                     // 🔴 §下-3：抽成函式，微調那條路呼叫【同一段】
  /* 🔴 需求 4：7 處「直接 in-place 改值」一律改成「改記憶體 → 呼叫 saveItem()」 */
  saveItem(f).catch(e=>cloudErr(e));
  /* 清單的分組是依 f.room 分的 ⇒ 換房間之後清單要跟著重建（修十）。 */
  buildList();
}

/* ══════════════════════════════════════════════════════════════
   需求 12｜選中面板（重排）
   ══════════════════════════════════════════════════════════════ */
function select(id){
  /* ╔═ 🔴🔴 v0.20_i §3-1g ②｜select() 是 commitAngEdit 的**第七條入口** ═══════════════╗
     🔴 **順序不可換：先 commit，後清旗標。**
        commitFieldEdits 的守衛是 `if(!S.sizeOpen) return;`、
        commitAngEdit 的守衛是 `if(!S.angOpen) return;`
        ⇒ 先把旗標設成 false 再呼叫 ＝ 那一次 commit **必定被自己的守衛擋成 no-op**，
          而且**不會報錯**。
     🔴 **為什麼 select() 也要 commit**：點平面圖上另一件家具走的是 `endPointer → select()`，
        而**在 svg 上點擊不保證輸入框的 blur 先於 select**（手機上尤其）。
        現況的 commitFieldEdits 一直靠「原生 blur 先觸發」頂著 —— 那是瀏覽器行為，
        不是規格寫出來的保護。
        ⚠️ 這條入口只在**手機**上壞：桌機的原生 blur 會先觸發，一切看起來正常
           ⇒ 我在桌機驗 N-524/N-528 會全綠，而她在手機上會掉資料。
     🔴 不清 angOpen 的症狀：選中 A 且旋轉模式開著 → 點選 B
        ⇒ angOpen 沿用 true ⇒ **B 的面板直接展開成旋轉模式**，而她只是想看 B（N-555）。
     📌 obs O-20／O-25 的形狀：函式名字沒變，但「它現在該做的事」變多了。 ╚═══════════╝ */
  commitFieldEdits();
  commitAngEdit();
  if(id) clearPinState();            // 🔴 v0.1.9 R-20：家具與釘子互斥（選了家具 ⇒ 收掉預覽卡／定位面板）
  S.selId=id;
  S.sizeOpen=false; S.angOpen=false; S.warnOpen=false;
  S.selNote='';                      // 🔴 需求 30：訊息跟著選中狀態走
  S.selMsg='';                       // 🔴 v0.17_i：一次性動作訊息也跟著選中狀態走
  S.roomGuessFailed=null;            // 🔴 v0.17_i 六-b：換選別件 ⇒ 上一件的「判不出來」要清掉
  $('sel').classList.remove('szopen');
}

/* 需求 12：撞到多件 → 截斷成「🔴 撞到：沙發 +2」；點警示展開全部 */
function warnSummary(n){
  if(n.hit.length){
    const names=n.hit.map(x=>x.name||'未命名');
    if(S.warnOpen || names.length===1) return {cls:'c', txt:`🔴 撞到：${names.join('、')}`};
    return {cls:'c', txt:`🔴 撞到：${names[0]} +${names.length-1}`};
  }
  if(n.near.length){
    const names=n.near.map(x=>x.name||'未命名');
    if(S.warnOpen || names.length===1)
      return {cls:'w', txt:`🟠 走道不足：與 ${names.join('、')} 之間不到 ${CLEAR_CM} 公分`};
    return {cls:'w', txt:`🟠 走道不足：與 ${names[0]} +${names.length-1} 不到 ${CLEAR_CM} 公分`};
  }
  return {cls:'n', txt:'🟢 沒有碰撞，走道也夠'};
}

function syncSel(){
  syncPinUI();                       // 🔴 v0.1.9 R-20：定位面板／預覽卡／提示條（另一個元素，每幀跟著套用）
  const f=FURN.find(x=>x.id===S.selId);
  const box=$('sel');
  /* 🔴 v0.21_i §1-3 ⑤：面板顯不顯示的判準抽成 selPanelShown()，drawHUD 讀【同一支】
     ⇒ 兩邊不可能不同步（不要在這裡另寫一份條件）。 */
  if(!selPanelShown()){ box.hidden=true; return; }
  box.hidden=false;
  const p=place(f);
  $('selName').textContent = `${roomName(f.room)} · ${f.name||'未命名'}`;
  /* 🔴 v0.17_i 修五：selPos 已拿掉 —— 「貼牆／未貼牆」這個狀態長在 btnUnsnap 上（見下方）。 */

  // 微調鍵整組跟著軸轉（_d §10-2b：箭頭跟「它依附誰」走）。🔴 這段行為一行不改。
  let axis;
  if(p.wall) axis = wallAngle(p.wall);
  else if(f.rot) axis = f.rot*Math.PI/180;
  else axis = 0;
  $('pad').style.transform = `rotate(${axis*180/Math.PI}deg)`;

/* ╔═ 🔴🔴 v0.20_i §3-1e｜長按連發抽成 bindRepeat(el, fn) ═════════════════════════╗

   而角度的 [−1][＋1] 不在 .pad 裡 ⇒ 不可能沿用。
   🛑 **也不要複製第二份** —— 那正是 obs O-34 的溫床（兩個連發實作，之後只有一個會被改）。

      ⚠️ 這是 .pad 現況的形狀，照直覺寫（pointerdown 就呼叫一次 fn）會**按一次跳兩步**：
         放開時瀏覽器**仍然會發 click** ⇒ 跑兩次
         ⇒ 微調從 1cm 變 2cm、角度從 +1 變 +2
         ⇒ 而 .pad 是**已驗收的既有功能** ⇒ 這是靜默回歸。

function bindRepeat(el, fn){
  if(!el) return;
  el.addEventListener('pointerdown',e=>{
    if(el.disabled) return;
    e.stopPropagation();
    _repId=e.pointerId;
    _rep=setTimeout(()=>{ _rep=setInterval(fn, 90); },450);   // 按住 450ms 後開始連發
  });
  ['pointerup','pointercancel','pointerleave','lostpointercapture']
    .forEach(ev=> el.addEventListener(ev,e=>{ if(_repId===e.pointerId) stopRepeat(); }));
  el.addEventListener('click',e=>{
    if(el.disabled) return;
    e.stopPropagation();                     // §2：擋住父層
    fn();
  });
}

function nudge(dir){
  const f=FURN.find(x=>x.id===S.selId); if(!f||!hasSize(f)) return;
  const step=nudgeCm(), p=place(f);
  const axis = p.wall ? wallAngle(p.wall) : (f.rot? f.rot*Math.PI/180 : 0);
  const ux=Math.cos(axis), uy=Math.sin(axis);
  /* ⚠️ O-6：螢幕的 y 是【往下增加】。整組按鈕用 CSS rotate(axis) 轉，
     「▲ 這顆鈕視覺上指的方向」＝ 把 (0,-1) 旋轉 axis 度 ＝ (uy, -ux)。 */
  const nx=uy, ny=-ux;
  let dx=0,dy=0;
  if(dir==='r'){dx=ux*step;  dy=uy*step;}
  if(dir==='l'){dx=-ux*step; dy=-uy*step;}
  if(dir==='u'){dx=nx*step;  dy=ny*step;}
  if(dir==='d'){dx=-nx*step; dy=-ny*step;}
  if(f.anchor.type==='wall'){
    const w=wallById(f.anchor.wall);
    if(w){
      /* 🔴 v0.13_i 修四 4-c：這是 side 的【第三個讀取點】（v0.12_i 完全沒提到）。

         ⇒ 有一半的牆，按微調鍵家具會往反方向跑 —— 而那是已驗收過的既有功能。 */
      const n2=wallNormalFor(w, f.anchor);
      f.anchor.along += dx*ux + dy*uy;
      f.anchor.off    = (f.anchor.off||0) + (dx*n2.x + dy*n2.y);
    }
  }else{ f.anchor.x=(f.anchor.x||0)+dx; f.anchor.y=(f.anchor.y||0)+dy; }
  saveItem(f).catch(e=>cloudErr(e));          // 需求 4：改記憶體 → 呼叫 saveItem()
  scheduleRoomRejudge(f.id);                  // 🔴 §下-3：移動【之後】才重判，且連發只算最後一次
  render(); syncSel();
}

      inp.value = f[key]==null ? '' : Math.round(f[key]*10)/10;

/* ══════════════════════════════════════════════════════════════
   🔴 v0.20_i §3-1d~f｜角度族：正規化／顯示／寫入／解析
   ══════════════════════════════════════════════════════════════ */
/* 🔴 兩支具名函式，setRot() 與 syncSel() **共用**（不可以各寫一份）。
   🔴 absDegOf 一定要正規化：place(f).ang 來自 Math.atan2 ⇒ 值域是 (−π, π]
      ⇒ 直接換算成度，一件轉到 233° 的家具，欄位會顯示 **−127.0**
      ⇒ 與「一律正規化到 [0,360)」直接矛盾，而 N-521 會在超過 180° 時失敗。 */
const normDeg  = d => ((d % 360) + 360) % 360;
const absDegOf = f => Math.round(normDeg(place(f).ang * 180 / Math.PI) * 10) / 10;
const ANG_STEP = 1;      // 🔴 Ali 裁決：微調一次一度。寫成具名常數，之後要改 0.5 只改這一行。

/* ╔═ 🔴 v0.22_i §12／v0.21_i §6c-3 下-28｜「現在真的貼著牆嗎」的【單一來源】═══════════════╗
   讀者（只有這三個，意思都是「貼著」）：litWall（render）／〔🧲〕亮暗（syncSel）／〔🧲〕點擊（btnUnsnap）。
   🛑 place(f).wall 的另外三個讀者（syncSel axis／nudge／setRot）意思是「掛在哪道牆」，不讀這支。
   📌 obs O-40：不新增狀態、不偵測「復原」這個動作 —— 每次只看【現在的幾何】。
   容差（R-42）：
     off  < 0.25 cm　off 由 nudge 以 ±步長 累加（sin²+cos²，數學上精確），存檔取到 0.1 cm
     角度 < 0.1°　　absDegOf 四捨五入到 0.1°、setRot 再減牆角 ⇒ 斜牆（小數第二位是 5）
                    ＋1 再 −1 回來的殘差是 0.05°；< 0.05 會時過時不過（O-38 的形狀），0.1 才穩。 ╚═══╝ */
const FLUSH_OFF_CM = 0.25;
const FLUSH_DEG    = 0.1;
function isFlushToWall(f){
  if(!f) return false;
  const p = place(f);
  if(!p.wall) return false;
  const off = (f.anchor && f.anchor.off) || 0;
  const rel = normDeg(f.rot || 0) % 90;
  return Math.abs(off) < FLUSH_OFF_CM && Math.min(rel, 90 - rel) < FLUSH_DEG;
}

/* ╔═ 🔴🔴 §3-1f｜四個入口共用的唯一寫入點 ═══════════════════════════════════════╗
   🔴 **絕對不可以寫成 `f.rot = 正規化(絕對角)`** —— 那會讓貼牆的家具翻掉：
      place() 的 wall 分支是 `ang = wallAngle(w) + f.rot*π/180`
      ⇒ 把**絕對角**直接塞進 f.rot ⇒ **牆角被加兩次**
      ⇒ 她在 53.2° 的斜牆上把角度打成 120，家具會跑到 **173.2°**。
   ⇒ 所以要先把牆角**減掉**，換算回「相對於那道牆」的 rot。free 時 wallDeg=0 ⇒ 自然退化。
   ⚠️ 抽成一支的理由見 obs O-34：同一個狀態轉換有多個入口時，通常只有一個做對了。
   🛑 **不寫 flags.rotUser**（Ali 裁決【丁】，見 snapRot 上方）。 ╚═══════════════════╝ */
function setRot(f, absDeg){
  const p = place(f);                                          // 🔴 先取得目前的 anchor 狀態
  const wallDeg = p.wall ? wallAngle(p.wall)*180/Math.PI : 0;
  f.rot = normDeg(absDeg - wallDeg);
  saveItem(f).catch(e=>cloudErr(e)); render(); syncSel();
}
/* ╔═ 🔴 §3-1d｜角度欄的解析：一個**極小的求值**，不是通用算式 ═══════════════════╗
   接受的字元　數字、小數點、`+`、`-`、空白。其餘一律無效。
   求值規則　　把字串切成**帶符號的項**，全部相加。第一項沒有符號就是正的。
       `90+30` → 120 ／ `90-30` → 60 ／ `90+30-5` → 115 ／ `-30` → −30 → 正規化 → **330**
   🔑 為什麼這樣就夠：Ali 定的語意是「欄位**預填目前值**」⇒「在 90 後面接著打 +30」
      這件事自然成立，不需要另外定義一套相對語意 —— 她打完之後欄位字面上就是 `90+30`，
      而她**看得到自己打了什麼**。
   🛑🛑 **絕對不可以用 eval() 或 new Function()** —— 那個字串來自輸入框，
      而這個 App 之後要多人共享。自己寫十行切字串 ⇒ 沒有任何執行任意碼的可能。
   🔴 也**不要**支援 `*`、`/`、括號 —— 她沒有要，而每多一個符號就多一組邊界。
   回傳　數字（已正規化到 [0,360)，1 位小數）／null ＝ 無效 ╚═══════════════════════╝ */
function parseAngle(raw){
  const s=String(raw==null?'':raw).trim();
  if(s==='') return null;
  if(!/^[0-9.+\-\s]+$/.test(s)) return null;        // 只准這些字元
  const terms=s.match(/[+-]?\s*[0-9]*\.?[0-9]+/g);  // 切成帶符號的項
  if(!terms) return null;
  // 🔴 把項接回去比對，確認沒有任何字元被默默忽略（例如 `90++` 或 `9.9.9`）
  if(terms.join('').replace(/\s/g,'') !== s.replace(/\s/g,'')) return null;
  let sum=0;
  for(const t of terms){
    const v=parseFloat(t.replace(/\s/g,''));
    if(!isFinite(v)) return null;
    sum+=v;
  }
  if(!isFinite(sum)) return null;
  return Math.round(normDeg(sum)*10)/10;
}
/* ╔═ 🔴🔴 §3-1d｜commitAngEdit() 的**七條入口**，與 commitFieldEdits 完全同構 ═══════╗

/* ╔═ ⚠️ v0.17_i 丙-6｜「貼回最近的牆」是一整條【新功能】，不是改文字 ═════════════╗
   舊的 btnUnsnap 是單向的（脫離得了、貼不回去）。七點規格（丙-6）全部寫死在這裡：

        下-19 剛替她保住的那個角度**會被牆角覆蓋**。那是【預期行為】（驗收 N-564b）。
   ⑤ along 夾限比照 previewMove
   ⑥ L('snap') 熄著時這顆鈕 disabled（見 syncSel）
   ⑦ 守衛改成只看 noSize（見 syncSel） ╚═══════════════════════════════════════════╝ */
function snapBackToWall(f){
  const c=place(f);
  let best=null;
  /* 🔴 §下-4 ③：snapBackToWall 是同一個形狀 —— perpHalf 也要【相對於該候選牆】算。
     這裡家具的絕對朝向是 c.ang（place() 算出來的），不是 S.dragging.ang。 */
  WALLS.forEach(w=>{
    const {d,t}=distSeg(c.x,c.y,w);

  f.anchor={type:'wall', wall:w.id, along, off:0, side};

}
$('btnUnsnap').onclick=()=>{ const f=FURN.find(x=>x.id===S.selId); if(!f) return;

             ⇒ 絕對朝向從 (牆角＋rot) 掉成 (rot) ⇒ **整個牆角掉了，而且不報錯**。

       🛑 **不要**順手寫 flags.rotUser —— 那個旗標整族已撤（見 snapRot 上方）。
       📌 這是 obs O-34 的實例：同一個狀態轉換有三個入口（拖走／本處／刪房間），

    f.rot = ((p.ang*180/Math.PI) % 360 + 360) % 360;   // 🔴 下-19：保住絕對朝向
