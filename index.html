/* ══════════════════════════════════════════════════════════════
   需求 2｜本機持久化（IndexedDB）
   🔴 DB_VER 升到 2：加 rooms / walls / beams / items 四個 store。
   🔴 R-6：onblocked 沒掛 → Promise 永不 resolve 也永不 reject → 畫面停在「讀取中…」
   ══════════════════════════════════════════════════════════════ */
/* 🔴 v0.13_i 修三：DB_VER 2 → 3（新增 projects store，keyPath 用 code）。
   ⚠️ 升級後第一次打開若另一個分頁還開著舊版本 ⇒ onblocked 會說話（只發生一次）。 */
/* 🔴 v0.22_i §0c R-45（主代理裁定甲）：deco_probe【維持 DB_VER 3，一行不升】。
   理由：v0.1.8.1 開一個版本比現存低的 IndexedDB 會丟 VersionError ⇒ 開過 v0.1.9 的手機就回不去。
   相簿的兩個新 store 放【另一個資料庫】ALBUM_DB_NAME（見下方 openAlbumDB）；
   photos store 的新欄位（origPath／origStatus／albumVer…）不需要升版（IndexedDB 不管欄位）。
   🔴 名稱一律帶 ENV_PREFIX（正式版＝'' ⇒ 仍是 'deco_probe'）。 */
const DB_NAME=ENV_PREFIX+'deco_probe', DB_VER=3;
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{const d=e.target.result;
      ['photos','markers','rooms','walls','beams','items'].forEach(st=>{
        if(!d.objectStoreNames.contains(st)) d.createObjectStore(st,{keyPath:'id'});
      });
      /* 🔴 v0.13_i 修三：projects 的 keyPath 是 code（它沒有 id，也沒有 deleted_at
         ⇒ 不可以套 stampObj／softDelete，走一條專屬的小函式）。 */
      if(!d.objectStoreNames.contains('projects'))
        d.createObjectStore('projects',{keyPath:'code'});
    };
    r.onsuccess=e=>{
      _db=e.target.result;
      /* 另一個分頁要升級時，這一邊要主動讓位，否則那一邊會被 blocked 卡住 */
      _db.onversionchange=()=>{ try{_db.close();}catch(err){} _db=null;
        showDbNotice('資料庫版本被另一個分頁更新了。請重新載入這一頁。'); };
      res(_db);
    };
    r.onerror=e=>rej(e.target.error);
    /* 🔴 這一條不做會【靜默卡死】：另一個分頁還開著舊版本 ⇒ 升級被擋 */
    r.onblocked=()=>rej(new Error(
      '另一個分頁還開著舊版本，資料庫升級被擋住。請把其他分頁關掉再重新載入。'));
  });
}
function showDbNotice(msg){
  S.dataErr=msg;
  try{ render(); }catch(e){}
  /* 🔴 v0.1.9 R-50（🟡-11）：pstat 搬走了 ⇒ 資料庫錯誤改畫在相簿清單頁最上面 */
  S.dbNote=msg;
  try{ renderAlbums(); }catch(e){}
}
/* ╔═ 🔴 v0.22_i §0c R-45｜相簿的資料庫（另一個 IndexedDB）════════════════════════════╗
   兩個 store：albums（相簿）、album_photos（相簿裡的一張；名字／備註／排序各本一份）。
   「照片本身」仍在 deco_probe 的 photos（R-01）。
   ⚠️ 兩個資料庫之間【沒有交易】：一次寫相簿＋照片是兩個請求。寫的順序由呼叫端決定
      （搬家：先相簿 → 再 album_photo → 最後才在照片上蓋 albumVer，中途斷了下次會接著做）。
   onblocked／onversionchange 與 deco_probe 同一套說法（這一個資料庫之後升版時才會用到）。 ╚═╝ */
const ALBUM_DB_NAME=ENV_PREFIX+'deco_album', ALBUM_DB_VER=1;
const ALBUM_STORES=['albums','album_photos'];
let _adb=null;
function openAlbumDB(){
  return new Promise((res,rej)=>{
    if(_adb) return res(_adb);
    const r=indexedDB.open(ALBUM_DB_NAME,ALBUM_DB_VER);
    r.onupgradeneeded=e=>{const d=e.target.result;
      ALBUM_STORES.forEach(st=>{
        if(!d.objectStoreNames.contains(st)) d.createObjectStore(st,{keyPath:'id'});
      });
    };
    r.onsuccess=e=>{
      _adb=e.target.result;
      _adb.onversionchange=()=>{ try{_adb.close();}catch(err){} _adb=null;
        showDbNotice('相簿資料庫版本被另一個分頁更新了。請重新載入這一頁。'); };
      res(_adb);
    };
    r.onerror=e=>rej(e.target.error);
    r.onblocked=()=>rej(new Error(
      '另一個分頁還開著舊版本，相簿資料庫升級被擋住。請把其他分頁關掉再重新載入。'));
  });
}
/* 🔴 tx() 依 store 名稱選資料庫 ⇒ lPut／lGet／lAll／lDel／lPutObj…所有既有低階函式【一行不改】就能用在新 store。 */
function tx(store,mode,fn){
  const open = ALBUM_STORES.includes(store) ? openAlbumDB() : openDB();
  return open.then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store);
    const req=fn(s);
    t.oncomplete=()=>res(req&&req.result);
    t.onerror=()=>rej(t.error);
  }));
}
/* ⚠️ id 必須是【合法 UUID】——雲端的 id 是 uuid 型別，非 UUID 會被拒，
   而錯誤訊息看不出是 id 的問題（研究員 R-5）。🔴 種子資料也一律走這裡。 */
function uid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16));
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
/* ── 本機（IndexedDB）低階：只在資料層內部使用，畫面層不呼叫 ── */
async function lPut(st,rec){ rec.id=rec.id||uid(); await tx(st,'readwrite',s=>s.put(rec)); return rec.id; }
async function lGet(st,id){ return tx(st,'readonly',s=>s.get(id)); }
async function lAll(st){ return tx(st,'readonly',s=>s.getAll()); }
async function lDel(st,id){ return tx(st,'readwrite',s=>s.delete(id)); }

/* ══════════════════════════════════════════════════════════════
   需求 4｜單位換算（_d §3-6b）
     資料庫（IndexedDB ＋ 雲端）→ 公釐、整數
     記憶體與幾何運算            → 公分、浮點
     換算【只發生在資料層邊界】
   🔴 含 anchor 內的 along / off / x / y —— 唯一一個「嵌在 JSON 裡的長度」，最容易漏。
   ══════════════════════════════════════════════════════════════ */
const toMM   = v => (v==null || v==='') ? null : Math.round(Number(v)*10);
const fromMM = v => (v==null) ? null : Number(v)/10;

/* 要換算的長度欄位（逐一列出，不可漏）。
   ❌ 不換算：rot（度）、price（元）、color、name、note、所有布林、所有時間 */
const LEN_FIELDS = {
  rooms:['slabH'],
  walls:['x1','y1','x2','y2','thickness','height'],
  beams:['x1','y1','x2','y2','width','drop'],
  /* 🔴 需求 46：zBase（離地高度）＝ 六處換算的第六處。記憶體欄位名沿用 slabH 的 camelCase。 */
  items:['w','d','h','zBase'],
  /* 🔴 v0.13_i 修三：第五處。floorH 記憶體是公分、雲端 floor_h 是公釐。 */
  projects:['floorH'],
  /* 🔴 v0.22_i R-11：第七處。相簿定位點 locX／locY：記憶體【公分浮點】、IndexedDB 與雲端【公釐整數】。
     ⚠️ 搬家時 markers 的 x／y（公分 double、不經換算）直接指定給 locX／locY（記憶體單位相同），
        「×10」由這裡的 toDb 做 —— 🛑 搬家那一段【不可以】自己再乘 10（會變成 100 倍）。 */
  albums:['locX','locY']
  /* album_photos：沒有長度欄位（sort 是排序值，不是長度） */
};
function anchorToMM(a){
  if(!a) return null;
  /* 🔴 v0.13_i 修四 4-a：這兩個函式不是 Object.assign，是【重建物件】
     ⇒ 沒有列出來的欄位會被安靜吃掉（side 存進記憶體 → 第一次 saveItem → 欄位消失）。
     🔴 side 不是長度，【不可以乘 10】。 */
  if(a.type==='wall') return {type:'wall', wall:a.wall,
    along:toMM(a.along), off:toMM(a.off||0), side:(a.side ?? null)};
  return {type:'free', x:toMM(a.x), y:toMM(a.y)};
}
function anchorFromMM(a){
  if(!a) return {type:'free', x:0, y:0};
  if(a.type==='wall') return {type:'wall', wall:a.wall,
    along:fromMM(a.along)||0, off:fromMM(a.off)||0, side:(a.side ?? null)};
  return {type:'free', x:fromMM(a.x)||0, y:fromMM(a.y)||0};
}
/* 記憶體物件（公分） → IndexedDB 紀錄（公釐整數） */
function toDb(store,obj){
  const o=Object.assign({},obj);
  (LEN_FIELDS[store]||[]).forEach(k=>{ o[k]=toMM(obj[k]); });
  if(store==='items') o.anchor=anchorToMM(obj.anchor);
  /* 🔴 六處換算之三（v0.13_i 修五）：LEN_FIELDS 是【逐欄位純量】換算，吃不下陣列
     ⇒ poly 必須比照 anchorToMM 另外寫一對。 */
  if(store==='rooms') o.poly=polyToMM(obj.poly);
  return o;
}
/* IndexedDB 紀錄（公釐整數） → 記憶體物件（公分浮點） */
function fromDb(store,rec){
  const o=Object.assign({},rec);
  (LEN_FIELDS[store]||[]).forEach(k=>{ o[k]=fromMM(rec[k]); });
  if(store==='items') o.anchor=anchorFromMM(rec.anchor);
  /* 🔴 六處換算之四 —— v0.13_i 修五明寫這是【最容易漏的一格】。
     漏了它，cloudJoin 的認領迴圈（lAllObj → lPutObj 原地來回）每跑一次就差 10 倍。 */
  if(store==='rooms') o.poly=polyFromMM(rec.poly);
  return o;
}
/* 🔴 需求 4｜時區：一律存 ISO（UTC），顯示時才轉本地。
   現況 W1（寫 '2026-09-08 10:30' 無時區）／W2（把 UTC 當本地印）各偏 8 小時。 */
const nowISO = ()=> new Date().toISOString();
function fmtLocal(iso){
  if(!iso) return '';
  const s=String(iso);
  /* ⚠️ 舊紀錄的 addedAt 是無時區字串 → new Date() 會得到 Invalid Date。
     邊界處理：沒有 T 也沒有 Z → 原樣輸出（那是舊紀錄，isLegacy() 已經會標它）。 */
  if(s.indexOf('T')<0 && s.indexOf('Z')<0) return s;
  const d=new Date(s);
  if(isNaN(d.getTime())) return s;
  const z=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} `+
         `${z(d.getHours())}:${z(d.getMinutes())}`;
}

/* ── 物件資料層（與照片線同構）──
   🔴 save* 與 savePhoto() 同一個模式：① 寫本機 ② 標 pending ③ 背景推雲端（失敗不擋畫面）
   🔴 delete* 【不是】。delete* 一律走軟刪除（需求 5 / 6 / 7），
      不可抄照片線的 lDel()。（v0.04_i §6；🗂 v0.1.9 起照片線也不物理刪除了，舊的 deletePhoto 已拿掉） */
async function lAllObj(st){ return (await lAll(st)).map(r=>fromDb(st,r)); }
async function lAllLive(st){ return (await lAllObj(st)).filter(x=>!x.deletedAt); }
async function lGetObj(st,id){ const r=await lGet(st,id); return r? fromDb(st,r) : null; }
async function lPutObj(st,obj){ return lPut(st, toDb(st,obj)); }

function stampObj(o){
  o.id = o.id || uid();
  /* 🔴 需求 36（obs O-19）：只有【還沒歸屬】的才蓋章。
     「認領」只能由 cloudJoin 明確做，不可以靠「順便存檔」偷偷改變一筆資料屬於誰。
     ⚠️ 判斷用 == null（同時涵蓋 null 與 undefined）；不可用 !o.projectCode，
        空字串也會被當成「沒歸屬」而被蓋掉。 */
  if(o.projectCode == null) o.projectCode = CLOUD.code || null;
  o.updatedAt   = nowISO();
  o.appVer      = APP_VER;
  if(o.deletedAt===undefined) o.deletedAt=null;
  /* 🔴 v0.05_i §3（修三）：createdAt 只在【新建】時寫入（見 newObj()），
     這裡【一個字都不准動它】——之後任何更新、pull 覆蓋都要保留。
     🔴 也【不准】在這裡幫舊資料補一個假的 createdAt（obs O-13：偽裝成有資料）。 */
  /* ⚠️ 與 savePhoto 的一點差異（刻意）：物件【會被反覆修改】，
     每次存都要重新標 pending，否則改過的值永遠推不上去（N-59）。 */
  if(CLOUD.code){ o.pending=true; o.synced=false; }
  return o;
}
/* 🔴 v0.05_i §3（修三）：唯一可以寫 createdAt 的地方。
   四種物件（Room/Wall/Beam/Item）新建時都要經過這裡。
   ⚠️ 只有「這一筆真的是現在被造出來的」才准蓋這個章——
      從雲端 pull 回來的那條路不走這裡（它帶著雲端的 created_at，見 fromRow）。 */
function newObj(o){
  o.id = o.id || uid();
  o.createdAt = nowISO();
  return o;
}
async function saveRoom(r){ stampObj(r); await lPutObj('rooms',r);
  if(CLOUD.on) cloudPushObj('rooms',r.id).catch(e=>cloudErr(e)); return r.id; }
async function saveWall(w){ stampObj(w); await lPutObj('walls',w);
  if(CLOUD.on) cloudPushObj('walls',w.id).catch(e=>cloudErr(e)); return w.id; }
async function saveBeam(b){ stampObj(b); await lPutObj('beams',b);
  if(CLOUD.on) cloudPushObj('beams',b.id).catch(e=>cloudErr(e)); return b.id; }
async function saveItem(i){ stampObj(i); await lPutObj('items',i);
  if(CLOUD.on) cloudPushObj('items',i.id).catch(e=>cloudErr(e)); return i.id; }

/* ══════════════════════════════════════════════════════════════
   🔴 v0.1.9｜相簿資料層（_i v0.22 §1、§0b R-04／R-05／R-10／R-11、§0c）
   三層：相簿 album ─ 相簿裡的一張 album_photo（名字／備註／排序，各本一份）─ 照片本身 photo（deco_probe.photos）
   · albums、album_photos 走【物件那一套】：stampObj（歸屬只蓋沒歸屬的、updatedAt、pending）＋ lPutObj（toDb 換算）
   · 三態刪除（R-05）：deletedAt（垃圾桶）／purgedAt（永久刪除，墓碑）／restoredAt（還原表態）＋ batchId
     🔴 照片本身【不加】deletedAt／batchId：「照片在不在垃圾桶」＝它所有 album_photo 是否都在垃圾桶（推算，O-40）
   · 「最近變動時間」不存（R-16）：推算＝max(相簿 updatedAt, 其 album_photo 的 updatedAt)
   ══════════════════════════════════════════════════════════════ */
let ALBUMS  = [];      // 活的相簿（不含垃圾桶與墓碑）
let APHOTOS = [];      // 活的 album_photo（不含垃圾桶與墓碑）
/* 🔴 兩張新表的雲端推送開關。批 2 時是 false（雲端還沒有這兩張表）；
   Ali 2026-09-30 貼完 v0.1.9 SQL、批 3 接上 push／pull ⇒ 打開。 */
const ALBUM_CLOUD = true;
async function saveAlbum(a){ stampObj(a); await lPutObj('albums',a);
  if(CLOUD.on && ALBUM_CLOUD) cloudPushObj('albums',a.id).catch(e=>cloudErr(e)); return a.id; }
async function saveAlbumPhoto(ap){ stampObj(ap); await lPutObj('album_photos',ap);
  if(CLOUD.on && ALBUM_CLOUD) cloudPushObj('album_photos',ap.id).catch(e=>cloudErr(e)); return ap.id; }
/* 最近變動時間（R-16，推算、不存）。ap 含垃圾桶裡的（「從這本拿掉」也算這本有變動）。 */
async function albumRecency(){
  const m=new Map();
  for(const a of await lAllObj('albums')) m.set(a.id, String(a.updatedAt||''));
  for(const ap of await lAllObj('album_photos')){
    const t=String(ap.updatedAt||'');
    if(m.has(ap.albumId) && t > m.get(ap.albumId)) m.set(ap.albumId, t);
  }
  return m;
}

/* ╔═ 🔴 v0.22_i §0b R-10｜推算 id：UUIDv5（RFC 4122 §4.3，SHA-1）═══════════════════════╗
   兩台同時搬家、或搬到一半斷掉重來，都會推出【同一個】相簿 id 與 album_photo id
   ⇒ 只會寫到同一列，不會變兩本（相-03 的反面）。
   🔴 命名空間常數【寫死、永不改】：改了等於換一套 id，已搬過的會再搬一次。
   🔴 結果一定是合法 UUID（雲端 id 是 uuid 型別，3355 註解）。
   ⚠️ crypto.subtle 只在安全來源可用（https／localhost）；GitHub Pages 是 https。
      不可用時丟一個講得出原因的錯（不安靜）。 ╚═══════════════════════════════════════╝ */
const ALBUM_ID_NS = '6f1b3c2e-8d4a-4e7b-9c15-2a7e0d9b4f63';
function _uuidBytes(u){ const h=String(u).replace(/-/g,''); const b=new Uint8Array(16);
  for(let i=0;i<16;i++) b[i]=parseInt(h.substr(i*2,2),16); return b; }
function _uuidStr(b){ const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`; }
async function uuidv5(name, ns){
  if(!(window.crypto && crypto.subtle && crypto.subtle.digest))
    throw new Error('這個瀏覽器環境不能計算相簿編號（需要安全連線 https），舊照片沒有整理成相簿。');
  const nsb=_uuidBytes(ns||ALBUM_ID_NS), nb=new TextEncoder().encode(String(name));
  const buf=new Uint8Array(nsb.length+nb.length); buf.set(nsb,0); buf.set(nb,nsb.length);
  const hash=new Uint8Array(await crypto.subtle.digest('SHA-1', buf));
  const b=hash.slice(0,16);
  b[6]=(b[6]&0x0f)|0x50;          // version 5
  b[8]=(b[8]&0x3f)|0x80;          // variant RFC 4122
  return _uuidStr(b);
}
const albumIdOf      = photoId => uuidv5('album:'+photoId);
const albumPhotoIdOf = photoId => uuidv5('ap:'+photoId);

/* ╔═ 🔴 v0.22_i §0b-5 F-1 ＋ §0c R-50（🟡-5）｜舊照片的名字「像不像檔名」═══════════════╗
   Ali 09-29 同意：改過名的沿用；檔名樣子的 ⇒ 相簿名改成「新相簿(N)」。
   判定（寫死，不要各猜）：空字串、'(無檔名)'（intake 5148 的預設值）、或以圖片副檔名結尾。
   （改過名的照片不會帶副檔名 —— 改名框不預填副檔名以外的東西，她打的是字。）
   ⚠️ 只決定【相簿名】；那一筆 album_photo 的名字一律照搬照片原名（§2 第一點）。 ╚═══════╝ */
const FILE_NAME_RE = /\.(jpe?g|png|heic|heif|webp|gif)$/i;
function looksLikeFileName(n){
  const s=String(n==null?'':n).trim();
  return s==='' || s==='(無檔名)' || FILE_NAME_RE.test(s);
}
/* 「新相簿(N)」：N ＝ 目前最大號＋1，🔴 數【全部】相簿（含垃圾桶與墓碑）⇒ 還原後不撞名（R-50 🟡-3）。 */
const NEW_ALBUM_RE = /^新相簿\((\d+)\)$/;
function maxNewAlbumNo(all){
  let n=0; for(const a of all){ const m=NEW_ALBUM_RE.exec(String(a.name||'')); if(m) n=Math.max(n, +m[1]); }
  return n;
}

/* ╔═ 🔴🔴 v0.22_i §2 ＋ §0b R-10 ＋ §0c（🔴-6、🟠-1、🟠-2）｜搬家：舊照片 ⇒ 一本相簿一張 ══════╗
   掛點：loadAll（開 App；未連線與已連線都經過，pull 之後）＋ 批 3 起 cloudPull 結尾（手動同步）。
   【可重複執行】是唯一的保護（舊版 v0.1.8.1 不讀版本號、搬完之後還可能再新增照片，相-03）：
     判準　照片 projectCode === 目前專案（未連線＝null）      ← 🟠-1：別的專案的孤兒不碰
           且 albumVer 為空（0＝已由舊版搬來、1＝v0.1.9 上傳）← 🟠-2：主判準
           且 本機沒有任何 album_photo（含垃圾桶）指向它    ← 輔助：搬到一半斷掉的那一張
     🔴 直接讀 IndexedDB（lAll），【不讀 MARKERS 變數】—— 開 App 時 loadMarkers 在 pull 之前（A-13）
   每一張做三件，順序寫死（斷在任何一步，下次都接得上，而且推出同一組 id）：
     ① 相簿（id＝UUIDv5('album:'+photoId)）：名字＝照片原名，像檔名 ⇒ 新相簿(N)；
        定位點＝那張照片最新的 marker（x／y 公分 ⇒ locX／locY，×10 由 toDb 做），沒有 ⇒ 未定位
     ② album_photo（id＝UUIDv5('ap:'+photoId)）：名字＝照片原名、備註空、sort＝1
     ③ 照片蓋 albumVer＝0（savePhoto：本機存、標 pending）
   🛑 不碰：orig_status（null＝舊照片、從來沒有原檔；不寫 'none'）、shot_at（讀時推算）、
          photos.name（凍結，舊版在讀）、markers（只讀不寫不刪，保留當備份）。 ╚═══════════════╝ */
S.migrate = null;                        // {done, total}：畫面顯示「正在整理舊照片（N / M）」
let _migrating = false;
async function migrateOldPhotos(){
  if(_migrating) return 0;
  _migrating = true;
  let made = 0;
  try{
    const scope   = CLOUD.code || null;
    const photos  = await lAll('photos');
    const aps     = await lAllObj('album_photos');
    const albums  = await lAllObj('albums');
    const markers = await lAll('markers');
    const hasAp   = new Set(aps.map(x=>x.photoId));
    const apIds   = new Set(aps.map(x=>x.id));
    const inScope = photos.filter(p => (p.projectCode ?? null) === scope && p.albumVer == null);
    /* 🔴 自驗抓到的缺口：斷在 ② 之後（album_photo 寫了、照片還沒蓋章）⇒ 下次因為「已有 album_photo」被跳過，
       而 albumVer 永遠是空的（🟠-2 那道保護就少了這一張）。
       ⇒ 若它的 album_photo 正是搬家推算出來的那一個 id，只補蓋章（不重建任何東西）。 */
    for(const p of inScope){
      if(!hasAp.has(p.id)) continue;
      if(apIds.has(await albumPhotoIdOf(p.id))){ p.albumVer = 0; await savePhoto(p); }
    }
    const todo = inScope.filter(p => !hasAp.has(p.id));
    if(!todo.length) return 0;
    /* 名次要穩定：依加入時間、再依 id ⇒ 同一批舊照片在任何一台排出同樣的「新相簿(N)」順序 */
    todo.sort((a,b)=>String(a.addedAt||'').localeCompare(String(b.addedAt||''))
                   || String(a.id).localeCompare(String(b.id)));
    let nextNo = maxNewAlbumNo(albums);
    const albumById = new Map(albums.map(a=>[a.id,a]));
    S.migrate = {done:0, total:todo.length}; onMigrateProgress();
    for(const p of todo){
      const aid  = await albumIdOf(p.id);
      const apid = await albumPhotoIdOf(p.id);
      /* ① 相簿（搬到一半斷掉時可能已經有了 ⇒ 沿用，不改它的名字與位置） */
      if(!albumById.has(aid)){
        /* 同一張照片可能有多個 marker（兩台各標過）⇒ 取 updatedAt 最新；一樣新就取 id 大的（穩定） */
        const mk = markers.filter(m=>m.photoId===p.id)
          .sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))
                    || String(b.id).localeCompare(String(a.id)))[0];
        const name = looksLikeFileName(p.name) ? `新相簿(${++nextNo})` : String(p.name).trim();
        const a = newObj({ id:aid, name,
          locX: (mk && isFinite(mk.x)) ? Number(mk.x) : null,     // 🔴 公分；×10 在 toDb
          locY: (mk && isFinite(mk.y)) ? Number(mk.y) : null,
          projectCode: p.projectCode ?? null,                     // 🔴 歸屬跟著照片（不靠 stampObj 補）
          deletedAt:null, batchId:null, restoredAt:null, purgedAt:null });
        await saveAlbum(a);
        albumById.set(aid, a);
      }
      /* ② album_photo */
      const ap = newObj({ id:apid, albumId:aid, photoId:p.id,
        name: p.name==null ? '' : String(p.name), note:'', sort:1,
        projectCode: p.projectCode ?? null,
        deletedAt:null, batchId:null, restoredAt:null, purgedAt:null });
      await saveAlbumPhoto(ap);
      /* ③ 最後才蓋章（前兩步沒成功，下次會再來一次） */
      p.albumVer = 0;
      await savePhoto(p);
      made++;
      S.migrate.done++; onMigrateProgress();
    }
  }catch(e){
    /* _i §2 🔍：搬家失敗沿用同步錯誤的顯示（cloudErr）；已搬完的那幾張不會重來（有 albumVer） */
    cloudErr(new Error('整理舊照片時失敗（已整理的不受影響，下次開啟會接著做）：'+((e&&e.message)||e)));
  }finally{
    _migrating = false;
    S.migrate = null; onMigrateProgress();
  }
  return made;
}
/* 搬家進度：畫在相簿清單頁最上面（albNotes 裡的 #albMig）。 */
function onMigrateProgress(){
  const b=$('albMig'); if(!b) return;           // 🔴 v0.1.9 批 5：畫在相簿清單頁最上面（albNotes）
  b.hidden=!S.migrate;
  b.textContent = S.migrate ? `正在整理舊照片（${S.migrate.done} / ${S.migrate.total}）` : '';
}

/* ══════════════════════════════════════════════════════════════
   🔴 v0.12_i 需求 44 ＋ v0.13_i 修三｜projects 的資料層（專屬小函式）
   ⚠️ projects 沒有 id、沒有 deleted_at、沒有 pending/synced
      ⇒ 【不要】套 stampObj／softDelete／cloudPushObj，那三個都假設有 id 與墓碑。
   🔴 本批明確【不含】pull —— cloudPullObjects 的 store 清單一個字不改。
      ⇒ 代價：兩台之間樓高與專案名字不會自動同步。這是刻意的取捨（形狀套不進既有迴圈），
        已列進交付必講清單 ⑧。
   ══════════════════════════════════════════════════════════════ */
/* 未連線時也要存得住 ⇒ 用一個不會與任何真實代碼衝突的本機鍵。
   ⚠️ A 類歧義：_i 沒有寫「還沒連線時這一列的 key 是什麼」，這裡取保守解（只存這台）。 */
const LOCAL_PROJ_KEY='_local';
const projKey = ()=> CLOUD.code || LOCAL_PROJ_KEY;
async function lGetProject(code){
  const rec=await tx('projects','readonly',s=>s.get(code));
  return rec ? fromDb('projects',rec) : null;
}
async function lPutProject(p){
  await tx('projects','readwrite',s=>s.put(toDb('projects',p)));
}
/* 雲端那一列（只有一列，key 是 code）。pull 與 push 的守衛都要讀它。 */
async function cloudFetchProjectRow(){
  const r=await sbFetch('/rest/v1/projects?select=*&code=eq.'+encodeURIComponent(CLOUD.code));
  if(!r.ok) throw new Error('讀雲端 projects 失敗：'+(await r.text()).slice(0,200));
  const rows=await r.json();
  return (Array.isArray(rows) && rows[0]) ? rows[0] : null;
}
/* ╔═ 🔴 v0.17_i 修八 ②③｜送出前先【真的比對】，而且 null 不送 ════════════════════╗
   舊版：整列 upsert，updated_at 只是【寫進去】，從來沒有拿來比對
   ⇒ 手機沒有樓高 → 在手機只改專案名字 → 整列推上去、floor_h 寫成 null
     → 把電腦填的樓高蓋掉，而畫面同時顯示「✅ 已存」。
   🔴 ③ floor_h 為 null 時【不要送這個欄位】——與 v0.13_i 修二的 poly 是同一個形狀
      （polyToMM(undefined) 回 null ⇒ 把雲端洗掉）。同一個坑，不要再踩第二次。 ╚═══════╝ */
async function cloudPushProject(){
  if(!CLOUD.on || !CLOUD.code) return;
  const cloudRow = await cloudFetchProjectRow();
  const mine   = PROJECT.updatedAt ? new Date(PROJECT.updatedAt).getTime() : NaN;
  const theirs = (cloudRow && cloudRow.updated_at) ? new Date(cloudRow.updated_at).getTime() : NaN;
  /* ╔═ 🔴 v0.20_i §4-1a ③｜樓高有【自己的時間戳】，與整列的 updated_at 分開比 ═══════╗
     🔴🔴 **方向一寫反就是「資料被刪、而畫面說『✅ 一致』」**（本批最危險的位置之一）：
        曾經寫成　`!isFinite(hTheirs) || (isFinite(hMine) && hMine > hTheirs)`
        ⚠️ 貼完 SQL 的當下，雲端 floor_h_updated_at 對【所有既有專案】都是 NULL
           ⇒ `!isFinite(hTheirs)` 恆成立 ⇒ pushH 恆為 true ⇒ **兩台都推、誰後同步誰贏**
           ⇒ 🔴 B 從來沒動過樓高，也會送 `floor_h:null` **蓋掉 A 的 280**
           ⇒ N-534 必敗，而且它與 §4-1b「沒時間戳＝當成最舊」**直接打架**
             （pull 側做對了，push 側做反了）。
     ✅ 正解一句話：**這台自己沒有動過樓高，就永遠不推。** ╚═══════════════════════════╝ */
  const hMine   = PROJECT.floorHUpdatedAt ? new Date(PROJECT.floorHUpdatedAt).getTime() : NaN;
  const hTheirs = (cloudRow && cloudRow.floor_h_updated_at)
                    ? new Date(cloudRow.floor_h_updated_at).getTime() : NaN;
  const pushH = isFinite(hMine) && (!isFinite(hTheirs) || hMine > hTheirs);
  /* ╔═ 🔴🔴 外層那個守衛原本是 `return`，不是「跳過 name」（前刀 A-11）═══════════════╗
     情境：A 改了名字（雲端 updated_at 變新）→ B 先前清掉樓高但還沒推
     ⇒ B 的 `mine <= theirs` 成立 ⇒ **整支函式 return**
     ⇒ **樓高的清空永遠推不上去**，而畫面說「✅ 已存」。
     ✅ 改成旗標，不要 return —— 名字與樓高各自決定要不要送。
     🔑 這裡正好用得上 §4-2a 查證過的 PostgREST 事實：**payload 沒帶的欄位不會被動**
        ⇒「只送要改的那幾欄」是安全的。 ╚════════════════════════════════════════════╝ */
  const pushRow = !(cloudRow && isFinite(mine) && isFinite(theirs) && mine <= theirs);
  const row = { code: CLOUD.code };
  if(pushRow){
    row.name = PROJECT.name||null;
    row.updated_at = PROJECT.updatedAt || nowISO();
  }
  if(pushH){
    /* 🔴 含 null —— 「她把樓高清掉了」這件事**必須傳播**（§4-1c ②）。
       ⚠️ 這與 v0.17_i 修八「null 不送」相反，是【刻意的行為改變】，已列進交付必講 ⑨。
          之所以現在敢送 null，是因為有了 floor_h_updated_at 能分辨
          「她清掉了」與「這台根本沒填過」—— 修八當時沒有這個分辨能力。 */
    row.floor_h = PROJECT.floorH == null ? null : toMM(PROJECT.floorH);
    row.floor_h_updated_at = PROJECT.floorHUpdatedAt;
  }
  if(Object.keys(row).length === 1) return;   // 🔴 只剩 code ⇒ 沒事要送
  const r=await sbFetch('/rest/v1/projects?on_conflict=code',{method:'POST',
    headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify(row)});
  if(!r.ok) throw new Error('寫入雲端 projects 失敗：'+(await r.text()).slice(0,200));
}
/* ╔═ 🔴 v0.17_i 修八 ① ＋ §0-6 A-1｜projects 走【自己的一支】，不進 cloudPullObjects ══╗
   🔴 為什麼不可以加進那個迴圈（前刀查碼、冷讀刀複驗）：
     · fromRow 的結構是 rooms→walls→beams→【否則落到 items】（最後一個 return 沒有守衛）
       ⇒ 傳 'projects' 進去，回來的是一個 items 形狀的物件，floor_h 沒有人讀
     · lmap = new Map(local.map(x=>[x.id,x]))，而 projects 的 keyPath 是 code、每一列沒有 id
       ⇒ 全部 key 是 undefined ⇒ 互相蓋掉
     · lPutObj → lPut 第一行 rec.id = rec.id || uid() ⇒ 往 keyPath='code' 的 store
       塞一個只有 id 沒有 code 的物件
   ⇒ 症狀：按〔🔄 同步〕沒有任何錯誤訊息，專案那一列被寫成垃圾
     ⇒ 下一次 loadProject() 讀回來 floorH 是 null ⇒ 設定頁變「（未填）」，
       而畫面同時顯示「✅ 同步完成　雲端與這台一致」
     ＝ **修八自己要修的那個症狀，被修八本身重新造出來一次**（O-20）。
   🔴 所以這一支：自己打 API、自己做欄位對應、不走 fromRow、不用 lPutObj／stampObj／softDelete。╚═╝ */
async function cloudPullProject(){
  if(!CLOUD.on || !CLOUD.code) return;
  syncStep('專案設定…');
  const row=await cloudFetchProjectRow();
  if(!row) return;                                  // 雲端還沒有這一列 ⇒ 沒事可拉
  const local=await lGetProject(CLOUD.code);
  const theirs = row.updated_at ? new Date(row.updated_at).getTime() : NaN;
  const mine   = (local && local.updatedAt) ? new Date(local.updatedAt).getTime() : NaN;
  /* ╔═ 🔴 v0.20_i §4-1a ④｜先算【樓高那一組】，再算【整列那一組】═════════════════╗
     舊版是整列比一次 updated_at，theirs <= mine 就整支 return
     ⇒ 樓高沒有自己的發言權，只能跟著名字的時間戳走。
     ✅ 拆成兩組之後，「只改名字」與「清掉樓高」才不會互相綁架。
     🔴 §4-1b 邊界：雲端沒有 floor_h_updated_at ⇒ **當成最舊，不覆蓋**
        （沿用碼 3587「雲端沒時間戳 → 當最舊」的既有規則，🔴 不新發明；
          而且這正是 push 側 pushH 的鏡像 —— 兩邊必須同向，否則就是 N-534 那個坑）。
     🛑 **不要**幫舊資料補一個假的 floor_h_updated_at（obs O-13）。 ╚═══════════════╝ */
  const hTheirs = row.floor_h_updated_at ? new Date(row.floor_h_updated_at).getTime() : NaN;
  const hMine   = (local && local.floorHUpdatedAt) ? new Date(local.floorHUpdatedAt).getTime() : NaN;
  const takeH   = isFinite(hTheirs) && (!isFinite(hMine) || hTheirs > hMine);
  const takeRow = !(isFinite(mine) && isFinite(theirs) && theirs <= mine);  // 名字：整列級（沿用現況）
  if(!takeH && !takeRow) return;
  const merged={
    code: CLOUD.code,
    name: takeRow ? (row.name==null ? (local? local.name : '') : row.name)
                  : (local? local.name : ''),
    /* 🔴 takeH 為 true 時，**row.floor_h 是 null 也要收** ——
       那就是「她在另一台把樓高清掉了」，必須傳播（§4-1c ②）。
       ⚠️ 這與舊版「雲端 null 就不收」相反，而之所以現在敢收，
          是因為 takeH 已經先用時間戳確認過「那個 null 是有人主動清的」。 */
    floorH: takeH ? (row.floor_h==null ? null : fromMM(row.floor_h))
                  : (local ? local.floorH : null),
    floorHUpdatedAt: takeH ? row.floor_h_updated_at : (local ? local.floorHUpdatedAt : null),
    updatedAt: takeRow ? (row.updated_at || nowISO()) : (local ? local.updatedAt : nowISO())
  };
  await lPutProject(merged);
  PROJECT = merged;                                 // 記憶體也要跟上（O-24：兩層都要看）
}
async function loadProject(){
  try{
    const p=await lGetProject(projKey());
    /* 🔴 丙-5：這是【重建一個新的物件字面值】，不是 Object.assign
       ⇒ 沒有列出來的欄位會被安靜吃掉。而 loadProject() 被 reloadObjects() 最後一行
         無條件呼叫（boot／每次同步／每次擺上圖／每次刪房間都會跑）
       ⇒ 漏了 updatedAt 的話它永遠是 undefined，A-2 修的那個坑原封不動回來。
       🔴 兩個分支都要有 updatedAt。（同形前例：anchorToMM/anchorFromMM 的註解。） */
    /* 🔴 v0.20_i §4-1a ①：floorHUpdatedAt 是本批新增的欄位，
       而這裡是【重建物件字面值】⇒ **三個分支都要列到它**，漏一個就被安靜吃掉。 */
    PROJECT = p ? {code:p.code, name:p.name||'', floorH:(p.floorH==null?null:p.floorH),
                   updatedAt:(p.updatedAt||null),
                   floorHUpdatedAt:(p.floorHUpdatedAt||null)}
                : {code:projKey(), name:'', floorH:null, updatedAt:null, floorHUpdatedAt:null};
  }catch(e){ PROJECT={code:projKey(), name:'', floorH:null, updatedAt:null, floorHUpdatedAt:null}; }
}

/* delete*：🔴 軟刪除（進垃圾桶），不是 lDel
   🔴 v0.1.9 R-05：一次刪除＝同一個 batchId（垃圾桶一行）。沒給就自己開一個（單筆刪除＝一行）。 */
async function softDelete(store, arr, id, saver, batchId){
  const o=arr.find(x=>x.id===id) || await lGetObj(store,id);
  if(!o) return;
  o.deletedAt=nowISO();
  o.batchId=batchId||uid();
  await saver(o);
}
async function deleteRoom(id, batchId){ return softDelete('rooms',ROOMS,id,saveRoom,batchId); }
async function deleteWall(id){ return softDelete('walls',WALLS,id,saveWall); }
async function deleteBeam(id){ return softDelete('beams',BEAMS,id,saveBeam); }
async function deleteItem(id){ return softDelete('items',FURN,id,saveItem); }

/* ── 需求 4／15｜啟動時一次載入 ──
   🔴 順序寫死（v0.04_i §1）：
      lAll × 四個 store → pull（若已連線）→ seedIfEmpty → purgeTrash
      ⚠️ pull 失敗（丟錯）→ 【不要】跑 seedIfEmpty，讓使用者看到錯誤訊息。
         理由：pull 失敗時「本機全空」不代表「這個專案是空的」。 */
async function reloadObjects(){
  ROOMS_ALL = await lAllObj('rooms');      // 🔴 含墓碑，給 roomOrder() 用（v0.05_i §3 / N-93）
  ROOMS = await lAllLive('rooms');
  WALLS = await lAllLive('walls');
  BEAMS = await lAllLive('beams');
  FURN  = await lAllLive('items');
  /* 🔴 v0.1.9：相簿兩層也在這裡載入（活的：不含垃圾桶，也不含永久刪除的墓碑）。 */
  ALBUMS  = (await lAllObj('albums')).filter(x=>!x.deletedAt && !x.purgedAt);
  APHOTOS = (await lAllObj('album_photos')).filter(x=>!x.deletedAt && !x.purgedAt);
  PHOTOS  = new Map((await lAll('photos')).map(p=>[p.id,p]));   // 照片本身（相簿畫面與放大畫面讀這裡）
  /* 🔴 需求 41 邊界 ＋ v0.13_i 修七 F-29：poly 少於 3 點或格式壞掉 → 不畫，但【不可靜默】。
     ⚠️ 放在這裡重算（而不是畫的時候寫），是為了讓它跟著資料走、
        而且不會被「同步成功就清空」那條路清掉（那是 S.dataErr 的行為）。
     邊界：poly 為 null ＝ 正常情況（種子／手建的房間），不是錯誤，不報。 */
  const bad=ROOMS.filter(r=>r.poly!=null && !validPoly(r.poly)).map(r=>r.name||'未命名');
  S.geomErr = bad.length
    ? `有 ${bad.length} 間房的分區形狀讀不出來（${bad.slice(0,3).join('、')}${bad.length>3?'…':''}），那幾塊不會畫出來。`
    : '';
  /* 🔴 修九邊界：beamFocus 指到的樑被刪掉 ⇒ 清掉，不炸。 */
  if(S.beamFocus && !BEAMS.some(b=>b.id===S.beamFocus)) S.beamFocus=null;
  await loadProject();
}
async function loadAll(){
  await reloadObjects();
  let pulled=false;
  if(CLOUD.on){
    await cloudPull();            // 丟錯 → 由呼叫端接，且不會走到 seed
    await reloadObjects();
    pulled=true;
  }
  if(!CLOUD.on || pulled) await seedIfEmpty();
  /* 🔴 v0.1.9 §2 搬家（R-10）：連線時已在 cloudPull 結尾跑過（手動同步也經過）；
     這裡只負責【未連線】那條路。可重複執行；失敗只寫 cloudErr、不擋開 App。 */
  if(!CLOUD.on) await migrateOldPhotos();
  await purgeTrash();
  await reloadObjects();
}

/* ══════════════════════════════════════════════════════════════
   需求 5｜種子範例、兩種清空、垃圾桶
   ══════════════════════════════════════════════════════════════ */
const SEED_ROOM_NAME='範例房間（可刪）';
/* 🔴 v0.09_i 需求 28：判準是【有沒有存活的房間】，不是「四種物件全空」。
   ⚠️ 舊判準造出一條【出不去的狀態】（Ali 兩台真機踩到、claude 本機重現）：
        清清單 → 建一筆家具 → 重新載入 → rooms:0, furn:1 ⇒ 種子【不生】
        而 v0.1.4 刻意沒有「新增房間」UI ⇒ 沒有房間、也沒有任何辦法生一個出來
   ⇒ 種子的目的就是「給一個可以放東西的房間」；家具存不存在與這個目的無關，
     卻會把它鎖死 ⇒ 判準只看房間。
   ⚠️ ROOMS 已經是【存活】的（lAllLive 過濾掉 deletedAt）。
   邊界：有房間但沒有牆 → 不生（房間在就不生，牆的有無不是種子的判準）。 */
async function seedIfEmpty(){
  if(ROOMS.length) return;
  const rid=uid();
  const room=newObj({ id:rid, name:SEED_ROOM_NAME, slabH:300, note:'',
    projectCode:CLOUD.code||null, synced:false, pending:false,
    appVer:APP_VER, deletedAt:null });
  await saveRoom(room);
  // 矩形 400×300 公分（＝4000×3000 公釐）、state='proposed'、isBoundary=true、thickness=10cm
  const P=[[0,0],[400,0],[400,300],[0,300]];
  for(let i=0;i<4;i++){
    const a=P[i], b=P[(i+1)%4];
    await saveWall(newObj({ id:uid(), room:rid, x1:a[0],y1:a[1],x2:b[0],y2:b[1],
      /* 🔴 v0.05_i §1（修一）：種子牆是 state:'proposed'，不是 'existing'。
         _d §4-2c：existing ＝ 後台匯入、前台唯讀；種子是【前台自己造的】
         ⇒ 它在定義上就不可能是 existing。
         ⚠️ 寫 'existing' 的後果（建造者實測推出來的）：需求 3 的 insert 政策
            with check (… and state='proposed') 會回 42501 ⇒ 四道牆永遠 pending
            ⇒「有 N 筆未上傳」永遠不歸零。 */
      thickness:10, height:null, isBoundary:true, state:'proposed',
      total:null, note:'', isPlaced:true, isBudgeted:false,
      projectCode:CLOUD.code||null, synced:false, pending:false,
      appVer:APP_VER, deletedAt:null }));
  }
  // 🔴 家具 ×0（零件）。要試就自己建一件——那正是本輪的功能。
  await reloadObjects();
}
/* 種子還沒被動過？（提示句只留到使用者建了第一件東西為止） */
function isSeedPristine(){
  return FURN.length===0 && ROOMS.length===1 && ROOMS[0].name===SEED_ROOM_NAME;
}

/* 甲｜清擺設：什麼都不刪，只把所有 Item 的 isPlaced 設成 false。
   🔴 anchor 保留！只是不擺（它記得上次擺哪，切回來就回原位）。
   ⚠️ 逐筆更新、逐筆標 pending，不做交易（探針階段）。 */
async function clearPlacement(){
  for(const f of FURN.slice()){ f.isPlaced=false; await saveItem(f); }
  await reloadObjects();
}
/* ══ 🔴 v0.12_i 需求 47 ＋ v0.13_i 修六｜清清單不准動【房子本身】══
   判準是「這一筆是不是房子本身（＝匯入來的）」，🔴【不是 state】。
   ⚠️ 用 state 的後果：匯入的 33 道裡有 5 道是 proposed（她 SVG 裡的隔間牆）
      ⇒ 不會被跳過 ⇒ 被軟刪 ⇒ 而 RLS 允許改 proposed ⇒【沒有任何錯誤訊息】
      ⇒ 而舊的 N-198 只檢查「28 道 existing 還在」⇒ 綠燈通過，五分之一的房子已經不見了。
   🔴 這條依賴「poly 有補進本機」（v0.13_i 修二）：若 poly 沒下來，isHouseRoom 全 false
      ⇒ 10 間真實房間會被全部軟刪，而 rooms 的 RLS 不會擋。兩條要一起看。
      ⇒ 防線＝確認框先把「保留 X 間房」講出來（v0.14_i 補七 N-10b，obs O-18 規則①）。 */
/* 牆：匯入的 room_id 一律 NULL。
   ⚠️ v0.14_i 補七 N-10a：加一層便宜保險 `|| state==='existing'`，成本一個 ||，
      同時擋住 D1-8 的原始 42501 路徑（對 existing 牆送 UPDATE 會被 RLS 拒 28 次）。 */
const isHouse     = w => (w && (w.room == null || w.state === 'existing'));
/* 房間：有 poly ＝ 從 SVG 匯入的真實分區，不是她擺的東西。 */
const isHouseRoom = r => (r && validPoly(r.poly));
/* 樑：全部都是匯入的 ⇒ clearAll 一律跳過。 */

/* 乙｜清清單：只清【她擺的東西】；房子（既有牆、樑、有 poly 的分區）留著。
   🔴 留什麼：photos / markers 【完全不動】（照片不屬於清單）。 */
async function clearAll(){
  const batch=uid();                 // 🔴 v0.1.9 R-05：清清單一次＝垃圾桶一行（🟡-12：出現在它含有的每個篩選底下）
  for(const r of ROOMS.slice()){ if(isHouseRoom(r)) continue; r.deletedAt=nowISO(); r.batchId=batch; await saveRoom(r); }
  for(const w of WALLS.slice()){ if(isHouse(w))     continue; w.deletedAt=nowISO(); w.batchId=batch; await saveWall(w); }
  /* 🔴 樑跟既有牆同性質（房子本身）⇒ 一根都不刪。 */
  for(const f of FURN.slice()) { f.deletedAt=nowISO(); f.batchId=batch; await saveItem(f); }
  await reloadObjects();
  /* 🔴 v0.09_i 需求 29：立刻重生種子，不要等下一次重新載入。
     若清完之後畫面上 0 個房間，而重生只發生在下一次載入
     則使用者處在一個「什麼都做不了」的狀態，而且畫面不說為什麼。
     ⚠️ v0.02_i 需求 5 本來就明訂「清空 → 種子會回來」
        ⇒ 這只是把「回來」的時機從【下次載入】提前到【當下】，不是新行為。
     ⚠️ 不要加「範例房間已重新產生」這種說明句（_d §10-0b）——她看得到它出現在畫面上。 */
  await seedIfEmpty();
}
/* 🗂 v0.1.9 批 7（R-18）：舊的 purgeTrash（「超過 20 筆刪最舊」＋「1 個月」、只刪本機）與 trashSize（數四個 store 的筆數）
   整段改寫 ⇒ 移到「批 7｜垃圾桶頁＋永久刪除」那一段（183 天、拿掉 20 筆、六張表、連線中寫 purged_at、離線只清本機）。 */

/* ══════════════════════════════════════════════════════════════
   需求 6｜房間：改名／刪除（含 anchor 重設）
   ══════════════════════════════════════════════════════════════ */
/* ╔═ 🔴 v0.19_i §下-9｜房間備註頁 ═════════════════════════════════════════════╗
   🔑 資料層【早就備好而且沒人用】：rooms.note 在 toRow／fromRow 都在，
      會推雲端也會拉回來 ⇒ 不用改 SQL、不用改同步。
   🛑 不用 askDialog 當本體：.dlg 是 max-height:80vh，輸入區加標題與按鈕列
      在所有手機都會把按鈕擠到捲動線以下。 */
let _noteRid=null, _noteOrig='';
/* ╔═ 🔴 v0.21_i §5b 下-27｜備註頁：鍵盤開著時〔取消〕〔完成〕不可以被推出畫面 ═══════════════╗
   Ali 真機（N-541）：「有鍵盤的情況下，如果一直增加，會被推到畫面看不到的位置。」
   🔑 不是瀏覽器的上限，可以修。根因（obs O-32 同族）：
      手機跳出鍵盤時，瀏覽器【不縮】整個版面，只縮「看得見的那一塊」（visual viewport）。
      而備註頁是 `position:fixed; inset:0` ＝ 高度仍是整個畫面
      ⇒ 打字時瀏覽器為了讓游標看得見，把看得見的那一塊往下捲 ⇒ 釘在最上面的按鈕被捲出去。
   ✅ 修法（Ali 同意：**只在備註頁生效**）：備註頁打開時追著 visualViewport，
      把 .notepage 的 top／height 設成「鍵盤上方看得見的那一塊」⇒ 按鈕在最上面、備註在框內捲。
   🛑🛑 **不動 <meta viewport>**（不用 interactive-widget=resizes-content）——
      Ali：「不改全域設定（之前 debug 撞爛很麻煩）」；那會讓所有 fixed 元素（含 .sel 家具面板）
      在鍵盤開著時一起跳位置，改掉 N-527 剛通過的行為。
   🔴 四個前提（讀坑 ⚠️14）：
      ① 關閉時的善後寫在 closeRoomNote 的【最前面】—— 它第二行有 `if(!rid) return;`
      ② 監聽在 focus（叫出鍵盤）之前就掛上，並在打開當下先套一次
      ③ visualViewport 在【手指縮放】時也會發 resize ⇒ 只在 scale≈1 時套用
      ④ 「只在手機上作用」寫成一個具名判準（noteFitsVisualViewport），
         §6b 之後做電腦版的寬螢幕版型（例如側欄）時，**只改這一處**，不要讓它把側欄拉成滿高。
   📌 obs O-40：這裡新增了一個狀態 `_noteVVOn` ⇒ 同一刻寫出誰把它清掉：**只有 noteVVDetach()**，
      而 noteVVDetach 只有一個呼叫點（closeRoomNote 最前面）。 ╚══════════════════════════════╝ */
function noteFitsVisualViewport(){                     // ④ 具名判準（function 宣告，測試時可覆寫）
  return !!window.visualViewport && !!window.matchMedia && matchMedia('(pointer:coarse)').matches;
}
let _noteVVOn=false;
function noteFitVV(){
  const vv=window.visualViewport, p=$('notePage'); if(!vv||!p) return;
  if(Math.abs((vv.scale||1)-1) > 0.01) return;         // ③ 手指縮放中：不追
  p.style.top    = vv.offsetTop+'px';
  p.style.height = vv.height+'px';
  p.style.bottom = 'auto';                              // inset:0 的 bottom 讓給 height
}
function noteVVAttach(){
  if(_noteVVOn || !noteFitsVisualViewport()) return;
  window.visualViewport.addEventListener('resize', noteFitVV);
  window.visualViewport.addEventListener('scroll', noteFitVV);
  _noteVVOn=true;
  noteFitVV();                                          // ② 打開當下先套一次
}
function noteVVDetach(){
  if(_noteVVOn && window.visualViewport){
    window.visualViewport.removeEventListener('resize', noteFitVV);
    window.visualViewport.removeEventListener('scroll', noteFitVV);
  }
  _noteVVOn=false;
  const p=$('notePage');
  if(p){ p.style.top=''; p.style.height=''; p.style.bottom=''; }   // 清乾淨 ⇒ 回到 inset:0
}
function openRoomNote(rid){
  const r=ROOMS.find(x=>x.id===rid); if(!r) return;
  _noteRid=rid; _noteOrig=r.note||'';
  $('npTitle').textContent=`🏷️ ${r.name||'未命名'}　備註`;
  $('npText').value=_noteOrig;
  $('notePage').hidden=false;
  noteVVAttach();                                       // 🔴 下-27 ②：在 focus（叫出鍵盤）之前
  setTimeout(()=>$('npText').focus(),30);
}
/* 🔴 關閉之後要回到【原來那個房間的位置】。
   renameRoom／saveRoom 那條路會重建清單（buildList 第一行是 innerHTML=''）
   ⇒ 直接關會彈回最上面 ⇒ 用 §下-1 加的 .grp[data-room] 捲回去。 */
function closeRoomNote(){
  noteVVDetach();                                       // 🔴 下-27 ①：在任何 return 之前
  const rid=_noteRid;
  $('notePage').hidden=true; _noteRid=null; _noteOrig='';
  if(!rid) return;
  const gh=document.querySelector(`.grp[data-room="${rid}"]`);
  if(gh) gh.scrollIntoView({block:'start'});
}
$('npDone').onclick=async()=>{
  const rid=_noteRid; if(!rid) return closeRoomNote();
  const r=ROOMS.find(x=>x.id===rid);
  if(r){
    r.note=$('npText').value;
    await saveRoom(r); await reloadObjects();   // 沿用 renameRoom 那條路，不新造存檔路徑
  }
  buildList(); refreshTop();
  closeRoomNote();
};
$('npCancel').onclick=async()=>{
  /* 🔴 保護：**只有真的改過字**，按〔取消〕才問一次；沒改過直接關。 */
  if($('npText').value !== _noteOrig){
    const ok=await askDialog({title:'放棄修改', body:'這次的修改不留？', okText:'不留'});
    if(ok===false) return;               // 她說「還要改」⇒ 留在備註頁
  }
  closeRoomNote();
};

async function renameRoom(id,name){
  const r=ROOMS.find(x=>x.id===id); if(!r) return;
  r.name=(name==null?'':String(name)).trim();       // 可留空 → 顯示「未命名」，不報錯
  await saveRoom(r); await reloadObjects();
}
/* 🔴 刪什麼／留什麼（spec-authoring §5-1）
   刪：該 Room／該 Room 底下所有 Wall／Beam 的列（軟刪除）
   留：Item 一筆都不刪；name/w/d/h/note/price/color/log/isBudgeted 全部不動；
       🔴 anchor 必須【就地轉成絕對座標】，不可留著指向已刪的牆
   🔴 順序硬規則：【先算 place()、再刪牆】。反了就取不到牆。 */
async function deleteRoomCascade(rid){
  const items=FURN.filter(f=>f.room===rid);
  const snap=items.map(f=>({f, p:place(f)}));       // ← 先算（此時牆還在）
  for(const {f,p} of snap){
    if(f.anchor && f.anchor.type==='wall'){

/* ⚠️ O-14：fetch 被 CSP 擋掉時丟的是 TypeError，訊息看起來像網路問題。
   要把它與「真的連不上」分開講，否則測試的人會以為程式壞了。 */
async function sbFetch(path, opt){
  opt = opt || {};
  const h = Object.assign({ apikey: CLOUD.key }, opt.headers||{});
  if(CLOUD.tok) h.Authorization = 'Bearer '+CLOUD.tok;
  let r;
  try{
    r = await fetch(CLOUD.url+path, Object.assign({}, opt, {headers:h}));
  }catch(e){
    CLOUD.blocked = true;
    throw new Error('對外連線失敗（可能被這個環境的安全政策擋住）：'+e.message);
  }
  CLOUD.blocked = false;
  /* 🔴 需求 34：401 先【續期】，續不動才換身分。
     ⚠️ path.indexOf('/auth/')<0 這一行守衛不准動——refreshSession 本身也走 sbFetch，
        少了它就會遞迴。 */
  if(r.status===401 && !opt._retry && path.indexOf('/auth/')<0){
    const okRefresh = await refreshSession();
    if(!okRefresh){
      await signInAnon(true);                   // 身分過期且續不動 → 重新拿一個
      /* 🔴 R-1：新身分是【全新的 uid】，不在 members 裡。
         少了這一步，接下來每個讀取都會回 200 []（有權限問題，但長得像「雲端空了」）。 */
      if(CLOUD.code && !_rejoining){
        _rejoining = true;
        try{ await joinProject(CLOUD.code); }
        finally{ _rejoining = false; }          // ⚠️ 防遞迴：joinProject 本身也走 sbFetch
      }
      CLOUD.reidentified = true;                // 🔴 需求 35-1：這件事不可以靜默
    }
    return sbFetch(path, Object.assign({}, opt, {_retry:true}));
  }
  return r;
}
let _rejoining = false;

/* 🔴 需求 35-2：舊格式（沒有 v:2 ＝ 沒有 refresh_token）的 session 一律丟棄。
   ⚠️ 只丟【身分】，不丟 deco_code——代碼是 Ali 唯一的鑰匙。 */
function dropLegacySession(){
  try{
    const raw = LS.get('deco_sess');
    if(!raw) return;
    const j = JSON.parse(raw);
    if(!j || j.v !== 2) LS.del('deco_sess');
  }catch(e){ LS.del('deco_sess'); }             // 壞掉的也丟
}

/* 🔴 需求 34：用 refresh_token 續期。
   ⚠️ 回來的 refresh_token 是【新的】，一定要覆蓋存起來，否則下一次續期必失敗。
   ⚠️ in-flight 共用：兩個請求同時 401 時只能真的續一次，否則第二個拿到已被輪替掉的
      舊 token ⇒ 失敗 ⇒ 白白掉回重新註冊。 */
let _refreshing = null;
async function refreshSession(){
  if(_refreshing) return _refreshing;
  _refreshing = (async ()=>{
    let saved={};
    try{ saved = JSON.parse(LS.get('deco_sess')||'{}') || {}; }catch(e){ saved={}; }
    if(!saved.r) return false;                  // 沒有 refresh token → 續不了
    let r;
    try{
      r = await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ refresh_token: saved.r })});
    }catch(e){ return false; }                  // 離線／被擋：不換身分，錯誤由外層那條路報
    if(!r.ok) return false;                     // 400／401：token 失效或被撤銷
    let j={}; try{ j = await r.json(); }catch(e){ return false; }
    if(!j.access_token) return false;
    CLOUD.tok = j.access_token;
    CLOUD.uid = (j.user && j.user.id) || CLOUD.uid;
    LS.set('deco_sess', JSON.stringify({ v:2, t:j.access_token,
            r: j.refresh_token || saved.r, u: CLOUD.uid }));
    return true;
  })().finally(()=>{ _refreshing = null; });
  return _refreshing;
}

async function signInAnon(force){
  dropLegacySession();                          // 🔴 需求 35-2：早於任何還原邏輯
  if(CLOUD.tok && !force) return;
  if(!force){
    const saved=LS.get('deco_sess');
    if(saved){ try{ const j=JSON.parse(saved);
      if(j && j.v===2 && j.t){ CLOUD.tok=j.t; CLOUD.uid=j.u; return; } }catch(e){} }
  }
  const r=await sbFetch('/auth/v1/signup',{method:'POST',
    headers:{'Content-Type':'application/json'}, body:'{}'});
  const t=await r.text();
  let j={}; try{ j=JSON.parse(t); }catch(e){}
  if(!r.ok || !j.access_token)
    throw new Error('拿匿名身分失敗（Anonymous sign-ins 開了嗎？）：'+(j.msg||j.error_description||j.error||t.slice(0,160)));
  const prev=CLOUD.uid;
  CLOUD.tok=j.access_token; CLOUD.uid=(j.user&&j.user.id)||null;
  if(force && prev && prev!==CLOUD.uid) CLOUD.reauth++;   // 身分真的換掉了
  /* 🔴 需求 34：refresh_token 一定要存下來，否則到期時只能重新註冊一個新身分。
     邊界：這個環境沒有給 refresh_token ⇒ 標起來，讓 cloudStat() 說一句（不要沉默）。 */
  CLOUD.noRefresh = !j.refresh_token;
  LS.set('deco_sess', JSON.stringify({v:2, t:CLOUD.tok, r:j.refresh_token||null, u:CLOUD.uid}));
}

/* ══════════════════════════════════════════════════════════════
   需求 15｜四張新表的 push／pull 欄位對照
   🔴 fromRow() 必須做 fromMM()，含 anchor 內的 along/off/x/y
   ⚠️ synced / pending / appVer 是本機專用欄位，不可送上雲端（雲端 schema 沒有）
   ══════════════════════════════════════════════════════════════ */
/* ╔═ 🔴🔴 v0.20_i §4-2｜`site` 由後台管，App **一個字都不要送** ═══════════════════╗
   本批貼了 SQL 加 site 欄位（projects／rooms／walls／beams；🔴 items 不加），
   但 App **不做任何功能** —— 所以這支函式裡【完全不要出現 `site` 這個 key】。

   🛑 **最容易寫出來的那一種錯**：`site: o.site ?? null`
      ⇒ 會送出 `"site":null` ⇒ **把後台填的值洗成 NULL**。
   🔑 為什麼這個坑特別毒：下面 items 分支現成就有一行 `flags:o.flags ?? null`，
      **那一行是對的**（flags 本來就歸 App 管、fromRow 也讀得回來）
      ⇒ 建造者很自然會「比照 flags 的寫法」把 site 也加上去 ⇒ **一行就洗掉整張表**。
      🔴 **不可以比照 flags 的寫法。**
   ⚠️ JS 的兩種「沒有」在這裡不等價：
        { site: undefined } → JSON.stringify 會丟掉它 → 安全
        { site: null }      → 序列化成 "site":null → 🔴 會 SET 成 NULL
      ⇒ 不要依賴 undefined 的僥倖，**直接不要有那個 property**。
   ✅ fromRow() 也不要讀 site（App 完全不需要知道它）。

   📌 **判準（機械可查，之後加任何新欄位都照它判）**：
      「`toRow()` 送、而 `fromRow()` **不讀** 的欄位 ⇒ 它一定會在第一次存檔被洗成 null。」
      理由：讀得回來的欄位是 round-trip（送出去的就是從雲端讀來的），怎麼送都不會掉；
           讀不回來的欄位，記憶體裡永遠是 undefined ⇒ `?? null` ⇒ SET NULL。
      ⇒ `site` 正是這一類（所以不能送）；`z_min`／`z_max` 也是（已正確不送）。
      ✅ 建造前讀坑已逐欄掃過四個分支：**本批不需要修任何一欄。** ╚═══════════════════╝ */
function toRow(store,o){
  const base={ id:o.id, project_code:CLOUD.code,
    deleted_at:o.deletedAt||null, updated_at:o.updatedAt||nowISO() };
  /* 🔴 v0.05_i §3（修三）：有 createdAt 才送 created_at。
     ⚠️ 沒有的【不要送 null】——雲端那一欄是 not null default now()，
        送 null 會被拒；而 omit 掉就由資料庫自己蓋（那是真的時間，不是假造的）。
        這正好就是「不要補寫一個假的 createdAt」（obs O-13）的另一半。 */
  if(o.createdAt) base.created_at=o.createdAt;
  /* 🔴 v0.22_i R-05：三態刪除的新欄位（六張表都有 batch_id／purged_at；兩張相簿表多 restored_at）。
     🔴 一律【有值才送】（比照 created_at／poly）：
        · purged_at　一台還不知道「已永久刪除」的手機送 null 會把墓碑洗掉（雲端 trigger 也擋，兩層）
        · batch_id　 與 deleted_at 成對；還原時雲端的舊 batch_id 留著無害（垃圾桶只看 deleted_at 有值的）
        · restored_at 只有「按了還原」的那一次才有新值 ⇒ 雲端 trigger 靠它分辨還原與離線編輯（§0c R-06）
     📌 fromRow 三個都讀 ⇒ 是 round-trip 欄位，不會落入 3112 的「送了卻讀不回來 ⇒ 洗成 null」。 */
  if(o.batchId)    base.batch_id=o.batchId;
  if(o.purgedAt)   base.purged_at=o.purgedAt;
  if((store==='albums'||store==='album_photos') && o.restoredAt) base.restored_at=o.restoredAt;
  /* ── 🔴 v0.1.9：相簿兩張表 ── */
  if(store==='albums') return Object.assign(base,{
    name:o.name??null,
    /* 🔴 定位點【永遠送】（含 null）：〔取消定位〕＝清成空，這個「清空」必須傳播到別台。 */
    loc_x:toMM(o.locX), loc_y:toMM(o.locY) });
  if(store==='album_photos') return Object.assign(base,{
    album_id:o.albumId, photo_id:o.photoId,
    name:o.name??null, note:o.note??null, sort:(o.sort==null? null : Number(o.sort)) });
  if(store==='rooms'){
    const row=Object.assign(base,{
      name:o.name??null, slab_h:toMM(o.slabH), note:o.note??null });
    /* 🔴🔴 v0.13_i 修二-a：poly【有值才送】，比照上面 created_at 的寫法。
       ⚠️ 若無條件送，polyToMM(undefined) 會是 null
          ⇒ 舊裝置存一次檔就把雲端那一列的 poly 明確覆寫成 null ⇒ 另一台也跟著死。
       ⭐ 這個寫法不論 PostgREST 的 upsert 對「payload 沒帶的欄位」是保留還是覆寫成預設，

    category:o.category??null, z_base:toMM(o.zBase),

function fromRow(store,row){
  const base={ id:row.id, projectCode:row.project_code||null,
    deletedAt:row.deleted_at||null, updatedAt:row.updated_at||null,
    /* 🔴 v0.05_i §3（修三）：pull 覆蓋時要【保留】建立時間 ⇒ 直接讀雲端的 created_at。
       雲端沒有（舊列）→ null，不偽造。 */
    createdAt:row.created_at||null,
    /* 🔴 v0.22_i R-05：與 toRow 成對（兩邊都要有，3112 判準）。 */
    batchId:row.batch_id||null, purgedAt:row.purged_at||null,
    appVer:APP_VER };
  /* ── 🔴 v0.1.9：相簿兩張表 ── */
  if(store==='albums') return Object.assign(base,{

  if(store==='album_photos') return Object.assign(base,{

    name:row.name||'', note:row.note||'', sort:(row.sort==null? null : Number(row.sort)),
    restoredAt:row.restored_at||null });

  if(store==='rooms') return Object.assign(base,{
    name:row.name||'', slabH:fromMM(row.slab_h), note:row.note||'',
    poly:polyFromMM(row.poly) });
  if(store==='walls') return Object.assign(base,{
    room:row.room_id||null,
    x1:fromMM(row.x1), y1:fromMM(row.y1), x2:fromMM(row.x2), y2:fromMM(row.y2),
    thickness:fromMM(row.thickness), height:fromMM(row.height),
    isBoundary:row.is_boundary!==false, state:row.state||'existing',
    total:row.total??null, note:row.note||'',
    isPlaced:row.is_placed!==false, isBudgeted:!!row.is_budgeted });
  if(store==='beams') return Object.assign(base,{
    room:row.room_id||null,
    x1:fromMM(row.x1), y1:fromMM(row.y1), x2:fromMM(row.x2), y2:fromMM(row.y2),
    width:fromMM(row.width), drop:fromMM(row.drop_mm), note:row.note||'' });
  /* 🔴 R-04：同 toRow —— 不認得的 store 不可以落成 items。 */
  if(store!=='items') throw new Error('fromRow：不認得的資料表 '+store);
  return Object.assign(base,{
    room:row.room_id||null, name:row.name||'',
    w:fromMM(row.w), d:fromMM(row.d), h:fromMM(row.h),
    note:row.note||'', price:row.price??null, color:row.color||null, rot:row.rot||0,
    anchor:anchorFromMM(row.anchor),
    category:row.category||null, zBase:fromMM(row.z_base),     // 🔴 需求 46
    flags:row.flags||null,                                     // 🔴 §下-7 ②

}
/* ══════════════════════════════════════════════════════════════
   🔴 v0.1.9 批 3｜同步層的共用零件

/* ╔═ 🔴 v0.22_i §0c R-44｜所有 pull 一律翻頁（sbFetchAll）═══════════════════════════════╗
   PostgREST（Supabase 預設 Max rows）一次最多回 1000 列，而且【不報錯、不說被截斷】。
   照片線的刪除傳播是「雲端沒這個 id ⇒ 刪本機」⇒ 第 1001 張起每一次同步都會被刪掉本機副本（O-18／O-22）。
   ⇒ 依 id 排序、limit／offset 一頁一頁拿到「不足一頁」為止。
   🔧 SB_PAGE 是 let：自驗時改小（例 2）就能在幾筆資料上驗翻頁，不必造 1001 筆。 */
let SB_PAGE = 1000;
async function sbFetchAll(pathBase, what){
  const out=[];
  for(let off=0; ; off+=SB_PAGE){
    const r=await sbFetch(`${pathBase}&order=id.asc&limit=${SB_PAGE}&offset=${off}`);
    if(!r.ok) throw new Error(`讀雲端${what||''}失敗：`+(await r.text()).slice(0,200));
    const rows=await r.json();
    if(!Array.isArray(rows)) throw new Error(`讀雲端${what||''}失敗：回應不是清單`);
    out.push(...rows);
    if(rows.length < SB_PAGE) break;
  }
  return out;
}
/* ╔═ 🔴 v0.22_i §0c R-15｜資料版本號：v0.1.9 只讀不寫 ═════════════════════════════════╗
   v0.1.9 自己的格式＝1。雲端 projects.data_ver 是 null 或 ≤ 1 ⇒ 正常。
   > 1（之後的版本寫的）⇒ 【只停推雲端】：本機照存、照標 pending，畫面常駐一行「請重新整理到新版」。
   讀的時機：cloudPull 最前面（身分確認之後）⇒ 在任何補推之前就知道要不要停。 */
const DATA_VER = 1;
CLOUD.frozen = false;
const FROZEN_MSG = '雲端資料已經是新版的格式，這個版本不會再上傳任何東西。請重新整理到新版。';

/* 🔴 v0.1.9：推送後拿回雲端那一列（return=representation）並當場套用（§0c R-06、R-07）。
   · 雲端 trigger 把已永久刪除的列「回舊列」、把離線編輯留在垃圾桶 ⇒ 回來的列與送出去的不同
   · 不當場套用的話，推的那台要等下一次同步才知道（甚至永遠不知道：雲端 updated_at 可能等於本機） */
async function applyPushedRow(store, o, row){
  if(!row) return;
  const inc=fromRow(store,row);
  if(inc.purgedAt){ await lDel(store,o.id); return 'purged'; }
  if((inc.deletedAt||null)!==(o.deletedAt||null)
     || (Date.parse(inc.updatedAt||'')||0)!==(Date.parse(o.updatedAt||'')||0)){
    await lPutObj(store, Object.assign({}, inc, {pending:false, synced:true,
      createdAt: inc.createdAt || o.createdAt || null}));
    return 'changed';
  }
  return null;
}
/* 推：本機 → 雲端（單筆） */
async function cloudPushObj(store,id){
  const o=await lGetObj(store,id);
  if(!o || !CLOUD.on || o.projectCode!==CLOUD.code) return;
  if(CLOUD.frozen) return;                       // 🔴 R-15：停推（pending 留著）
  if(ALBUM_STORES.includes(store) && !ALBUM_CLOUD) return;
  const row=toRow(store,o);
  const ins=await sbFetch(`/rest/v1/${store}?on_conflict=id`,{method:'POST',
    headers:{'Content-Type':'application/json',
             'Prefer':'resolution=merge-duplicates,return=representation'},
    body:JSON.stringify(row)});
  if(!ins.ok){
    const t=await ins.text();
    /* 🔴 §0c R-48（🟠-4）：兩台同時把同一張照片放進同一本 ⇒ 撞「同一本不重複」的唯一鍵（23505）。
       不處理的話這一筆永遠 pending、永遠重試（O-19 形狀）。⇒ 本機這一筆拿掉，說一句話。 */
    if(store==='album_photos' && /23505/.test(t)){
      await lDel(store,o.id);
      const a=ALBUMS.find(x=>x.id===o.albumId);
      cloudErr(new Error(`這張已經在「${(a&&a.name)||'那本相簿'}」裡了（另一台先放進去了），這一筆沒有重複加入。`));
      return;
    }
    throw new Error(`寫入雲端 ${store} 失敗：`+t.slice(0,200));
  }
  let rows=null; try{ rows=await ins.json(); }catch(e){}
  const back = Array.isArray(rows) ? rows[0] : null;
  const how  = await applyPushedRow(store, o, back);
  if(!how){
    /* 🔴 v0.1.9：同照片線 —— 推送途中又存過一次的話，不可以用舊的那份蓋掉（只標記沒被改過的）。 */
    const cur=await lGetObj(store,o.id);
    if(cur && (cur.updatedAt||null)===(o.updatedAt||null)){ cur.pending=false; cur.synced=true; await lPutObj(store,cur); }
  }
  SYNC.pushed++;                                 // 🔴 需求 18 ②：上傳 N 筆
  cloudStat();
}

/* ╔═ 🔴 v0.1.9｜照片列的欄位對照（兩個方向各一支，推與拉只准走這兩支）══════════════════╗
   本機欄位名 ⇄ 雲端欄位名。🔴 只列【雲端認得】的欄位 —— 本機專用的（small／orig 兩個 Blob、
   source、rotated、oriBy、orientation、decoded、err、rawW/H、origClean…）不進來也不被洗掉。 */
function photoFromRow(row){
  const o={ name:row.name, mime:row.mime||'image/jpeg',
    smallSize:row.small_size,
    w:row.width, h:row.height, dateTaken:row.date_taken||null,
    addedAt:row.added_at||null, storagePath:row.storage_path,
    origPath:row.orig_path||null, origStatus:row.orig_status||null,
    origType:(row.orig_type==='jpg-shrunk' ? 'jpg' : (row.orig_type||null)),
    origShrunk:(row.orig_type==='jpg-shrunk'),
    albumVer:(row.album_ver==null? null : row.album_ver),
    updatedAt:row.updated_at||null };
  /* 🔴 v0.1.9 批 7 自驗抓到：orig_size 在雲端是「有原檔才送」（photoToRow）⇒ 第一次推（還是 pending）回來的列是 null，
     舊寫法照單全收 ⇒ 本機的 origSize 被洗成 null ⇒ 之後傳完原檔（has）時 `origSize!=null` 不成立 ⇒ 永遠不送
     ⇒ 雲端與本機都不知道原檔多大（〔刪除雲端的原檔〕寫不出 MB）。同一個形狀＝3112 判準的反方向（讀回 null 洗掉本機）。
     ⇒ 雲端沒有值就【不帶這個欄位】（Object.assign 不會碰本機那一欄）。 */
  if(row.orig_size!=null) o.origSize=row.orig_size;
  return o;
}
function photoToRow(r){
  /* 🔴 R-03 ②：updated_at 送【編輯當時】的時間（rec.updatedAt），不是推送當下。
     從雲端拉下來的舊紀錄可能沒有 updatedAt ⇒ 退回 addedAt，再不行才現在（雲端欄位 not null）。 */
  const row={ id:r.id, project_code:CLOUD.code, name:r.name, mime:r.mime,
    small_size:r.smallSize||null,
    width:r.w||null, height:r.h||null, date_taken:r.dateTaken||null,
    added_at:r.addedAt||null, storage_path:r.storagePath,
    updated_at:r.updatedAt || r.addedAt || nowISO() };
  /* 🔴🔴 §0c R-03（🔴-6）：新欄位一律【有值才送】（比照 poly）。
     照片是整列 upsert ⇒ 一台舊資料的手機（本機 origStatus 還是空）一推，
     就會把另一台剛寫的 'has' 洗掉（相-32 時過時不過）。有值才送 ⇒ 它不會碰那一欄。 */
  if(r.origSize!=null && r.origStatus==='has') row.orig_size=r.origSize;
  if(r.origPath)   row.orig_path=r.origPath;
  if(r.origStatus) row.orig_status=r.origStatus;
  /* 🔴 v0.1.9 Q-A2：「已縮小」要讓別台也知道 ⇒ 編進 orig_type（'jpg-shrunk'）；讀回來拆開 */
  if(r.origType)   row.orig_type = (r.origShrunk && r.origType==='jpg') ? 'jpg-shrunk' : r.origType;
  if(r.albumVer!=null) row.album_ver=r.albumVer;
  /* 唯一的例外：〔刪除雲端的原檔〕要把路徑【清掉】，這個清空必須傳播 ⇒ 明寫送 null。 */
  if(r.origStatus==='purged') row.orig_path=null;
  return row;
}
/* ── 推：本機 → 雲端（照片） ── */
async function cloudPushPhoto(id){
  const r=await lGet('photos',id);
  if(!r || !CLOUD.on || r.projectCode!==CLOUD.code) return;
  if(CLOUD.frozen) return;                       // 🔴 R-15
  if(!r.storagePath){
    /* 🔴 §0b R-13（A-17）：只傳【壓縮版】。舊碼是 `r.small||r.orig` ⇒ 解不開的 HEIC 會被當成
       壓縮版傳到 .jpg 路徑。small 做不出來的照片根本不會進相簿（批 4 intake），這裡是第二道。 */
    const blob=r.small;
    if(!blob) return;
    const path=`${CLOUD.code}/${r.id}.jpg`;      // 🔑 路徑第一段＝權限鍵
    const up=await sbFetch('/storage/v1/object/photos/'+path,{method:'POST',
      headers:{'Content-Type':blob.type||'image/jpeg','x-upsert':'true'}, body:blob});
    if(!up.ok) throw new Error('上傳照片檔失敗：'+(await up.text()).slice(0,200));
    r.storagePath=path;
  }
  /* ⚠️ 先上傳檔案、成功才寫列。反序會留下「指不到檔的列」。 */
  const row=photoToRow(r);
  const ins=await sbFetch('/rest/v1/photos?on_conflict=id',{method:'POST',
    headers:{'Content-Type':'application/json',
             'Prefer':'resolution=merge-duplicates,return=representation'},
    body:JSON.stringify(row)});
  if(!ins.ok) throw new Error('寫入雲端清單失敗：'+(await ins.text()).slice(0,200));
  let rows=null; try{ rows=await ins.json(); }catch(e){}
  /* 🔴 §0c R-07（🔴-5）：雲端回 [] ＝ 這張已被永久刪除（photo_purged 墓碑擋下了重新插入）
     ⇒ 本機也刪掉，不要再推。 */
  if(Array.isArray(rows) && rows.length===0){
    await lDel('photos',r.id);
    SYNC.pushed++; cloudStat();
    return 'purged';
  }
  /* 🔴 v0.1.9：推送途中這台可能又存了一次（例如原檔佇列、改名）⇒ 重讀本機那一筆，
     只有「沒被改過」才標成已同步；storagePath 一律補上。否則會用舊的那份蓋掉新的編輯。 */
  {
    const cur=await lGet('photos',r.id);
    if(cur){
      cur.storagePath=r.storagePath;
      if((cur.updatedAt||null)===(r.updatedAt||null)){
        cur.pending=false; cur.synced=true;
        /* 🔴 自驗抓到（相-32 在 B 台失敗）：「有值才送」讓雲端保住了 A 寫的 'has'，
           但雲端那一列的 updated_at 變成 B 送的時間 ＝ B 本機的時間 ⇒ B 下次拉「一樣新」就不採用
           ⇒ B 的橘條永遠不消失。⇒ 用推送回傳的那一列（return=representation）把雲端認得的欄位
           當場補進本機（它＝B 送的值＋雲端保住的那幾欄）。 */
        if(Array.isArray(rows) && rows[0]) Object.assign(cur, photoFromRow(rows[0]));
      }
      await lPut('photos',cur);
      /* 壓縮版一上雲，原檔佇列就可以接著傳這一張（§9-2 ①） */
      if(cur.orig && (cur.origStatus==='pending' || (cur.albumVer===0 && cur.origStatus==null && !cur.origClean)))
        kickOrigQueue();
    }
  }
  SYNC.pushed++;                                 // 🔴 需求 18 ②
  cloudStat();
}

const BACKFILL = { rooms:['poly'] };

async function cloudPullObjects(){
  const q = '&project_code=eq.' + encodeURIComponent(CLOUD.code);
  syncStep('房間／牆／樑／家具／相簿…');          // 🔴 需求 18 ①（第 4 階段）
  for(const store of OBJ_STORES){
    const rows  = await sbFetchAll(`/rest/v1/${store}?select=*${q}`, store);   // 🔴 R-44 翻頁
    SYNC.cloudObjRows += rows.length;           // 🔴 需求 19 ①
    const local = await lAllObj(store);
    const lmap  = new Map(local.map(x => [x.id, x]));

    for(const row of rows){
      const inc = fromRow(store, row);        // 欄位改名 ＋ fromMM() ＋ anchor 內的長度
      const cur = lmap.get(inc.id);
      /* 🔴 v0.1.9 §0c R-06：已永久刪除（墓碑）⇒ 本機刪掉，【無視時間戳】。
         理由：雲端 trigger 對墓碑一律「回舊列」，墓碑的 updated_at 可能比某台本機還舊
         ⇒ 走下面「晚的贏」的話，那台永遠不會知道它已經被永久刪除。 */
      if(inc.purgedAt){
        if(cur) await lDel(store, inc.id);
        continue;
      }
      if(!cur){
        if(inc.deletedAt) continue;           // ① 墓碑：本機沒有 → 不要把它生出來
        await lPutObj(store, Object.assign({}, inc, {synced:true, pending:false}));
        SYNC.added++;                         // 🔴 需求 18 ②：聯集發生時要說出多了幾筆
        continue;
      }
      /* 🔴 v0.09_i 需求 31：pending 不再是【絕對否決】。
         ⚠️ v0.04_i 需求 15 的規則② `if(cur.pending) continue` 是規格寫錯的：
            pending 只代表「還沒推上去」，【不代表「本機這份比較新」】
            ⇒ 一旦某一筆卡在 pending，它就【永遠】不接受雲端的任何更新
            ⇒ 兩台各自守著自己的版本，不會自己好，畫面也不會說
            實例：Ali 手機那間房間是【已軟刪除 ＋ pending】⇒ 雲端的活房間永遠拉不回來。
         ⇒ 改成一律照比 updatedAt——晚的贏（與本輪一貫的衝突規則一致）。
            本機 pending 且【較新】→ 不覆蓋（保護真正的離線編輯）
            本機 pending 且【較舊】→ 覆蓋，並清掉 pending／設 synced=true
                                     （那筆舊修改被判定為已被取代）
         ⚠️ 時間戳相同 → 不動本機（用 > 不用 >=，沿用 v0.04_i）。 */
      /* ══ 🔴🔴 v0.13_i 修二-b ＋ v0.14_i 補一｜新欄位的回填（放在「晚的贏」之前）══
         情境：Ali 兩台都已經 pull 過那 10 筆 room，本機有它們但【沒有 poly】
               （v0.1.4.5 的 fromRow 不認識這個欄位），而 updatedAt 與雲端【完全相等】
               ⇒ 走 `>` 這條比較 ⇒ 不覆蓋 ⇒ 🔴 poly 永遠下不來，10 個分區一個都不畫。
         ⚠️ 乾淨的開發機走的是 `!cur` 分支 ⇒ 一切正常 ⇒ 測試會【全綠】，只有她的機器會壞
            （obs O-13「本機儲存比程式活得久」＋ O-17「量具說謊」的合體）。
         ⇒ 規則：雲端有值、本機是 null／undefined 的欄位，無視時間戳補下來。
         🔴 但只限【白名單】（v0.14_i 補一）：判準是「使用者有沒有辦法把這個欄位清空」。
            有辦法清空 ⇒ 不可以進白名單 —— 這個 App 明訂「清空 ＝ null」，
            寫成通則會把【使用者清掉的價錢】當成版本落差長回來，並推回雲端。
            poly 目前沒有任何 UI 可以清空它 ⇒ 符合條件。
            ⚠️ 之後若做了「編輯分區形狀」，這一格要重新檢視；
               下一個新欄位（z_min／z_max／category／z_base）要【逐一判斷】，不可以自動加。 */
      for(const k of (BACKFILL[store] || [])){
        if(cur && cur[k]==null && inc[k]!=null){
          /* 🔴 不改 updatedAt、不動 pending／synced ——
             這不是一次「雲端比較新」的衝突，是【本機根本不知道有這個欄位】。 */
          await lPutObj(store, Object.assign({}, cur, {[k]: inc[k]}));
        }
      }
      if(!inc.updatedAt) continue;            // ③ 雲端沒時間戳 → 當最舊，不覆蓋
      if(new Date(inc.updatedAt) > new Date(cur.updatedAt||0))
        await lPutObj(store, Object.assign({}, inc, {synced:true, pending:false,
          /* 🔴 v0.05_i §3（修三）：整筆覆蓋時 createdAt 要【保留】。
             雲端那一欄是 not null，正常一定有值；只有「雲端是舊列、沒有 created_at」
             這個情況才會回 null —— 那時用本機原本記得的，不要被 null 蓋掉。 */
          createdAt: inc.createdAt || cur.createdAt || null})); // ④ 晚的贏
    }
    // 🔴 ⑤ 這裡【沒有】「雲端沒有就刪本機」那一段。刪除一律走 deletedAt／purgedAt。
  }
  /* ⑥ 補推：本機還沒推成功的（pending）。
     ⚠️ 這一段是建造者依【規則②「等 push」】＋ 既有 ③ 補推（照片/標記）的對稱性補的，
        _i 需求 15 的函式本體沒有寫。若規格者認為不該有，砍掉這一個 for 即可。 */
  {
    let n=0;
    for(const store of OBJ_STORES)
      n += (await lAllObj(store)).filter(x=>x.projectCode===CLOUD.code && x.pending).length;
    if(n && !CLOUD.frozen) syncStep(`上傳 ${n} 筆…`);   // 🔴 需求 18 ①（第 6 階段）
  }
  for(const store of OBJ_STORES){
    for(const x of await lAllObj(store))
      if(x.projectCode===CLOUD.code && x.pending)
        await cloudPushObj(store,x.id).catch(e=>cloudErr(e));
  }
}

/* ── 拉：雲端 → 本機 ── */
async function cloudPull(){
  if(!CLOUD.on) return;
  syncStep('確認身分…');                       // 🔴 需求 18 ①（第 1 階段）
  /* 🔴 R-1：先確認身分，再談同步。
     ⚠️ 這一步失敗就【中止】——下面有刪除傳播迴路（照片線），
        身分不對時它會把「讀不到」誤讀成「別台刪了」，然後刪掉本機。 */
  if(!await cloudVerifyMember())
    throw new Error(`這台的身分不在專案 ${CLOUD.code} 裡（身分可能已變更）。`
      +`為避免誤刪本機資料，同步已中止，一筆都沒有刪。請按「重新連線」。`);
  /* 🔴 §0c R-15：資料版本號（只讀）。在任何補推之前判斷要不要停推。 */
  {
    const prow=await cloudFetchProjectRow();
    CLOUD.frozen = !!(prow && prow.data_ver!=null && Number(prow.data_ver) > DATA_VER);
  }
  const q='&project_code=eq.'+encodeURIComponent(CLOUD.code);

  // ① 照片
  syncStep('照片清單…');
  const rows=await sbFetchAll('/rest/v1/photos?select=*'+q, '清單');   // 🔴 R-44 翻頁
  SYNC.photoTotal=rows.length;
  SYNC.cloudPhotoRows=rows.length;             // 🔴 需求 19 ①：雲端到底有沒有東西
  const local=await lAll('photos');
  const lmap=new Map(local.map(x=>[x.id,x]));
  for(const row of rows){
    /* 🔴 需求 18 ①（第 2 階段）：逐張下載時要動，不然她只看到「停住好久」 */
    SYNC.photoDone++;
    syncStep(`照片 ${SYNC.photoDone}/${SYNC.photoTotal}…`);
    const cur=lmap.get(row.id);
    if(cur && (cur.small||cur.orig)){
      /* ╔═ 🔴🔴 v0.22_i §0b R-03 ①（A-3）｜檔案有就不重下載，但【欄位照 updatedAt 晚的贏】═══╗
         舊寫法：本機有檔就整筆跳過 ⇒ A 台傳完原檔（has），B 台的橘條【永遠不消失】（相-32）。
         🔴 而且舊寫法對 !synced 的照片會【順手清掉 pending】⇒ R-03 ③ 剛標上的待推
            （例如搬家蓋的 albumVer）還沒推就被當成「已同步」（批 2 施工紀錄已記這一條必修）。
         新規則（與物件表同一套）：
           本機 pending 且較新　⇒ 不覆蓋、pending 留著（③ 補推會送上去）
           雲端較新（或本機沒有 updatedAt）⇒ 只覆蓋【雲端認得的欄位】（photoFromRow），
                                              本機的 Blob 與本機專用欄位不動；pending 清掉
           一樣新　⇒ 視為已同步 ╚══════════════════════════════════════════════════════════╝ */
      const inc=photoFromRow(row);
      const tC=Date.parse(inc.updatedAt||'')||0, tL=Date.parse(cur.updatedAt||'')||0;
      let changed=false;
      if(cur.projectCode!==CLOUD.code){ cur.projectCode=CLOUD.code; changed=true; }
      if(cur.pending && tL>tC){
        if(!cur.storagePath && inc.storagePath){ cur.storagePath=inc.storagePath; changed=true; }
      }else if(tC>tL || !cur.updatedAt){
        Object.assign(cur, inc); cur.pending=false; cur.synced=true; changed=true;
      }else if(!cur.synced || cur.pending){
        cur.synced=true; cur.pending=false;
        cur.storagePath=cur.storagePath||inc.storagePath; changed=true;
      }
      if(changed) await lPut('photos',cur);
      continue;
    }
    const f=await sbFetch('/storage/v1/object/photos/'+row.storage_path);
    if(!f.ok) continue;                          // 檔案還沒到 → 下次再拉
    const blob=await f.blob();
    const inc=photoFromRow(row);
    await lPut('photos',Object.assign({ id:row.id, source:'雲端',
      rawW:row.width, rawH:row.height,
      decoded:true, orientation:null, rotated:false, oriBy:null, err:null,
      appVer:APP_VER+'（雲端）', small:blob,
      projectCode:CLOUD.code, synced:true, pending:false }, inc, {
      origSize: inc.origSize || blob.size, smallSize: inc.smallSize || blob.size,
      addedAt: inc.addedAt || nowISO() }));
    SYNC.added++;                              // 🔴 需求 18 ②：要說出「新增 N 筆」
  }
  /* 🔴 照片段落的「雲端沒這個 id → lDel」【一行不動】（需求 15 留什麼）。
     理由：照片沒有 deletedAt 欄位，它只能用「消失」表達刪除（v0.1.9 的永久刪除也靠它傳播，§0b Q-4）。
     ⚠️ 這是兩套刪除語言並存，【刻意的】，不要統一。
     🔴 v0.1.9 R-44：rows 已經翻頁拿全 ⇒ 這裡的「沒有」才是真的沒有。 */
  const rid=new Set(rows.map(r=>r.id));
  for(const x of local)
    if(x.synced && x.projectCode===CLOUD.code && !rid.has(x.id)) await lDel('photos',x.id);

  // ② 標記（v0.1.9：只讀，搬家用）
  syncStep('標記…');                            // 🔴 需求 18 ①（第 3 階段）
  let mrows=null;
  try{ mrows=await sbFetchAll('/rest/v1/markers?select=*'+q, '標記'); }catch(e){ mrows=null; }
  if(mrows){
    const lm=await lAll('markers');
    const lmm=new Map(lm.map(x=>[x.id,x]));
    for(const row of mrows){
      const cur=lmm.get(row.id);
      /* 🔴 v0.1.9：本機也存 updatedAt（搬家「同一張有兩個標記取較新的」靠它，兩台才會選同一個）。 */
      if(cur && cur.x===row.x && cur.y===row.y && cur.synced
         && (cur.updatedAt||null)===(row.updated_at||null)) continue;
      const isNew=!cur;
      await lPut('markers',{ id:row.id, photoId:row.photo_id, x:row.x, y:row.y,
        updatedAt:row.updated_at||null,
        projectCode:CLOUD.code, synced:true, pending:false });
      if(isNew) SYNC.added++;
    }
    const mid=new Set(mrows.map(r=>r.id));
    for(const x of lm)
      if(x.synced && x.projectCode===CLOUD.code && !mid.has(x.id)) await lDel('markers',x.id);
  }

  // ③ 補推：本機有、雲端還沒有的（離線時拍的）
  {
    const pend=(await lAll('photos')).filter(x=>x.projectCode===CLOUD.code && x.pending)
      .concat((await lAll('markers')).filter(x=>x.projectCode===CLOUD.code && x.pending));
    if(pend.length && !CLOUD.frozen) syncStep(`上傳 ${pend.length} 筆…`);   // 🔴 需求 18 ①（第 5 階段）
  }
  for(const x of await lAll('photos'))
    if(x.projectCode===CLOUD.code && x.pending) await cloudPushPhoto(x.id).catch(e=>cloudErr(e));
  for(const x of await lAll('markers'))
    if(x.projectCode===CLOUD.code && x.pending) await cloudPushMarker(x.id).catch(e=>cloudErr(e));

  // ④ 🔴 需求 15：物件表（掛在照片與標記【之後】；v0.1.9 起含相簿兩張）
  await cloudPullObjects();
  /* ⑤ 🔴 v0.17_i 修八 ①：專案設定（樓高／專案名字）。
     🔴 排在四個 store 的迴圈【之外】，單獨呼叫一次（§0-6 A-1：它的形狀套不進那個迴圈）。 */
  await cloudPullProject();
  /* ⑥ 🔴 v0.1.9 §0b R-10：搬家掛在這裡（開 App 與手動〔🔄 同步〕都經過）。
     放在所有 pull 之後 ⇒ 另一台先搬好的相簿已經拉下來了，這台只補沒搬的。 */
  const moved = await migrateOldPhotos();
  /* 🔴 自驗抓到（B 台第一次同步）：搬家的推送是背景送的（saveAlbum／savePhoto 不等），
     cloudSync 緊接著數 pending ⇒ 畫面寫「⏳ 還有 6 筆沒上傳」，而它們其實正在上傳（O-18：狀態說錯）。
     ⇒ 有搬到東西，就在這裡【等】它們推完（重複推一次無害：upsert＋回傳列套用）。 */
  if(moved){
    for(const x of await lAll('photos'))
      if(x.projectCode===CLOUD.code && x.pending) await cloudPushPhoto(x.id).catch(e=>cloudErr(e));
    for(const st of ALBUM_STORES)
      for(const x of await lAllObj(st))
        if(x.projectCode===CLOUD.code && x.pending) await cloudPushObj(st,x.id).catch(e=>cloudErr(e));
  }
  /* ⑦ 🔴 v0.1.9 批 4：用量（每次同步重讀一次，給用量條與 95% 擋上傳用）＋ 原檔上傳佇列（背景；失敗寫在照片上，不擋同步結果）。 */
  await refreshUsage();
  kickOrigQueue();
  /* ⑧ 🔴 v0.1.9 批 7（🟠-3）：上次沒刪成的雲端檔（永久刪除／刪除雲端原檔留下的）每次同步重試 */
  await flushPendingDel().catch(e=>cloudErr(e));
}

/* 🔴 需求 37：狀態式那一行要用的兩個計數。
   ⚠️ M（pend）在 cloudSync 的【成功分支】現算，不沿用 cloudStat 開頭那個舊值（v0.11_i 修三）。 */
async function countPending(){
  let n=0;
  try{
    for(const x of await lAll('photos'))  if(x.pending) n++;
    for(const x of await lAll('markers')) if(x.pending) n++;
    for(const st of OBJ_STORES)
      for(const x of await lAll(st)) if(x.pending) n++;
  }catch(e){}
  return n;
}
/* 房間／家具用 lAllLive()（不含墓碑）。
   🔴 v0.1.9 R-41：同步結果改說「相簿 N、照片 N」——照片＝至少還在一本活的相簿裡的那些（推算）。 */
async function countLive(){
  const out={rooms:0, items:0, albums:0, photos:0};
  try{
    out.rooms  = (await lAllLive('rooms')).length;
    out.items  = (await lAllLive('items')).length;
    const albums=(await lAllObj('albums')).filter(x=>!x.deletedAt && !x.purgedAt);
    const alive=new Set(albums.map(a=>a.id));
    out.albums = albums.length;
    const ph=new Set((await lAllObj('album_photos'))
      .filter(x=>!x.deletedAt && !x.purgedAt && alive.has(x.albumId)).map(x=>x.photoId));
    out.photos = ph.size;
  }catch(e){}
  return out;
}
async function cloudSync(){
  if(!CLOUD.on || CLOUD.busy) return;
  CLOUD.busy=true; CLOUD.msg='';
  syncReset();
  $('newProjNote').hidden=true;
  if($('btnSync')) $('btnSync').disabled=true;    // 🔴 需求 18 ④：同步中不能連按
  cloudStat();
  let ok=false;
  try{ await cloudPull(); S.dataErr=''; ok=true; }
  catch(e){ cloudErr(e); S.dataErr=(e&&e.message)||String(e); }
  CLOUD.busy=false;
  if($('btnSync')) $('btnSync').disabled=false;
  /* 🔴 需求 18 ②③：完成／失敗都要有一行【帶時間】的結果。
     ⚠️ 失敗時的錯誤與歸屬句由 cloudStat() 照原樣輸出，這裡只給狀態行。 */
  if(ok){
    /* 🔴 需求 38：同步成功才寫入（失敗不寫）。語意＝「這台拉到雲端資料」的時間。 */
    LS.set('deco_lastsync', new Date().toISOString());
    /* 🔴 需求 37（＋v0.11_i 修三）：改成【狀態式】——說現在是什麼樣子，
       不是「剛剛搬了幾筆」。她問的是「我那兩件家具到底上去了沒」。
       🔴 M（pend）必須在 cloudPull() 【結束之後】重算，不可以沿用先前的值，否則會說謊。 */
    const m = await countPending();
    const c = await countLive();
    let line2;
    if(CLOUD.msg){
      /* 🔴 v0.11_i 修三：這一輪有任何錯誤被 cloudErr 記下 ⇒ 不准說「一致」。
         一致是一個【承諾】；有錯誤還承諾一致，比不承諾更糟。 */
      line2 = `<span class="er">⚠️ 同步完成，但有錯誤（下方有詳細訊息）</span>`;
    }else if(m > 0){
      line2 = `<span class="er">⏳ 還有 <b>${m}</b> 筆沒上傳</span>`;
    }else{
      /* 🔴 v0.1.9 R-41：相簿 N、照片 N（照片＝還在某一本活相簿裡的那些） */
      line2 = `雲端與這台一致　房間 <b>${c.rooms}</b>、家具 <b>${c.items}</b>、相簿 <b>${c.albums}</b>、照片 <b>${c.photos}</b>`;
    }
    syncProg(`<span class="done">✅ 同步完成</span>　${hhmm()}<br>`+line2
      + (SYNC.added? `<br>這次從雲端拿到 <b>${SYNC.added}</b> 筆` : ''));
  }else{
    syncProg(`<span class="fail">🔴 同步失敗</span>　${hhmm()}`);
  }
  /* ⚠️ 需求 15 邊界：pull 結束後呼叫【一次】render() ＋ buildList()，
     不要每寫一筆就重畫。 */
  await reloadObjects();                          // 🗂 v0.1.9：loadMarkers 拿掉（平面圖不再畫舊標記）
  render(); buildList(); syncSel(); refreshTop(); renderPhotos();
  /* 🔴 v0.17_i 修八：樓高／專案名字是【設定頁】上的欄位。她很可能就站在那一頁按同步，
     而那一頁的欄位只有 refreshProj() 會重填 ⇒ 不補這一行的話，拉下來了但畫面沒變
     ⇒ 又變成「看不出有沒有同步到」（O-18）。 */
  if(S.tab==='proj') await refreshProj();
  /* 🔴 需求 19 ①：雲端這個代碼下【四張表 ＋ photos 全部 0 筆】＝ 這是一個新專案。
     ⚠️ 不阻擋，只提醒（她可能真的要開新專案）。
        邊界：雲端有照片但沒有物件 → 不算新專案（所以兩個計數要一起看）。

/* ══════════════════════════════════════════════════════════════
   🔴 需求 19 ②｜記住用過的專案代碼（最多 5 組）
   理由：Ali 這次就是【手打錯】的（ALI_WUNDAWU vs ALI_WUNDAUW），
        一整輪跨裝置測試因此作廢。點一下填入 ⇒ 不必再手打。
   ⚠️ 邊界（v0.06_i §4）：清單裡要能【刪除單筆】——
      否則打錯的那個代碼會一直留在清單裡誘惑人點。
   ══════════════════════════════════════════════════════════════ */
const CODES_KEY='deco_codes';
function codesGet(){
  try{ const a=JSON.parse(LS.get(CODES_KEY)||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function codesSave(a){ LS.set(CODES_KEY, JSON.stringify(a.slice(0,5))); }
function codesAdd(code){
  if(!code) return;
  const a=codesGet().filter(x=>x!==code);
  a.unshift(code);                      // 最近用過的排最前
  codesSave(a); renderCodes();
}
function codesDel(code){
  codesSave(codesGet().filter(x=>x!==code)); renderCodes();
}
function renderCodes(){
  const box=$('codeList'); if(!box) return;
  box.innerHTML='';
  for(const c of codesGet()){
    const chip=document.createElement('span'); chip.className='codechip';
    const pick=document.createElement('button'); pick.className='pick codetxt';
    pick.textContent=c;
    pick.title='填入這個代碼';
    pick.onclick=()=>{ $('pcode').value=c; };
    const del=document.createElement('button'); del.className='del';
    del.textContent='✕'; del.title='從清單移除';
    del.onclick=()=>codesDel(c);
    chip.appendChild(pick); chip.appendChild(del);
    box.appendChild(chip);
  }
}

/* ── 連線 / 離開 / 狀態 ── */
async function cloudJoin(){
  const raw=($('pcode').value||'').trim().toUpperCase();
  if(raw.length<4){ CLOUD.msg='專案代碼至少 4 個字'; cloudStat(); return; }
  CLOUD.busy=true; CLOUD.msg=''; cloudStat();
  try{
    const code=await joinProject(raw);
    CLOUD.code=code; CLOUD.on=true;
    LS.set('deco_code',code);
    codesAdd(code);                       // 🔴 需求 19 ②：記住它，下次不必手打
    $('pcode').value=code;
    /* 這台既有的本機照片：歸到這個 project 底下並推上去
       ⚠️ 只認 projectCode 為空的（沒有被別的代碼認領過的），不搶別人的 */
    for(const x of await lAll('photos'))
      if(!x.projectCode){ x.projectCode=code; x.pending=true; await lPut('photos',x); }
    for(const x of await lAll('markers'))
      if(!x.projectCode){ x.projectCode=code; x.pending=true; await lPut('markers',x); }
    /* ══ 🔴 v0.05_i §2（修二）：離線建立的【物件】也要被認領 ══
       v0.04_i 需求 15「留什麼」原本寫「cloudJoin 一行不改」⇒ 建造者依規格沒動
       ⇒ 未連線時建的房間／家具 projectCode 永遠是 null
       ⇒ cloudPushObj 第一行 `o.projectCode!==CLOUD.code` 就 return ⇒ 連線後也推不上去。
       v0.05_i 把那一條改成「cloudJoin 只准【加一段物件認領】」。
       ⚠️ 刻意【不】改寫上面照片與標記那兩段，也【不】把三者合併成一個泛用迴圈——
          照片與物件的欄位形狀不同（照片走 lPut，物件要走 lPutObj 做單位換算），
          合併會讓下一手看不出哪個是哪個。 */
    for(const store of ['rooms','walls','beams','items','albums','album_photos']){
      for(const x of await lAllObj(store)){
        if(x.projectCode) continue;          // 已屬於某個專案 → 不動（不搶別人的）
        if(x.deletedAt)   continue;          // 🔴 垃圾桶裡的不認領（避免把墓碑推上去）
        /* 🔴 邊界：認領到一道 state='existing' 的牆 ——修一之後前台不會造出這種牆，
           但若真的遇到（例如手動塞的測試資料），插入必被 RLS 擋（42501）。
           ⇒ 跳過不認領，並留一筆錯誤在狀態列（_d §10-0b：狀態與錯誤必留）。 */
        if(store==='walls' && x.state==='existing'){
          cloudErr(new Error(`有一道既有牆（state=existing）無法認領進專案 ${code}：`
            +`既有牆只能由後台匯入。這一道留在本機，不會上傳。`));
          continue;
        }
        x.projectCode = code;
        x.pending     = true;                // 標成待推，交給 cloudPullObjects() 的 ⑥ 補推
        await lPutObj(store, x);             // ⚠️ 逐筆寫入、不做交易（與需求 5 甲同一個模式）
      }
    }
  }catch(e){ CLOUD.on=false; cloudErr(e); CLOUD.busy=false; cloudStat(); return; }
  CLOUD.busy=false;
  await cloudSync();
}
function cloudLeave(){
  CLOUD.on=false; CLOUD.code=null; CLOUD.msg='';
  LS.del('deco_code');
  /* 🔴 v0.22_i R-52（甲）：行為不變（本機資料留著＝刻意設計），只補清兩個【遺漏】：
     · deco_lastsync　不清的話，離開後加入別的代碼會顯示「舊專案」的上次同步時間（相-36）
     · reidentified　 「身分已過期、已重新加入」那一句是上一次連線期間的事，不該帶到下一次
     （前·規格刀 v0.1.4.5 就指出過；報告：_關卡報告/建造者檢查_登出與測試專案設定_opus_20260930.md） */
  LS.del('deco_lastsync');

const ORPHAN_STORES = ['rooms','walls','beams','items','photos','markers','albums','album_photos'];   // 🔴 v0.1.9 R-04
async function countOrphans(){
  if(!CLOUD.on || !CLOUD.code) return 0;
  let n=0;
  try{
    for(const st of ORPHAN_STORES)
      for(const x of await lAll(st))
        if(x.projectCode != null && x.projectCode !== CLOUD.code) n++;
  }catch(e){ return 0; }
  return n;
}
/* 🔴 需求 38：上次【這台拉到雲端資料】的時間。
   ⚠️ 不是「雲端最後被改的時間」——兩者不同，文案不可寫成後者。 */
function lastSyncDate(){
  const s=LS.get('deco_lastsync'); if(!s) return null;
  const d=new Date(s); return isNaN(d.getTime())? null : d;
}
function lastSyncLabel(){
  const d=lastSyncDate();
  if(!d) return '還沒同步過';                    // 🔴 不要顯示空白或 --:--
  const z=x=>String(x).padStart(2,'0');
  return `${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}
function isStale(){
  const d=lastSyncDate();
  if(!d) return true;                            // 從來沒同步過 ⇒ 也算舊的
  return (Date.now()-d.getTime()) > STALE_MIN*60*1000;
}

       for(const x of await lAll('markers')) if(x.pending) pend++;

  const orphan = await countOrphans();
  $('syncDlg').classList.toggle('blocked', !!CLOUD.blocked);

  }else if(CLOUD.on){
    /* ⚠️ 文字一字不改（需求 13「留什麼」）；只給代碼那個 <b> 加等寬＋加寬字距的 class
       ——需求 19 ③，讓顛倒的字母看得出來。 */
    html = `<span class="on">✅ 已連線</span>　專案代碼 <b class="codetxt">${esc(CLOUD.code)}</b>`+
      `　這台的身分 <b>…${esc((CLOUD.uid||'').slice(-6))}</b><br>`+

      /* 🔴 需求 38 ①：接在那一行後面，對話框一關也還記得（存在 localStorage）。 */

      /* 🔴 需求 35-1：換身分是「資料歸屬會改變」的事件，不可以靜默。旗標，不是計數。 */
      (CLOUD.reidentified? `<br><span class="er">⚠️ 這台的身分已過期，已用專案代碼重新加入。資料沒有掉，但這台在雲端是一個新身分。</span>`:'')+
      /* 需求 34 邊界：這個環境沒給續期憑證 ⇒ 說出來，不要讓它安靜地每小時換一次身分。 */
      (CLOUD.noRefresh? `<br><span class="er">⚠️ 這個環境沒有給續期用的憑證，身分到期時會換成新的身分。</span>`:'')+
      /* 🔴 需求 36-2：孤兒資料必須看得見。N=0 整行不顯示。 */
      (orphan? `<br><span class="er">⚠️ 有 <b>${orphan}</b> 筆資料屬於別的專案代碼，不會同步。</span>`:'')+

   存檔顆粒度沿用需求 7：即時改記憶體、blur／Enter 才存；無效值加紅框、失焦還原。

      不可以只寫在同步對話框裡（她不會為了確認一個欄位去開同步對話框）。

function setSaveNote(id, txt, cls){
  const b=$(id); if(!b) return;
  b.className='savenote'+(cls?' '+cls:'');
  b.textContent=txt||'';
}
/* ╔═ 🔴 v0.20_i §4-1a ②｜「這一次有沒有動到樓高」的快照 ═══════════════════════════╗
   🔴🔴 **不可以在 blur 時才記舊值**（前刀 A-9，obs O-24 在同一個檔案的第二次）：
      pjFloorH 的 **input handler 早就把新值寫進 PROJECT.floorH 了**
      ⇒ 到 blur 時 PROJECT.floorH **已經是新值** ⇒ 任何「比對舊值」必定相等
      ⇒ hChanged 恆為 false ⇒ floor_h_updated_at 永遠不寫 ⇒ 畫面完全安靜。
   ✅ 所以快照要在 **focus**（她還沒開始打字）時拍。
   ⚠️ 也要在 refreshSettings() 填值時同步記一份 —— 因為她可能**沒有 focus 過就同步了**。 */
let _hSnapshot = null;
function refreshSettings(){
  const n=$('pjName'), h=$('pjFloorH');
  if(n && document.activeElement!==n) n.value = PROJECT.name||'';
  if(h && document.activeElement!==h){
    h.value = PROJECT.floorH==null ? '' : String(Math.round(PROJECT.floorH*10)/10);
    h.classList.remove('bad');
    _hSnapshot = PROJECT.floorH;      // 🔴 §4-1a ②：沒 focus 過就同步的那條路
  }
}
/* 存這一列（本機必存；已連線就順便推雲端）。回饋一律落在欄位旁邊。
   ╔═ 🔴 v0.20_i §4-1a ②｜`touchH` 由【呼叫端】給，不要用共用的模組變數 ═══════════╗
   🔴🔴 理由（前刀 A-10）：saveProject 是【名字與樓高共用】的存檔路徑
      （pjName 的 blur 也呼叫它）。若用一個模組變數 `_floorHBefore` 當判斷，
      它沒被初始化時是 undefined ⇒ `280 !== undefined` ⇒ hChanged=true
      ⇒ **只改名字也會蓋掉 floor_h_updated_at** ⇒ N-532（修八的目標）當場退步。
   ⇒ 誰動了樓高，誰自己說。 ╚═══════════════════════════════════════════════════╝ */
async function saveProject(opt){
  const touchH = !!(opt && opt.touchH);
  PROJECT.code = projKey();
  /* 🔴 v0.17_i §0-6 A-2 ①：這是【使用者改名字／改樓高】的那條路 ⇒ 在這裡蓋時間章。
     ⚠️ lPutProject 走 toDb('projects',…)，LEN_FIELDS.projects 只換算 floorH，
        字串欄位原樣帶過（建造者已實查：updatedAt 存得進 IndexedDB 也讀得回來）。 */
  PROJECT.updatedAt = nowISO();
  if(touchH) PROJECT.floorHUpdatedAt = nowISO();   // 🔴 §4-1a ②：只有真的動到樓高才蓋
  try{ await lPutProject(PROJECT); }
  catch(e){ setSaveNote('pjSaveNote','⚠️ 這台存不進去：'+((e&&e.message)||e),'er'); return; }
  if(CLOUD.on && CLOUD.code){
    try{
      await cloudPushProject();
      setSaveNote('pjSaveNote',`✅ 已存（這台＋雲端）　${hhmm()}`,'ok');
    }catch(e){
      /* 🔴 需求 44-c：失敗是【安靜的】(cloudErr 只寫進 CLOUD.msg) ⇒ 這裡一定要講出來。 */
      cloudErr(e);
      setSaveNote('pjSaveNote','⚠️ 還沒存上去（只存在這台）：'+((e&&e.message)||e),'er');
    }
  }else{
    setSaveNote('pjSaveNote',`✅ 已存這台　${hhmm()}　（未連線，不會上雲端）`,'ok');
  }
}
if($('pjName')){
  $('pjName').addEventListener('input',()=>{ PROJECT.name=$('pjName').value; });
  $('pjName').addEventListener('blur',()=>saveProject());
  $('pjName').addEventListener('keydown',e=>{ if(e.key==='Enter') $('pjName').blur(); });
}
if($('pjFloorH')){
  /* 🔴 v0.20_i §4-1a ②：快照在 **focus** 時拍（不是 blur，理由見 _hSnapshot 上方）。 */
  $('pjFloorH').addEventListener('focus',()=>{ _hSnapshot = PROJECT.floorH; });
  $('pjFloorH').addEventListener('input',()=>{
    const raw=$('pjFloorH').value.trim();
    if(raw===''){ PROJECT.floorH=null; $('pjFloorH').classList.remove('bad'); return; }
    const v=parseFloat(raw);
    /* 需求 7：打字中不阻止、不還原、不寫入，但無效就加紅框 */
    if(!isFinite(v)||v<=0){ $('pjFloorH').classList.add('bad'); return; }
    $('pjFloorH').classList.remove('bad');
    PROJECT.floorH=v;
  });
  $('pjFloorH').addEventListener('blur',()=>{
    const raw=$('pjFloorH').value.trim();
    const v=raw===''? null : parseFloat(raw);
    if(raw!=='' && (!isFinite(v)||v<=0)){
      // 無效 → 還原成上一個有效值，移除紅框，不存
      $('pjFloorH').value = PROJECT.floorH==null ? '' : String(Math.round(PROJECT.floorH*10)/10);
      $('pjFloorH').classList.remove('bad');
      return;
    }
    $('pjFloorH').classList.remove('bad');
    /* 🔴 v0.20_i §4-1a ②：先比對【focus 當下的快照】，再寫新值、再呼叫。
       ⚠️ 順序不可換：_hSnapshot 必須在 `PROJECT.floorH = v` 之前讀走。 */
    const before = _hSnapshot;
    PROJECT.floorH = v;                 // 🔴 留空存 null，不是 0
    _hSnapshot = v;                     // 連續編輯：下一次的基準就是這一次的結果
    saveProject({ touchH: (before !== v) });
  });
  $('pjFloorH').addEventListener('keydown',e=>{ if(e.key==='Enter') $('pjFloorH').blur(); });
}

/* 🔴 需求 44-b：樑的下垂量，一根一列，【編號與平面圖一致】（共用 beamOrder()）。 */
function beamLabel(b,i){
  const L=Math.hypot(b.x2-b.x1, b.y2-b.y1);
  return `樑${i+1}（長 ${Math.round(L)}cm × 寬 ${Math.round(b.width||20)}cm）`;
}
/* ⚠️ 宣告要在 buildBeamRows 之前：let 沒有 hoist 到可用狀態（TDZ），
   放在下面會讓「先跑到 buildBeamRows」的路徑丟 ReferenceError。 */
let _beamReturnId=null;
function buildBeamRows(){
  const box=$('beamRows'); if(!box) return;
  box.innerHTML='';
  const list=beamOrder();
  if(!list.length){
    const d=document.createElement('div'); d.className='savenote';
    d.textContent='目前沒有樑。';
    box.appendChild(d); return;
  }
  list.forEach((b,i)=>{
    const row=document.createElement('div'); row.className='setrow';
    row.dataset.beam=b.id;
    const k=document.createElement('div'); k.className='k'; k.textContent=beamLabel(b,i);
    const ip=document.createElement('input');
    ip.setAttribute('inputmode','decimal');
    ip.placeholder='（未填）';
    ip.value = b.drop==null ? '' : String(Math.round(b.drop*10)/10);
    ip.addEventListener('input',()=>{
      const raw=ip.value.trim();
      if(raw===''){ ip.classList.remove('bad'); return; }
      const v=parseFloat(raw);
      ip.classList.toggle('bad', !isFinite(v)||v<=0);
    });
    ip.addEventListener('blur',async()=>{
      const raw=ip.value.trim();
      const v=raw===''? null : parseFloat(raw);
      if(raw!=='' && (!isFinite(v)||v<=0)){
        ip.value = b.drop==null ? '' : String(Math.round(b.drop*10)/10);
        ip.classList.remove('bad'); return;
      }
      ip.classList.remove('bad');
      if(b.drop===v) return;
      b.drop=v;                        // 🔴 留空存 null ⇒ 平面圖那根變回灰色虛線
      try{
        await saveBeam(b);
        setSaveNote('beamSaveNote',`✅ ${beamLabel(b,i)} 已存　${hhmm()}`,'ok');
      }catch(e){
        cloudErr(e);
        setSaveNote('beamSaveNote',`⚠️ ${beamLabel(b,i)} 還沒存上去：`+((e&&e.message)||e),'er');
      }
      await reloadObjects();
      render(); buildBeamRows();
    });
    ip.addEventListener('keydown',e=>{ if(e.key==='Enter') ip.blur(); });
    const pv=document.createElement('button'); pv.className='btn'; pv.textContent='預覽';
    /* 🔴 v0.13_i 修九 ＋ v0.14_i 補四／補五：
         ① 先設 S.beamFocus，【再】setTab('plan',{keepFocus:true})（否則剛設的立刻被清掉）
         ② 一併 select(null)：這次進平面圖是【來看樑的】，
            否則選中家具面板（.sel）會跟返回列（.pinning）搶同一個 bottom:56px
         ③ 把鏡頭帶到那根樑，否則亮了也看不到 */
    pv.onclick=()=>{
      select(null);
      S.beamFocus=b.id;
      setTab('plan',{keepFocus:true});
      centerOnBeam(b);
      refreshBeamBar();
      render(); syncSel();
    };
    row.appendChild(k); row.appendChild(ip); row.appendChild(pv);
    box.appendChild(row);
  });
  /* 從平面圖按〔返回設定〕回來時，捲回原本那一列 */
  if(_beamReturnId){
    const el2=box.querySelector(`[data-beam="${_beamReturnId}"]`);
    _beamReturnId=null;
    if(el2) try{ el2.scrollIntoView({block:'center'}); }catch(e){}
  }
}
/* 🔴 修九：樑在畫面外時要把鏡頭帶過去（只平移、不動 zoom，沿用 ensureVisible 的原則：
   zoom 是使用者剛剛自己調的，而長度比例尺由 zoom 實算）。 */
function centerOnBeam(b){
  const {w,h}=svgSize();
  if(!(w>0&&h>0)) return;
  const cx=(b.x1+b.x2)/2, cy=(b.y1+b.y2)/2;
  const s=w2s(cx,cy);
  if(s.x>=SVG_PAD && s.y>=SVG_PAD && s.x<=w-SVG_PAD && s.y<=h-SVG_PAD) return;  // 看得到就不動
  S.panX = w/2 - cx*S.zoom;
  S.panY = h/2 - cy*S.zoom;
}
if($('beamBack')) $('beamBack').onclick=()=>{
  _beamReturnId = S.beamFocus;          // 記住要捲回哪一列
  S.beamFocus = null;                   // 離開平面圖 ⇒ 樑不再亮
  setTab('proj');                       // setTab 內會呼叫 refreshProj → buildBeamRows
  refreshBeamBar();
};
/* 🔴 v0.07_i 需求 25：診斷列。
   ⚠️ 畫面尺寸是 window.innerWidth×innerHeight（【CSS 像素】），不是螢幕解析度——
      Ali 要判斷的是「版面在她那台上有多少空間」，不是硬體規格。
   ⚠️ userAgent 認不出來 → 印「未知」，不要印空白（_d §10-0b：狀態必須看得出來）。 */
function uaShort(){
  const u=navigator.userAgent||'';
  let eng='未知', plat='未知';
  if(/Edg\//.test(u)) eng='Edge';
  else if(/OPR\//.test(u)) eng='Opera';
  else if(/SamsungBrowser/.test(u)) eng='Samsung';
  else if(/Firefox\//.test(u)) eng='Firefox';
  else if(/Chrome\//.test(u)) eng='Chrome';
  else if(/Safari\//.test(u)) eng='Safari';
  if(/Android/.test(u)) plat='Android';
  else if(/iPhone|iPad|iPod/.test(u)) plat='iOS';
  else if(/Windows/.test(u)) plat='Windows';
  else if(/Mac OS X|Macintosh/.test(u)) plat='macOS';
  else if(/Linux/.test(u)) plat='Linux';
  return eng+'/'+plat;
}
