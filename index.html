/* ══════════════════════════════════════════════════════════════
   需求 2｜本機持久化（IndexedDB）
   🔴 DB_VER 升到 2：加 rooms / walls / beams / items 四個 store。
   🔴 R-6：onblocked 沒掛 → Promise 永不 resolve 也永不 reject → 畫面停在「讀取中…」
   ══════════════════════════════════════════════════════════════ */
/* 🔴 v0.13_i 修三：DB_VER 2 → 3（新增 projects store，keyPath 用 code）。
   ⚠️ 升級後第一次打開若另一個分頁還開著舊版本 ⇒ onblocked 會說話（只發生一次）。 */
const DB_NAME='deco_probe', DB_VER=3;
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{const d=e.target.result;
      ['photos','markers','rooms','walls','beams','items'].forEach(st=>{
        if(!d.objectStoreNames.contains(st)) d.createObjectStore(st,{keyPath:'id'});
      });
      /* 🔴 v0.13_i 修三：projects 的 keyPath 是 code（它沒有 id，也沒有 deleted_at
         ⇒ 不可以套 stampObj／softDelete，走一條專屬的小函式）。 */
      if(!d.objectStoreNames.contains('projects'))
        d.createObjectStore('projects',{keyPath:'code'});
    };
    r.onsuccess=e=>{
      _db=e.target.result;
      /* 另一個分頁要升級時，這一邊要主動讓位，否則那一邊會被 blocked 卡住 */
      _db.onversionchange=()=>{ try{_db.close();}catch(err){} _db=null;
        showDbNotice('資料庫版本被另一個分頁更新了。請重新載入這一頁。'); };
      res(_db);
    };
    r.onerror=e=>rej(e.target.error);
    /* 🔴 這一條不做會【靜默卡死】：另一個分頁還開著舊版本 ⇒ 升級被擋 */
    r.onblocked=()=>rej(new Error(
      '另一個分頁還開著舊版本，資料庫升級被擋住。請把其他分頁關掉再重新載入。'));
  });
}
function showDbNotice(msg){
  S.dataErr=msg;
  try{ render(); }catch(e){}
  const b=$('pstat'); if(b) b.innerHTML='🔴 '+esc(msg);
}
function tx(store,mode,fn){
  return openDB().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store);
    const req=fn(s);
    t.oncomplete=()=>res(req&&req.result);
    t.onerror=()=>rej(t.error);
  }));
}
/* ⚠️ id 必須是【合法 UUID】——雲端的 id 是 uuid 型別，非 UUID 會被拒，
   而錯誤訊息看不出是 id 的問題（研究員 R-5）。🔴 種子資料也一律走這裡。 */
function uid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16));
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
/* ── 本機（IndexedDB）低階：只在資料層內部使用，畫面層不呼叫 ── */
async function lPut(st,rec){ rec.id=rec.id||uid(); await tx(st,'readwrite',s=>s.put(rec)); return rec.id; }
async function lGet(st,id){ return tx(st,'readonly',s=>s.get(id)); }
async function lAll(st){ return tx(st,'readonly',s=>s.getAll()); }
async function lDel(st,id){ return tx(st,'readwrite',s=>s.delete(id)); }

/* ══════════════════════════════════════════════════════════════
   需求 4｜單位換算（_d §3-6b）
     資料庫（IndexedDB ＋ 雲端）→ 公釐、整數
     記憶體與幾何運算            → 公分、浮點
     換算【只發生在資料層邊界】
   🔴 含 anchor 內的 along / off / x / y —— 唯一一個「嵌在 JSON 裡的長度」，最容易漏。
   ══════════════════════════════════════════════════════════════ */
const toMM   = v => (v==null || v==='') ? null : Math.round(Number(v)*10);
const fromMM = v => (v==null) ? null : Number(v)/10;

/* 要換算的長度欄位（逐一列出，不可漏）。
   ❌ 不換算：rot（度）、price（元）、color、name、note、所有布林、所有時間 */
const LEN_FIELDS = {
  rooms:['slabH'],
  walls:['x1','y1','x2','y2','thickness','height'],
  beams:['x1','y1','x2','y2','width','drop'],
  /* 🔴 需求 46：zBase（離地高度）＝ 六處換算的第六處。記憶體欄位名沿用 slabH 的 camelCase。 */
  items:['w','d','h','zBase'],
  /* 🔴 v0.13_i 修三：第五處。floorH 記憶體是公分、雲端 floor_h 是公釐。 */
  projects:['floorH']
};
function anchorToMM(a){
  if(!a) return null;
  /* 🔴 v0.13_i 修四 4-a：這兩個函式不是 Object.assign，是【重建物件】
     ⇒ 沒有列出來的欄位會被安靜吃掉（side 存進記憶體 → 第一次 saveItem → 欄位消失）。
     🔴 side 不是長度，【不可以乘 10】。 */
  if(a.type==='wall') return {type:'wall', wall:a.wall,
    along:toMM(a.along), off:toMM(a.off||0), side:(a.side ?? null)};
  return {type:'free', x:toMM(a.x), y:toMM(a.y)};
}
function anchorFromMM(a){
  if(!a) return {type:'free', x:0, y:0};
  if(a.type==='wall') return {type:'wall', wall:a.wall,
    along:fromMM(a.along)||0, off:fromMM(a.off)||0, side:(a.side ?? null)};
  return {type:'free', x:fromMM(a.x)||0, y:fromMM(a.y)||0};
}
/* 記憶體物件（公分） → IndexedDB 紀錄（公釐整數） */
function toDb(store,obj){
  const o=Object.assign({},obj);
  (LEN_FIELDS[store]||[]).forEach(k=>{ o[k]=toMM(obj[k]); });
  if(store==='items') o.anchor=anchorToMM(obj.anchor);
  /* 🔴 六處換算之三（v0.13_i 修五）：LEN_FIELDS 是【逐欄位純量】換算，吃不下陣列
     ⇒ poly 必須比照 anchorToMM 另外寫一對。 */
  if(store==='rooms') o.poly=polyToMM(obj.poly);
  return o;
}
/* IndexedDB 紀錄（公釐整數） → 記憶體物件（公分浮點） */
function fromDb(store,rec){
  const o=Object.assign({},rec);
  (LEN_FIELDS[store]||[]).forEach(k=>{ o[k]=fromMM(rec[k]); });
  if(store==='items') o.anchor=anchorFromMM(rec.anchor);
  /* 🔴 六處換算之四 —— v0.13_i 修五明寫這是【最容易漏的一格】。
     漏了它，cloudJoin 的認領迴圈（lAllObj → lPutObj 原地來回）每跑一次就差 10 倍。 */
  if(store==='rooms') o.poly=polyFromMM(rec.poly);
  return o;
}
/* 🔴 需求 4｜時區：一律存 ISO（UTC），顯示時才轉本地。
   現況 W1（寫 '2026-09-08 10:30' 無時區）／W2（把 UTC 當本地印）各偏 8 小時。 */
const nowISO = ()=> new Date().toISOString();
function fmtLocal(iso){
  if(!iso) return '';
  const s=String(iso);
  /* ⚠️ 舊紀錄的 addedAt 是無時區字串 → new Date() 會得到 Invalid Date。
     邊界處理：沒有 T 也沒有 Z → 原樣輸出（那是舊紀錄，isLegacy() 已經會標它）。 */
  if(s.indexOf('T')<0 && s.indexOf('Z')<0) return s;
  const d=new Date(s);
  if(isNaN(d.getTime())) return s;
  const z=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} `+
         `${z(d.getHours())}:${z(d.getMinutes())}`;
}

/* ── 物件資料層（與照片線同構）──
   🔴 save* 與 savePhoto() 同一個模式：① 寫本機 ② 標 pending ③ 背景推雲端（失敗不擋畫面）
   🔴 delete* 【不是】。delete* 一律走軟刪除（需求 5 / 6 / 7），
      不可抄 deletePhoto() 的 lDel()。（v0.04_i §6） */
async function lAllObj(st){ return (await lAll(st)).map(r=>fromDb(st,r)); }
async function lAllLive(st){ return (await lAllObj(st)).filter(x=>!x.deletedAt); }
async function lGetObj(st,id){ const r=await lGet(st,id); return r? fromDb(st,r) : null; }
async function lPutObj(st,obj){ return lPut(st, toDb(st,obj)); }

function stampObj(o){
  o.id = o.id || uid();
  /* 🔴 需求 36（obs O-19）：只有【還沒歸屬】的才蓋章。
     「認領」只能由 cloudJoin 明確做，不可以靠「順便存檔」偷偷改變一筆資料屬於誰。
     ⚠️ 判斷用 == null（同時涵蓋 null 與 undefined）；不可用 !o.projectCode，
        空字串也會被當成「沒歸屬」而被蓋掉。 */
  if(o.projectCode == null) o.projectCode = CLOUD.code || null;
  o.updatedAt   = nowISO();
  o.appVer      = APP_VER;
  if(o.deletedAt===undefined) o.deletedAt=null;
  /* 🔴 v0.05_i §3（修三）：createdAt 只在【新建】時寫入（見 newObj()），
     這裡【一個字都不准動它】——之後任何更新、pull 覆蓋都要保留。
     🔴 也【不准】在這裡幫舊資料補一個假的 createdAt（obs O-13：偽裝成有資料）。 */
  /* ⚠️ 與 savePhoto 的一點差異（刻意）：物件【會被反覆修改】，
     每次存都要重新標 pending，否則改過的值永遠推不上去（N-59）。 */
  if(CLOUD.code){ o.pending=true; o.synced=false; }
  return o;
}
/* 🔴 v0.05_i §3（修三）：唯一可以寫 createdAt 的地方。
   四種物件（Room/Wall/Beam/Item）新建時都要經過這裡。
   ⚠️ 只有「這一筆真的是現在被造出來的」才准蓋這個章——
      從雲端 pull 回來的那條路不走這裡（它帶著雲端的 created_at，見 fromRow）。 */
function newObj(o){
  o.id = o.id || uid();
  o.createdAt = nowISO();
  return o;
}
async function saveRoom(r){ stampObj(r); await lPutObj('rooms',r);
  if(CLOUD.on) cloudPushObj('rooms',r.id).catch(e=>cloudErr(e)); return r.id; }
async function saveWall(w){ stampObj(w); await lPutObj('walls',w);
  if(CLOUD.on) cloudPushObj('walls',w.id).catch(e=>cloudErr(e)); return w.id; }
async function saveBeam(b){ stampObj(b); await lPutObj('beams',b);
  if(CLOUD.on) cloudPushObj('beams',b.id).catch(e=>cloudErr(e)); return b.id; }
async function saveItem(i){ stampObj(i); await lPutObj('items',i);
  if(CLOUD.on) cloudPushObj('items',i.id).catch(e=>cloudErr(e)); return i.id; }

/* ══════════════════════════════════════════════════════════════
   🔴 v0.12_i 需求 44 ＋ v0.13_i 修三｜projects 的資料層（專屬小函式）
   ⚠️ projects 沒有 id、沒有 deleted_at、沒有 pending/synced
      ⇒ 【不要】套 stampObj／softDelete／cloudPushObj，那三個都假設有 id 與墓碑。
   🔴 本批明確【不含】pull —— cloudPullObjects 的 store 清單一個字不改。
      ⇒ 代價：兩台之間樓高與專案名字不會自動同步。這是刻意的取捨（形狀套不進既有迴圈），
        已列進交付必講清單 ⑧。
   ══════════════════════════════════════════════════════════════ */
/* 未連線時也要存得住 ⇒ 用一個不會與任何真實代碼衝突的本機鍵。
   ⚠️ A 類歧義：_i 沒有寫「還沒連線時這一列的 key 是什麼」，這裡取保守解（只存這台）。 */
const LOCAL_PROJ_KEY='_local';
const projKey = ()=> CLOUD.code || LOCAL_PROJ_KEY;
async function lGetProject(code){
  const rec=await tx('projects','readonly',s=>s.get(code));
  return rec ? fromDb('projects',rec) : null;
}
async function lPutProject(p){
  await tx('projects','readwrite',s=>s.put(toDb('projects',p)));
}
/* 雲端那一列（只有一列，key 是 code）。pull 與 push 的守衛都要讀它。 */
async function cloudFetchProjectRow(){
  const r=await sbFetch('/rest/v1/projects?select=*&code=eq.'+encodeURIComponent(CLOUD.code));
  if(!r.ok) throw new Error('讀雲端 projects 失敗：'+(await r.text()).slice(0,200));
  const rows=await r.json();
  return (Array.isArray(rows) && rows[0]) ? rows[0] : null;
}
/* ╔═ 🔴 v0.17_i 修八 ②③｜送出前先【真的比對】，而且 null 不送 ════════════════════╗
   舊版：整列 upsert，updated_at 只是【寫進去】，從來沒有拿來比對
   ⇒ 手機沒有樓高 → 在手機只改專案名字 → 整列推上去、floor_h 寫成 null
     → 把電腦填的樓高蓋掉，而畫面同時顯示「✅ 已存」。
   🔴 ③ floor_h 為 null 時【不要送這個欄位】——與 v0.13_i 修二的 poly 是同一個形狀
      （polyToMM(undefined) 回 null ⇒ 把雲端洗掉）。同一個坑，不要再踩第二次。 ╚═══════╝ */
async function cloudPushProject(){
  if(!CLOUD.on || !CLOUD.code) return;
  const cloudRow = await cloudFetchProjectRow();
  const mine   = PROJECT.updatedAt ? new Date(PROJECT.updatedAt).getTime() : NaN;
  const theirs = (cloudRow && cloudRow.updated_at) ? new Date(cloudRow.updated_at).getTime() : NaN;
  /* 🔴 本機不比雲端新 ⇒ 不要推（相同也不推，沿用「晚的贏、相同不動」）。
     ⚠️ mine 是 NaN 只可能發生在「這台從來沒存過」——那時本來就沒有東西好推，
        但為了不把使用者剛按下的那次存檔吃掉，saveProject 一定會先寫 updatedAt（見下）。 */
  if(cloudRow && isFinite(mine) && isFinite(theirs) && mine <= theirs) return;
  const row={ code:CLOUD.code, name:PROJECT.name||null,
              updated_at: PROJECT.updatedAt || nowISO() };
  if(PROJECT.floorH != null) row.floor_h = toMM(PROJECT.floorH);   // 🔴 有值才送
  const r=await sbFetch('/rest/v1/projects?on_conflict=code',{method:'POST',
    headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify(row)});
  if(!r.ok) throw new Error('寫入雲端 projects 失敗：'+(await r.text()).slice(0,200));
}
/* ╔═ 🔴 v0.17_i 修八 ① ＋ §0-6 A-1｜projects 走【自己的一支】，不進 cloudPullObjects ══╗
   🔴 為什麼不可以加進那個迴圈（前刀查碼、冷讀刀複驗）：
     · fromRow 的結構是 rooms→walls→beams→【否則落到 items】（最後一個 return 沒有守衛）
       ⇒ 傳 'projects' 進去，回來的是一個 items 形狀的物件，floor_h 沒有人讀
     · lmap = new Map(local.map(x=>[x.id,x]))，而 projects 的 keyPath 是 code、每一列沒有 id
       ⇒ 全部 key 是 undefined ⇒ 互相蓋掉
     · lPutObj → lPut 第一行 rec.id = rec.id || uid() ⇒ 往 keyPath='code' 的 store
       塞一個只有 id 沒有 code 的物件
   ⇒ 症狀：按〔🔄 同步〕沒有任何錯誤訊息，專案那一列被寫成垃圾
     ⇒ 下一次 loadProject() 讀回來 floorH 是 null ⇒ 設定頁變「（未填）」，
       而畫面同時顯示「✅ 同步完成　雲端與這台一致」
     ＝ **修八自己要修的那個症狀，被修八本身重新造出來一次**（O-20）。
   🔴 所以這一支：自己打 API、自己做欄位對應、不走 fromRow、不用 lPutObj／stampObj／softDelete。╚═╝ */
async function cloudPullProject(){
  if(!CLOUD.on || !CLOUD.code) return;
  syncStep('專案設定…');
  const row=await cloudFetchProjectRow();
  if(!row) return;                                  // 雲端還沒有這一列 ⇒ 沒事可拉
  const local=await lGetProject(CLOUD.code);
  const theirs = row.updated_at ? new Date(row.updated_at).getTime() : NaN;
  const mine   = (local && local.updatedAt) ? new Date(local.updatedAt).getTime() : NaN;
  if(isFinite(mine) && isFinite(theirs) && theirs <= mine) return;   // 晚的贏；相同不動
  const merged={
    code: CLOUD.code,
    name: (row.name==null ? (local? local.name : '') : row.name),
    /* 🔴 雲端 floor_h 是 null ＝【沒有人填過】（②③ 保證 null 不會被送上去）
       ⇒ 不可以用它洗掉本機已經有值的那一格（與 BACKFILL 白名單同一個判準）。 */
    floorH: (row.floor_h==null ? (local? local.floorH : null) : fromMM(row.floor_h)),
    updatedAt: row.updated_at || nowISO()
  };
  await lPutProject(merged);
  PROJECT = merged;                                 // 記憶體也要跟上（O-24：兩層都要看）
}
async function loadProject(){
  try{
    const p=await lGetProject(projKey());
    /* 🔴 丙-5：這是【重建一個新的物件字面值】，不是 Object.assign
       ⇒ 沒有列出來的欄位會被安靜吃掉。而 loadProject() 被 reloadObjects() 最後一行
         無條件呼叫（boot／每次同步／每次擺上圖／每次刪房間都會跑）
       ⇒ 漏了 updatedAt 的話它永遠是 undefined，A-2 修的那個坑原封不動回來。
       🔴 兩個分支都要有 updatedAt。（同形前例：anchorToMM/anchorFromMM 的註解。） */
    PROJECT = p ? {code:p.code, name:p.name||'', floorH:(p.floorH==null?null:p.floorH),
                   updatedAt:(p.updatedAt||null)}
                : {code:projKey(), name:'', floorH:null, updatedAt:null};
  }catch(e){ PROJECT={code:projKey(), name:'', floorH:null, updatedAt:null}; }
}

/* delete*：🔴 軟刪除（進垃圾桶），不是 lDel */
async function softDelete(store, arr, id, saver){
  const o=arr.find(x=>x.id===id) || await lGetObj(store,id);
  if(!o) return;
  o.deletedAt=nowISO();
  await saver(o);
}
async function deleteRoom(id){ return softDelete('rooms',ROOMS,id,saveRoom); }
async function deleteWall(id){ return softDelete('walls',WALLS,id,saveWall); }
async function deleteBeam(id){ return softDelete('beams',BEAMS,id,saveBeam); }
async function deleteItem(id){ return softDelete('items',FURN,id,saveItem); }

/* ── 需求 4／15｜啟動時一次載入 ──
   🔴 順序寫死（v0.04_i §1）：
      lAll × 四個 store → pull（若已連線）→ seedIfEmpty → purgeTrash
      ⚠️ pull 失敗（丟錯）→ 【不要】跑 seedIfEmpty，讓使用者看到錯誤訊息。
         理由：pull 失敗時「本機全空」不代表「這個專案是空的」。 */
async function reloadObjects(){
  ROOMS_ALL = await lAllObj('rooms');      // 🔴 含墓碑，給 roomOrder() 用（v0.05_i §3 / N-93）
  ROOMS = await lAllLive('rooms');
  WALLS = await lAllLive('walls');
  BEAMS = await lAllLive('beams');
  FURN  = await lAllLive('items');
  /* 🔴 需求 41 邊界 ＋ v0.13_i 修七 F-29：poly 少於 3 點或格式壞掉 → 不畫，但【不可靜默】。
     ⚠️ 放在這裡重算（而不是畫的時候寫），是為了讓它跟著資料走、
        而且不會被「同步成功就清空」那條路清掉（那是 S.dataErr 的行為）。
     邊界：poly 為 null ＝ 正常情況（種子／手建的房間），不是錯誤，不報。 */
  const bad=ROOMS.filter(r=>r.poly!=null && !validPoly(r.poly)).map(r=>r.name||'未命名');
  S.geomErr = bad.length
    ? `有 ${bad.length} 間房的分區形狀讀不出來（${bad.slice(0,3).join('、')}${bad.length>3?'…':''}），那幾塊不會畫出來。`
    : '';
  /* 🔴 修九邊界：beamFocus 指到的樑被刪掉 ⇒ 清掉，不炸。 */
  if(S.beamFocus && !BEAMS.some(b=>b.id===S.beamFocus)) S.beamFocus=null;
  await loadProject();
}
async function loadAll(){
  await reloadObjects();
  let pulled=false;
  if(CLOUD.on){
    await cloudPull();            // 丟錯 → 由呼叫端接，且不會走到 seed
    await reloadObjects();
    pulled=true;
  }
  if(!CLOUD.on || pulled) await seedIfEmpty();
  await purgeTrash();
  await reloadObjects();
}

/* ══════════════════════════════════════════════════════════════
   需求 5｜種子範例、兩種清空、垃圾桶
   ══════════════════════════════════════════════════════════════ */
const SEED_ROOM_NAME='範例房間（可刪）';
/* 🔴 v0.09_i 需求 28：判準是【有沒有存活的房間】，不是「四種物件全空」。
   ⚠️ 舊判準造出一條【出不去的狀態】（Ali 兩台真機踩到、claude 本機重現）：
        清清單 → 建一筆家具 → 重新載入 → rooms:0, furn:1 ⇒ 種子【不生】
        而 v0.1.4 刻意沒有「新增房間」UI ⇒ 沒有房間、也沒有任何辦法生一個出來
   ⇒ 種子的目的就是「給一個可以放東西的房間」；家具存不存在與這個目的無關，
     卻會把它鎖死 ⇒ 判準只看房間。
   ⚠️ ROOMS 已經是【存活】的（lAllLive 過濾掉 deletedAt）。
   邊界：有房間但沒有牆 → 不生（房間在就不生，牆的有無不是種子的判準）。 */
async function seedIfEmpty(){
  if(ROOMS.length) return;
  const rid=uid();
  const room=newObj({ id:rid, name:SEED_ROOM_NAME, slabH:300, note:'',
    projectCode:CLOUD.code||null, synced:false, pending:false,
    appVer:APP_VER, deletedAt:null });
  await saveRoom(room);
  // 矩形 400×300 公分（＝4000×3000 公釐）、state='proposed'、isBoundary=true、thickness=10cm
  const P=[[0,0],[400,0],[400,300],[0,300]];
  for(let i=0;i<4;i++){
    const a=P[i], b=P[(i+1)%4];
    await saveWall(newObj({ id:uid(), room:rid, x1:a[0],y1:a[1],x2:b[0],y2:b[1],
      /* 🔴 v0.05_i §1（修一）：種子牆是 state:'proposed'，不是 'existing'。
         _d §4-2c：existing ＝ 後台匯入、前台唯讀；種子是【前台自己造的】
         ⇒ 它在定義上就不可能是 existing。
         ⚠️ 寫 'existing' 的後果（建造者實測推出來的）：需求 3 的 insert 政策
            with check (… and state='proposed') 會回 42501 ⇒ 四道牆永遠 pending
            ⇒「有 N 筆未上傳」永遠不歸零。 */
      thickness:10, height:null, isBoundary:true, state:'proposed',
      total:null, note:'', isPlaced:true, isBudgeted:false,
      projectCode:CLOUD.code||null, synced:false, pending:false,
      appVer:APP_VER, deletedAt:null }));
  }
  // 🔴 家具 ×0（零件）。要試就自己建一件——那正是本輪的功能。
  await reloadObjects();
}
/* 種子還沒被動過？（提示句只留到使用者建了第一件東西為止） */
function isSeedPristine(){
  return FURN.length===0 && ROOMS.length===1 && ROOMS[0].name===SEED_ROOM_NAME;
}

/* 甲｜清擺設：什麼都不刪，只把所有 Item 的 isPlaced 設成 false。
   🔴 anchor 保留！只是不擺（它記得上次擺哪，切回來就回原位）。
   ⚠️ 逐筆更新、逐筆標 pending，不做交易（探針階段）。 */
async function clearPlacement(){
  for(const f of FURN.slice()){ f.isPlaced=false; await saveItem(f); }
  await reloadObjects();
}
/* ══ 🔴 v0.12_i 需求 47 ＋ v0.13_i 修六｜清清單不准動【房子本身】══
   判準是「這一筆是不是房子本身（＝匯入來的）」，🔴【不是 state】。
   ⚠️ 用 state 的後果：匯入的 33 道裡有 5 道是 proposed（她 SVG 裡的隔間牆）
      ⇒ 不會被跳過 ⇒ 被軟刪 ⇒ 而 RLS 允許改 proposed ⇒【沒有任何錯誤訊息】
      ⇒ 而舊的 N-198 只檢查「28 道 existing 還在」⇒ 綠燈通過，五分之一的房子已經不見了。
   🔴 這條依賴「poly 有補進本機」（v0.13_i 修二）：若 poly 沒下來，isHouseRoom 全 false
      ⇒ 10 間真實房間會被全部軟刪，而 rooms 的 RLS 不會擋。兩條要一起看。
      ⇒ 防線＝確認框先把「保留 X 間房」講出來（v0.14_i 補七 N-10b，obs O-18 規則①）。 */
/* 牆：匯入的 room_id 一律 NULL。
   ⚠️ v0.14_i 補七 N-10a：加一層便宜保險 `|| state==='existing'`，成本一個 ||，
      同時擋住 D1-8 的原始 42501 路徑（對 existing 牆送 UPDATE 會被 RLS 拒 28 次）。 */
const isHouse     = w => (w && (w.room == null || w.state === 'existing'));
/* 房間：有 poly ＝ 從 SVG 匯入的真實分區，不是她擺的東西。 */
const isHouseRoom = r => (r && validPoly(r.poly));
/* 樑：全部都是匯入的 ⇒ clearAll 一律跳過。 */

/* 乙｜清清單：只清【她擺的東西】；房子（既有牆、樑、有 poly 的分區）留著。
   🔴 留什麼：photos / markers 【完全不動】（照片不屬於清單）。 */
async function clearAll(){
  for(const r of ROOMS.slice()){ if(isHouseRoom(r)) continue; r.deletedAt=nowISO(); await saveRoom(r); }
  for(const w of WALLS.slice()){ if(isHouse(w))     continue; w.deletedAt=nowISO(); await saveWall(w); }
  /* 🔴 樑跟既有牆同性質（房子本身）⇒ 一根都不刪。 */
  for(const f of FURN.slice()) { f.deletedAt=nowISO(); await saveItem(f); }
  await reloadObjects();
  /* 🔴 v0.09_i 需求 29：立刻重生種子，不要等下一次重新載入。
     若清完之後畫面上 0 個房間，而重生只發生在下一次載入

        ⇒ 這只是把「回來」的時機從【下次載入】提前到【當下】，不是新行為。
     ⚠️ 不要加「範例房間已重新產生」這種說明句（_d §10-0b）——她看得到它出現在畫面上。 */

}
/* 垃圾桶｜真刪除的兩個條件【先到先算】：① 超過 20 筆刪最舊 ② deletedAt 超過 1 個月
   🔴 只刪【本機】那一列。雲端那一列【保留】當墓碑（v0.04_i §2）——
      兩邊都刪會讓墓碑消失，另一台未到期的那筆會把它重新插回雲端 ⇒ 復活迴路。 */
async function purgeTrash(){
  const MONTH=30*24*3600*1000, now=Date.now();
  for(const st of ['rooms','walls','beams','items']){
    const all=await lAllObj(st);
    const trash=all.filter(x=>x.deletedAt)
      .sort((a,b)=>String(a.deletedAt).localeCompare(String(b.deletedAt)));
    const kill=[];
    const rest=[];
    for(const x of trash){
      const t=new Date(x.deletedAt).getTime();
      if(isFinite(t) && now-t>MONTH) kill.push(x.id); else rest.push(x);
    }
    while(rest.length>20) kill.push(rest.shift().id);
    for(const id of kill) await lDel(st,id);        // 🔴 只刪本機
  }
}
async function trashSize(){
  let n=0;
  for(const st of ['rooms','walls','beams','items'])
    n += (await lAllObj(st)).filter(x=>x.deletedAt).length;
  return n;
}

/* ⚠️ O-14：fetch 被 CSP 擋掉時丟的是 TypeError，訊息看起來像網路問題。
   要把它與「真的連不上」分開講，否則測試的人會以為程式壞了。 */
async function sbFetch(path, opt){
  opt = opt || {};
  const h = Object.assign({ apikey: CLOUD.key }, opt.headers||{});
  if(CLOUD.tok) h.Authorization = 'Bearer '+CLOUD.tok;
  let r;
  try{
    r = await fetch(CLOUD.url+path, Object.assign({}, opt, {headers:h}));
  }catch(e){
    CLOUD.blocked = true;
    throw new Error('對外連線失敗（可能被這個環境的安全政策擋住）：'+e.message);
  }
  CLOUD.blocked = false;
  /* 🔴 需求 34：401 先【續期】，續不動才換身分。
     ⚠️ path.indexOf('/auth/')<0 這一行守衛不准動——refreshSession 本身也走 sbFetch，
        少了它就會遞迴。 */
  if(r.status===401 && !opt._retry && path.indexOf('/auth/')<0){
    const okRefresh = await refreshSession();
    if(!okRefresh){
      await signInAnon(true);                   // 身分過期且續不動 → 重新拿一個
      /* 🔴 R-1：新身分是【全新的 uid】，不在 members 裡。
         少了這一步，接下來每個讀取都會回 200 []（有權限問題，但長得像「雲端空了」）。 */
      if(CLOUD.code && !_rejoining){
        _rejoining = true;
        try{ await joinProject(CLOUD.code); }
        finally{ _rejoining = false; }          // ⚠️ 防遞迴：joinProject 本身也走 sbFetch
      }
      CLOUD.reidentified = true;                // 🔴 需求 35-1：這件事不可以靜默
    }
    return sbFetch(path, Object.assign({}, opt, {_retry:true}));
  }
  return r;
}
let _rejoining = false;

/* 🔴 需求 35-2：舊格式（沒有 v:2 ＝ 沒有 refresh_token）的 session 一律丟棄。
   ⚠️ 只丟【身分】，不丟 deco_code——代碼是 Ali 唯一的鑰匙。 */
function dropLegacySession(){
  try{
    const raw = LS.get('deco_sess');
    if(!raw) return;
    const j = JSON.parse(raw);
    if(!j || j.v !== 2) LS.del('deco_sess');
  }catch(e){ LS.del('deco_sess'); }             // 壞掉的也丟
}

/* 🔴 需求 34：用 refresh_token 續期。
   ⚠️ 回來的 refresh_token 是【新的】，一定要覆蓋存起來，否則下一次續期必失敗。
   ⚠️ in-flight 共用：兩個請求同時 401 時只能真的續一次，否則第二個拿到已被輪替掉的
      舊 token ⇒ 失敗 ⇒ 白白掉回重新註冊。 */
let _refreshing = null;
async function refreshSession(){
  if(_refreshing) return _refreshing;
  _refreshing = (async ()=>{
    let saved={};
    try{ saved = JSON.parse(LS.get('deco_sess')||'{}') || {}; }catch(e){ saved={}; }
    if(!saved.r) return false;                  // 沒有 refresh token → 續不了
    let r;
    try{
      r = await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ refresh_token: saved.r })});
    }catch(e){ return false; }                  // 離線／被擋：不換身分，錯誤由外層那條路報
    if(!r.ok) return false;                     // 400／401：token 失效或被撤銷
    let j={}; try{ j = await r.json(); }catch(e){ return false; }
    if(!j.access_token) return false;
    CLOUD.tok = j.access_token;
    CLOUD.uid = (j.user && j.user.id) || CLOUD.uid;
    LS.set('deco_sess', JSON.stringify({ v:2, t:j.access_token,
            r: j.refresh_token || saved.r, u: CLOUD.uid }));
    return true;
  })().finally(()=>{ _refreshing = null; });
  return _refreshing;
}

async function signInAnon(force){
  dropLegacySession();                          // 🔴 需求 35-2：早於任何還原邏輯
  if(CLOUD.tok && !force) return;
  if(!force){
    const saved=LS.get('deco_sess');
    if(saved){ try{ const j=JSON.parse(saved);
      if(j && j.v===2 && j.t){ CLOUD.tok=j.t; CLOUD.uid=j.u; return; } }catch(e){} }
  }
  const r=await sbFetch('/auth/v1/signup',{method:'POST',
    headers:{'Content-Type':'application/json'}, body:'{}'});
  const t=await r.text();
  let j={}; try{ j=JSON.parse(t); }catch(e){}
  if(!r.ok || !j.access_token)
    throw new Error('拿匿名身分失敗（Anonymous sign-ins 開了嗎？）：'+(j.msg||j.error_description||j.error||t.slice(0,160)));
  const prev=CLOUD.uid;
  CLOUD.tok=j.access_token; CLOUD.uid=(j.user&&j.user.id)||null;
  if(force && prev && prev!==CLOUD.uid) CLOUD.reauth++;   // 身分真的換掉了
  /* 🔴 需求 34：refresh_token 一定要存下來，否則到期時只能重新註冊一個新身分。
     邊界：這個環境沒有給 refresh_token ⇒ 標起來，讓 cloudStat() 說一句（不要沉默）。 */
  CLOUD.noRefresh = !j.refresh_token;
  LS.set('deco_sess', JSON.stringify({v:2, t:CLOUD.tok, r:j.refresh_token||null, u:CLOUD.uid}));
}

        這正好就是「不要補寫一個假的 createdAt」（obs O-13）的另一半。 */
  if(o.createdAt) base.created_at=o.createdAt;

      name:o.name??null, slab_h:toMM(o.slabH), note:o.note??null });
    /* 🔴🔴 v0.13_i 修二-a：poly【有值才送】，比照上面 created_at 的寫法。
       ⚠️ 若無條件送，polyToMM(undefined) 會是 null
          ⇒ 舊裝置存一次檔就把雲端那一列的 poly 明確覆寫成 null ⇒ 另一台也跟著死。
       ⭐ 這個寫法不論 PostgREST 的 upsert 對「payload 沒帶的欄位」是保留還是覆寫成預設，
          都不會洗掉資料 ⇒ 我們不必先解那個【仍未實測】的問題。
       ⚠️ 與 obs O-19 同一個形狀：存檔不可以順便把一個欄位變成 null。 */
    if(validPoly(o.poly)) row.poly=polyToMM(o.poly);
    return row;
  }
  if(store==='walls') return Object.assign(base,{
    room_id:o.room||null, x1:toMM(o.x1), y1:toMM(o.y1), x2:toMM(o.x2), y2:toMM(o.y2),
    thickness:toMM(o.thickness), height:toMM(o.height),
    /* 🔴 v0.05_i §1（修一）：前台是唯一的 insert 來源，它只能寫 proposed
       ⇒ 這裡的後備值也必須是 'proposed'，否則一道沒有 state 的牆會被 42501 拒掉。 */
    /* 🔴 v0.13_i 修十一 F-14：本批 z_min／z_max【只讀不寫】—— 這裡一個字都不加。
       （它們要等門窗那一批才用得到；順手加進來會把匯入的高度區間洗掉。） */
    is_boundary:o.isBoundary!==false, state:o.state||'proposed',
    total:o.total??null, note:o.note??null,
    is_placed:o.isPlaced!==false, is_budgeted:!!o.isBudgeted });
  if(store==='beams') return Object.assign(base,{
    room_id:o.room||null, x1:toMM(o.x1), y1:toMM(o.y1), x2:toMM(o.x2), y2:toMM(o.y2),
    width:toMM(o.width), drop_mm:toMM(o.drop), note:o.note??null });
  // items
  return Object.assign(base,{
    room_id:o.room||null, name:o.name??null,
    w:toMM(o.w), d:toMM(o.d), h:toMM(o.h),
    note:o.note??null, price:o.price??null, color:o.color??null, rot:o.rot||0,
    anchor:anchorToMM(o.anchor),
    /* 🔴 需求 46：只加兩個欄位，【不做任何邏輯】（分類的篩選／分組／icon 差異／
       任何用到 z_base 的判定都不在本批）。
       category 存英文代碼（space／furniture／appliance／hidden／opening），前台顯示中文
       ⇒ 之後改中文顯示名不用動資料。 */
    category:o.category??null, z_base:toMM(o.zBase),
    /* 🔴 v0.19_i §下-7 ①：新欄位 items.flags（jsonb，Ali 2026-09-19 已貼 SQL）。
       🔴🔴 rotUser **不可以塞進 anchor**：commitMove 與 snapBackToWall 都是
          【整個重建 anchor】⇒ 塞進去會被安靜丟掉，而失敗路徑正好就是本條要修的那一條
          （同一個坑 v0.14_i 踩過一次：anchor.side 消失）。 */
    flags:o.flags ?? null,
    is_placed:!!o.isPlaced, is_budgeted:!!o.isBudgeted, log:o.log||[] });
}
function fromRow(store,row){
  const base={ id:row.id, projectCode:row.project_code||null,
    deletedAt:row.deleted_at||null, updatedAt:row.updated_at||null,
    /* 🔴 v0.05_i §3（修三）：pull 覆蓋時要【保留】建立時間 ⇒ 直接讀雲端的 created_at。
       雲端沒有（舊列）→ null，不偽造。 */
    createdAt:row.created_at||null,
    appVer:APP_VER };
  /* 🔴 六處換算之一：雲端 mm → 記憶體 cm。 */
  if(store==='rooms') return Object.assign(base,{
    name:row.name||'', slabH:fromMM(row.slab_h), note:row.note||'',
    poly:polyFromMM(row.poly) });
  if(store==='walls') return Object.assign(base,{
    room:row.room_id||null,
    x1:fromMM(row.x1), y1:fromMM(row.y1), x2:fromMM(row.x2), y2:fromMM(row.y2),
    thickness:fromMM(row.thickness), height:fromMM(row.height),
    isBoundary:row.is_boundary!==false, state:row.state||'existing',
    total:row.total??null, note:row.note||'',
    isPlaced:row.is_placed!==false, isBudgeted:!!row.is_budgeted });
  if(store==='beams') return Object.assign(base,{
    room:row.room_id||null,
    x1:fromMM(row.x1), y1:fromMM(row.y1), x2:fromMM(row.x2), y2:fromMM(row.y2),
    width:fromMM(row.width), drop:fromMM(row.drop_mm), note:row.note||'' });
  // items
  return Object.assign(base,{
    room:row.room_id||null, name:row.name||'',
    w:fromMM(row.w), d:fromMM(row.d), h:fromMM(row.h),
    note:row.note||'', price:row.price??null, color:row.color||null, rot:row.rot||0,
    anchor:anchorFromMM(row.anchor),
    category:row.category||null, zBase:fromMM(row.z_base),     // 🔴 需求 46
    flags:row.flags||null,                                     // 🔴 §下-7 ②
    isPlaced:!!row.is_placed, isBudgeted:!!row.is_budgeted, log:row.log||[] });
}
/* 推：本機 → 雲端（單筆） */
async function cloudPushObj(store,id){
  const o=await lGetObj(store,id);
  if(!o || !CLOUD.on || o.projectCode!==CLOUD.code) return;
  const row=toRow(store,o);
  const ins=await sbFetch(`/rest/v1/${store}?on_conflict=id`,{method:'POST',
    headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify(row)});
  if(!ins.ok) throw new Error(`寫入雲端 ${store} 失敗：`+(await ins.text()).slice(0,200));
  o.pending=false; o.synced=true; await lPutObj(store,o);
  SYNC.pushed++;                                 // 🔴 需求 18 ②：上傳 N 筆
  cloudStat();
}

/* ── 推：本機 → 雲端（照片與標記，一行不改）── */
async function cloudPushPhoto(id){
  const r=await lGet('photos',id);
  if(!r || !CLOUD.on || r.projectCode!==CLOUD.code) return;
  if(!r.storagePath){
    const blob=r.small||r.orig;
    if(!blob) return;
    const path=`${CLOUD.code}/${r.id}.jpg`;      // 🔑 路徑第一段＝權限鍵
    const up=await sbFetch('/storage/v1/object/photos/'+path,{method:'POST',
      headers:{'Content-Type':blob.type||'image/jpeg','x-upsert':'true'}, body:blob});
    if(!up.ok) throw new Error('上傳照片檔失敗：'+(await up.text()).slice(0,200));
    r.storagePath=path;
  }
  /* ⚠️ 先上傳檔案、成功才寫列。反序會留下「指不到檔的列」。 */
  const row={ id:r.id, project_code:CLOUD.code, name:r.name, mime:r.mime,
    orig_size:r.origSize||null, small_size:r.smallSize||null,
    width:r.w||null, height:r.h||null, date_taken:r.dateTaken||null,
    added_at:r.addedAt||null, storage_path:r.storagePath,
    updated_at:nowISO() };
  const ins=await sbFetch('/rest/v1/photos?on_conflict=id',{method:'POST',
    headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify(row)});
  if(!ins.ok) throw new Error('寫入雲端清單失敗：'+(await ins.text()).slice(0,200));
  r.pending=false; r.synced=true; await lPut('photos',r);
  SYNC.pushed++;                                 // 🔴 需求 18 ②
  cloudStat();
}
async function cloudPushMarker(id){

/* ══════════════════════════════════════════════════════════════
   🔴 需求 15｜四張物件表的 pull
   掛在 cloudPull() 內、照片與標記【之後】。
   前提：cloudPull() 開頭的 cloudVerifyMember() 已通過（R-1 守門），本函式不重複做。
   🔴 【不准】抄照片線的兩條：
      · 「本機已有就跳過」—— 房間/家具會改，抄了就永遠拉不到修改
      · 「雲端沒這個 id ⇒ 刪本機」—— 四張表有 deletedAt，刪除是寫得出來的事實
   ══════════════════════════════════════════════════════════════ */
/* 🔴 v0.14_i 補一：無視時間戳回填的【白名單】。
   判準：這個欄位使用者【有沒有辦法把它清空】？有 → 不可以進；沒有 → 可以進。
   🔴 不要寫成「所有 null 的欄位」。 */
const BACKFILL = { rooms:['poly'] };
async function cloudPullObjects(){
  const q = '&project_code=eq.' + encodeURIComponent(CLOUD.code);
  syncStep('房間／牆／樑／家具…');               // 🔴 需求 18 ①（第 4 階段）
  for(const store of ['rooms','walls','beams','items']){
    const r = await sbFetch(`/rest/v1/${store}?select=*${q}`);
    if(!r.ok) throw new Error(`讀雲端${store}失敗：` + (await r.text()).slice(0,200));
    const rows  = await r.json();
    SYNC.cloudObjRows += rows.length;           // 🔴 需求 19 ①
    const local = await lAllObj(store);
    const lmap  = new Map(local.map(x => [x.id, x]));

    for(const row of rows){
      const inc = fromRow(store, row);        // 欄位改名 ＋ fromMM() ＋ anchor 內的長度
      const cur = lmap.get(inc.id);

      if(!cur){
        if(inc.deletedAt) continue;           // ① 墓碑：本機沒有 → 不要把它生出來
        await lPutObj(store, Object.assign({}, inc, {synced:true, pending:false}));
        SYNC.added++;                         // 🔴 需求 18 ②：聯集發生時要說出多了幾筆
        continue;
      }
      /* 🔴 v0.09_i 需求 31：pending 不再是【絕對否決】。
         ⚠️ v0.04_i 需求 15 的規則② `if(cur.pending) continue` 是規格寫錯的：
            pending 只代表「還沒推上去」，【不代表「本機這份比較新」】
            ⇒ 一旦某一筆卡在 pending，它就【永遠】不接受雲端的任何更新
            ⇒ 兩台各自守著自己的版本，不會自己好，畫面也不會說
            實例：Ali 手機那間房間是【已軟刪除 ＋ pending】⇒ 雲端的活房間永遠拉不回來。
         ⇒ 改成一律照比 updatedAt——晚的贏（與本輪一貫的衝突規則一致）。
            本機 pending 且【較新】→ 不覆蓋（保護真正的離線編輯）
            本機 pending 且【較舊】→ 覆蓋，並清掉 pending／設 synced=true
                                     （那筆舊修改被判定為已被取代）
         ⚠️ 時間戳相同 → 不動本機（用 > 不用 >=，沿用 v0.04_i）。 */
      /* ══ 🔴🔴 v0.13_i 修二-b ＋ v0.14_i 補一｜新欄位的回填（放在「晚的贏」之前）══
         情境：Ali 兩台都已經 pull 過那 10 筆 room，本機有它們但【沒有 poly】
               （v0.1.4.5 的 fromRow 不認識這個欄位），而 updatedAt 與雲端【完全相等】
               ⇒ 走 `>` 這條比較 ⇒ 不覆蓋 ⇒ 🔴 poly 永遠下不來，10 個分區一個都不畫。
         ⚠️ 乾淨的開發機走的是 `!cur` 分支 ⇒ 一切正常 ⇒ 測試會【全綠】，只有她的機器會壞
            （obs O-13「本機儲存比程式活得久」＋ O-17「量具說謊」的合體）。
         ⇒ 規則：雲端有值、本機是 null／undefined 的欄位，無視時間戳補下來。
         🔴 但只限【白名單】（v0.14_i 補一）：判準是「使用者有沒有辦法把這個欄位清空」。
            有辦法清空 ⇒ 不可以進白名單 —— 這個 App 明訂「清空 ＝ null」，
            寫成通則會把【使用者清掉的價錢】當成版本落差長回來，並推回雲端。
            poly 目前沒有任何 UI 可以清空它 ⇒ 符合條件。
            ⚠️ 之後若做了「編輯分區形狀」，這一格要重新檢視；
               下一個新欄位（z_min／z_max／category／z_base）要【逐一判斷】，不可以自動加。 */
      for(const k of (BACKFILL[store] || [])){
        if(cur && cur[k]==null && inc[k]!=null){
          /* 🔴 不改 updatedAt、不動 pending／synced ——
             這不是一次「雲端比較新」的衝突，是【本機根本不知道有這個欄位】。 */
          await lPutObj(store, Object.assign({}, cur, {[k]: inc[k]}));
        }
      }
      if(!inc.updatedAt) continue;            // ③ 雲端沒時間戳 → 當最舊，不覆蓋
      if(new Date(inc.updatedAt) > new Date(cur.updatedAt||0))
        await lPutObj(store, Object.assign({}, inc, {synced:true, pending:false,
          /* 🔴 v0.05_i §3（修三）：整筆覆蓋時 createdAt 要【保留】。
             雲端那一欄是 not null，正常一定有值；只有「雲端是舊列、沒有 created_at」
             這個情況才會回 null —— 那時用本機原本記得的，不要被 null 蓋掉。 */
          createdAt: inc.createdAt || cur.createdAt || null})); // ④ 晚的贏
    }
    // 🔴 ⑤ 這裡【沒有】「雲端沒有就刪本機」那一段。刪除一律走 deletedAt。
  }
  /* ⑥ 補推：本機還沒推成功的（pending）。
     ⚠️ 這一段是建造者依【規則②「等 push」】＋ 既有 ③ 補推（照片/標記）的對稱性補的，
        _i 需求 15 的函式本體沒有寫。若規格者認為不該有，砍掉這一個 for 即可。 */
  {
    let n=0;
    for(const store of ['rooms','walls','beams','items'])
      n += (await lAllObj(store)).filter(x=>x.projectCode===CLOUD.code && x.pending).length;
    if(n) syncStep(`上傳 ${n} 筆…`);            // 🔴 需求 18 ①（第 6 階段）
  }
  for(const store of ['rooms','walls','beams','items']){
    for(const x of await lAllObj(store))
      if(x.projectCode===CLOUD.code && x.pending)
        await cloudPushObj(store,x.id).catch(e=>cloudErr(e));
  }
}

/* ── 拉：雲端 → 本機 ── */
async function cloudPull(){
  if(!CLOUD.on) return;
  syncStep('確認身分…');                       // 🔴 需求 18 ①（第 1 階段）
  /* 🔴 R-1：先確認身分，再談同步。
     ⚠️ 這一步失敗就【中止】——下面有刪除傳播迴路（照片線），
        身分不對時它會把「讀不到」誤讀成「別台刪了」，然後刪掉本機。 */
  if(!await cloudVerifyMember())
    throw new Error(`這台的身分不在專案 ${CLOUD.code} 裡（身分可能已變更）。`
      +`為避免誤刪本機資料，同步已中止，一筆都沒有刪。請按「重新連線」。`);
  const q='&project_code=eq.'+encodeURIComponent(CLOUD.code);

  // ① 照片
  const pr=await sbFetch('/rest/v1/photos?select=*'+q);
  if(!pr.ok) throw new Error('讀雲端清單失敗：'+(await pr.text()).slice(0,200));
  const rows=await pr.json();
  SYNC.photoTotal=rows.length;
  SYNC.cloudPhotoRows=rows.length;             // 🔴 需求 19 ①：雲端到底有沒有東西
  const local=await lAll('photos');
  const lmap=new Map(local.map(x=>[x.id,x]));
  for(const row of rows){
    /* 🔴 需求 18 ①（第 2 階段）：逐張下載時要動，不然她只看到「停住好久」 */
    SYNC.photoDone++;
    syncStep(`照片 ${SYNC.photoDone}/${SYNC.photoTotal}…`);
    const cur=lmap.get(row.id);
    if(cur && (cur.small||cur.orig)){
      if(!cur.synced){ cur.synced=true; cur.pending=false; cur.projectCode=CLOUD.code;
                       cur.storagePath=cur.storagePath||row.storage_path; await lPut('photos',cur); }
      continue;
    }
    const f=await sbFetch('/storage/v1/object/photos/'+row.storage_path);
    if(!f.ok) continue;                          // 檔案還沒到 → 下次再拉
    const blob=await f.blob();
    await lPut('photos',{ id:row.id, name:row.name, source:'雲端', mime:row.mime||'image/jpeg',
      origSize:row.orig_size||blob.size, smallSize:row.small_size||blob.size,
      w:row.width, h:row.height, rawW:row.width, rawH:row.height,
      dateTaken:row.date_taken||null,
      addedAt:row.added_at || nowISO(),
      decoded:true, orientation:null, rotated:false, oriBy:null, err:null,
      appVer:APP_VER+'（雲端）', small:blob, storagePath:row.storage_path,
      projectCode:CLOUD.code, synced:true, pending:false });
    SYNC.added++;                              // 🔴 需求 18 ②：要說出「新增 N 筆」
  }
  /* 🔴 照片段落的「雲端沒這個 id → lDel」【一行不動】（需求 15 留什麼）。
     理由：照片沒有 deletedAt 欄位，它只能用「消失」表達刪除。
     ⚠️ 這是兩套刪除語言並存，【刻意的】，不要統一。 */
  const rid=new Set(rows.map(r=>r.id));
  for(const x of local)
    if(x.synced && x.projectCode===CLOUD.code && !rid.has(x.id)) await lDel('photos',x.id);

  // ② 標記
  syncStep('標記…');                            // 🔴 需求 18 ①（第 3 階段）
  const mr=await sbFetch('/rest/v1/markers?select=*'+q);
  if(mr.ok){
    const mrows=await mr.json();
    const lm=await lAll('markers');
    const lmm=new Map(lm.map(x=>[x.id,x]));
    for(const row of mrows){
      const cur=lmm.get(row.id);
      if(cur && cur.x===row.x && cur.y===row.y && cur.synced) continue;
      await lPut('markers',{ id:row.id, photoId:row.photo_id, x:row.x, y:row.y,
        projectCode:CLOUD.code, synced:true, pending:false });
      SYNC.added++;
    }
    const mid=new Set(mrows.map(r=>r.id));
    for(const x of lm)
      if(x.synced && x.projectCode===CLOUD.code && !mid.has(x.id)) await lDel('markers',x.id);
  }

  // ③ 補推：本機有、雲端還沒有的（離線時拍的）
  {
    const pend=(await lAll('photos')).filter(x=>x.projectCode===CLOUD.code && x.pending)
      .concat((await lAll('markers')).filter(x=>x.projectCode===CLOUD.code && x.pending));
    if(pend.length) syncStep(`上傳 ${pend.length} 筆…`);   // 🔴 需求 18 ①（第 5 階段）
  }
  for(const x of await lAll('photos'))
    if(x.projectCode===CLOUD.code && x.pending) await cloudPushPhoto(x.id).catch(e=>cloudErr(e));
  for(const x of await lAll('markers'))
    if(x.projectCode===CLOUD.code && x.pending) await cloudPushMarker(x.id).catch(e=>cloudErr(e));

  // ④ 🔴 需求 15：四張物件表（掛在照片與標記【之後】）
  await cloudPullObjects();
  /* ⑤ 🔴 v0.17_i 修八 ①：專案設定（樓高／專案名字）。
     🔴 排在四個 store 的迴圈【之外】，單獨呼叫一次（§0-6 A-1：它的形狀套不進那個迴圈）。 */
  await cloudPullProject();
}

/* 🔴 需求 37：狀態式那一行要用的兩個計數。
   ⚠️ M（pend）在 cloudSync 的【成功分支】現算，不沿用 cloudStat 開頭那個舊值（v0.11_i 修三）。 */
async function countPending(){
  let n=0;
  try{
    for(const x of await lAll('photos'))  if(x.pending) n++;
    for(const x of await lAll('markers')) if(x.pending) n++;
    for(const st of ['rooms','walls','beams','items'])
      for(const x of await lAll(st)) if(x.pending) n++;
  }catch(e){}
  return n;
}
/* 房間／家具用 lAllLive()（不含墓碑）；照片用 lAll('photos')。 */
async function countLive(){
  const out={rooms:0, items:0, photos:0};
  try{
    out.rooms  = (await lAllLive('rooms')).length;
    out.items  = (await lAllLive('items')).length;
    out.photos = (await lAll('photos')).length;
  }catch(e){}
  return out;
}
async function cloudSync(){
  if(!CLOUD.on || CLOUD.busy) return;
  CLOUD.busy=true; CLOUD.msg='';
  syncReset();
  $('newProjNote').hidden=true;
  if($('btnSync')) $('btnSync').disabled=true;    // 🔴 需求 18 ④：同步中不能連按
  cloudStat();
  let ok=false;
  try{ await cloudPull(); S.dataErr=''; ok=true; }
  catch(e){ cloudErr(e); S.dataErr=(e&&e.message)||String(e); }
  CLOUD.busy=false;
  if($('btnSync')) $('btnSync').disabled=false;
  /* 🔴 需求 18 ②③：完成／失敗都要有一行【帶時間】的結果。
     ⚠️ 失敗時的錯誤與歸屬句由 cloudStat() 照原樣輸出，這裡只給狀態行。 */
  if(ok){
    /* 🔴 需求 38：同步成功才寫入（失敗不寫）。語意＝「這台拉到雲端資料」的時間。 */
    LS.set('deco_lastsync', new Date().toISOString());
    /* 🔴 需求 37（＋v0.11_i 修三）：改成【狀態式】——說現在是什麼樣子，
       不是「剛剛搬了幾筆」。她問的是「我那兩件家具到底上去了沒」。
       🔴 M（pend）必須在 cloudPull() 【結束之後】重算，不可以沿用先前的值，否則會說謊。 */
    const m = await countPending();
    const c = await countLive();
    let line2;
    if(CLOUD.msg){
      /* 🔴 v0.11_i 修三：這一輪有任何錯誤被 cloudErr 記下 ⇒ 不准說「一致」。
         一致是一個【承諾】；有錯誤還承諾一致，比不承諾更糟。 */
      line2 = `<span class="er">⚠️ 同步完成，但有錯誤（下方有詳細訊息）</span>`;
    }else if(m > 0){
      line2 = `<span class="er">⏳ 還有 <b>${m}</b> 筆沒上傳</span>`;
    }else{
      line2 = `雲端與這台一致　房間 <b>${c.rooms}</b>、家具 <b>${c.items}</b>、照片 <b>${c.photos}</b>`;
    }
    syncProg(`<span class="done">✅ 同步完成</span>　${hhmm()}<br>`+line2
      + (SYNC.added? `<br>這次從雲端拿到 <b>${SYNC.added}</b> 筆` : ''));
  }else{
    syncProg(`<span class="fail">🔴 同步失敗</span>　${hhmm()}`);
  }
  /* ⚠️ 需求 15 邊界：pull 結束後呼叫【一次】render() ＋ buildList()，
     不要每寫一筆就重畫。 */
  await loadMarkers();
  await reloadObjects();
  render(); buildList(); syncSel(); refreshTop(); renderPhotos();
  /* 🔴 v0.17_i 修八：樓高／專案名字是【設定頁】上的欄位。她很可能就站在那一頁按同步，
     而那一頁的欄位只有 refreshProj() 會重填 ⇒ 不補這一行的話，拉下來了但畫面沒變
     ⇒ 又變成「看不出有沒有同步到」（O-18）。 */
  if(S.tab==='proj') await refreshProj();
  /* 🔴 需求 19 ①：雲端這個代碼下【四張表 ＋ photos 全部 0 筆】＝ 這是一個新專案。
     ⚠️ 不阻擋，只提醒（她可能真的要開新專案）。
        邊界：雲端有照片但沒有物件 → 不算新專案（所以兩個計數要一起看）。
     🔴 這是 obs_環境與既有狀態的落差那條坑的【第四次變形】：
        用「什麼都沒有」表達「你不在你以為的地方」。 */
  if(ok && CLOUD.on && SYNC.cloudPhotoRows===0 && SYNC.cloudObjRows===0){
    const n=$('newProjNote');
    n.innerHTML = `⚠️ <b>這是一個新的專案</b>，雲端目前沒有任何東西。<br>`
      +`如果你是要連到既有專案，請檢查代碼有沒有打錯：`
      +`<b class="codetxt">${esc(CLOUD.code||'')}</b>`;
    n.hidden=false;
  }
  cloudStat();
}

/* ══════════════════════════════════════════════════════════════
   🔴 需求 19 ②｜記住用過的專案代碼（最多 5 組）
   理由：Ali 這次就是【手打錯】的（ALI_WUNDAWU vs ALI_WUNDAUW），
        一整輪跨裝置測試因此作廢。點一下填入 ⇒ 不必再手打。
   ⚠️ 邊界（v0.06_i §4）：清單裡要能【刪除單筆】——
      否則打錯的那個代碼會一直留在清單裡誘惑人點。
   ══════════════════════════════════════════════════════════════ */
const CODES_KEY='deco_codes';
function codesGet(){
  try{ const a=JSON.parse(LS.get(CODES_KEY)||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function codesSave(a){ LS.set(CODES_KEY, JSON.stringify(a.slice(0,5))); }
function codesAdd(code){
  if(!code) return;
  const a=codesGet().filter(x=>x!==code);
  a.unshift(code);                      // 最近用過的排最前
  codesSave(a); renderCodes();
}
function codesDel(code){
  codesSave(codesGet().filter(x=>x!==code)); renderCodes();
}
function renderCodes(){
  const box=$('codeList'); if(!box) return;
  box.innerHTML='';
  for(const c of codesGet()){
    const chip=document.createElement('span'); chip.className='codechip';
    const pick=document.createElement('button'); pick.className='pick codetxt';
    pick.textContent=c;
    pick.title='填入這個代碼';
    pick.onclick=()=>{ $('pcode').value=c; };
    const del=document.createElement('button'); del.className='del';
    del.textContent='✕'; del.title='從清單移除';
    del.onclick=()=>codesDel(c);
    chip.appendChild(pick); chip.appendChild(del);
    box.appendChild(chip);
  }
}

/* ── 連線 / 離開 / 狀態 ── */
async function cloudJoin(){
  const raw=($('pcode').value||'').trim().toUpperCase();
  if(raw.length<4){ CLOUD.msg='專案代碼至少 4 個字'; cloudStat(); return; }
  CLOUD.busy=true; CLOUD.msg=''; cloudStat();
  try{
    const code=await joinProject(raw);
    CLOUD.code=code; CLOUD.on=true;
    LS.set('deco_code',code);
    codesAdd(code);                       // 🔴 需求 19 ②：記住它，下次不必手打
    $('pcode').value=code;
    /* 這台既有的本機照片：歸到這個 project 底下並推上去
       ⚠️ 只認 projectCode 為空的（沒有被別的代碼認領過的），不搶別人的 */
    for(const x of await lAll('photos'))
      if(!x.projectCode){ x.projectCode=code; x.pending=true; await lPut('photos',x); }
    for(const x of await lAll('markers'))
      if(!x.projectCode){ x.projectCode=code; x.pending=true; await lPut('markers',x); }
    /* ══ 🔴 v0.05_i §2（修二）：離線建立的【物件】也要被認領 ══
       v0.04_i 需求 15「留什麼」原本寫「cloudJoin 一行不改」⇒ 建造者依規格沒動
       ⇒ 未連線時建的房間／家具 projectCode 永遠是 null
       ⇒ cloudPushObj 第一行 `o.projectCode!==CLOUD.code` 就 return ⇒ 連線後也推不上去。
       v0.05_i 把那一條改成「cloudJoin 只准【加一段物件認領】」。
       ⚠️ 刻意【不】改寫上面照片與標記那兩段，也【不】把三者合併成一個泛用迴圈——
          照片與物件的欄位形狀不同（照片走 lPut，物件要走 lPutObj 做單位換算），
          合併會讓下一手看不出哪個是哪個。 */
    for(const store of ['rooms','walls','beams','items']){
      for(const x of await lAllObj(store)){
        if(x.projectCode) continue;          // 已屬於某個專案 → 不動（不搶別人的）
        if(x.deletedAt)   continue;          // 🔴 垃圾桶裡的不認領（避免把墓碑推上去）
        /* 🔴 邊界：認領到一道 state='existing' 的牆 ——修一之後前台不會造出這種牆，
           但若真的遇到（例如手動塞的測試資料），插入必被 RLS 擋（42501）。
           ⇒ 跳過不認領，並留一筆錯誤在狀態列（_d §10-0b：狀態與錯誤必留）。 */
        if(store==='walls' && x.state==='existing'){
          cloudErr(new Error(`有一道既有牆（state=existing）無法認領進專案 ${code}：`
            +`既有牆只能由後台匯入。這一道留在本機，不會上傳。`));
          continue;
        }
        x.projectCode = code;
        x.pending     = true;                // 標成待推，交給 cloudPullObjects() 的 ⑥ 補推
        await lPutObj(store, x);             // ⚠️ 逐筆寫入、不做交易（與需求 5 甲同一個模式）
      }
    }
  }catch(e){ CLOUD.on=false; cloudErr(e); CLOUD.busy=false; cloudStat(); return; }
  CLOUD.busy=false;
  await cloudSync();
}
function cloudLeave(){
  CLOUD.on=false; CLOUD.code=null; CLOUD.msg='';
  LS.del('deco_code');
  syncProg(''); $('newProjNote').hidden=true;
  cloudStat(); refreshTop(); renderPhotos();
  /* ⚠️ 刻意【不刪】本機資料——離開只是停止同步，不是清空這台 */
}

/* 🔴 需求 13：cloudStat() 的【狀態】與【錯誤與歸屬】文字一字不改，只換輸出目標
   （.cloudbar → 頂列徽章 ＋ 同步對話框）。
   ⚠️ 已刪：未連線時那兩行【說明文字】（依 _d §10-0b，不搬）。 */
/* 🔴 需求 36-2：本機有多少筆「屬於別的專案代碼」的東西（改完之後它們會永遠不同步，
   而那正是 obs O-18 的形狀——不說出來就是把會報錯的坑換成不會報錯的坑）。
   ⚠️ v0.11_i 修二：要掃【六個】store，含 photos／markers，否則孤兒照片會完全看不見。
   ⚠️ 含已軟刪除的（墓碑也還在推）。
   ⚠️ 這裡只【數】，不動任何一筆——cloudJoin 的認領邏輯一行不改（N-169）。 */
const ORPHAN_STORES = ['rooms','walls','beams','items','photos','markers'];
async function countOrphans(){
  if(!CLOUD.on || !CLOUD.code) return 0;
  let n=0;
  try{
    for(const st of ORPHAN_STORES)
      for(const x of await lAll(st))
        if(x.projectCode != null && x.projectCode !== CLOUD.code) n++;
  }catch(e){ return 0; }
  return n;
}
/* 🔴 需求 38：上次【這台拉到雲端資料】的時間。
   ⚠️ 不是「雲端最後被改的時間」——兩者不同，文案不可寫成後者。 */
function lastSyncDate(){
  const s=LS.get('deco_lastsync'); if(!s) return null;
  const d=new Date(s); return isNaN(d.getTime())? null : d;
}
function lastSyncLabel(){
  const d=lastSyncDate();
  if(!d) return '還沒同步過';                    // 🔴 不要顯示空白或 --:--
  const z=x=>String(x).padStart(2,'0');
  return `${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
}
function isStale(){
  const d=lastSyncDate();
  if(!d) return true;                            // 從來沒同步過 ⇒ 也算舊的
  return (Date.now()-d.getTime()) > STALE_MIN*60*1000;
}
async function cloudStat(){
  const box=$('cstat');
  if(!box) return;
  let pend=0;
  try{ for(const x of await lAll('photos')) if(x.pending) pend++;
       for(const x of await lAll('markers')) if(x.pending) pend++;
       for(const st of ['rooms','walls','beams','items'])
         for(const x of await lAll(st)) if(x.pending) pend++; }catch(e){}
  const orphan = await countOrphans();
  $('syncDlg').classList.toggle('blocked', !!CLOUD.blocked);
  $('btnJoin').textContent = CLOUD.on?'重新連線':'連線';
  /* 🔴 需求 23：〔離開專案〕整區（含分隔線）一起顯示／隱藏 */
  $('leaveRow').hidden = !CLOUD.on;
  $('btnSync').hidden  = !CLOUD.on;
  let html;
  if(CLOUD.blocked){
    html = `<span class="er">🔴 這個環境擋住了對外連線</span><br>`+
      `Artifact 頁面有安全政策（CSP），只允許連少數幾個網址，`+
      `<b>連不到資料庫，而且不會有錯誤提示</b>。<br>`+
      `⚠️ <b>這不是程式的問題，是頁面被放在哪裡的問題。</b><br>`+
      `→ 正解：把本檔放到 GitHub Pages 當網頁開。`+
      `步驟見 <code>階段B_放上網_20260908.md</code>`;
  }else if(CLOUD.on){
    /* ⚠️ 文字一字不改（需求 13「留什麼」）；只給代碼那個 <b> 加等寬＋加寬字距的 class
       ——需求 19 ③，讓顛倒的字母看得出來。 */
    html = `<span class="on">✅ 已連線</span>　專案代碼 <b class="codetxt">${esc(CLOUD.code)}</b>`+
      `　這台的身分 <b>…${esc((CLOUD.uid||'').slice(-6))}</b><br>`+
      (CLOUD.busy? `⏳ 同步中…` : (pend? `⏳ 有 <b>${pend}</b> 筆還沒上傳` : `雲端與這台一致`))+
      /* 🔴 需求 38 ①：接在那一行後面，對話框一關也還記得（存在 localStorage）。 */
      `　上次同步 <b>${esc(lastSyncLabel())}</b>`+
      /* 🔴 需求 35-1：換身分是「資料歸屬會改變」的事件，不可以靜默。旗標，不是計數。 */
      (CLOUD.reidentified? `<br><span class="er">⚠️ 這台的身分已過期，已用專案代碼重新加入。資料沒有掉，但這台在雲端是一個新身分。</span>`:'')+
      /* 需求 34 邊界：這個環境沒給續期憑證 ⇒ 說出來，不要讓它安靜地每小時換一次身分。 */
      (CLOUD.noRefresh? `<br><span class="er">⚠️ 這個環境沒有給續期用的憑證，身分到期時會換成新的身分。</span>`:'')+
      /* 🔴 需求 36-2：孤兒資料必須看得見。N=0 整行不顯示。 */
      (orphan? `<br><span class="er">⚠️ 有 <b>${orphan}</b> 筆資料屬於別的專案代碼，不會同步。</span>`:'')+
      (CLOUD.reauth? `<br><span class="er">⚠️ 這次連線期間身分重新取得過 ${CLOUD.reauth} 次</span>`:'')+
      `<br>⚠️ 安全等級＝<b>知道代碼的人就看得到</b>。只放測試照片。`;
  }else{
    html = `<span class="off">未連線</span>　照片只存這台（行為與 v0.1.2.2 完全相同）`;
  }
  if(CLOUD.msg) html += `<br><span class="er">⚠️ ${esc(CLOUD.msg)}</span>`;

/* 需求 13：頂列徽章。未連線 → 「未連線」（中性色），仍可點。
   連線被擋 → 紅色「⚠️ 連線被擋」，點了在對話框內顯示完整錯誤與歸屬句。 */
function refreshTop(pend){
  const b=$('btnCode'); if(!b) return;
  b.classList.remove('off','er');
  if(CLOUD.blocked){ b.classList.add('er'); b.textContent='⚠️ 連線被擋'; }
  else if(CLOUD.on){
    /* 🔴 需求 38 ②：這一處才是關鍵——Ali 困惑那次【根本沒打開同步對話框】。
       已連線且超過 STALE_MIN 分鐘沒同步 → 加一個橘點，點進去看得到時間。
       ⚠️ 只加一個點，不動版面、不動尺寸。 */
    b.innerHTML='✅ '+esc(CLOUD.code||'')
      + (isStale()? ` <span style="color:var(--warnB)">●</span>` : '');
  }
  else { b.classList.add('off'); b.textContent='未連線'; }
  const t=$('appTitle');
  if(t) t.textContent =
      S.tab==='list' ? '清單'
    : S.tab==='photo'? '照片'
    : S.tab==='proj' ? '專案'
    : S.tab==='cost' ? '估價'
    : S.tab==='layout'?'格局'
    : (ROOMS.length? (ROOMS[0].name||'未命名') : '平面圖');
}

/* ── 最小 EXIF 解析：只取 DateTimeOriginal 與 Orientation ── */
function parseExif(buf){
  const v=new DataView(buf), out={dateTaken:null, orientation:null};
  if(v.byteLength<4 || v.getUint16(0)!==0xFFD8) return out;   // 不是 JPEG
  let off=2;
  while(off+4<v.byteLength){
    if(v.getUint16(off)!==0xFFE1){ off+=2+v.getUint16(off+2); continue; }
    const start=off+4;
    if(v.getUint32(start)!==0x45786966) return out;           // "Exif"
    const tiff=start+6;
    const le=v.getUint16(tiff)===0x4949;
    const u16=(p)=>v.getUint16(p,le), u32=(p)=>v.getUint32(p,le);
    const readIFD=(p,want)=>{
      const n=u16(p); let found={};
      for(let i=0;i<n;i++){
        const e=p+2+i*12, tag=u16(e), type=u16(e+2), cnt=u32(e+4);
        if(!want.includes(tag)) continue;
        if(type===3) found[tag]=u16(e+8);
        else if(type===4) found[tag]=u32(e+8);
        else if(type===2){
          const vo=cnt>4? tiff+u32(e+8) : e+8;
          let str=''; for(let k=0;k<cnt-1;k++) str+=String.fromCharCode(v.getUint8(vo+k));
          found[tag]=str;
        }
      }
      return found;
    };
    const ifd0=tiff+u32(tiff+4);
    const a=readIFD(ifd0,[0x0112,0x8769]);
    if(a[0x0112]) out.orientation=a[0x0112];
    if(a[0x8769]){
      const b=readIFD(tiff+a[0x8769],[0x9003,0x9004]);
      out.dateTaken=b[0x9003]||b[0x9004]||null;
    }
    return out;
  }
  return out;
}
const orientOf = v => (Number.isInteger(v) && v>=1 && v<=8) ? v : 1;

/* 🔴 O-12：瀏覽器會不會自己套 EXIF 方向？——【測】，不猜（能力探測）。 */
let _oriByBrowser = null;
function _probeJpegOri6(bytes){
  const body=[0x45,0x78,0x69,0x66,0x00,0x00,
              0x49,0x49,0x2A,0x00, 0x08,0x00,0x00,0x00,
              0x01,0x00,
              0x12,0x01, 0x03,0x00, 0x01,0x00,0x00,0x00, 0x06,0x00,0x00,0x00,
              0x00,0x00,0x00,0x00];
  const len=body.length+2;
  const app1=[0xFF,0xE1,(len>>8)&0xFF,len&0xFF].concat(body);
  const out=new Uint8Array(2+app1.length+(bytes.length-2));
  out.set(bytes.subarray(0,2),0);
  out.set(app1,2);
  out.set(bytes.subarray(2),2+app1.length);
  return new Blob([out],{type:'image/jpeg'});
}
async function browserAppliesOrientation(){
  if(_oriByBrowser!==null) return _oriByBrowser;
  try{
    const cv=document.createElement('canvas'); cv.width=2; cv.height=1;
    const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,2,1);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
    const probe=_probeJpegOri6(new Uint8Array(await blob.arrayBuffer()));
    const bmp=await createImageBitmap(probe);
    _oriByBrowser = bmp.height > bmp.width;      // 2×1 → 1×2 ＝ 被轉了
    bmp.close && bmp.close();
  }catch(e){ _oriByBrowser = false; }            // 測不出來 → 當它不轉（回到原行為）
  return _oriByBrowser;
}
function applyOrient(ctx, ori, rw, rh){
  switch(ori){
    case 2: ctx.transform(-1, 0, 0, 1, rw, 0); break;
    case 3: ctx.transform(-1, 0, 0,-1, rw, rh); break;
    case 4: ctx.transform( 1, 0, 0,-1, 0, rh); break;
    case 5: ctx.transform( 0, 1, 1, 0, 0, 0); break;
    case 6: ctx.transform( 0, 1,-1, 0, rh, 0); break;
    case 7: ctx.transform( 0,-1,-1, 0, rh, rw); break;
    case 8: ctx.transform( 0,-1, 1, 0, 0, rw); break;
    default: break;                                   // 1：不動
  }
}
const fmtBytes=n=> n>=1048576 ? (n/1048576).toFixed(2)+' MB'
                 : n>=1024 ? (n/1024).toFixed(0)+' KB' : n+' B';

/* ── 收一張照片 ── */
async function intake(file, source){
  const rec={ id:uid(), name:file.name||'(無檔名)', source, appVer:APP_VER,
    mime:file.type||'(未知)', origSize:file.size,
    addedAt:nowISO(), dateTaken:null, orientation:null,     // 🔴 需求 4：存 ISO
    decoded:false, err:null, w:0,h:0, small:null, smallSize:0 };
  try{
    const head=await file.slice(0, 256*1024).arrayBuffer();
    const ex=parseExif(head);
    rec.dateTaken=ex.dateTaken; rec.orientation=ex.orientation;
  }catch(e){ rec.err='EXIF 讀取失敗：'+e.message; }
  let bmp=null;
  try{
    bmp=await createImageBitmap(file);
    rec.decoded=true; rec.rawW=bmp.width; rec.rawH=bmp.height;
  }catch(e){
    rec.err=(rec.err? rec.err+'｜':'')+'解碼失敗（可能是 HEIC/HEIF）：'+e.message;
  }
  if(bmp){
    try{
      const exifOri=orientOf(rec.orientation);
      const byBrowser=await browserAppliesOrientation();
      const ori = byBrowser ? 1 : exifOri;
      rec.oriBy = (exifOri>1) ? (byBrowser?'瀏覽器':'本程式') : null;
      const k=Math.min(1, 1600/Math.max(bmp.width,bmp.height));
      const rw=Math.round(bmp.width*k), rh=Math.round(bmp.height*k);
      const swap = ori>=5;
      const cv=document.createElement('canvas');
      cv.width  = swap? rh : rw;
      cv.height = swap? rw : rh;
      const ctx=cv.getContext('2d');
      applyOrient(ctx, ori, rw, rh);
      ctx.drawImage(bmp,0,0,rw,rh);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8));
      rec.small=blob; rec.smallSize=blob? blob.size : 0;
      rec.w=cv.width; rec.h=cv.height;
      rec.rotated = (exifOri>1);
    }catch(e){
      rec.err=(rec.err? rec.err+'｜':'')+'壓縮失敗：'+e.message;
      rec.w=rec.rawW; rec.h=rec.rawH;
    }
    bmp.close && bmp.close();
  }
  rec.orig=file;
  await savePhoto(rec);
  return rec;
}

/* ⚠️ 環境偵測：某些情境下 IndexedDB 會被【整個擋掉】，且錯誤訊息看起來像程式壞了。

function envNote(){
  const bad = (location.protocol==='data:' || location.origin==='null');
  return bad ? `<div class="pstat" style="border-color:var(--warnB)">
      🔴 <b>這個環境擋住了瀏覽器儲存</b>（來源：<code>${location.origin}</code>／<code>${location.protocol}</code>）。<br>

/* ══════════════════════════════════════════════════════════════
   需求 8｜清單頁（版位依預覽 v0.04 確認）
     分組標題：[房間色小橫條] 房間名　N 件
     卡片    ：[色條4px][icon 欄 46px 留空] 名稱／尺寸 ＋ [計價][已擺] ＋ 價錢
     分組順序：各房間 → 最後是「未擺放」（色條用中性灰）
   ══════════════════════════════════════════════════════════════ */
/* 🔴 v0.05_i §4（修四）：清單卡片上的三個就地編輯欄（name / price / note）
   共用一套「即時改記憶體＋畫面、失焦才存」的顆粒度（需求 7）：
     input            → 記下 dirty（price 另外做無效標示），不存
     blur / Enter     → commitCardEdits()
     visibilitychange → commitCardEdits()（手機鎖屏／切 App 時 blur 不可靠）
   ⚠️ 原本只有 name（`_nameDirty`），本輪擴成三個欄位，改用 `id::欄位` 當 key。 */
/* 🔴 v0.07_i 需求 26：從 Set<key> 改成 Map<key, 使用者打的原始字串>。
   ⚠️ 原本的弱點（claude 重現時發現，**不是** Ali 這次踩到的路徑，見 v0.07_i §0-2b）：
        值只存在 DOM 的 input 裡，commitCardEdits() 存檔時才回頭去 DOM 撈
        ⇒ 若在存檔之前 buildList() 重建了清單，那個 input 就不存在了
        ⇒ `if(!inp) continue` ⇒ 值【安靜地丟掉】，
           而 _cardDirty 在函式開頭就已 clear ⇒ 連重試的機會都沒有
   ⇒ 改成值一律從 Map 取，不再依賴 DOM 還在不在。
      「還原成上一個有效值」「移除紅框」仍要摸 DOM ⇒ 那兩步只在 inp 存在時做；
      inp 不存在時【只寫值、跳過畫面還原】（清單等下會被重建，本來就會重畫）。 */
let _cardDirty=new Map();
const cardKey=(id,fld)=>id+'::'+fld;
/* ╔═ 🔬 v0.15_i 修一-查｜commitNameEdits()／commitCardEdits() 有沒有同一個病？ ═╗
   結論：【沒有】。三個理由，缺一都會變成同一個病：
     ① 它不是「掃過所有欄位讀 DOM」，而是【只處理使用者真的打過字的那幾格】——
        來源是 _cardDirty（只有 input 事件會寫進去），不是 querySelectorAll。
     ② 值取自 Map 的 rawVal（v0.07_i 需求 26 改的），【不是】 inp.value
        ⇒ 就算卡片被 buildList() 重建、input 已經不在，也不會讀到別人的殘留值。
     ③ key 是 `id::欄位` ⇒ 永遠寫回【當初被編輯的那一筆】，不可能跨物件汙染。
   ＋ 第一行 `if(!_cardDirty.size) return;` 本身就等同於修一-a 的守衛
     （沒編輯過就什麼都不做）。
   ⚠️ 給下一手：若哪天有人把 ② 改回「commit 時回頭去 DOM 撈」，這個病會立刻長回來。╚═╝ */
function commitCardEdits(){
  if(!_cardDirty.size) return;
  const entries=[..._cardDirty.entries()]; _cardDirty.clear();
  let touched=false;
  for(const [key,rawVal] of entries){
    const [id,fld]=key.split('::');
    const inp=document.querySelector(`.cardedit[data-id="${id}"][data-fld="${fld}"]`);
    const f=FURN.find(x=>x.id===id);
    if(!f) continue;                       // 🔴 只有「這一筆不在了」才跳過，不再看 inp
    const raw=String(rawVal==null?'':rawVal).trim();
    if(fld==='price'){
      /* 需求 7（v0.04_i §7）：無效 → 還原成【上一個有效值】、移除紅框；
         清空 → null（未填），🔴 不是 0 ⇒ 卡片回到顯示「缺價錢」。 */
      if(raw!=='' && !/^\d+$/.test(raw)){
        /* 🔴 需求 26：值無效 → 不寫入（與現況一致）。
           畫面還原（還原成上一個有效值＋移除紅框）要摸 DOM ⇒ 只在 inp 還在時做；
           inp 不在＝清單已重建，重建時本來就會顯示舊值，不需要還原。 */
        if(inp){ inp.value = f.price==null ? '' : String(f.price); inp.classList.remove('bad'); }
        continue;
      }
      if(inp) inp.classList.remove('bad');
      const v = raw==='' ? null : parseInt(raw,10);
      if(f.price!==v){ f.price=v; touched=true; saveItem(f).catch(e=>cloudErr(e)); }
      continue;
    }
    if(LEN_CARD_FIELDS.includes(fld)){
      /* 🔴 需求 22：清單展開列的寬／深／高，沿用需求 7 的輸入規則。
         🔴 與選中面板改的是【同一個值】（同一個 FURN 物件、同一個 saveItem）。
         🔴 v0.17_i C-6：離地（zBase）走同一條路，但判準是 v>=0（見 badLen）。
            照字面把它丟進「其餘一律當字串」那個分支的話，打成 "3o" 會讓
            toMM 把 NaN 寫進 IndexedDB —— 沒有紅框、沒有還原、沒有錯誤。 */
      const v = raw==='' ? null : parseFloat(raw);
      if(badLen(fld, raw, v)){
        // 🔴 需求 26：同上，畫面還原只在 inp 還在時做
        if(inp){ inp.value = f[fld]==null ? '' : String(Math.round(f[fld]*10)/10);
                 inp.classList.remove('bad'); }
        continue;
      }
      if(inp) inp.classList.remove('bad');
      /* 🔴🔴 v0.1.4.2 建造者實測抓到的缺陷（v0.1.4.1 需求 22 引入、已上線）：
         這裡【不可以】用 `if(f[fld]!==v)` 當「有沒有改」的判準。
         理由：需求 22 的 input handler 為了讓「還沒填尺寸」立刻消失、
               並讓平面圖同屏看後果（BP-F2），已經把值【先寫進記憶體】了
               ⇒ commit 時 f[fld] 早就等於 v ⇒ 判成「沒變」⇒ 【不存檔】
         最小重現（實測）：只改尺寸、不碰其他欄位 → commit → IndexedDB 仍是 null
               → 下一次 reloadObjects()（同步／按〔已擺〕／重新載入）把記憶體抹回 null
               ⇒ 140 變成 null，而畫面在被抹掉之前一直顯示 140
         ⚠️ 之前沒被抓到，是因為只要同一張卡片有【別的】欄位一起提交（例如價錢），
            saveItem(f) 會把整個物件寫下去 ⇒ 尺寸被順便存到 ⇒ 症狀時有時無。
         ⇒ 改成【有效就一律存】。多一次寫入的成本遠低於靜默掉資料。 */
      f[fld]=v; touched=true; saveItem(f).catch(e=>cloudErr(e));
      continue;
    }
    // name / note：文字，空字串就是空字串
    if(f[fld]!==raw){ f[fld]=raw; touched=true; saveItem(f).catch(e=>cloudErr(e)); }
  }
  render();
  if(touched) buildList();      // 讓「缺價錢」⇄ 數字、未命名 ⇄ 名稱的顯示跟上
}
/* 舊名保留為別名：setTab／visibilitychange 兩個既有呼叫點不必改語意 */
function commitNameEdits(){ commitCardEdits(); }
/* 🔴 v0.17_i §0-5 C-6 ＋ 新引入-2｜離地（zBase）併進 w/d/h 的【浮點分支】，
   但判準不同：w/d/h 必須 > 0，而【離地可以是 0】（放在地上）。
   ⚠️ 兩處都要用這一支（cardInput 的 input handler／commitCardEdits），
      只改一處＝半套：離地填 0 會被標紅框而且不寫入，或者打錯字時 NaN 進 IndexedDB。 */
const LEN_CARD_FIELDS = ['w','d','h','zBase'];
/* ╔═ 🔴 v0.17_i 丙-2 ＋ 丙-3｜卡片上那行尺寸字：【同兩行、四件事，一次改完】════╗
   那行字（.dim）只在 itemCard() 建立一次，但它的 textContent 與 class 會被
   cardInput() 的 w/d/h input handler【整個重寫】（3929-3934，而且是 className 賦值）。
   四件事全部落在同兩行，不可分批：
     ① 修三　　「還沒填尺寸」要有可點的外觀（class）
     ② 修十三　小數不可以被 Math.round 吃掉（textContent）
     ③ §0-6 B-4　className 賦值會洗掉 ① ⇒ 一律經過同一支，讓它【重算】而不是被清掉
     ④ 修九　　沒尺寸時它是「你還缺這個」的常駐標記（O-13）
   ⇒ 兩處（itemCard 建立時／cardInput 打字時）都只呼叫 applyDim()，不各自拼字串。
   🔴 只改一處的症狀：她在展開列把寬改成 12.5 的【當下】，另一處立刻把卡片那行寫回 13
      ⇒ 在「填完重新載入」的測法下會過，在「邊填邊看」的測法下會失敗 —— 而她是邊填邊看的。
   ⚠️ 可點性綁在【元素本身】（建立時掛的 onclick），不是綁在 class 上
      ⇒ class 被重算也不會掉。（B-4 的兩個候選做法，建造者選的是這一個。）╚═══════╝ */
const dim1 = v => (v==null ? '' : String(Math.round(v*10)/10));   // 修十三：保留一位小數
function dimText(f){
  if(f.w==null || f.d==null) return '還沒填尺寸';
  return `${dim1(f.w)} × ${dim1(f.d)}` + (f.h!=null ? ` × ${dim1(f.h)}` : '') + ' cm';
}
function dimClass(f){
  /* missbtn ＝ 修三的「可點外觀」。只有缺尺寸那個狀態才給它，
     填完之後它就是一行普通的資訊（卡片本體仍然點得開，見修十四）。 */
  return (f.w==null || f.d==null) ? 'dim miss missbtn' : 'dim';
}
function applyDim(dm, f){
  if(!dm) return;
  dm.className = dimClass(f);
  dm.textContent = dimText(f);
}
/* ╔═ 🔴 v0.17_i §0-5 D-4 ＋ 新引入-3｜展開這一列並把游標送進第一個缺的欄位 ══════╗
   修三與修九【共用這一支】，不可以寫兩次。順序寫死（少一步就靜默失敗）：
     ① commitCardEdits()

        （展開列只有在 S.expandId===f.id 時才被建立 ⇒ 不設它，欄位根本不存在）

/* 卡片上的就地編輯欄工廠
   🔴 v0.17_i 修四 ⑩：只有 note 走 <textarea>（Ali 要備註能換行）。
      ⚠️ cardInput 是共用函式 —— 不可以整個改成 textarea，那會弄壞價錢與尺寸欄。 */
function cardInput(f, fld, opts){
  const o=opts||{};
  const inp=document.createElement(fld==='note' ? 'textarea' : 'input');
  inp.className='cardedit '+(o.cls||'');
  inp.dataset.id=f.id; inp.dataset.fld=fld;
  inp.value = o.value!=null ? o.value : (f[fld]==null ? '' : String(f[fld]));
  if(o.placeholder) inp.placeholder=o.placeholder;
  if(o.inputmode) inp.setAttribute('inputmode',o.inputmode);
  inp.onclick=e=>e.stopPropagation();
  inp.addEventListener('input',()=>{
    /* 🔴 需求 26：把【值】一起記進 Map，不要只記「哪個欄位被改了」。
       同一欄位連打多次 → Map 覆蓋，最後一次為準。 */
    _cardDirty.set(cardKey(f.id,fld), inp.value);
    const raw=inp.value.trim();
    /* 打字中：不阻止、不還原、不寫入 —— 但無效就加紅框，
       讓「這個值沒被採用」看得出來（_d §10-0b 允許狀態提示）。 */
    if(fld==='price'){
      inp.classList.toggle('bad', raw!=='' && !/^\d+$/.test(raw));
    }else if(LEN_CARD_FIELDS.includes(fld)){
      const v=parseFloat(raw);
      const bad=badLen(fld, raw, v);
      inp.classList.toggle('bad', bad);
      /* 🔴 需求 22 邊界：在清單填完尺寸 → 卡片上的「還沒填尺寸」要立刻消失。
         ⇒ 有效值當下就寫記憶體並重畫（與需求 7「即時算、失焦才存」一致：
            這裡只改記憶體與畫面，不存檔）。 */
      if(!bad){
        f[fld] = raw==='' ? null : v;
        /* 🔴 丙-2／丙-3：這裡是【第二處】。與 itemCard 走同一支 applyDim，
           不再各自拼字串（只改一處＝她邊填邊看時會被寫回整數）。 */
        const card=inp.closest('.icard');
        if(card) applyDim(card.querySelector('.dim'), f);
        render();
      }
    }
  });
  inp.addEventListener('blur',()=>commitCardEdits());
  /* 🔴 備註改成 textarea 之後，Enter 是【換行】不是存檔 ——
     沿用舊的 Enter→blur 會讓「能換行」這件事做了等於沒做。其餘欄位一行不改。 */
  if(fld!=='note')
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') inp.blur(); });
  return inp;
}
/* 🔴 v0.17_i 修九：卡片【閃一下】（一次、短，不是持續動畫）。
   ⚠️ 必須對「buildList() 重建之後的那一張」呼叫 —— 舊節點已經不在文件上。 */
function flashCard(id){
  const c=document.querySelector(`.icard[data-id="${id}"]`);
  if(!c) return;
  c.classList.remove('flash');
  void c.offsetWidth;                      // 強制 reflow，動畫才會重新播一次
  c.classList.add('flash');
  c.addEventListener('animationend', ()=>c.classList.remove('flash'), {once:true});
}

/* is_placed false → true 的兩條邊界（需求 8） */
function inRoomBBox(rid,x,y){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  /* 🔴 v0.13_i 修七 F-9：這個函式 v0.12_i 整個漏列了。
     它靠牆算「在不在房間裡」，而匯入的牆 room 全 NULL ⇒ 需求 41 之後
     按〔已擺〕會判成「不在房間裡」⇒ 把家具丟回形心。
     ⇒ 有 poly 就用 poly 的外接矩形；沒有才回退舊算法。 */
  const r=ROOMS.find(z=>z.id===rid);
  if(r && validPoly(r.poly)){
    r.poly.forEach(q=>{ x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]);
                        y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]); });
    return x>x0 && x<x1 && y>y0 && y<y1;
  }
  const ws=WALLS.filter(w=>w.room===rid);
  if(!ws.length) return false;
  ws.forEach(w=>{x0=Math.min(x0,w.x1,w.x2);x1=Math.max(x1,w.x1,w.x2);
                 y0=Math.min(y0,w.y1,w.y2);y1=Math.max(y1,w.y1,w.y2);});
  /* ⚠️ 用【嚴格內部】而不是含邊界：新建項目的 anchor 是 (0,0)，
     而房間的左上角常常就是 (0,0) ⇒ 含邊界會判成「已經在房間裡」，
     那件家具就會卡在牆角（需求 7 明寫新建家具要放房間中心）。 */
  return x>x0 && x<x1 && y>y0 && y<y1;
}
function placeIntoRoomIfOutside(f){
  const a=f.anchor||{};
  if(a.type!=='free') return;
  if(inRoomBBox(f.room, a.x||0, a.y||0)) return;
  const c=roomCenter(f.room);
  if(c) f.anchor={type:'free', x:c.x, y:c.y};
}
/* ╔═ 🔴 v0.17_i §0-5 A-3 ＋ 新引入-1｜setPlaced(id, want) ═══════════════════════╗
   舊的 toggleChipPlaced 是【toggle】，不吃「要變成什麼」。
   乙-0 的動作鈕按下去是一個【確定的方向】（待擺→擺上去／已擺→收回），
   ⇒ 需要一個吃參數的版本，否則「狀態看得見了，但點它會說謊」。
   🔴 每一條分支的【內容】一行不改，只是為了吃參數而搬家（A-3 的鬆綁條款）。

async function setPlaced(id, want){
  const f=FURN.find(x=>x.id===id); if(!f) return;
  if(!!f.isPlaced === !!want) return;
  if(want===false){
    /* 🔴 true → false：anchor 保留不動（與「清擺設」一致）——它記得上次擺哪 */
    f.isPlaced=false;
    await saveItem(f);
    await reloadObjects(); render(); buildList(); syncSel();
    return;
  }
  /* 🔴 v0.09_i 需求 30 ①：連一間存活的房間都沒有時，展開房間下拉是沒有意義的
     （下拉裡只會有「未指定」）⇒ 直接說出來，不要給她一個選不到東西的下拉。
     ⚠️ 只加訊息、不擋操作：她仍然可以做別的事。 */
  if(!ROOMS.length){ S.listNote='目前沒有任何房間。'; buildList(); return; }
  // 🔴 先要求選房間（不可擺到「沒有房間」）→ 展開同一個列，cause='chip'
  //    ⚠️ v0.07_i 需求 24 邊界：這一條路【一行不改】——仍然只展開房間下拉，
  //       不切分頁、不選中。選了房間之後才會走到下面。
  if(!f.room){ S.expandId=id; S.expandCause='chip'; buildList(); return; }
  f.isPlaced=true;
  placeIntoRoomIfOutside(f);
  await saveItem(f);
  await reloadObjects();
  /* ── 🔴 v0.07_i 需求 24：擺好之後【三件一起做】，順序不可換 ──
     Ali 原話：「我看不到這個東西在畫面上的哪裡，因此，我亂按平面圖的〔📏 改尺寸〕，
                看到裡面都是空白的，故重新填寫。她會改到清單中的數值。」
     claude 線上重現 v0.1.4.1：擺完之後 tab='list'、selId=null、面板隱藏
       ⇒ 物件本身沒問題（有擺好、尺寸保留、平面圖上有畫）
       ⇒ 缺的是【指向】：畫面沒有任何一處告訴她那件東西去哪了
       ⇒ 她只能在圖上猜，猜到另一件沒填尺寸的，就把尺寸填到那一件身上。
     ⚠️ 尺寸未填的照樣要帶過去——面板尺寸欄是空的【是正確的狀態】（它真的沒填）。 */
  S.selId = f.id;              // ① 選中它 ⇒ 面板直接出現、尺寸已經是它的值
  setTab('plan');              // ② 帶到它在的地方（setTab 內含 render/syncSel）
  ensureVisible(f);            // ③ 若它在畫面外 → 平移過去（🔴 不動 zoom）
  render(); buildList(); syncSel();
}
/* 薄殼：語意與舊版完全相同（「反轉」），給還在用 toggle 語意的呼叫點。 */

/* 🔴 v0.07_i 需求 24：只平移，【不動 zoom】。
   理由：zoom 是使用者剛剛自己調的，而長度比例尺是由 zoom 實算的（需求 14／_d §10-2c）
        ⇒ 擅自改 zoom 會讓她失去「我現在看的是幾分之一」這個參考。
   邊界：已完全在可見範圍內 → 什麼都不做（不要「為了置中」而抖一下）。 */
function ensureVisible(f){
  if(!onPlan(f)) return;
  const p=place(f);
  const {w,h}=svgSize();
  if(!(w>0&&h>0)) return;
  /* 用它的外接矩形（含旋轉）判斷，不是只看中心點 */
  const pts = hasSize(f) ? corners(p.x,p.y,f.w,f.d,p.ang,0) : [{x:p.x,y:p.y}];
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const q of pts){ const s=w2s(q.x,q.y);
    x0=Math.min(x0,s.x); x1=Math.max(x1,s.x); y0=Math.min(y0,s.y); y1=Math.max(y1,s.y); }
  const inside = x0>=SVG_PAD && y0>=SVG_PAD && x1<=w-SVG_PAD && y1<=h-SVG_PAD;
  if(inside) return;                                   // 已看得到 → 不動
  const z=S.zoom;                                      // 🔴 全程不改它
  S.panX = w/2 - p.x*z;
  S.panY = h/2 - p.y*z;
}

  { key:'layout',label:'格局',   ic:'📐', el:'tabLayout', page:'soonPage',  soon:true  },
];
/* ╔═ 🔴 setTab 的【九件事】，改成迴圈時一件都不可以掉 ═══════════════════════════╗
   ① opt ＋ beamFocus 的清除（🔴 opt 這個參數不可以拿掉：帶 {keepFocus:true} 的呼叫靠它）
   ② 🔴🔴 離開清單頁要 commitNameEdits()（掉了會【安靜吃掉她打的字】）
   ③ listPage／photoPage／projPage／soonPage 的 hidden（proj 獨立寫）
   ④ zoombtns 只在 plan 顯示
   ⑤ fabAdd 只在 list 顯示
   ⑥ soon 頁的 icon 與文字（cost ＝ 💰／layout ＝ 📐）
   ⑦ 進 photo 要 renderPhotos()、進 proj 要 refreshProj()、進 list 要 buildList()
   ⑧ localStorage 只存 plan/list/photo 三種
   ⑨ 收尾四件 refreshTop → refreshBeamBar → render → syncSel，🔴 順序不可換
   ⑩ （v0.1.7 新增）renderLayerBar：圖層列依 LAYERS.tabs 重畫 */
function setTab(t, opt){
  opt = opt || {};                                            // ①
  if(!opt.keepFocus) S.beamFocus = null;                      // ①
  if(S.tab==='list' && t!=='list'){ commitNameEdits(); }      // ② 🔴🔴
  S.tab=t;
  const cur = TABS.find(x=>x.key===t);
  // ③ TABS 驅動的頁面；proj 不在表上 ⇒ 照舊獨立寫
  new Set(TABS.map(x=>x.page).filter(Boolean)).forEach(id=>{
    $(id).hidden = !(cur && cur.page===id);
  });
  $('projPage').hidden  = (t!=='proj');                       // ③
  $('zoombtns').hidden  = (t!=='plan');                       // ④
  $('fabAdd').hidden    = (t!=='list');                       // ⑤
  if(cur && cur.soon){                                        // ⑥
    /* 🔴 依 _d §10-0b 不寫「這裡以後會有…」——只給狀態 */
    $('soonIc').textContent  = cur.ic;
    $('soonTxt').textContent = '之後';
  }
  if(t==='photo') renderPhotos();                             // ⑦
  if(t==='proj')  refreshProj();                              // ⑦
  TABS.forEach(x=>$(x.el).classList.toggle('on', x.key===t));
  if(t==='list') buildList();                                 // ⑦
  try{ if(t==='plan'||t==='list'||t==='photo') localStorage.setItem('deco.tab',t); }catch(e){}  // ⑧
  renderLayerBar();                                           // ⑩
  refreshTop();                                               // ⑨
  refreshBeamBar();          // 🔴 修九：返回列跟著 beamFocus 與分頁走
  render(); syncSel();
}
/* 🔴 v0.13_i 修九：〔‹ 返回設定〕只在「平面圖 ＋ 有樑亮著」時出現。
   落點沿用 .pinning，不新造版位。 */
function refreshBeamBar(){
  const b=$('beamBack'); if(!b) return;
  b.hidden = !(S.tab==='plan' && S.beamFocus);
}
/* 🔴 v0.19_i §1-4：五個繫結改成迴圈（id 由 TABS 的 el 欄提供，不靠命名慣例猜）。 */
TABS.forEach(x=>{ $(x.el).onclick = ()=>setTab(x.key); });

/* 🔴 需求 39：手勢 A1／A2 切換與 A1 的模式列（segGesture／segMode／modebar／modeHint／
   applyModeClass）已整組移除——元素、CSS、狀態欄位、事件繫結、啟動時的初始化全部一起刪。
   ⚠️ 教訓（v0.11_i 修一）：只刪元素、留下讀它的那幾行，node --check 會過而畫面是白的。 */
/* ── 縮放：三種入口（雙指 / 滾輪 / 按鈕）——O-5 ── */
function zoomAt(cx,cy,factor){
  const r=svg.getBoundingClientRect();
  const mx=cx-r.left, my=cy-r.top;
  const z=Math.max(.2,Math.min(6, S.zoom*factor));
  S.panX = mx-(mx-S.panX)*(z/S.zoom);
  S.panY = my-(my-S.panY)*(z/S.zoom);
  S.zoom = z; render(); syncSel(); zLbl();
}
function zLbl(){ $('zLabel').textContent = Math.round(S.zoom*100)+'%'; }
svg.addEventListener('wheel',e=>{        // 電腦：滾輪縮放
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY<0 ? 1.12 : 1/1.12);
},{passive:false});
function zoomCenter(f){ const r=svg.getBoundingClientRect();
  zoomAt(r.left+r.width/2, r.top+r.height/2, f); }
$('zIn').onclick =()=>zoomCenter(1.25);
$('zOut').onclick=()=>zoomCenter(1/1.25);
$('zFit').onclick=()=>{ fit(); zLbl(); };

/* ╔═ 🔴 v0.19_i §1-1d／§1-2b｜圖層列（點亮式）＋ 記得住 ══════════════════════╗
   舊的 $('snapOn').onchange／$('gridAll').onchange 兩個繫結已隨元素一起移除。 */
const LAYERS_KEY='deco.layers';
/* 🔴 §1-2b：這是【這台裝置的檢視偏好】，不是專案的事實 ⇒ 只進 localStorage，不推雲端。
   ⚠️ 用既有的 LS（2949 一帶，本來就包了 try/catch），不另寫一套。 */
function saveLayers(){ LS.set(LAYERS_KEY, JSON.stringify(S.layers)); }
function loadLayers(){
  const raw=LS.get(LAYERS_KEY); if(!raw) return;
  try{
    const o=JSON.parse(raw);
    if(!o || typeof o!=='object') return;
    Object.keys(o).forEach(t=>{
      if(!o[t] || typeof o[t]!=='object') return;
      if(!S.layers[t]) S.layers[t]={};
      /* 🔴 只收 LAYERS 認得的 key；存檔裡【沒有】的 key 不碰
         ⇒ 自動留在 defaultLayers() 給的 def（新長出來的一層不會是關著的）。 */
      Object.keys(o[t]).forEach(k=>{ if(layerDef(k)) S.layers[t][k]=!!o[t][k]; });
    });
  }catch(e){}
}
/* 依 LAYERS 生成這一頁的圖層列。🔴 只列 tabs 含目前分頁的 ⇒ 其他分頁自然是空的（§1-4a）。 */
function renderLayerBar(){
  const bar=$('layerBar'); if(!bar) return;
  bar.innerHTML='';
  let prevKind=null;
  LAYERS.filter(l=>l.tabs.includes(S.tab)).forEach(l=>{
    if(prevKind && prevKind!==l.kind)
      bar.appendChild(Object.assign(document.createElement('span'),{className:'lsep'}));
    prevKind=l.kind;
    const b=document.createElement('button');
    b.type='button';
    b.className='chip'+(L(l.key)?' on':'');
    b.id='lay_'+l.key;
    b.dataset.layer=l.key;
    b.textContent=l.label;
    b.setAttribute('aria-pressed', L(l.key)?'true':'false');
    b.onclick=()=>toggleLayer(l.key);
    bar.appendChild(b);
  });
}
function toggleLayer(key){
  const t=S.tab;
  if(!S.layers[t]) S.layers[t]={};
  S.layers[t][key] = !L(key);
  saveLayers();
  renderLayerBar();
  render(); syncSel();          // 舊 snapOn 是 render+syncSel、gridAll 是 render ⇒ 取聯集
}

/* ── 啟動 ── */
/* 資料變了（種子只有 400×300，不再是舊假資料的 900×400）⇒ fit() 改成依實際資料算範圍。
   ⚠️ 這不是 _i 指定的改動，是換掉假資料後 fit() 的必要適配（見交付報告）。 */
function planBounds(){
  /* 🔴 需求 41：現況只看 WALLS ⇒ 凸出牆線的分區（例如「大門外」）會被切掉
     ⇒ 把 poly 的點一起納入（與 dataLeft／dataBottom 同步，v0.13_i 修七 F-24）。 */
  const pp=polyPoints();
  if(!WALLS.length && !pp.length) return {x0:0, y0:0, x1:400, y1:barY()+80};
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  WALLS.forEach(w=>{x0=Math.min(x0,w.x1,w.x2);x1=Math.max(x1,w.x1,w.x2);
                    y0=Math.min(y0,w.y1,w.y2);y1=Math.max(y1,w.y1,w.y2);});
  pp.forEach(q=>{x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]);
                 y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]);});
  y1=Math.max(y1, barY()+80);                 // 含下方的示意帶與比例尺
  x1=Math.max(x1, x0+340);
  return {x0,y0,x1,y1};
}
function fit(){
  const r=svg.getBoundingClientRect();
  /* ⚠️ O-1：版面還沒定案時 rect 是 0 → 算出 zoom=0 → 整張圖縮成一個點、畫面全白。
     語法檢查對這種完全瞎眼（實際踩到）。等下一幀再試。 */
  if(!r.width || !r.height){ requestAnimationFrame(fit); return; }
  const b=planBounds();
  /* 🔴 需求 21：Ali 的兩句話是同一件事——
     「平面圖下方一大片空白」＋「現在的手機畫面超級小，其實我不太好操作」
     實測（真實 375×812）：容器本身沒問題（見 _debug：壞例不壞），
     空白來自 fit() 的留白太大 ⇒ 房間被縮小、剩下的高度變成空白。
     留白 90 → 36 世界單位：房間畫得更大，空白同時變小。
     ⚠️ 沒有動任何元件的尺寸與位置（需求 21 明訂只修空白）。 */
  const FIT_PAD = 36;
  const W=Math.max(1,(b.x1-b.x0)+FIT_PAD), H=Math.max(1,(b.y1-b.y0)+FIT_PAD);
  const z=Math.min(r.width/W, r.height/H);
  S.zoom = (z>0 && isFinite(z)) ? z : 1;      // ← isFinite 那一層不能省（O-1）
  S.panX = (r.width  - (b.x1-b.x0)*S.zoom)/2 - b.x0*S.zoom;
  S.panY = (r.height - (b.y1-b.y0)*S.zoom)/2 - b.y0*S.zoom;
  render(); syncSel(); zLbl();
}
window.addEventListener('resize',()=>{
  /* 🔴 需求 25 邊界：轉向或網址列收起造成高度變化時，診斷列要跟著現況（它是狀態）。 */
  refreshDiag();
  if(!(S.zoom>0)) { fit(); return; }
  render(); syncSel();
});

let t0='plan'; try{ t0=localStorage.getItem('deco.tab')||'plan'; }catch(e){}
if(t0!=='plan' && t0!=='list' && t0!=='photo') t0='plan';

/* 🔴 啟動序列（需求 15 的順序寫死）：
     loadMarkers → cloudInit（可能連上）→ loadAll（lAll → pull → seed → purge）
     → render → buildList → setTab
   ⚠️ pull 丟錯 → 不跑 seed、把錯誤留在畫面上（不可用「本機全空」當成「專案是空的」）。 */
(async function boot(){
  loadLayers();               // 🔴 §1-2b：先把上次點亮／熄掉的狀態讀回來，再畫第一幀
  loadFold();                 // 🔴 §下-10：收合狀態也要記得住（N-433）
  await loadMarkers();
  await cloudInit();
  try{
    await loadAll();
    S.dataErr='';
  }catch(e){
    cloudErr(e);
    S.dataErr=(e&&e.message)||String(e);
    await reloadObjects();          // 至少把本機已有的畫出來，但【不產生種子】
  }
  fit();
  render();
  buildList();
  setTab(t0);
  refreshTop();
})();
</script>
